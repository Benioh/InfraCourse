mission: l01.5_gpu_execution_model
title: L01.5 Quiz · GPU 执行模型与硬件基础
pass_threshold: 1.0
description: |
  这 6 题验证你对 GPU 执行模型的核心理解：dispatch 异步性、硬件层级、内存带宽、
  Tensor Core 和 Stream。如果答不对，说明你后面看 profiler 和写 kernel 时会缺少
  正确的心智模型。先回去读 lecture.md。

