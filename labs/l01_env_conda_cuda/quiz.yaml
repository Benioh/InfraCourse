mission: l01_env_conda_cuda
title: L01 Quiz · 环境四件套与 rank/device 映射
pass_threshold: 1.0
description: |
  这 4 题打中"接手陌生机器最先暴雷"的四类失败：CUDA wheel、PYTHONPATH 污染、
  CUDA_VISIBLE_DEVICES 重映射、torchrun rank 语义。答错说明你对环境证据链的
  最小不变量还没有直觉，先回去读 scripts/env/check_cuda.py 与本关 task.md。

