mission: l02.5_memory_snapshot
title: L03 Quiz · Memory Snapshot 泄露归因
pass_threshold: 1.0
description: |
  这 5 题检查长期 OOM、live allocation、caller stack 和 top-k 聚合的核心边界。

prereq_checklist:
  - title: 读 L03 主讲义
    kind: doc
    path: labs/l02.5_memory_snapshot/lecture.md
    href: "#lesson"
  - title: 跟源码带读
    kind: doc
    path: labs/l02.5_memory_snapshot/source_walkthrough.md
    href: "#lesson"
  - title: 最后读 patch/task.md
    kind: task
    path: labs/l02.5_memory_snapshot/patch/task.md
    href: "#patch"
  - title: 对照 memory snapshot reference
    kind: source
    path: labs/l02.5_memory_snapshot/patch/reference/memory_snapshot.py

questions:
  - id: q1_why_snapshot
    prompt: |
      定位长期显存泄露时，为什么只看 `nvidia-smi` 不够？
    options:
      - id: a
        text: 它只给进程级总量，无法告诉你 live allocation 来自哪条调用栈。
        correct: true
      - id: b
        text: 它不能显示 GPU 型号。
      - id: c
        text: 它只能用于 CPU 内存。
      - id: d
        text: 它会自动清理 PyTorch cache。
    explanation: |
      `nvidia-smi` 可以确认进程占用，但不能给出 alloc/free 历史和 caller stack。
      泄露归因需要知道仍存活对象来自哪里。

  - id: q2_live_allocations
    prompt: |
      在本关的 snapshot 里，`total_leaked_bytes` 应该从哪里计算？
    options:
      - id: a
        text: 所有历史 alloc event 的 size 总和。
      - id: b
        text: 所有 free event 的 size 总和。
      - id: c
        text: 当前 `_live` 中仍未释放的 AllocEvent size 总和。
        correct: true
      - id: d
        text: "`_next_addr` 的当前值。"
    explanation: |
      泄露候选来自 live allocations。已经 free 的历史 alloc 只能说明曾经分配过，
      不能计入当前泄露总量。

  - id: q3_caching_allocator
    prompt: |
      PyTorch reserved memory 长时间不下降时，下面哪个判断更稳妥？
    options:
      - id: a
        text: 一定是 tensor 泄露。
      - id: b
        text: 可能只是 caching allocator 保留了已释放 block，需要结合 live allocations 判断。
        correct: true
      - id: c
        text: 一定是 NCCL 没初始化。
      - id: d
        text: 说明 optimizer state 为空。
    explanation: |
      Caching allocator 会缓存已经释放的 block。泄露分析要看仍存活对象和 stack，
      不能只看 reserved memory 是否下降。

  - id: q4_stack_grouping
    prompt: |
      `find_top_leaks_by_stack(snapshot, k)` 在本关按什么 key 聚合？
    options:
      - id: a
        text: 完整的 `ev.stack` tuple。
        correct: true
      - id: b
        text: 只按 allocation size。
      - id: c
        text: 只按 timestamp。
      - id: d
        text: 只按 addr 的奇偶性。
    explanation: |
      本关测试按完整 stack tuple 聚合 size，再按累计 bytes 降序返回 top-k。
      真实排查中可以再加入 frame 归一化或 top-frame 分析。

  - id: q5_wrong_process
    prompt: |
      多进程 RL 训练里显存上涨发生在 rollout worker，但你只 dump 了 rank0 trainer。这个 snapshot 最大的问题是什么？
    options:
      - id: a
        text: 文件扩展名一定错误。
      - id: b
        text: 进程选错，snapshot 结构可能完整，但无法解释真正上涨的显存。
        correct: true
      - id: c
        text: stack 会自动合并所有进程。
      - id: d
        text: "`dump_snapshot()` 会删除模型参数。"
    explanation: |
      Snapshot 是进程内证据。多进程系统必须先定位显存上涨的 rank、worker 或 server pid，
      再 dump 对应进程。
