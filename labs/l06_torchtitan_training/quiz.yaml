mission: l06_torchtitan_training
title: L07 Quiz · Activation Checkpoint 设计权衡
pass_threshold: 1.0
description: |
  这 5 题打中 activation checkpoint（recompute）的核心权衡——
  时间 vs 显存、何时 ckpt 何时不 ckpt、与 DDP/TP 的交互。

