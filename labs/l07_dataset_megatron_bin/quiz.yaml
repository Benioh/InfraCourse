mission: l07_dataset_megatron_bin
title: L08 Quiz · Megatron IndexedDataset 数据格式
pass_threshold: 0.8
description: |
  这 5 题检查 `.bin/.idx`、offset/length、dtype、mmap 和真实 Megatron 数据入口。

prereq_checklist:
  - title: 读 L08 主讲义
    kind: doc
    path: labs/l07_dataset_megatron_bin/lecture.md
    href: "#lesson"
  - title: 跟源码带读
    kind: doc
    path: labs/l07_dataset_megatron_bin/source_walkthrough.md
    href: "#lesson"
  - title: 最后读 patch/task.md
    kind: task
    path: labs/l07_dataset_megatron_bin/patch/task.md
    href: "#patch"
  - title: 对照 preprocess drill 源码
    kind: source
    path: labs/l07_dataset_megatron_bin/scripts/run_preprocess.py

questions:
  - id: q1_layout
    prompt: |
      本关的 `.bin` 文件保存什么？
    options:
      - id: a
        text: 原始 JSONL 文本。
      - id: b
        text: 连续序列化的 token id。
        correct: true
      - id: c
        text: tokenizer vocab。
      - id: d
        text: model checkpoint。
    explanation: |
      `.bin` 保存 token id 的连续二进制数组。样本边界保存在 `.idx` 的 offsets 和 lengths 中。

  - id: q2_offset_length
    prompt: |
      本关 idx 中 offsets 和 lengths 的单位分别是什么？
    options:
      - id: a
        text: offsets 是字节偏移，lengths 是 token 个数。
        correct: true
      - id: b
        text: offsets 是 token 个数，lengths 是字节数。
      - id: c
        text: 二者都是字符数。
      - id: d
        text: 二者都是 JSON 行号。
    explanation: |
      读取时需要先用 `offset // dtype_bytes` 转成 token 下标，再按 length 切出 token 数。

  - id: q3_dtype
    prompt: |
      tokenizer 可能产出 token id 70000 时，`uint16` 会怎样？
    options:
      - id: a
        text: 应该显式报 ValueError，因为 70000 超过 uint16 上限。
        correct: true
      - id: b
        text: 自动截断成 4464。
      - id: c
        text: 自动改成 float32。
      - id: d
        text: 写入 JSONL。
    explanation: |
      `uint16` 最大只能表示 65535。本关要求写入前做 range check，避免 silent wrap。

  - id: q4_mmap
    prompt: |
      `IndexedDataset[i]` 为什么应使用 mmap 和 offsets？
    options:
      - id: a
        text: 这样可以直接定位目标样本，避免每次读取时全量加载或重新 tokenize。
        correct: true
      - id: b
        text: 这样可以跳过 dtype 检查。
      - id: c
        text: 这样会自动训练模型。
      - id: d
        text: 这样能把 vocab 压缩成 1 字节。
    explanation: |
      mmap 让多个 reader 共享文件页；offsets/lengths 让第 i 条样本可以直接 seek 和切片。

  - id: q5_data_path
    prompt: |
      后续 Megatron pretrain 的 `--data-path` 应该指向什么？
    options:
      - id: a
        text: "`<prefix>`，也就是不带 `.bin` 或 `.idx` 后缀的路径。"
        correct: true
      - id: b
        text: 只指向 `<prefix>.bin`。
      - id: c
        text: 只指向 `<prefix>.idx`。
      - id: d
        text: 指向原始 JSONL。
    explanation: |
      Megatron 根据 prefix 找到配套的 `.bin` 和 `.idx`。drill 生成的命令模板也按这个口径传参。
