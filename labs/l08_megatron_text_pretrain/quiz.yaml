mission: l08_megatron_text_pretrain
title: L09 Quiz · Megatron 训练 step 与 LR Scheduler
pass_threshold: 0.8
description: |
  这 5 题检查训练 step 顺序、scheduler 计数、cosine restart 边界、
  param group 输出和 fallback 证据。

prereq_checklist:
  - title: 读 L09 主讲义
    kind: doc
    path: labs/l08_megatron_text_pretrain/lecture.md
    href: "#lesson"
  - title: 读 patch/task.md
    kind: task
    path: labs/l08_megatron_text_pretrain/patch/task.md
    href: "#patch"
  - title: 读 Megatron OptimizerParamScheduler
    kind: source
    path: github_repo/Megatron-LM/megatron/core/optimizer_param_scheduler.py

questions:
  - id: q1_train_step_order
    prompt: |
      在本讲的训练 step 主路径里，LR scheduler 应该在什么条件下推进？
    options:
      - id: a
        text: 每进入一次 data iterator 都推进。
      - id: b
        text: optimizer update 成功后推进。
        correct: true
      - id: c
        text: backward 之前推进。
      - id: d
        text: 只在保存 checkpoint 时推进。
    explanation: |
      Scheduler 控制下一步更新使用的学习率。Megatron 和 MiniInfra 都把它放在
      optimizer update 成功之后；如果本次 update 被跳过，继续推进 lr 会让学习率
      时间轴和真实参数更新错位。

  - id: q2_restart_boundary
    prompt: |
      `restart_steps=[1000, 3000]`、`total_steps=5000` 时，step 1000 的 lr 应该是什么？
    options:
      - id: a
        text: 接近 min_lr，因为它是第一段末尾。
      - id: b
        text: max_lr，因为 restart step 是新 segment 起点。
        correct: true
      - id: c
        text: 0。
      - id: d
        text: "`(max_lr + min_lr) / 2`。"
    explanation: |
      Boundaries 是 `[0, 1000, 3000, 5000]`。本关使用 `start <= step < end`
      查找 segment，因此 step 1000 落入 `[1000, 3000)`，段内相对位置是 0，
      cosine 公式返回 `max_lr`。

  - id: q3_scheduler_increment
    prompt: |
      Megatron 里 scheduler 的 increment 为什么不能简单理解成永远加 1？
    options:
      - id: a
        text: 它可能按本次 optimizer update 消费的样本数推进。
        correct: true
      - id: b
        text: 它只按 wall clock 时间推进。
      - id: c
        text: 它只在 validation 期间推进。
      - id: d
        text: 它与 batch size 完全无关。
    explanation: |
      Megatron 的训练 loop 会根据 `num_microbatches * micro_batch_size *
      data_parallel_size` 计算 increment。改 batch 相关参数时，LR schedule 的真实
      时间轴也要复查。

  - id: q4_param_groups
    prompt: |
      本关 patch 为什么要求 `_set_lr()` 写入所有 optimizer param groups？
    options:
      - id: a
        text: 避免不同参数组使用不一致的 lr，并让日志读到的 lr 与实际更新一致。
        correct: true
      - id: b
        text: 这样可以减少模型参数量。
      - id: c
        text: 这样可以跳过 optimizer.step()。
      - id: d
        text: 因为 PyTorch 只允许一个 param group。
    explanation: |
      PyTorch optimizer 可以包含多个 param groups。若只写第一个 group，其他 group
      会继续使用旧 lr，训练行为和日志都会变得难解释。

  - id: q5_fallback
    prompt: |
      L09 drill 在缺少真实 Megatron runtime 时写出 fallback artifact。这个结果能证明什么？
    options:
      - id: a
        text: 证明真实 GPT forward/backward 已完成。
      - id: b
        text: 证明启动边界、缺失条件和 expected command 被记录。
        correct: true
      - id: c
        text: 证明模型收敛。
      - id: d
        text: 证明 checkpoint 一定可恢复。
    explanation: |
      Fallback 的价值是诚实记录本地缺什么：JSONL、indexed dataset 或 Megatron
      包。真实训练还需要 loss、lr、tokens/sec、checkpoint 等运行证据。
