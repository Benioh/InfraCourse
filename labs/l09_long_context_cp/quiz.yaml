mission: l09_long_context_cp
title: L10 Quiz · 长上下文 CP 与 Online Softmax
pass_threshold: 0.8
description: |
  这 5 题检查 score 激活显存、online softmax 等价性、ring 通信、
  causal mask 边界和 RoPE/YaRN 的系统位置。

prereq_checklist:
  - title: 读 L10 主讲义
    kind: doc
    path: labs/l09_long_context_cp/lecture.md
    href: "#lesson"
  - title: 读 patch/task.md
    kind: task
    path: labs/l09_long_context_cp/patch/task.md
    href: "#patch"
  - title: 对照 sequence length drill 源码
    kind: source
    path: labs/l09_long_context_cp/scripts/run_seqlen.py

questions:
  - id: q1_score_memory
    prompt: |
      Full attention 中 `scores = QK^T / sqrt(D)` 的主要中间张量形状是什么？
    options:
      - id: a
        text: "(B, H, Sq, Sk)"
        correct: true
      - id: b
        text: "(B, Sq, D)"
      - id: c
        text: "(H, D, D)"
      - id: d
        text: "(B, H, Sk, D)"
    explanation: |
      对每个 query 位置都要和所有 key 位置做相似度计算，因此 score 形状是
      `(B,H,Sq,Sk)`。当 `Sq` 和 `Sk` 同时变长时，中间激活按二次方增长。

  - id: q2_online_rescale
    prompt: |
      online softmax 看到新 chunk 后，`new_max` 大于旧 `running_max`。为什么旧的
      `running_denom` 和 `running_out` 都要乘 `exp(running_max - new_max)`？
    options:
      - id: a
        text: 因为旧状态原来使用旧 max 作为指数平移参考，需要换到 new_max 的参考系。
        correct: true
      - id: b
        text: 因为这样可以减少矩阵乘的 FLOPs。
      - id: c
        text: 因为 PyTorch SDPA 要求这样调用。
      - id: d
        text: 因为只有分母需要归一化，输出张量可以随意缩放。
    explanation: |
      softmax 的分子和分母必须使用同一个 max-shift。新 chunk 让最大值上升时，
      旧的分母和未归一化输出都要按同一系数重缩放，否则不同 chunk 的贡献不在
      同一参考系里。

  - id: q3_chunk_semantics
    prompt: |
      如果 `num_chunks` 从 1 改成 4，正确实现下 attention 语义应该怎样变化？
    options:
      - id: a
        text: 输出应保持与 full attention 等价，只是读取 K/V 的顺序改变。
        correct: true
      - id: b
        text: 输出会变成 4 倍。
      - id: c
        text: 每个 query 只能看当前 chunk。
      - id: d
        text: softmax 分母会分别归一化，最终不用合并。
    explanation: |
      chunk 只改变计算顺序和峰值中间张量。online softmax 把所有 chunk 合进同一个
      running denominator，因此最终应与 full attention 对齐。

  - id: q4_ring_steps
    prompt: |
      Context Parallel world size 为 4 时，每个 rank 除了自己的 K/V chunk，还需要从 ring 上接收几次其他 chunk？
    options:
      - id: a
        text: 0 次。
      - id: b
        text: 1 次。
      - id: c
        text: 3 次。
        correct: true
      - id: d
        text: 4 次。
    explanation: |
      每个 rank 已经持有自己的 K/V chunk。为了见到其他 3 个 rank 的 chunk，需要
      `world_size - 1` 次传递。第 4 次会把自己的 chunk 传回，无需继续。

  - id: q5_rope_yarn_boundary
    prompt: |
      RoPE / YaRN 与 ring attention 的边界是什么？
    options:
      - id: a
        text: RoPE/YaRN 主要处理位置外推；ring attention 主要处理 attention 计算和激活路径。
        correct: true
      - id: b
        text: RoPE/YaRN 会自动减少 score 矩阵显存。
      - id: c
        text: ring attention 会自动解决所有长上下文位置外推问题。
      - id: d
        text: 两者都只影响 tokenizer。
    explanation: |
      RoPE/YaRN 影响 Q/K 的位置表示和长上下文外推。online softmax、FlashAttention
      和 Context Parallel 处理 attention 计算、显存峰值与通信。两类问题需要分别验证。
