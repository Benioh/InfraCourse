profile: cpu_smoke
mode: lifecycle
model:
  hidden_size: 64
  num_layers: 4
  num_attention_heads: 4
  vocab_size: 256
training:
  micro_batch_size: 2
  global_batch_size: 8
  seq_length: 64
  train_steps: 200
  precision: fp32
parallel:
  tp: 1
  pp: 1
  dp: 1
optimizer:
  name: adamw
  lr: 1.0e-3
  min_lr: 1.0e-5
  weight_decay: 0.01
  betas: [0.9, 0.95]
scheduler:
  name: cosine_with_restarts
  restart_steps: [80]
  total_steps: 200
checkpoint:
  save_every: 100
  save_dir: artifacts/checkpoints
acceptance:
  loss_drop_first_50_steps: 0.05
  must_observe_restart_at_step: 80
