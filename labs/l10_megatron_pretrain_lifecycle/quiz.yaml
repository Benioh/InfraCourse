mission: l10_megatron_pretrain_lifecycle
title: L04.8 Quiz · Megatron train_step
pass_threshold: 1.0
description: |
  这组问题确认你能把 L04 的 scheduler patch 放回 Megatron-shaped train_step。

prereq_checklist:
  - title: 读 patch/task.md
    kind: read
    path: labs/l10_megatron_pretrain_lifecycle/patch/task.md
  - title: 读 MiniInfra Megatron pretrain
    kind: source
    path: mini_infra/megatron/pretrain_gpt.py
  - title: 读 Megatron training.py
    kind: source
    path: github_repo/Megatron-LM/megatron/training/training.py

questions:
  - id: q1_entry_boundary
    prompt: Megatron 的 `pretrain_gpt.py` 主要把哪些 provider 交给通用 training loop？
    options:
      - id: a
        text: model_provider、get_batch、loss_func
        correct: true
      - id: b
        text: HTTP router、KV cache、scheduler
      - id: c
        text: tokenizer trainer、dataset downloader、wandb login
      - id: d
        text: CUDA kernel launch 参数
    explanation: "`pretrain_gpt.py` 是任务入口；通用循环在 `megatron/training/training.py`。"
  - id: q2_forward_backward
    prompt: "`forward_backward_func` 的系统边界是什么？"
    options:
      - id: a
        text: 只负责保存 checkpoint
      - id: b
        text: 连接 microbatch、PP schedule、forward/loss/backward 的执行
        correct: true
      - id: c
        text: 只负责 tokenizer
      - id: d
        text: 只负责读取 JSONL
    explanation: "它是训练 step 中把并行 schedule 和模型计算接起来的关键边界。"
  - id: q3_scheduler_state
    prompt: LR scheduler state 为什么属于 checkpoint 语义？
    options:
      - id: a
        text: 不保存也不会影响 resume
      - id: b
        text: resume 后必须延续 step-based LR，否则 loss 曲线会跳变
        correct: true
      - id: c
        text: scheduler 只影响日志
      - id: d
        text: scheduler 只影响 dataloader seed
    explanation: "训练恢复需要 model、optimizer、scheduler/global step 一致。"
  - id: q4_miniinfra_gap
    prompt: MiniInfra pretrain 不能外推成真实 Megatron 性能结论的主要原因是什么？
    options:
      - id: a
        text: 它保留生命周期但缩小了模型、数据、并行 runtime 和硬件复杂度
        correct: true
      - id: b
        text: 它没有 Python 代码
      - id: c
        text: 它一定比真实 Megatron 慢
      - id: d
        text: 它只支持 HTTP
    explanation: "MiniInfra 用来验证系统语义，不代表 8×H200 性能。"
  - id: q5_debug_start
    prompt: 如果 Megatron 训练启动后 loss 是 NaN，你不会第一时间从哪里查？
    options:
      - id: a
        text: batch/loss 函数
      - id: b
        text: precision/lr/optimizer
      - id: c
        text: checkpoint resume 状态
      - id: d
        text: OpenAI HTTP streaming response
        correct: true
    explanation: "HTTP streaming 是 serving 边界，不是 Megatron pretrain 启动 NaN 的第一调查点。"
