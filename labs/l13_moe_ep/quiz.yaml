mission: l13_moe_ep
title: L14 Quiz · MoE Router、Capacity 与 Expert Parallelism
pass_threshold: 0.8
description: |
  这 5 题检查 L14 讲过的关键边界：top-1/top-2 的取舍、capacity factor、
  Switch 风格 aux loss、token dropping 和 Expert Parallelism。

prereq_checklist:
  - title: 读系统地图
    kind: doc
    path: labs/l13_moe_ep/system_map.md
    href: "#lesson"
  - title: 读主讲义
    kind: doc
    path: labs/l13_moe_ep/lecture.md
    href: "#lesson"
  - title: 读源码带读
    kind: doc
    path: labs/l13_moe_ep/source_walkthrough.md
    href: "#lesson"
  - title: 最后读 patch/task.md
    kind: task
    path: labs/l13_moe_ep/patch/task.md
    href: "#patch"
  - title: 对照 Megatron MoE router
    kind: source
    path: github_repo/Megatron-LM/megatron/core/transformer/moe/router.py

questions:
  - id: q1_top1_vs_top2
    prompt: Switch Transformer 常用 top-1，GShard / Mixtral 一类模型常用 top-2。核心取舍是什么？
    options:
      - id: a
        text: top-1 每个 token 只走一个 expert，通信少；top-2 通信和 expert 计算更多，但质量和负载平滑通常更好
        correct: true
      - id: b
        text: top-2 要求 expert 数必须是偶数
      - id: c
        text: top-1 只能训练，top-2 只能推理
      - id: d
        text: top-1 和 top-2 在通信量上没有区别
    explanation: |
      top-k 改变每个 token 实际触发的 expert 数。top-1 通信和 expert 计算更少，但路由更硬；top-2 每个 token 多一条路径，通常有更好的组合空间和负载平滑，代价是更多 dispatch/combine 通信。

  - id: q2_capacity_factor
    prompt: 128 个 token、8 个 expert、top-2、capacity factor 为 1.0 时，每个 expert 的 capacity 是多少？
    options:
      - id: a
        text: 16
      - id: b
        text: 32
        correct: true
      - id: c
        text: 64
      - id: d
        text: 128
    explanation: |
      capacity = capacity_factor * num_tokens * top_k / num_experts = 1.0 * 128 * 2 / 8 = 32。top-2 时总路由槽位是 token 数的 2 倍。

  - id: q3_aux_loss
    prompt: Switch 风格 aux loss 为什么同时使用 `fraction_routed` 和 `fraction_prob`？
    options:
      - id: a
        text: "`fraction_routed` 反映实际路由分布，`fraction_prob` 来自 softmax，可把梯度传回 router logits"
        correct: true
      - id: b
        text: 二者完全相同，只是写法不同
      - id: c
        text: "`fraction_prob` 只用于打印日志"
      - id: d
        text: "`fraction_routed` 比 softmax 更可微"
    explanation: |
      top-k 路由是离散选择，实际 routed count 本身不能直接给 logits 提供平滑梯度。aux loss 用实际行为放大可微概率，让 router 能学习减少 expert 过载。

  - id: q4_token_drop
    prompt: capacity 不够时，本关应该怎样处理超出容量的 route？
    options:
      - id: a
        text: 按该 expert 的 combine weight 保留前 capacity 个 route，其余 mask 和 weights 同步清零
        correct: true
      - id: b
        text: 强制塞进 expert，只要不报错即可
      - id: c
        text: 只清 dispatch_mask，保留 combine_weights
      - id: d
        text: 重新广播到所有 expert
    explanation: |
      mask 和 weights 必须保持同一 token-to-expert 对齐关系。drop 时只清其中一个会让后续 combine 使用不存在的 expert 输出。

  - id: q5_ep_vs_tp
    prompt: Expert Parallelism (EP) 与 Tensor Parallelism (TP) 在 MoE 中的关键区别是什么？
    options:
      - id: a
        text: EP 把不同 expert 放到不同 rank，token 按路由通过 all-to-all 到对应 rank；TP 把单个 expert 内部矩阵切到多个 rank
        correct: true
      - id: b
        text: EP 只能用于 dense FFN，TP 只能用于 router
      - id: c
        text: EP 不需要通信，TP 才需要通信
      - id: d
        text: 二者只是命名不同
    explanation: |
      EP 利用 MoE 稀疏性：token 只去自己选中的 expert。TP 切的是矩阵计算，通常不自动利用 token-to-expert 稀疏路由。实际训练常把 EP、TP、DP、PP 组合使用。
