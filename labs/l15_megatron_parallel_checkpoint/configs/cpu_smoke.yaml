profile: cpu_smoke
checkpoint_iteration: 10
states:
  model_state:
    layer.0.weight: [1, 2, 3, 4]
    layer.1.weight: [5, 6, 7, 8]
  optimizer_state:
    distributed: true
    shards:
      - rank: 0
        slice: [0, 4]
      - rank: 1
        slice: [4, 8]
  scheduler_state:
    step_count: 10
    last_lr: 3.0e-4
  parallel_state:
    tp: 2
    pp: 1
    dp: 4
    ep: 1
expected_compatibility:
  - label: same_topology
    parallel_state: {tp: 2, pp: 1, dp: 4}
    must_pass_strict: true
    must_have_warnings: 0
  - label: tp_doubled
    parallel_state: {tp: 4, pp: 1, dp: 2}
    must_pass_strict: false
    must_have_warnings: 1
  - label: ep_introduced
    parallel_state: {tp: 2, pp: 1, dp: 4, ep: 2}
    must_pass_strict: false
    must_have_warnings: 1
