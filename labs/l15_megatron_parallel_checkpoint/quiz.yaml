mission: l15_megatron_parallel_checkpoint
title: L05.8 Quiz · Distributed checkpoint 与 resume
pass_threshold: 1.0
description: |
  确认学习者理解 Megatron checkpoint 不只是 model weights，还包含 optimizer、
  scheduler 和 parallel_state 的 resume 合同。

prereq_checklist:
  - title: 读 patch/task.md
    kind: read
    path: labs/l15_megatron_parallel_checkpoint/patch/task.md
  - title: 读 MiniInfra checkpointing
    kind: source
    path: mini_infra/megatron/training/checkpointing.py
  - title: 读 Megatron checkpointing
    kind: source
    path: github_repo/Megatron-LM/megatron/training/checkpointing.py

questions:
  - id: q1_checkpoint_contents
    prompt: 恢复训练时，checkpoint 至少应该恢复哪些状态？
    options:
      - id: a
        text: model、optimizer、scheduler/global step、parallel_state
        correct: true
      - id: b
        text: 只恢复 model weights
      - id: c
        text: 只恢复 tokenizer
      - id: d
        text: 只恢复日志文件
    explanation: "少了 optimizer/scheduler/parallel_state，resume 语义就不连续。"
  - id: q2_parallel_state
    prompt: load checkpoint 时为什么要校验 parallel_state？
    options:
      - id: a
        text: 因为 TP/PP/DP/EP 等并行配置会影响权重和优化器状态的切片语义
        correct: true
      - id: b
        text: 因为 tokenizer 一定改变
      - id: c
        text: 因为 JSONL 文件会消失
      - id: d
        text: 因为 Python 不能加载旧文件
    explanation: "并行切片语义是 checkpoint compatibility 的一部分。"
  - id: q3_scheduler_state
    prompt: 为什么 scheduler_state 也要保存？
    options:
      - id: a
        text: resume 后 LR 必须从正确 step 继续，否则训练曲线会跳变
        correct: true
      - id: b
        text: HTTP response
      - id: c
        text: tokenizer vocab
      - id: d
        text: README
    explanation: "LR schedule 是 step-based 状态，不是纯配置。"
  - id: q4_strict_load
    prompt: strict=True 加载时发现 parallel_state 不匹配，正确行为是什么？
    options:
      - id: a
        text: 直接报错，阻止错误 resume
        correct: true
      - id: b
        text: 静默忽略
      - id: c
        text: 自动改 tokenizer
      - id: d
        text: 删除 checkpoint
    explanation: "strict load 的意义就是尽早暴露不兼容状态。"
  - id: q5_debug
    prompt: 加载 checkpoint 报 tensor shape mismatch，最应该先核对什么？
    options:
      - id: a
        text: 模型结构、TP/PP/EP/DP 配置和 checkpoint 元数据
        correct: true
      - id: b
        text: 浏览器缓存
      - id: c
        text: markdown 标题
      - id: d
        text: OpenAI API key
    explanation: "shape mismatch 多数来自模型结构或并行切片语义不一致。"
