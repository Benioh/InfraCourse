mission: l16_resume_after_crash
title: L17 Quiz · Crash Resume
pass_threshold: 0.8
description: |
  这 5 题检查 L17 的关键边界：原子写、dangling tmp 清理、latest marker、
  optimizer/RNG 恢复，以及 crash+resume 后的 loss 连续性。

prereq_checklist:
  - title: 读系统地图
    kind: doc
    path: labs/l16_resume_after_crash/system_map.md
    href: "#lesson"
  - title: 读主讲义
    kind: doc
    path: labs/l16_resume_after_crash/lecture.md
    href: "#lesson"
  - title: 读源码带读
    kind: doc
    path: labs/l16_resume_after_crash/source_walkthrough.md
    href: "#lesson"
  - title: 最后读 patch/task.md
    kind: task
    path: labs/l16_resume_after_crash/patch/task.md
    href: "#patch"
  - title: 对照 Megatron checkpointing
    kind: source
    path: github_repo/Megatron-LM/megatron/training/checkpointing.py

questions:
  - id: q1_atomic_save
    prompt: checkpoint 写入为什么要先落到临时文件，再用同目录 rename/replace 提交？
    options:
      - id: a
        text: 同一文件系统内的 replace 是提交边界，reader 不会看到半写 checkpoint
        correct: true
      - id: b
        text: 这样可以减少模型参数数量
      - id: c
        text: 这样可以跳过 optimizer state
      - id: d
        text: 这样会自动修复损坏的训练数据
    explanation: |
      crash-safe save 的核心是把写入阶段和提交阶段分开。临时文件完成 flush/fsync 后，rename/replace 才把它变成 committed checkpoint。

  - id: q2_dangling_tmp
    prompt: 启动恢复时发现目录里只有 `iter_0000003.pt.tmp`，正确处理是什么？
    options:
      - id: a
        text: 删除 dangling tmp，并回退到最近一个已提交 checkpoint
        correct: true
      - id: b
        text: 把 tmp 文件直接当作最新 checkpoint 加载
      - id: c
        text: 把 tmp 文件改名为正式 checkpoint
      - id: d
        text: 忽略所有旧 checkpoint 并从头训练
    explanation: |
      `.tmp` 表示上一次写入没有完成提交。恢复路径只能信任已提交文件和 marker，不能加载半成品。

  - id: q3_resume_state
    prompt: crash 后要继续同一条训练轨迹，checkpoint 至少需要恢复哪些状态？
    options:
      - id: a
        text: model state、optimizer state、step/iteration、RNG state，生产里还要考虑数据进度
        correct: true
      - id: b
        text: 只恢复模型权重
      - id: c
        text: 只恢复 tokenizer 文件
      - id: d
        text: 只恢复日志目录
    explanation: |
      下一步训练由参数、优化器历史、随机流和数据游标共同决定。只恢复模型权重不能证明 resume 连续性。

  - id: q4_latest_marker
    prompt: "`latest_checkpointed_iteration.txt` 应该在什么时候更新？"
    options:
      - id: a
        text: checkpoint 文件原子提交成功之后，再更新 latest marker
        correct: true
      - id: b
        text: 写临时文件之前
      - id: c
        text: 每个 batch 开始之前
      - id: d
        text: 只要目录存在就立即更新
    explanation: |
      marker 是恢复入口。若它先指向尚未提交的 iteration，下一次 resume 可能读到不存在或半写的文件。

  - id: q5_loss_continuity
    prompt: drill 中 baseline 跑完整 100 步，crash run 跑 50 步后保存再恢复继续。通过条件主要证明什么？
    options:
      - id: a
        text: 恢复后的状态足够完整，最终 loss 与不中断 baseline 对齐
        correct: true
      - id: b
        text: checkpoint 文件越大越好
      - id: c
        text: resume 后一定比 baseline 更快收敛
      - id: d
        text: 可以不保存 optimizer state
    explanation: |
      loss 对齐是端到端证据：保存、加载、优化器状态和后续 step 都在同一条轨迹上。
