mission: l17_megatron_multimodal_data
title: L18 Quiz · Multimodal Data Collator
pass_threshold: 0.8
description: |
  这 5 题检查 L18 的关键边界：placeholder token、attention mask、
  modal_type_ids、image/audio side tensors，以及 dataloader 层的职责。

prereq_checklist:
  - title: 读系统地图
    kind: doc
    path: labs/l17_megatron_multimodal_data/system_map.md
    href: "#lesson"
  - title: 读主讲义
    kind: doc
    path: labs/l17_megatron_multimodal_data/lecture.md
    href: "#lesson"
  - title: 读源码带读
    kind: doc
    path: labs/l17_megatron_multimodal_data/source_walkthrough.md
    href: "#lesson"
  - title: 最后读 patch/task.md
    kind: task
    path: labs/l17_megatron_multimodal_data/patch/task.md
    href: "#patch"
  - title: 对照 Megatron multimodal TaskEncoder
    kind: source
    path: github_repo/Megatron-LM/examples/multimodal/dataset_helpers.py

questions:
  - id: q1_sequence_order
    prompt: 一个样本同时有图像、12 帧音频和 3 个文本 token，`image_num_patches=4`。主序列顺序和长度是什么？
    options:
      - id: a
        text: 4 个 image token，12 个 audio token，再接 3 个 text token，总长度 19
        correct: true
      - id: b
        text: 1 个 image token，1 个 audio token，再接 3 个 text token，总长度 5
      - id: c
        text: 3 个 text token 后接 image/audio token，总长度 19
      - id: d
        text: 只保留 text token，总长度 3
    explanation: |
      L18 约定顺序固定为 image、audio、text。图像占位数量由 `image_num_patches` 决定，音频占位数量由截断后的真实帧数决定。

  - id: q2_masks
    prompt: "`attention_mask` 和 `modal_type_ids` 的职责有什么区别？"
    options:
      - id: a
        text: attention_mask 标记真实位置与 padding，modal_type_ids 标记真实位置的模态来源
        correct: true
      - id: b
        text: 两者完全等价，只是 dtype 不同
      - id: c
        text: attention_mask 只在 inference 用，modal_type_ids 只在 training 用
      - id: d
        text: modal_type_ids 用来判断缺文件，attention_mask 用来判断文件路径
    explanation: |
      padding 与真实文本的 modal 值都可以是 0，所以判断 padding 必须看 `attention_mask`。

  - id: q3_image_side_channel
    prompt: batch 中第 1 行和第 3 行有图像，其他行无图。`pixel_values` 和 `image_batch_indices` 应该怎样表示？
    options:
      - id: a
        text: pixel_values 只 stack 两张真实图，image_batch_indices 为 [1, 3]
        correct: true
      - id: b
        text: pixel_values 必须补成 batch 大小 4，空图用全 0 占位
      - id: c
        text: image_batch_indices 可以省略，因为顺序总是和 batch 行号相同
      - id: d
        text: 图像内容应直接写进 input_ids
    explanation: |
      side tensor 只保存真实存在的模态内容，batch indices 负责把 side tensor 行映射回原 batch 行。

  - id: q4_audio_padding
    prompt: "`max_audio_frames=64`，一段音频有 10 帧。collator 应该生成多少个 audio token，`audio_features` 形状如何？"
    options:
      - id: a
        text: 主序列 10 个 audio token；side tensor 这一行 pad 成 (64, 80)，audio_mask 前 10 个为 True
        correct: true
      - id: b
        text: 主序列 64 个 audio token；所有 padding 帧都参与 attention
      - id: c
        text: 主序列 0 个 audio token；音频只放进 report
      - id: d
        text: side tensor 保持 (10, 80)，不需要 stack
    explanation: |
      主序列只为真实保留帧占位；side tensor 为了 stack 到同一 shape，需要 pad 到固定上限。

  - id: q5_pipeline_boundary
    prompt: 真实训练中发现 resume 后重复读样本，最先应该检查哪一层？
    options:
      - id: a
        text: dataloader/shard resume state，例如 Energon savable loader 和 worker cursor
        correct: true
      - id: b
        text: "`IMAGE_TOKEN_ID` 的数值是否为 1"
      - id: c
        text: "`modal_type_ids` 是否使用 int8"
      - id: d
        text: "`pixel_values` 的通道数是否等于 3"
    explanation: |
      重复读或漏读是样本顺序和恢复状态问题，通常先查 shard order、worker state 和 dataloader checkpoint。
