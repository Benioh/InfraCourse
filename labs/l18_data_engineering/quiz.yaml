mission: l18_data_engineering
title: L19 Quiz · MinHash Data Engineering
pass_threshold: 0.8
description: |
  这 5 题检查 L19 的关键边界：shingle/Jaccard、num_perm 成本、
  LSH banding、train/eval 泄漏，以及 shard resume 的排查入口。

prereq_checklist:
  - title: 读系统地图
    kind: doc
    path: labs/l18_data_engineering/system_map.md
    href: "#lesson"
  - title: 读主讲义
    kind: doc
    path: labs/l18_data_engineering/lecture.md
    href: "#lesson"
  - title: 读源码带读
    kind: doc
    path: labs/l18_data_engineering/source_walkthrough.md
    href: "#lesson"
  - title: 最后读 patch/task.md
    kind: task
    path: labs/l18_data_engineering/patch/task.md
    href: "#patch"
  - title: 对照 MiniInfra MinHash
    kind: source
    path: mini_infra/data/minhash_dedup.py

questions:
  - id: q1_shingle_jaccard
    prompt: shingle 和 Jaccard 在 MinHash 去重里分别承担什么职责？
    options:
      - id: a
        text: shingle 把文本变成集合，Jaccard 衡量两个集合交集占并集的比例
        correct: true
      - id: b
        text: shingle 是 GPU kernel，Jaccard 是 tokenizer
      - id: c
        text: shingle 只用于图像，Jaccard 只用于音频
      - id: d
        text: 二者都只用于排序文件路径
    explanation: |
      MinHash 的数学对象是集合。先定义 shingle 集合，再用 Jaccard 定义相似度，签名只是估计这个相似度。

  - id: q2_num_perm
    prompt: "`num_perm` 从 64 增加到 256，最直接的影响是什么？"
    options:
      - id: a
        text: 估计方差降低，但每篇文档的签名计算和存储成本约增加 4 倍
        correct: true
      - id: b
        text: 文档数量会自动减少 4 倍
      - id: c
        text: Jaccard 定义会改变
      - id: d
        text: 不再需要稳定哈希
    explanation: |
      `num_perm` 是重复抽样次数。更多维度能让估计更稳，但成本按签名长度线性增加。

  - id: q3_lsh
    prompt: LSH banding 在大规模 MinHash dedup 中解决什么问题？
    options:
      - id: a
        text: 用 band hash 先筛候选对，减少 O(N^2) 全量两两比较
        correct: true
      - id: b
        text: 改写 Jaccard 的数学定义
      - id: c
        text: 自动读取坏 shard
      - id: d
        text: 把文本变成图像 embedding
    explanation: |
      LSH 只负责候选检索。候选对仍要用签名相似度或 Jaccard 阈值做最终判断。

  - id: q4_eval_leak
    prompt: 为什么训练数据要检查和 eval 集的重叠？
    options:
      - id: a
        text: eval 样本如果已在训练集中出现，指标可能反映记忆而非泛化
        correct: true
      - id: b
        text: eval 集重叠会让 DataLoader 不能启动
      - id: c
        text: eval 集重叠会改变模型参数量
      - id: d
        text: eval 集重叠只影响文件名排序
    explanation: |
      train/eval overlap 是数据泄漏。去重报告应记录阈值、命中 pairs 和抽样审计结果。

  - id: q5_shard_resume
    prompt: 训练恢复后出现重复读或漏读样本，应该优先检查哪一层？
    options:
      - id: a
        text: shard order、resume cursor、dataloader state 和 corrupt shard recovery
        correct: true
      - id: b
        text: MinHash 的 `_seeded_hashes` 参数
      - id: c
        text: "`IMAGE_TOKEN_ID` 的值"
      - id: d
        text: 训练 loss 的显示格式
    explanation: |
      重复读和漏读通常来自数据供给状态，不是 MinHash 签名本身。先查 shard/recovery，再回到具体 batch。
