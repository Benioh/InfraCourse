mission: l19_vllm_serving_baseline
title: L20 Quiz · vLLM Serving Baseline and Typical-p Sampling
pass_threshold: 0.8
description: |
  这 5 题检查 L20 的关键边界：typical-p 的排序依据、logits filter
  的 shape 合同、vLLM sampler 顺序、validation_only 的含义，以及
  serving 指标复盘时必须固定的 workload。

prereq_checklist:
  - title: 读系统地图
    kind: doc
    path: labs/l19_vllm_serving_baseline/system_map.md
    href: "#lesson"
  - title: 读主讲义
    kind: doc
    path: labs/l19_vllm_serving_baseline/lecture.md
    href: "#lesson"
  - title: 读源码带读
    kind: doc
    path: labs/l19_vllm_serving_baseline/source_walkthrough.md
    href: "#lesson"
  - title: 最后读 patch/task.md
    kind: task
    path: labs/l19_vllm_serving_baseline/patch/task.md
    href: "#patch"
  - title: 对照 vLLM Sampler
    kind: source
    path: github_repo/vllm/vllm/v1/sample/sampler.py

questions:
  - id: q1_typical_vs_top_p
    prompt: typical-p 和 top-p 都会截断候选 token，它们最核心的差别是什么？
    options:
      - id: a
        text: top-p 按概率从高到低累计，typical-p 按 |surprisal - entropy| 从小到大累计
        correct: true
      - id: b
        text: 二者完全等价，只是参数名不同
      - id: c
        text: top-p 只用于 chat 模型，typical-p 只用于 base 模型
      - id: d
        text: typical-p 会改变模型权重，top-p 只改变 logits
    explanation: |
      top-p 的候选集合按 token 概率排序，优先保留概率最高的一段。typical-p
      先计算每个 token 的 surprisal，再和整行分布的 entropy 比较，优先保留信息量接近平均值的 token。

  - id: q2_shape_contract
    prompt: "`typical_p_filter(logits, typical_p, filter_value)` 的输出合同是什么？"
    options:
      - id: a
        text: 返回和输入 logits 同形的张量，过滤位置等于 filter_value，保留位置保持原始 logit
        correct: true
      - id: b
        text: 返回保留下来的 token id 列表，shape 可以随阈值变化
      - id: c
        text: 返回已经采样出的 token，因此不需要后续 softmax
      - id: d
        text: 返回每行 entropy，供 scheduler 使用
    explanation: |
      logits filter 只编辑候选集合，不负责抽样。它必须保持 `(batch, vocab)` 形状，
      这样后面的 sampler 还能在原 vocab id 空间里归一化和采样。

  - id: q3_scatter_reason
    prompt: reference 实现为什么要把 `sorted_remove` scatter 回原 vocab 顺序？
    options:
      - id: a
        text: 排序只是临时视图，mask 必须回到原 token id 位置才能正确 masked_fill
        correct: true
      - id: b
        text: scatter 可以降低 entropy
      - id: c
        text: scatter 会自动启动 vLLM server
      - id: d
        text: scatter 用来把 batch size 改成 1
    explanation: |
      `torch.sort` 产生的是按 typicality distance 排列后的索引。最终返回的 logits
      仍按原 vocab id 排列，所以删除 mask 也必须回到原顺序。

  - id: q4_sampler_order
    prompt: 在当前 vLLM sampler 主路径里，temperature、argmax-invariant processors 和 top-k/top-p 的相对顺序是什么？
    options:
      - id: a
        text: 先应用 temperature，再应用 argmax-invariant processors，最后进入 top-k/top-p sampler
        correct: true
      - id: b
        text: 先 top-k/top-p，再 temperature，最后 penalties
      - id: c
        text: temperature 只在 prefill 阶段生效
      - id: d
        text: top-k/top-p 在模型 forward 前执行
    explanation: |
      `Sampler.sample` 中随机采样路径先处理 temperature，然后执行只影响随机采样的
      logits processors，接着调用 top-k/top-p sampler。

  - id: q5_validation_only
    prompt: "`run_vllm_lab.py` 写出 `status: validation_only` 时，报告应该怎样解释？"
    options:
      - id: a
        text: 本地没有完成真实 serving 请求，报告只能说明健康检查和配置记录，不应当写成 served 指标
        correct: true
      - id: b
        text: 已完成真实 benchmark，可以比较吞吐
      - id: c
        text: typical-p patch 一定失败
      - id: d
        text: vLLM 已经在 H200 集群上运行
    explanation: |
      `validation_only` 通常表示端口上没有可用 server，或者没有完成真实请求。它可以用于检查配置、
      命令和报告路径，但不能当作 TTFT、ITL 或吞吐的服务结果。
