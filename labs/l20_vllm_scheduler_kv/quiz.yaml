mission: l20_vllm_scheduler_kv
title: L21 Quiz · vLLM Scheduler and KV Cache
pass_threshold: 1.0
description: |
  检查学习者是否理解 vLLM 请求生命周期和 KV block 调度边界。

prereq_checklist:
  - title: 读系统地图：知道 L21 在 Serving 主线里的位置
    kind: doc
    path: labs/l20_vllm_scheduler_kv/system_map.md
    href: "#lesson"
    estimate_min: 8
  - title: 读主讲义：从问题、机制到生产排查串起来
    kind: doc
    path: labs/l20_vllm_scheduler_kv/lecture.md
    href: "#lesson"
    estimate_min: 35
  - title: 跟源码带读：按主路径读 MiniInfra 和真实 vLLM
    kind: doc
    path: labs/l20_vllm_scheduler_kv/source_walkthrough.md
    href: "#lesson"
    estimate_min: 30
  - title: 最后读 patch/task.md
    kind: task
    path: labs/l20_vllm_scheduler_kv/patch/task.md
    href: "#patch"
    estimate_min: 5
  - title: 对照真实 vLLM engine
    kind: source
    path: github_repo/vllm/vllm/v1/engine/llm_engine.py
    estimate_min: 10
  - title: 对照真实 vLLM scheduler
    kind: source
    path: github_repo/vllm/vllm/v1/core/sched/scheduler.py
    estimate_min: 15

questions:
  - id: q1_lifecycle
    prompt: OpenAI 请求进入 vLLM 后通常先被转换成什么？
    options:
      - id: a
        text: engine request / internal request
        correct: true
      - id: b
        text: Megatron optimizer state
      - id: c
        text: WebDataset shard
      - id: d
        text: PPO advantage
    explanation: "OpenAI-compatible API 负责协议入口，请求随后会进入 engine/core 的内部请求生命周期。调度决策发生在 engine/scheduler 之后。"
  - id: q2_kv_pressure
    prompt: KV block 不足最直接影响什么？
    options:
      - id: a
        text: waiting 请求能否 prefill / running 请求能否继续
        correct: true
      - id: b
        text: tokenizer vocab 是否存在
      - id: c
        text: README 渲染
      - id: d
        text: optimizer warmup
    explanation: "KV cache 是 serving scheduler 的硬资源。block 不够时，新请求不能进入 running，running 请求也可能无法继续扩展上下文。"
  - id: q3_ttft
    prompt: 长 prompt 的 TTFT 通常主要受哪一阶段影响？
    options:
      - id: a
        text: prefill
        correct: true
      - id: b
        text: checkpoint save
      - id: c
        text: Adam moment update
      - id: d
        text: MinHash
    explanation: "首 token 出现前要先处理 prompt 并写入对应 KV。prompt 越长，prefill 计算和 KV 写入越重。"
  - id: q4_itl
    prompt: ITL 更直接对应哪个阶段？
    options:
      - id: a
        text: decode step
        correct: true
      - id: b
        text: data preprocess
      - id: c
        text: LR restart
      - id: d
        text: tar shard 写入
    explanation: "ITL 观察的是输出 token 之间的间隔，主要对应 decode 阶段的循环推进、KV 读取、batch 组织和采样。"
  - id: q5_debug
    prompt: 如果服务吞吐下降且 waiting 队列增长，最应该同时看什么？
    options:
      - id: a
        text: token budget、KV free blocks、running/waiting 队列和请求长度分布
        correct: true
      - id: b
        text: 只看 HTTP 200 状态码
      - id: c
        text: 只看 README
      - id: d
        text: 只看训练 loss
    explanation: "waiting 增长通常要把请求分布、running 上限、token budget、KV free blocks 和 prefix/cache 命中一起看，单看 HTTP 状态或吞吐很容易误判。"
