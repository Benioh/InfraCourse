mission: l21_sglang_serving_core
title: L22 Quiz · SGLang RadixCache Prefix Reuse
pass_threshold: 0.8
description: |
  这 5 题检查 L22 的关键边界：prefix hit 的判定对象、RadixCache
  与 PagedAttention 的分工、LRU 叶子驱逐、namespace 隔离，以及
  repeated-prefix benchmark 的 validation-only 边界。

prereq_checklist:
  - title: 读系统地图
    kind: doc
    path: labs/l21_sglang_serving_core/system_map.md
    href: "#lesson"
  - title: 读主讲义
    kind: doc
    path: labs/l21_sglang_serving_core/lecture.md
    href: "#lesson"
  - title: 读源码带读
    kind: doc
    path: labs/l21_sglang_serving_core/source_walkthrough.md
    href: "#lesson"
  - title: 最后读 patch/task.md
    kind: task
    path: labs/l21_sglang_serving_core/patch/task.md
    href: "#patch"
  - title: 对照真实 SGLang RadixCache
    kind: source
    path: github_repo/sglang/python/sglang/srt/mem_cache/radix_cache.py

questions:
  - id: q1_prefix_hit_key
    prompt: RadixCache 判断 prefix hit 时，最直接比较的对象是什么？
    options:
      - id: a
        text: token id 序列加可选 namespace / extra_key
        correct: true
      - id: b
        text: prompt 字符串的语义相似度
      - id: c
        text: HTTP header
      - id: d
        text: 输出 token 的文本
    explanation: |
      Prefix cache 复用的是已经计算过的 KV。KV 对应 tokenized prompt，因此命中必须按 token id 前缀判断。`extra_key` 可以把不同 adapter、cache version 或 retrieval context 隔离开。

  - id: q2_radix_vs_paged
    prompt: RadixCache 和 PagedAttention 的分工是什么？
    options:
      - id: a
        text: RadixCache 按 token 前缀索引可复用 KV，PagedAttention 管 KV page 的显存分配和访问
        correct: true
      - id: b
        text: 二者完全等价，只是 SGLang 和 vLLM 的命名不同
      - id: c
        text: RadixCache 只负责 HTTP 路由，PagedAttention 只负责 tokenizer
      - id: d
        text: PagedAttention 会自动解决所有 prefix cache miss
    explanation: |
      RadixCache 回答“哪些 token 前缀已经算过 KV”；PagedAttention/KV manager 回答“这些 KV page 在显存里怎么分配、引用和释放”。生产系统通常把两层结合起来。

  - id: q3_lru_leaf
    prompt: 教学版 `evict(num_tokens)` 为什么要从 LRU 叶子节点开始删？
    options:
      - id: a
        text: 叶子没有子路径，删除它不会破坏仍被其它序列共享的前缀
        correct: true
      - id: b
        text: 叶子一定占用最多显存
      - id: c
        text: 删除 root 可以一次释放全部 cache
      - id: d
        text: LRU 只适用于 tokenizer，不适用于 cache
    explanation: |
      `[1,2,3]` 和 `[1,2,4]` 共享 `[1,2]`。如果直接删除共享前缀，两个请求的缓存路径都会坏掉。教学版每次删最冷叶子，再重新收集叶子。

  - id: q4_match_prefix_updates_access
    prompt: "`match_prefix` 为什么也要更新 `last_access`？"
    options:
      - id: a
        text: 命中表示这段前缀刚被使用，LRU 应把它视为热数据
        correct: true
      - id: b
        text: 否则 token id 会自动改变
      - id: c
        text: 因为 `last_access` 决定 HTTP 状态码
      - id: d
        text: 只有 insert 更新访问时间才符合 LRU
    explanation: |
      LRU 需要反映最近使用情况。一个前缀频繁被命中，即使很久没有新插入，也不应被当成冷数据优先驱逐。

  - id: q5_validation_only
    prompt: "repeated-prefix benchmark 写出 `status: validation_only` 时，报告能支持什么结论？"
    options:
      - id: a
        text: 命令、配置和 artifact 路径可用，但不能证明真实 TTFT 或 cache hit 改善
        correct: true
      - id: b
        text: 真实 SGLang server 已经完成性能 benchmark
      - id: c
        text: RadixCache patch 必定失败
      - id: d
        text: cache hit rate 一定高于 90%
    explanation: |
      `validation_only` 通常表示没有连上真实 serving 进程。它是配置和报告路径的证据，不是性能证据。真实 TTFT/cache 结论需要 server 可用、workload 固定和指标完整。
