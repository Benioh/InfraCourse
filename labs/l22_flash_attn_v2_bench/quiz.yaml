mission: l22_flash_attn_v2_bench
title: L23 Quiz · PyTorch SDPA and FlashAttention Benchmark
pass_threshold: 1.0
description: |
  检查学习者是否理解 eager attention 的中间矩阵成本、SDPA backend 边界、causal mask 和 benchmark 证据。

prereq_checklist:
  - title: 读系统地图：确认 L23 在 Serving 性能路径中的位置
    kind: doc
    path: labs/l22_flash_attn_v2_bench/system_map.md
    href: "#lesson"
    estimate_min: 8
  - title: 读主讲义：从 eager baseline 到 SDPA benchmark
    kind: doc
    path: labs/l22_flash_attn_v2_bench/lecture.md
    href: "#lesson"
    estimate_min: 35
  - title: 跟源码带读：按主路径读 patch、MiniInfra 和真实 wrapper
    kind: doc
    path: labs/l22_flash_attn_v2_bench/source_walkthrough.md
    href: "#lesson"
    estimate_min: 30
  - title: 最后读 patch/task.md
    kind: task
    path: labs/l22_flash_attn_v2_bench/patch/task.md
    href: "#patch"
    estimate_min: 5
  - title: 对照 MiniInfra online softmax
    kind: source
    path: mini_infra/gpu/triton_softmax.py
    estimate_min: 10
  - title: 对照真实 SDPA wrapper
    kind: source
    path: github_repo/torchtitan/torchtitan/models/common/attention.py
    estimate_min: 10

questions:
  - id: q1_eager_memory
    prompt: eager attention 在长序列下最直接的中间内存压力来自哪里？
    options:
      - id: a
        text: 显式生成 `[B, H, T, T]` 的 scores 和 weights
        correct: true
      - id: b
        text: tokenizer vocab 变大
      - id: c
        text: optimizer state 增加
      - id: d
        text: HTTP header 变长
    explanation: "eager baseline 会保存 score matrix 和 softmax 后的 weights，二者都随 T^2 增长。"
  - id: q2_flash_mechanism
    prompt: FlashAttention 类 kernel 的主要收益来自什么？
    options:
      - id: a
        text: 分块计算并维护在线 softmax 状态，减少完整 attention matrix 写入 HBM
        correct: true
      - id: b
        text: 把注意力公式改成线性复杂度
      - id: c
        text: 删除 value 张量
      - id: d
        text: 只保留一个 attention head
    explanation: "FlashAttention 保留 QK softmax V 的语义，收益主要来自 tile 内融合和中间矩阵不落到 HBM。"
  - id: q3_sdpa_backend
    prompt: 看到 `F.scaled_dot_product_attention()` 调用后，最合理的判断是什么？
    options:
      - id: a
        text: 这是统一 SDPA API，实际 backend 还要看 device、dtype、head_dim、mask 和可用性
        correct: true
      - id: b
        text: 它必然走 flash backend
      - id: c
        text: 它必然只在 CPU 上运行
      - id: d
        text: 它不支持 causal attention
    explanation: "SDPA 是入口，不是 backend 证明。CPU、fp32、mask 或 head_dim 条件都可能改变实际执行路径。"
  - id: q4_benchmark
    prompt: 为什么 L23 的 reference 把正确性路径和性能路径分开？
    options:
      - id: a
        text: fp32 小 shape 适合严格对齐数值，目标 dtype 大 shape 适合观察 kernel 成本
        correct: true
      - id: b
        text: 正确性和性能完全无关，不能在同一脚本里出现
      - id: c
        text: CPU 不支持任何 attention
      - id: d
        text: CUDA 不需要同步
    explanation: "小 shape fp32 能降低数值和内存干扰；性能判断要使用真实 dtype、device 和 seq_len。"
  - id: q5_causal
    prompt: patch 测试如何验证 causal mask 没有泄漏未来 token？
    options:
      - id: a
        text: 用 one-hot value 检查第 0 行输出只能来自位置 0
        correct: true
      - id: b
        text: 只检查输出 dtype
      - id: c
        text: 只比较文件名
      - id: d
        text: 只看 speedup
    explanation: "第 0 个 token 在 causal attention 中只能看自己；若未来 value 泄漏，one-hot 检查会失败。"
