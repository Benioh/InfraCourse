mission: l23_quant_serving
title: L24 Quiz · AWQ-lite Quant Serving
pass_threshold: 1.0
description: |
  检查学习者是否理解 W8A16、AWQ scale、per-channel quantization、FP8 和 KV cache scale 的边界。

prereq_checklist:
  - title: 读系统地图：确认 L24 在 Serving 性能路径中的位置
    kind: doc
    path: labs/l23_quant_serving/system_map.md
    href: "#lesson"
    estimate_min: 8
  - title: 读主讲义：从 scale 选择到真实加载器边界
    kind: doc
    path: labs/l23_quant_serving/lecture.md
    href: "#lesson"
    estimate_min: 35
  - title: 跟源码带读：按 patch、MiniInfra 和 vLLM 主路径阅读
    kind: doc
    path: labs/l23_quant_serving/source_walkthrough.md
    href: "#lesson"
    estimate_min: 30
  - title: 最后读 patch/task.md
    kind: task
    path: labs/l23_quant_serving/patch/task.md
    href: "#patch"
    estimate_min: 5
  - title: 对照 MiniInfra calibrator
    kind: source
    path: mini_infra/vllm/quant/calibrator.py
    estimate_min: 10
  - title: 对照 vLLM AWQ loader
    kind: source
    path: github_repo/vllm/vllm/model_executor/layers/quantization/awq.py
    estimate_min: 15

questions:
  - id: q1_w8a16
    prompt: W8A16 表示什么？
    options:
      - id: a
        text: weight 用 8 bit 表示，activation 仍用 16 bit 参与计算
        correct: true
      - id: b
        text: weight 有 8 个 channel，activation 有 16 个 channel
      - id: c
        text: 只量化 KV cache，不量化 weight
      - id: d
        text: 所有张量都变成 8 bit
    explanation: "W8A16 是 weight-only 或 weight-dominant 的低精度表示，activation 通常仍用 fp16/bf16。"
  - id: q2_awq_scale_shape
    prompt: L24 的 `compute_awq_scale()` 应返回什么 shape？
    options:
      - id: a
        text: "`(in_features,)`，因为 activation 按输入通道进入 linear"
        correct: true
      - id: b
        text: "`(out_features,)`，因为输出通道更多"
      - id: c
        text: "`()`，整个 tensor 一个 scale"
      - id: d
        text: "`(batch, seq_len)`"
    explanation: "AWQ scale 保护的是 activation outlier 对应的输入通道，测试也明确要求 shape 为 `(in_features,)`。"
  - id: q3_dequant
    prompt: "`dequantize_w8_per_channel()` 传入 `awq_scale` 时为什么要除回去？"
    options:
      - id: a
        text: int8 先还原到 `weight * awq_scale` 空间，除回后才接近原始 weight
        correct: true
      - id: b
        text: 除回是为了改变输出 shape
      - id: c
        text: 除回会把 int8 变成 uint8
      - id: d
        text: 不除回也一定等价
    explanation: "quantize 前把 weight 列按 AWQ scale 放大；dequant 后如果要恢复原始 weight，必须按输入通道除回。"
  - id: q4_real_awq
    prompt: 真实 vLLM AWQ 加载器最需要检查哪些边界？
    options:
      - id: a
        text: weight_bits、group_size、zero_point、qweight/qzeros/scales、pack_factor 对齐
        correct: true
      - id: b
        text: 只检查 README 是否存在
      - id: c
        text: 只检查 tokenizer vocab
      - id: d
        text: 只检查 HTTP 端口
    explanation: "真实 AWQ 加载器消费已量化 checkpoint，主要风险在配置字段、packed 参数和 shape 对齐。"
  - id: q5_report
    prompt: 为什么量化 serving 报告不能只写 tokens/s？
    options:
      - id: a
        text: 还必须记录显存、延迟分位数、accuracy drift、校准/评估数据和硬件边界
        correct: true
      - id: b
        text: tokens/s 不能用于任何系统
      - id: c
        text: 量化只影响 tokenizer
      - id: d
        text: 只要 tokens/s 高，准确率漂移可以忽略
    explanation: "量化可能换来吞吐或显存收益，也可能引入 accuracy drift；缺少质量和条件字段时结论无法复查。"
