mission: l24_spec_decode
title: L25 Quiz · Speculative Decoding Greedy Verify
pass_threshold: 1.0
description: |
  检查学习者是否理解 greedy verify、bonus token、accepted draft count、acceptance/speedup 和 KV 提交边界。

prereq_checklist:
  - title: 读系统地图：确认 L25 在 Serving decode 加速路径中的位置
    kind: doc
    path: labs/l24_spec_decode/system_map.md
    href: "#lesson"
    estimate_min: 8
  - title: 读主讲义：从 greedy verify 合同到生产排查
    kind: doc
    path: labs/l24_spec_decode/lecture.md
    href: "#lesson"
    estimate_min: 35
  - title: 跟源码带读：按 patch、MiniInfra、vLLM 和 SGLang 主路径阅读
    kind: doc
    path: labs/l24_spec_decode/source_walkthrough.md
    href: "#lesson"
    estimate_min: 30
  - title: 最后读 patch/task.md
    kind: task
    path: labs/l24_spec_decode/patch/task.md
    href: "#patch"
    estimate_min: 5
  - title: 对照 MiniInfra draft runner
    kind: source
    path: mini_infra/vllm/spec_decode/draft_runner.py
    estimate_min: 10
  - title: 对照 vLLM spec decode metrics
    kind: source
    path: github_repo/vllm/vllm/v1/spec_decode/metrics.py
    estimate_min: 15

questions:
  - id: q1_bonus_token
    prompt: "`draft_tokens` 长度为 4 且四个 draft 都被 target greedy argmax 接受时，`greedy_verify` 应返回什么？"
    options:
      - id: a
        text: 5 个 token，前 4 个是 draft，第 5 个是 target 在位置 4 的 bonus
        correct: true
      - id: b
        text: 4 个 token，只返回 draft 前缀
      - id: c
        text: 0 个 token，因为还要等下一轮 target decode
      - id: d
        text: 只返回 target 在位置 0 的 argmax
    explanation: "全接受时 target verify forward 已经算出第 k 行 logits，因此可以追加一个 bonus token；accepted draft 数仍然是 k。"
  - id: q2_mismatch
    prompt: "`draft=[3,7,11,23]`，`target_argmax=[3,7,99,0,0]` 时返回值应是什么？"
    options:
      - id: a
        text: "`accepted_tokens=[3,7,99]`，`num_accepted_drafts=2`"
        correct: true
      - id: b
        text: "`accepted_tokens=[3,7,11,23]`，`num_accepted_drafts=4`"
      - id: c
        text: "`accepted_tokens=[99]`，`num_accepted_drafts=0`"
      - id: d
        text: "`accepted_tokens=[3,7]`，`num_accepted_drafts=3`"
    explanation: "位置 2 是第一处 mismatch，前两个 draft 被接受，位置 2 由 target argmax 99 接管，后面的 draft 不再使用。"
  - id: q3_count_boundary
    prompt: "`num_accepted_drafts` 和 `len(accepted_tokens)` 的关系是什么？"
    options:
      - id: a
        text: "`num_accepted_drafts` 不含 bonus，通常等于 `len(accepted_tokens) - 1`"
        correct: true
      - id: b
        text: 二者永远相等
      - id: c
        text: "`num_accepted_drafts` 包含 target bonus，`accepted_tokens` 不包含"
      - id: d
        text: 二者都只用于日志，不影响 KV"
    explanation: "返回列表包含一个 target bonus；accepted draft count 只统计被 target 接受的 draft token。"
  - id: q4_speedup
    prompt: "判断 spec decode 是否值得打开时，哪些字段必须一起看？"
    options:
      - id: a
        text: acceptance rate、draft latency、K、ITL p50/p99、draft memory、baseline 和质量指标
        correct: true
      - id: b
        text: 只看 acceptance rate
      - id: c
        text: 只看 draft 模型参数量
      - id: d
        text: 只看是否生成了 metrics 文件
    explanation: "高 acceptance 也可能被 draft 成本、显存或长尾延迟抵消；速度结论要有 baseline、硬件、workload 和质量边界。"
  - id: q5_kv_boundary
    prompt: "SGLang 中 `accept_lens` 包含 bonus token 时，accepted draft 数应该如何计算？"
    options:
      - id: a
        text: "每个请求用 `accept_lens[i] - 1`，因为 bonus 不属于 draft acceptance"
        correct: true
      - id: b
        text: 直接等于 `accept_lens[i]`
      - id: c
        text: 永远等于 K
      - id: d
        text: 只看 prompt length"
    explanation: "bonus 会推进输出和 KV committed length，但 accepted draft tokens 的计数要排除 bonus。"
