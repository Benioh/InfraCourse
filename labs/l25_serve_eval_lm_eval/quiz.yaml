mission: l25_serve_eval_lm_eval
title: L26 Quiz · Serving Eval Harness
pass_threshold: 1.0
description: |
  检查学习者是否理解 evaluation harness 的 few-shot 切分、双指标、stop sequence、completion endpoint 和 artifact 边界。

prereq_checklist:
  - title: 读系统地图：确认 L26 在 Serving 质量闭环中的位置
    kind: doc
    path: labs/l25_serve_eval_lm_eval/system_map.md
    href: "#lesson"
    estimate_min: 8
  - title: 读主讲义：从评测链路到 artifact 复盘
    kind: doc
    path: labs/l25_serve_eval_lm_eval/lecture.md
    href: "#lesson"
    estimate_min: 35
  - title: 跟源码带读：按 patch、run_eval、SGLang eval 和 endpoint 主路径阅读
    kind: doc
    path: labs/l25_serve_eval_lm_eval/source_walkthrough.md
    href: "#lesson"
    estimate_min: 30
  - title: 最后读 patch/task.md
    kind: task
    path: labs/l25_serve_eval_lm_eval/patch/task.md
    href: "#patch"
    estimate_min: 5
  - title: 对照本讲 run_eval 脚本
    kind: source
    path: labs/l25_serve_eval_lm_eval/scripts/run_eval.py
    estimate_min: 10
  - title: 对照 SGLang GSM8K eval
    kind: source
    path: github_repo/sglang/python/sglang/test/simple_eval_gsm8k.py
    estimate_min: 15

questions:
  - id: q1_n_total
    prompt: "`run_evaluation(items, client, n_shots=2)` 中 `items` 有 6 条时，`n_total` 应该是多少？"
    options:
      - id: a
        text: "4，因为前 2 条是 few-shot examples，不进入评测样本数"
        correct: true
      - id: b
        text: "6，因为所有 items 都参与打分"
      - id: c
        text: "2，因为只统计 few-shot examples"
      - id: d
        text: "0，因为 stub client 不算真实评测"
    explanation: "few-shot examples 用来构造 prompt，评测样本从 `items[n_shots:]` 开始。"
  - id: q2_exact_vs_numeric
    prompt: "如果 exact_match 低、first_number_match 高，最可能说明什么？"
    options:
      - id: a
        text: "数值大多正确，但输出格式、附加文本或大小写不满足 strict match"
        correct: true
      - id: b
        text: "模型完全没有能力"
      - id: c
        text: "所有请求都 timeout"
      - id: d
        text: "few-shot examples 被计入了 n_total"
    explanation: "numeric metric 能隔离格式噪声；exact 低时要抽查 prediction 和 reference。"
  - id: q3_stop_sequence
    prompt: "completion eval 中为什么常传 `stop=[\"Question:\"]`？"
    options:
      - id: a
        text: "防止模型继续生成下一道题，污染当前答案"
        correct: true
      - id: b
        text: "提高 GPU 显存容量"
      - id: c
        text: "把 temperature 自动设为 1"
      - id: d
        text: "让 prompt 不需要 few-shot examples"
    explanation: "缺少 stop 时，模型可能续写新题和答案，导致 parser 抽到错误数字或 exact match 失败。"
  - id: q4_artifact
    prompt: "一份可复查的 serving eval 报告至少应包含什么？"
    options:
      - id: a
        text: "配置、命令、样本级 prediction/reference、聚合指标、完成率和运行摘要"
        correct: true
      - id: b
        text: "只包含最终分数"
      - id: c
        text: "只包含 tokens/s"
      - id: d
        text: "只包含模型名称"
    explanation: "质量结论要能追溯到输入、输出、打分函数和运行条件。"
  - id: q5_endpoint
    prompt: "本讲 OpenAIClient 默认调用哪个 endpoint 形状？"
    options:
      - id: a
        text: "`/v1/completions`，读取 `choices[0].text`"
        correct: true
      - id: b
        text: "`/v1/embeddings`，读取 embedding vector"
      - id: c
        text: "`/metrics`，读取 Prometheus counter"
      - id: d
        text: "`/v1/audio/transcriptions`，读取 text"
    explanation: "本讲 prompt 是 raw completion 形状；chat endpoint 需要不同 client 或 prompt wrapper。"
