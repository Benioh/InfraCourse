mission: l26_sglang_pd_observability
title: L27 Quiz · SGLang PD Observability
pass_threshold: 1.0
description: |
  检查学习者是否理解 Prometheus 文本、gauge/counter/hit-rate、label 稳定性、PD 阶段化指标和 SGLang metrics 源码路径。

prereq_checklist:
  - title: 读系统地图：确认 L27 在 Serving 观测链路中的位置
    kind: doc
    path: labs/l26_sglang_pd_observability/system_map.md
    href: "#lesson"
    estimate_min: 8
  - title: 读主讲义：从 p99 排障到 PD 指标链路
    kind: doc
    path: labs/l26_sglang_pd_observability/lecture.md
    href: "#lesson"
    estimate_min: 30
  - title: 跟源码带读：按 patch、PD lab、SGLang metrics 主路径阅读
    kind: doc
    path: labs/l26_sglang_pd_observability/source_walkthrough.md
    href: "#lesson"
    estimate_min: 30
  - title: 最后读 patch/task.md
    kind: task
    path: labs/l26_sglang_pd_observability/patch/task.md
    href: "#patch"
    estimate_min: 5
  - title: 对照 SGLang loads endpoint
    kind: source
    path: github_repo/sglang/python/sglang/srt/entrypoints/v1_loads.py
    estimate_min: 10
  - title: 对照 SGLang metrics collector
    kind: source
    path: github_repo/sglang/python/sglang/srt/observability/metrics_collector.py
    estimate_min: 15
  - title: 对照 SGLang scheduler metrics mixin
    kind: source
    path: github_repo/sglang/python/sglang/srt/observability/scheduler_metrics_mixin.py
    estimate_min: 15

questions:
  - id: q1_metric_type
    prompt: "`prefill_queue_depth` 和 `requests_total` 分别更适合哪类 Prometheus metric？"
    options:
      - id: a
        text: prefill_queue_depth 用 gauge，requests_total 用 counter
        correct: true
      - id: b
        text: 两者都用 counter
      - id: c
        text: 两者都用 gauge
      - id: d
        text: prefill_queue_depth 用 histogram，requests_total 用 gauge
    explanation: "queue depth 表示当前状态，会升降，适合 gauge；requests_total 表示累计事件，适合 counter。"
  - id: q2_hit_rate
    prompt: L27 patch 中 `record_event("prefix_cache", hit=False)` 只记录一次 miss 时，导出的 hit-rate 应该是多少？
    options:
      - id: a
        text: "0.0"
        correct: true
      - id: b
        text: "1.0"
      - id: c
        text: NaN
      - id: d
        text: 不导出该 metric
    explanation: "hit-rate = hits / (hits + misses)。只有一次 miss 时 hits 为 0、total 为 1，所以是 0.0，不能出现除零或 NaN。"
  - id: q3_labels
    prompt: 为什么本讲要求 labels 按字母序稳定输出？
    options:
      - id: a
        text: 相同语义的 series 应产生稳定文本，便于测试、diff 和排障
        correct: true
      - id: b
        text: Prometheus 只接受字母序 label，否则拒绝 scrape
      - id: c
        text: 字母序可以自动降低请求延迟
      - id: d
        text: 字母序可以让 counter 自动变成 gauge
    explanation: "稳定输出能让同一份状态得到可比较的文本。Prometheus 的 series 语义由 label set 决定，课堂测试还会直接比较文本顺序。"
  - id: q4_pd_debug
    prompt: PD 分离服务里 TTFT 变长时，最先应该结合哪些指标判断阶段？
    options:
      - id: a
        text: prefill queue、prompt tokens、cache hit-rate、KV available tokens、KV transfer latency
        correct: true
      - id: b
        text: 只看 HTTP 200 状态码
      - id: c
        text: 只看 README 是否存在
      - id: d
        text: 只看训练 loss
    explanation: "TTFT 包含首 token 前的等待，常见因素包括 prefill 排队、prompt 长度、prefix cache 命中、KV 容量和 PD 交接成本。"
  - id: q5_sglang_source
    prompt: SGLang 哪个源码路径负责把 scheduler stats 写入 Prometheus collector？
    options:
      - id: a
        text: "`scheduler_metrics_mixin.py` 填充 stats，并调用 `metrics_collector.log_stats`"
        correct: true
      - id: b
        text: "`README.md` 直接生成 Prometheus samples"
      - id: c
        text: "`patch/task.md` 启动真实 SGLang server"
      - id: d
        text: "`quiz.yaml` 维护生产 metrics registry"
    explanation: "scheduler metrics mixin 在 prefill/decode 统计路径中填充 SchedulerStats，再由 metrics collector 负责写入 gauge、counter 或 histogram。"
