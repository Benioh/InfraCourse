mission: l28_sft_qwen_alpaca
title: L29 Quiz · SFT Loss Mask
pass_threshold: 1.0
description: |
  检查学习者是否理解 SFT 数据合同、assistant-only loss、EOS、pad、attention mask 和 CPU smoke 边界。

prereq_checklist:
  - title: 读系统地图：确认 SFT 在 RLHF 主线中的位置
    kind: doc
    path: labs/l28_sft_qwen_alpaca/system_map.md
    href: "#lesson"
    estimate_min: 8
  - title: 读主讲义：理解 tokenization、labels 和 loss
    kind: doc
    path: labs/l28_sft_qwen_alpaca/lecture.md
    href: "#lesson"
    estimate_min: 30
  - title: 跟源码带读：按 patch、测试、smoke 和 tokenizer 阅读
    kind: doc
    path: labs/l28_sft_qwen_alpaca/source_walkthrough.md
    href: "#lesson"
    estimate_min: 25
  - title: 最后读 patch/task.md
    kind: task
    path: labs/l28_sft_qwen_alpaca/patch/task.md
    href: "#patch"
    estimate_min: 5
  - title: 对照 patch reference
    kind: source
    path: labs/l28_sft_qwen_alpaca/patch/reference/sft_pipeline.py
    estimate_min: 8
  - title: 对照 SFT smoke
    kind: source
    path: labs/l28_sft_qwen_alpaca/scripts/run_sft.py
    estimate_min: 10

questions:
  - id: q1_prompt_mask
    prompt: SFT 样本中，system/user token 的 labels 应该是什么？
    options:
      - id: a
        text: 全部写成 -100，让 prompt 只作为条件输入
        correct: true
      - id: b
        text: 写成同位置 input id
      - id: c
        text: 写成 pad token id
      - id: d
        text: 删除这些 token
    explanation: "prompt token 仍输入模型，但不作为训练目标。"

  - id: q2_assistant_labels
    prompt: assistant token 的 labels 应该怎样写？
    options:
      - id: a
        text: 等于同位置 input_ids，末尾 EOS 也保留为训练目标
        correct: true
      - id: b
        text: 全部写 -100
      - id: c
        text: 只保留第一个 token
      - id: d
        text: 全部替换成 user token
    explanation: "SFT 要学习 assistant 回答本身，EOS 训练模型停止。"

  - id: q3_attention_mask
    prompt: attention_mask 和 labels mask 的职责差异是什么？
    options:
      - id: a
        text: attention_mask 控制 pad 是否参与模型计算；labels 的 -100 控制哪些位置进入 loss
        correct: true
      - id: b
        text: 二者都只控制 optimizer lr
      - id: c
        text: attention_mask 决定答案文本，labels 决定 tokenizer
      - id: d
        text: 二者没有任何影响
    explanation: "pad 可见性和 loss 目标是两个不同合同，不能混用。"

  - id: q4_ignore_index
    prompt: "`F.cross_entropy(ignore_index=-100, reduction=\"mean\")` 对 `-100` 位置的处理是什么？"
    options:
      - id: a
        text: 不计入 loss，也不进入平均分母
        correct: true
      - id: b
        text: 当作类别 100
      - id: c
        text: 把 logits 全部置零
      - id: d
        text: 只影响 backward，不影响 forward loss
    explanation: "ignore_index 会把对应 target 位置从 CE 平均中排除。"

  - id: q5_pad_eos
    prompt: pad_token_id 和 eos_token_id 相同的时候，L29 最需要检查什么？
    options:
      - id: a
        text: pad 位置 attention_mask 为 0，labels 为 -100；assistant EOS 位置仍进入 loss
        correct: true
      - id: b
        text: 所有 EOS 都删除
      - id: c
        text: 所有 pad 都进入 loss
      - id: d
        text: max_length 必须等于 1
    explanation: "id 相同不代表语义相同，位置和 mask 决定训练含义。"

  - id: q6_smoke_boundary
    prompt: CPU tokenize-only smoke 能证明什么？
    options:
      - id: a
        text: patch 函数能生成 assistant token、metrics 和 artifacts，但不能证明真实大模型训练质量
        correct: true
      - id: b
        text: 证明任意 7B 模型已经收敛
      - id: c
        text: 证明 tokenizer 下载一定成功
      - id: d
        text: 证明后续 RL 不需要 reward
    explanation: "CPU smoke 验证数据合同和证据写出，真实训练还需要模型、数据、硬件和长训指标。"
