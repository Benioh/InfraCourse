questions:
  - id: q1_root_cause
    prompt: 相同权重下，rollout engine 和 training engine 为什么仍可能对同一 token 序列算出不同 logprob？
    options:
      - id: a
        text: decode 与 prefill 的 batch shape、kernel 选择和归约顺序不同，浮点路径会产生差异
        correct: true
      - id: b
        text: rollout engine 不运行 attention
      - id: c
        text: KV cache 会改变 Transformer 的数学定义
      - id: d
        text: 只要 dtype 相同，logprob 必然完全一致
    explanation: |
      A 对。即使权重和 dtype 一致，执行 shape、kernel 和归约顺序仍可能不同。B/C/D 都把执行差异简化成了错误的数学结论。

  - id: q2_k3_formula
    prompt: K3 KL 估计器在本讲 patch 中怎样计算？
    options:
      - id: a
        text: mean(logp_p - logp_q)
      - id: b
        text: mean(ratio - 1 - log_ratio)，其中 log_ratio = logp_p - logp_q
        correct: true
      - id: c
        text: torch.distributions.kl_divergence(logp_p, logp_q)
      - id: d
        text: mean(abs(logp_p - logp_q))
    explanation: |
      B 对。K3 使用 `ratio = exp(log_ratio)` 和 `ratio - 1 - log_ratio`，aligned 时为 0，且对正 ratio 非负。本讲只有采样 token 的 logprob，不使用 closed-form KL。

  - id: q3_tis_mis
    prompt: TIS 和 MIS 对越界 ratio 的处理差异是什么？
    options:
      - id: a
        text: TIS 把 ratio clamp 到边界，MIS 把越界 token 的贡献置零
        correct: true
      - id: b
        text: TIS 丢弃整条序列，MIS 只记录指标
      - id: c
        text: TIS 和 MIS 都只改变 learning rate
      - id: d
        text: TIS 只能用于 sequence-level，MIS 只能用于 token-level
    explanation: |
      A 对。TIS 保留 token 但压到边界，MIS 通过 mask 直接切断越界 token 的梯度贡献。二者的偏差、方差和有效样本数取舍不同。

  - id: q4_geometric
    prompt: Geometric Sequence IS 为什么要按 `seq_lens` 生成 mask？
    options:
      - id: a
        text: padding 位置可能含任意值，进入 mean(log_ratio) 会污染序列权重
        correct: true
      - id: b
        text: mask 可以让所有序列长度变成 1
      - id: c
        text: mask 会把 ratio 的方向反过来
      - id: d
        text: Geometric IS 不需要 logprob
    explanation: |
      A 对。Geometric IS 计算 `exp(mean(log_ratio))`，只应统计有效 token。pytest 故意把 padding 位置填成 99.0，用来捕获忘记 mask 的实现。

  - id: q5_debug_order
    prompt: 线上发现 K3 KL 上升、reward 下跌时，第一步最应该确认什么？
    options:
      - id: a
        text: rollout token、training token、logprob 和 loss mask 是否逐 token 对齐
        correct: true
      - id: b
        text: 直接把 TIS 上界调到更大
      - id: c
        text: 只看 batch normalize 后的均值是否等于 1
      - id: d
        text: 跳过 ratio 分布，先改 reward parser 分数
    explanation: |
      A 对。token 与 logprob 对齐是 IS 公式的前提。对齐失败时，TIS/MIS/Veto 的阈值讨论没有可靠语义。
