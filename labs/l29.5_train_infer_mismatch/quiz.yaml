mission: l29.5_train_infer_mismatch
title: L32 Quiz · Train-Infer Mismatch
pass_threshold: 1.0
description: |
  检查学习者是否理解 rollout/training logprob 差异、K3 KL、TIS/MIS、Geometric IS、Veto 和 Batch Normalize 的边界。

prereq_checklist:
  - title: 读系统地图：确认 L32 在 RLHF 主线中的位置
    kind: doc
    path: labs/l29.5_train_infer_mismatch/system_map.md
    href: "#lesson"
    estimate_min: 8
  - title: 读主讲义：从 mismatch 来源到修正算子
    kind: doc
    path: labs/l29.5_train_infer_mismatch/lecture.md
    href: "#lesson"
    estimate_min: 35
  - title: 跟源码带读：按 patch、tests 和 SLiME mis.py 阅读
    kind: doc
    path: labs/l29.5_train_infer_mismatch/source_walkthrough.md
    href: "#lesson"
    estimate_min: 30
  - title: 最后读 patch/task.md
    kind: task
    path: labs/l29.5_train_infer_mismatch/patch/task.md
    href: "#patch"
    estimate_min: 8
  - title: 对照 patch reference
    kind: source
    path: labs/l29.5_train_infer_mismatch/patch/reference/mismatch.py
    estimate_min: 10
  - title: 对照 SLiME mismatch helper
