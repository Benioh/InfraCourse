mission: l29_verl_rl_baseline
title: L31 Quiz · Adaptive KL Controller
pass_threshold: 1.0
description: |
  检查学习者是否理解 KL controller、PPO ratio clip、reference model、reward parser self-test 和 RL smoke 指标边界。

prereq_checklist:
  - title: 读系统地图：确认 L31 在 RLHF 主线中的位置
    kind: doc
    path: labs/l29_verl_rl_baseline/system_map.md
    href: "#lesson"
    estimate_min: 8
  - title: 读主讲义：从 KL penalty 到 reward smoke
    kind: doc
    path: labs/l29_verl_rl_baseline/lecture.md
    href: "#lesson"
    estimate_min: 35
  - title: 跟源码带读：按 patch、reward、SLiME 主路径阅读
    kind: doc
    path: labs/l29_verl_rl_baseline/source_walkthrough.md
    href: "#lesson"
    estimate_min: 30
  - title: 最后读 patch/task.md
    kind: task
    path: labs/l29_verl_rl_baseline/patch/task.md
    href: "#patch"
    estimate_min: 5
  - title: 对照 reward parser
    kind: source
    path: labs/l29_verl_rl_baseline/scripts/reward_math.py
    estimate_min: 10
  - title: 对照 SLiME PPO utils
    kind: source
    path: github_repo/slime/slime/utils/ppo_utils.py
    estimate_min: 15

questions:
  - id: q1_kl_direction
    prompt: Adaptive KL Controller 中 current_kl 高于 target_kl 时应怎么调？
    options:
      - id: a
        text: 增大 KL penalty 系数
        correct: true
      - id: b
        text: 把系数重置为 0
      - id: c
        text: 减小 target_kl
      - id: d
        text: 跳过 reward parser
    explanation: "KL 过高说明 policy 偏离 reference 太远，controller 应增大惩罚系数。"
  - id: q2_clip
    prompt: L31 patch 中 clip 限制的是什么？
    options:
      - id: a
        text: proportional_error
        correct: true
      - id: b
        text: kl_coef 的绝对值
      - id: c
        text: reward_mean
      - id: d
        text: response_len
    explanation: "公式先计算 `current_kl / target_kl - 1`，再把这个误差 clip 到 [-0.2, 0.2]。"
  - id: q3_ratio_clip
    prompt: PPO ratio clipping 和 KL penalty 的关系是什么？
    options:
      - id: a
        text: ratio clip 限制单次 update，KL penalty 约束相对 reference 的漂移
        correct: true
      - id: b
        text: 二者完全等价
      - id: c
        text: KL penalty 只用于 critic
      - id: d
        text: ratio clip 会自动修复 reward parser
    explanation: "ratio clip 是 PPO update 的局部安全网，KL penalty 是相对 reference 的长期锚点。"
  - id: q4_reward_smoke
    prompt: 为什么 L31 要先跑 reward parser self-test？
    options:
      - id: a
        text: 避免把答案解析错误误判成 PPO 或 KL 问题
        correct: true
      - id: b
        text: self-test 会训练 reference model
      - id: c
        text: self-test 会启动 GPU rollout
      - id: d
        text: self-test 会改变 tokenizer
    explanation: "reward parser 是 RL 证据链入口。解析错时，reward_mean 和后续判断都会失真。"
  - id: q5_slime
    prompt: SLiME `compute_approx_kl` 和 L31 controller 的关系是什么？
    options:
      - id: a
        text: KL estimator 产生 current_kl，controller 用 current_kl 调整系数
        correct: true
      - id: b
        text: controller 先生成 token，再交给 estimator
      - id: c
        text: 二者都只处理 README
      - id: d
        text: estimator 会替代 reward parser
    explanation: "KL estimator 在控制器前面提供观测值；controller 根据观测值调 `kl_coef`。"
