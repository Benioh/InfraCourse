questions:
  - id: q1_static_address
    prompt: CUDA Graph replay 为什么不能随意换一块新分配的同 shape input tensor？
    options:
      - id: a
        text: capture 会记录 kernel 参数和 buffer 地址，新 tensor 可能有不同地址
        correct: true
      - id: b
        text: 因为新 tensor 一定比旧 tensor 慢
      - id: c
        text: 因为 CUDA Graph 只能处理 scalar
      - id: d
        text: 因为 PyTorch 不支持 tensor clone
    explanation: |
      A 对。真实 CUDA Graph replay 读写 capture 时记录的地址，所以动态输入通常要 copy 到 static buffer。

  - id: q2_patch_scope
    prompt: 本讲 CPU patch 能证明什么？
    options:
      - id: a
        text: cache key、capture/replay 计数、handle 状态和 paused bytes 合同正确
        correct: true
      - id: b
        text: CUDA Graph replay 一定比 eager 快
      - id: c
        text: GPU static buffer 地址已经稳定
      - id: d
        text: VMM allocator 已经释放真实物理显存
    explanation: |
      A 对。CPU patch 是结构语义验收，不包含真实 GPU timing、data_ptr 或 VMM physical page 证据。

  - id: q3_memory_savor
    prompt: 真实 Memory Savor 与普通 `cudaFree` 的关键差异是什么？
    options:
      - id: a
        text: Memory Savor 目标是释放物理页并保留恢复所需的虚拟地址语义
        correct: true
      - id: b
        text: Memory Savor 会自动提高矩阵乘吞吐
      - id: c
        text: cudaFree 只能释放 CPU 内存
      - id: d
        text: 二者对 graph replay 完全等价
    explanation: |
      A 对。co-locate 需要让出显存，同时不能让 graph 内部持有的地址语义失效。

  - id: q4_colocate_order
    prompt: co-locate 阶段切换中最稳的顺序是哪一个？
    options:
      - id: a
        text: rollout 完成 -> pause rollout 显存 -> train -> offload training -> resume rollout
        correct: true
      - id: b
        text: rollout 完成 -> 直接恢复 training 和 rollout 两套权重
      - id: c
        text: 先 resume rollout，再 offload training
      - id: d
        text: 销毁 rollout 进程即可替代 pause/resume
    explanation: |
      A 对。这个顺序避免两套大对象在同一阶段同时占满 GPU，也保留下一轮 rollout 恢复路径。
