mission: l30.5_cuda_graph_savor
title: L34 Quiz · CUDA Graph Cache + Memory Savor
pass_threshold: 1.0
description: |
  检查学习者是否理解 graph replay 的地址约束、shape cache、Memory Savor 和 co-locate 切换顺序。

prereq_checklist:
  - title: 读系统地图：确认 L34 在 RL co-locate 主线中的位置
    kind: doc
    path: labs/l30.5_cuda_graph_savor/system_map.md
    href: "#lesson"
    estimate_min: 8
  - title: 读主讲义：从 CUDA Graph 到 Memory Savor
    kind: doc
    path: labs/l30.5_cuda_graph_savor/lecture.md
    href: "#lesson"
    estimate_min: 35
  - title: 跟源码带读：按 patch、tests 和 Megatron 对照阅读
    kind: doc
    path: labs/l30.5_cuda_graph_savor/source_walkthrough.md
    href: "#lesson"
    estimate_min: 25
  - title: 最后读 patch/task.md
    kind: task
    path: labs/l30.5_cuda_graph_savor/patch/task.md
    href: "#patch"
    estimate_min: 8
  - title: 对照 patch reference
    kind: source
    path: labs/l30.5_cuda_graph_savor/patch/reference/cuda_graph_cache.py
    estimate_min: 10
