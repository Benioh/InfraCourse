mission: l31_rollout_only_smoke
title: L35 Quiz · Async Rollout Pool
pass_threshold: 1.0
description: |
  检查学习者是否理解 rollout-only 数据流、async 限流、保序返回、服务端 dynamic batching 和 SLiME 对照边界。

prereq_checklist:
  - title: 读系统地图：确认 L35 在 RL rollout 主线中的位置
    kind: doc
    path: labs/l31_rollout_only_smoke/system_map.md
    href: "#lesson"
    estimate_min: 8
  - title: 读主讲义：从 rollout 数据流到 SLiME 对照
    kind: doc
    path: labs/l31_rollout_only_smoke/lecture.md
    href: "#lesson"
    estimate_min: 35
  - title: 跟源码带读：按本地 smoke、patch、vLLM/SGLang、SLiME 阅读
    kind: doc
    path: labs/l31_rollout_only_smoke/source_walkthrough.md
    href: "#lesson"
    estimate_min: 30
  - title: 最后读 patch/task.md
    kind: task
    path: labs/l31_rollout_only_smoke/patch/task.md
    href: "#patch"
    estimate_min: 5
  - title: 对照 patch reference
    kind: source
    path: labs/l31_rollout_only_smoke/patch/reference/rollout_pool.py
    estimate_min: 8
  - title: 对照 SLiME rollout
    kind: source
    path: github_repo/slime/slime/rollout/sglang_rollout.py
    estimate_min: 15

questions:
  - id: q1_concurrency
    prompt: L35 的 `max_concurrency` 限制的是什么？
    options:
      - id: a
        text: 客户端同时运行的 `generate_fn` 协程数
        correct: true
      - id: b
        text: 服务端每次 GPU forward 的真实 batch size
      - id: c
        text: reward model 的参数量
      - id: d
        text: actor update 的 micro batch
    explanation: "`max_concurrency` 是客户端在途请求上限。vLLM/SGLang 的实际 batch 由服务端 scheduler 决定。"
  - id: q2_order
    prompt: 为什么 L35 patch 用 `asyncio.gather` 收集结果？
    options:
      - id: a
        text: 它按传入任务顺序返回结果，能保持 prompt/response 对齐
        correct: true
      - id: b
        text: 它会自动计算 reward
      - id: c
        text: 它会把请求发送到 GPU kernel
      - id: d
        text: 它会自动重试失败请求
    explanation: "rollout 样本必须和输入 prompt 对齐。`gather` 的返回顺序合同正好满足这个要求。"
  - id: q3_async_vs_manual_batch
    prompt: RL rollout 客户端为什么通常并发提交 prompt，而不手动固定 batch？
    options:
      - id: a
        text: vLLM/SGLang 服务端已有动态调度，客户端负责提交和限流
        correct: true
      - id: b
        text: 手动 batch 会自动修复 reward parser
      - id: c
        text: async 会跳过 KV cache
      - id: d
        text: batch size 与输出顺序无关
    explanation: "服务端知道当前 queue、KV cache、decode slot 和 finished 状态，更适合组织真实 batch。"
  - id: q4_error
    prompt: "`generate_fn` 抛异常时，L35 patch 应该怎么做？"
    options:
      - id: a
        text: 让异常传给调用者
        correct: true
      - id: b
        text: 返回空字符串
      - id: c
        text: 把异常写成 reward=0 后继续
      - id: d
        text: 随机换一个 prompt
    explanation: "吞掉异常会污染 rollout buffer。上层 driver 应决定重试、降并发或中止。"
  - id: q5_slime
    prompt: SLiME rollout 与 L35 patch 的对应关系是什么？
    options:
      - id: a
        text: SLiME 也使用 semaphore、task/gather 和样本排序，只是多了 reward、Ray、HTTP 和 weight sync
        correct: true
      - id: b
        text: SLiME 完全不需要并发控制
      - id: c
        text: L35 patch 会直接启动 SLiME actor
      - id: d
        text: SLiME 的 weight sync 发生在每个 token 后
    explanation: "L35 是单机最小合同；SLiME 把同样的限流和保序思想放进生产级 rollout manager。"
