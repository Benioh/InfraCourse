mission: l32_slime_rl_core
title: L36 Quiz · SLiME Weight Sync Coordinator
pass_threshold: 1.0
description: |
  检查学习者是否理解 weight sync 合同、shape/dtype mismatch、SLiME 更新链路、版本证据和本地 smoke 边界。

prereq_checklist:
  - title: 读系统地图：确认 L36 在 RL rollout 主线中的位置
    kind: doc
    path: labs/l32_slime_rl_core/system_map.md
    href: "#lesson"
    estimate_min: 8
  - title: 读主讲义：从本地合同到 SLiME 生产链路
    kind: doc
    path: labs/l32_slime_rl_core/lecture.md
    href: "#lesson"
    estimate_min: 35
  - title: 跟源码带读：按 patch、MiniInfra、SLiME updater 阅读
    kind: doc
    path: labs/l32_slime_rl_core/source_walkthrough.md
    href: "#lesson"
    estimate_min: 30
  - title: 最后读 patch/task.md
    kind: task
    path: labs/l32_slime_rl_core/patch/task.md
    href: "#patch"
    estimate_min: 5
  - title: 对照 patch reference
    kind: source
    path: labs/l32_slime_rl_core/patch/reference/weight_sync.py
    estimate_min: 8
  - title: 对照 SLiME Megatron updater
    kind: source
    path: github_repo/slime/slime/backends/megatron_utils/actor.py
    estimate_min: 15

questions:
  - id: q1_contract
    prompt: L36 patch 中，哪些 tensor 可以被写入 inference state？
    options:
      - id: a
        text: key 存在、shape 一致、dtype 一致的 tensor
        correct: true
      - id: b
        text: train state 里所有 tensor
      - id: c
        text: key 名相同即可，不看 dtype
      - id: d
        text: inference state 里不存在的 key
    explanation: "本地合同要求 key、shape、dtype 三项都匹配，才 clone 后写入 inference。"
  - id: q2_dtype
    prompt: train 是 fp32 master weight，inference 是 fp16 时，本讲 patch 应如何处理？
    options:
      - id: a
        text: 记入 mismatch，不在 coordinator 内自动 cast
        correct: true
      - id: b
        text: 自动调用 half()
      - id: c
        text: 直接覆盖 inference
      - id: d
        text: 删除 inference 的旧 tensor
    explanation: "dtype 策略应在发送方显式决定。同步函数静默转换会掩盖带宽和数值策略。"
  - id: q3_stats
    prompt: "`bytes_synced` 应该统计什么？"
    options:
      - id: a
        text: 只统计真正同步的 accepted tensors
        correct: true
      - id: b
        text: train state 中所有 tensor
      - id: c
        text: mismatched tensors
      - id: d
        text: rollout response 字节数
    explanation: "`bytes_synced` 是同步传输量证据，不能把跳过的 mismatch 算进去。"
  - id: q4_slime_path
    prompt: 真实 SLiME 中 weight sync 的主要链路是什么？
    options:
      - id: a
        text: train loop 触发 actor update_weights，Megatron updater 整理权重，SGLang engine 在线接收
        correct: true
      - id: b
        text: reward parser 直接写 SGLang 权重
      - id: c
        text: rollout pool 自动改 actor 参数
      - id: d
        text: 只要写 checkpoint 文件即可
    explanation: "SLiME 通过 Ray 协调 train actors，再由 updater 把权重交给 rollout engines。"
  - id: q5_smoke
    prompt: L36 本地 smoke 能证明什么？
    options:
      - id: a
        text: 配置、toy 数据、validation artifact 和 sync 指标格式闭合
        correct: true
      - id: b
        text: H200 上 NCCL 带宽达标
      - id: c
        text: SGLang 在线权重已经真实更新
      - id: d
        text: PPO 长训已经稳定
    explanation: "本地 smoke 是证据格式检查，不替代真实 SLiME/NCCL/GPU 训练验证。"
