mission: l33_rl_rollout_freshness
title: L11.5 Quiz · Versioned RolloutManager
pass_threshold: 1.0
description: |
  检查学习者是否理解 SLiME/verl 训练和 rollout engine 解耦后的权重版本问题。

prereq_checklist:
  - title: 读 patch/task.md
    kind: read
    path: labs/l33_rl_rollout_freshness/patch/task.md
  - title: 读 SLiME train_actor
    kind: source
    path: github_repo/slime/slime/ray/train_actor.py
  - title: 读 SLiME rollout
    kind: source
    path: github_repo/slime/slime/ray/rollout.py

questions:
  - id: q1_freshness
    prompt: rollout freshness 指什么？
    options:
      - id: a
        text: rollout engine 使用的权重落后 actor 当前权重多少 step
        correct: true
      - id: b
        text: prompt 是否新鲜
      - id: c
        text: GPU 风扇转速
      - id: d
        text: markdown 更新时间
    explanation: "训练和推理解耦后，权重同步延迟会造成 stale rollout。"
  - id: q2_block
    prompt: 所有 rollout engine 都 stale 时继续生成的风险是什么？
    options:
      - id: a
        text: 用过旧策略采样，advantage/KL 语义偏离当前 actor
        correct: true
      - id: b
        text: tokenizer 文件一定损坏
      - id: c
        text: HTTP 必定 404
      - id: d
        text: checkpoint 一定消失
    explanation: "stale rollout 会降低 RL 更新的有效性和稳定性。"
  - id: q3_sync
    prompt: weight sync 太频繁的主要代价是什么？
    options:
      - id: a
        text: rollout engine 等待或传输开销增加，吞吐下降
        correct: true
      - id: b
        text: reward parser 不再工作
      - id: c
        text: batch size 自动变 0
      - id: d
        text: loss 不能记录
    explanation: "freshness 和吞吐需要 trade-off。"
  - id: q4_debug
    prompt: reward 突然下降时，除了 reward parser，还应检查什么？
    options:
      - id: a
        text: rollout freshness、KL、actor/engine step gap
        correct: true
      - id: b
        text: 只看 README
      - id: c
        text: 只看端口号
      - id: d
        text: 只看 CSS
    explanation: "RL 问题常跨 reward、policy、rollout、sync 多层。"
  - id: q5_metric
    prompt: versioned rollout 至少应记录什么？
    options:
      - id: a
        text: actor_version、server weight_version、staleness、server_id
        correct: true
      - id: b
        text: 只包含 HTTP status
      - id: c
        text: 只包含文件大小
      - id: d
        text: 只包含 README 行数
    explanation: "没有 actor/server 版本信息，就无法判断 rollout 是否 stale。"
