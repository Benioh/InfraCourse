mission: l34.5_gae_chunked_parallel
title: L40 Quiz · GAE Chunked Parallel
pass_threshold: 1.0
description: |
  检查学习者是否理解 GAE 递推、last_value、chunk boundary、余数 chunk、batched shape 和真实性能结论边界。

prereq_checklist:
  - title: 读系统地图：确认 L40 在 RL 与对齐主线中的位置
    kind: doc
    path: labs/l34.5_gae_chunked_parallel/system_map.md
    href: "#lesson"
    estimate_min: 8
  - title: 读主讲义：从 GAE 递推到 chunk boundary 和 SLiME 对照
    kind: doc
    path: labs/l34.5_gae_chunked_parallel/lecture.md
    href: "#lesson"
    estimate_min: 35
  - title: 跟源码带读：按 patch、测试和 SLiME ppo_utils 阅读
    kind: doc
    path: labs/l34.5_gae_chunked_parallel/source_walkthrough.md
    href: "#lesson"
    estimate_min: 30
  - title: 最后读 patch/task.md
    kind: task
    path: labs/l34.5_gae_chunked_parallel/patch/task.md
    href: "#patch"
    estimate_min: 5
  - title: 对照 patch reference
    kind: source
    path: labs/l34.5_gae_chunked_parallel/patch/reference/gae_chunk.py
    estimate_min: 8
  - title: 对照 SLiME ppo_utils
    kind: source
    path: github_repo/slime/slime/utils/ppo_utils.py
    estimate_min: 18

questions:
  - id: q1_recurrence
    prompt: naive GAE 中 `next_value` 和 `next_adv` 分别用于什么？
    options:
      - id: a
        text: next_value 参与 delta，next_adv 参与 advantage 递推
        correct: true
      - id: b
        text: 二者都只用于日志
      - id: c
        text: next_value 是 reward，next_adv 是 value
      - id: d
        text: 二者都应该沿 batch 维递推
    explanation: "L40 的递推沿最后一维进行，两个右侧状态不能混用。"
  - id: q2_last_value
    prompt: "`last_value` 在 patch 中表示什么？"
    options:
      - id: a
        text: 最后一个 token 右侧状态的 value，用于链尾 delta
        correct: true
      - id: b
        text: 第一个 token 的 reward
      - id: c
        text: chunk 数量
      - id: d
        text: KL beta
    explanation: "忽略 last_value 会让最后一个 advantage 少掉 gamma * V(s_T)。"
  - id: q3_boundary
    prompt: 处理完 chunk `[start,end)` 后，左侧 chunk 至少需要哪两个状态？
    options:
      - id: a
        text: "`advantages[..., start]` 和 `values[..., start]`"
        correct: true
      - id: b
        text: 当前 chunk 的所有 reward 和所有 value
      - id: c
        text: prompt 文本和 tokenizer 文件
      - id: d
        text: ratio_mean 和 clipped fraction
    explanation: "左侧 chunk 需要右侧起点 advantage 作为 A_end，也需要右侧起点 value 作为 next_value。"
  - id: q4_tests
    prompt: 哪个边界必须由专门测试覆盖？
    options:
      - id: a
        text: T 不能整除 chunk_size 时的最后短 chunk
        correct: true
      - id: b
        text: CSS 是否加载
      - id: c
        text: README 是否有图片
      - id: d
        text: GPU 风扇转速
    explanation: "余数 chunk 很容易出现 off-by-one，所以 L40 单独测试 remainder。"
  - id: q5_performance
    prompt: CPU patch-test 通过后，关于性能最稳妥的说法是什么？
    options:
      - id: a
        text: 已证明数值等价；真实加速比仍需长 T、GPU kernel 和固定计时条件
        correct: true
      - id: b
        text: 已证明任何机器都有 100-300x 加速
      - id: c
        text: 已证明 reward parser 正确
      - id: d
        text: 已证明 rollout engine 权重最新
    explanation: "patch-test 支撑数值合同，不支撑生产速度结论。"
