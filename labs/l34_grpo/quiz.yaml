mission: l34_grpo
title: L39 Quiz · GRPO / RLOO
pass_threshold: 1.0
description: |
  检查学习者是否理解 critic-free advantage、RLOO baseline、ratio clip、reference KL 和 mask 归一化。

prereq_checklist:
  - title: 读系统地图：确认 L39 在 RL 主线中的位置
    kind: doc
    path: labs/l34_grpo/system_map.md
    href: "#lesson"
    estimate_min: 8
  - title: 读主讲义：从 GRPO/RLOO 到 loss 和 smoke
    kind: doc
    path: labs/l34_grpo/lecture.md
    href: "#lesson"
    estimate_min: 35
  - title: 跟源码带读：按 patch、测试、reward、PPO utils 和 smoke 阅读
    kind: doc
    path: labs/l34_grpo/source_walkthrough.md
    href: "#lesson"
    estimate_min: 30
  - title: 最后读 patch/task.md
    kind: task
    path: labs/l34_grpo/patch/task.md
    href: "#patch"
    estimate_min: 5
  - title: 对照 patch reference
    kind: source
    path: labs/l34_grpo/patch/reference/grpo.py
    estimate_min: 8
  - title: 对照 SLiME PPO utils
    kind: source
    path: github_repo/slime/slime/utils/ppo_utils.py
    estimate_min: 15

questions:
  - id: q1_critic_free
    prompt: GRPO 相对带 value critic 的 PPO，核心差异是什么？
    options:
      - id: a
        text: 不训练 value model，advantage 来自同 prompt 多条 response 的相对 reward
        correct: true
      - id: b
        text: 不再需要 reward
      - id: c
        text: 不再需要 reference policy 或 KL
      - id: d
        text: 必须使用 fp8
    explanation: "GRPO 用 group-relative reward 构造 baseline，但仍需要 reward 和更新约束。"
  - id: q2_advantage
    prompt: GRPO advantage 的最小公式是什么？
    options:
      - id: a
        text: A_i = (r_i - mean(r)) / (std(r) + eps)
        correct: true
      - id: b
        text: A_i = r_i
      - id: c
        text: A_i = r_i - V(s)
      - id: d
        text: A_i = log pi(y|x)
    explanation: "L39 patch 对同一 prompt 的 rewards 做组内归一化。"
  - id: q3_rloo
    prompt: RLOO baseline 的关键点是什么？
    options:
      - id: a
        text: 第 i 条 response 的 baseline 要排除 r_i 本身
        correct: true
      - id: b
        text: baseline 等于所有 prompts 的全局均值
      - id: c
        text: baseline 必须来自 value model
      - id: d
        text: baseline 等于 0
    explanation: "RLOO 是 leave-one-out baseline。"
  - id: q4_mask
    prompt: mask 在 grpo_loss 中应影响哪些量？
    options:
      - id: a
        text: policy_loss、kl_loss、ratio_mean 和 ratio_clipped_frac
        correct: true
      - id: b
        text: 只影响 report.md
      - id: c
        text: 只影响 reward parser
      - id: d
        text: 不影响任何平均
    explanation: "completion mask 决定哪些 token 参与训练和指标归一化。"
  - id: q5_kl
    prompt: L39 patch 中 reference KL 的作用是什么？
    options:
      - id: a
        text: 约束当前 policy 不要离 reference policy 太远
        correct: true
      - id: b
        text: 替代 reward
      - id: c
        text: 删除 old_log_probs
      - id: d
        text: 让 group size 自动变大
    explanation: "KL 是 policy 更新的锚点，和 ratio clip 一起限制更新幅度。"
