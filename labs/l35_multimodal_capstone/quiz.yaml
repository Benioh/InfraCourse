mission: l35_multimodal_capstone
title: L41 Quiz · MM-Tiny-Omni Capstone
pass_threshold: 1.0
description: |
  检查学习者是否理解 projector、WER/CLIP reward、Stage A/B/C 路径和 evidence package 边界。

prereq_checklist:
  - title: 读系统地图：确认 L41 的系统边界
    kind: doc
    path: labs/l35_multimodal_capstone/system_map.md
    href: "#lesson"
    estimate_min: 8
  - title: 读主讲义：从 Bronze 合同到 Stage A/B/C
    kind: doc
    path: labs/l35_multimodal_capstone/lecture.md
    href: "#lesson"
    estimate_min: 35
  - title: 跟源码带读：按 patch、测试和聚合器阅读
    kind: doc
    path: labs/l35_multimodal_capstone/source_walkthrough.md
    href: "#lesson"
    estimate_min: 30
  - title: 最后读 patch/task.md
    kind: task
    path: labs/l35_multimodal_capstone/patch/task.md
    href: "#patch"
    estimate_min: 5
  - title: 对照 patch reference
    kind: source
    path: labs/l35_multimodal_capstone/patch/reference/mm_omni.py
    estimate_min: 8
  - title: 对照 Capstone aggregator
    kind: source
    path: labs/l35_multimodal_capstone/scripts/run_capstone_aggregator.py
    estimate_min: 12

questions:
  - id: q1_projector_contract
    prompt: MultimodalProjector 在 Bronze patch 中承担什么合同？
    options:
      - id: a
        text: 把图像和语音 encoder feature 投到 LLM hidden dim，并对缺失模态返回 None
        correct: true
      - id: b
        text: 训练 CLIP 和 Whisper encoder
      - id: c
        text: 把图像直接转成 token id
      - id: d
        text: 负责写 final artifacts
    explanation: "Projector 是 Stage A 的 embedding 接口，负责 image/audio feature 到 LLM hidden dim 的转换。"

  - id: q2_wer_denominator
    prompt: wer_score 的 denominator 应该是什么？
    options:
      - id: a
        text: reference 的词数，空 reference 用 max guard 处理
        correct: true
      - id: b
        text: hypothesis 的词数
      - id: c
        text: 两个句子的字符数之和
      - id: d
        text: 固定常数 100
    explanation: "WER 是词级编辑距离除以 reference 词数。这个选择让转写错误率按目标文本长度归一化。"

  - id: q3_clip_score
    prompt: clip_score 为什么要先归一化 image_embed 和 text_embed？
    options:
      - id: a
        text: 让 score 表示方向相似度，避免 embedding 范数直接控制 reward
        correct: true
      - id: b
        text: 让 tensor 变成整数
      - id: c
        text: 跳过 cosine 计算
      - id: d
        text: 让 WER 变小
    explanation: "归一化后内积就是 cosine similarity，reward 更接近语义方向一致性。"

  - id: q4_stage_a
    prompt: Stage A 训练 MM-Tiny-Omni 时，较合理的默认策略是什么？
    options:
      - id: a
        text: 冻结 CLIP/Whisper，训练 image/audio projector，并可解冻 LLM 后部少量层
        correct: true
      - id: b
        text: 全量训练所有 encoder 和 LLM
      - id: c
        text: 只训练 tokenizer
      - id: d
        text: 跳过 projector，直接把 feature 当作 logits
    explanation: "冻结 encoder 能压住显存和训练风险，projector 与少量 LLM 层负责多模态适配。"

  - id: q5_serving_batch
    prompt: Stage B 遇到图像、音频和纯文本混合请求时，推理引擎应如何处理？
    options:
      - id: a
        text: 按模态集中编码，再把 embedding 注入同一个 LLM batch
        correct: true
      - id: b
        text: 每个请求都单独启动一次 LLM forward
      - id: c
        text: 丢弃纯文本请求
      - id: d
        text: 只返回 encoder feature
    explanation: "异质 batch 合并到同一次 LLM forward 能减少 prefill 重复，并保持训练与服务的 embedding 路径一致。"

  - id: q6_reward_routing
    prompt: Stage C 的 reward 应怎样按任务路由？
    options:
      - id: a
        text: 图像任务用 CLIP image-text 相似度，语音转写任务用 1 - WER，再结合 KL 约束
        correct: true
      - id: b
        text: 所有任务都只用 WER
      - id: c
        text: 所有任务都只用 response 长度
      - id: d
        text: reward 与任务模态无关
    explanation: "不同模态的 reward 含义不同，统一混用会让优化目标失真。"

  - id: q7_evidence_boundary
    prompt: Capstone aggregator 的结论边界是什么？
    options:
      - id: a
        text: 它整理已有 run 证据；缺 run 或 validation-only 行不能支撑真实训练、Serving 或 RL 成功
        correct: true
      - id: b
        text: 它会自动补跑所有缺失实验
      - id: c
        text: 它能替代 patch 测试
      - id: d
        text: 它只生成随机报告
    explanation: "聚合器负责证据索引和风险登记，真实性能结论仍需要对应 run、命令、配置、指标和报告支撑。"
