        L11-L23: MiniInfra 用 command、config、report、metrics 和 artifact 数量汇总证据。
    common_confusions:
    - 把 `tokens_per_sec=0.0` 当成性能失败；本关没有训练 workload。
    - 把 H200 smoke 通过写成长期训练稳定；它只覆盖环境入口。
    - 在 L01 失败时直接改模型 batch size；应先修复 import、CUDA、后端或 rank 映射。
    checkpoint_questions:
    - L01 中哪些字段比 tokens/s 更有解释价值？
    - 本地 4090 smoke 和 H200 smoke 的证据边界分别是什么？
    - 为什么环境检查通过后，后续仍可能出现 OOM 或数据错误？
  - title: Debug 路线
    plain_explanation: |
      遇到 import 失败，先看 `python_executable`、`pythonpath`、`CONDA_PREFIX` 和 `torch.__file__`，判断脚本是否进入了预期解释器，以及是否被项目内同名目录污染。遇到 `torch.cuda.is_available()` 为 false，但 `nvidia-smi` 能看到 GPU，先看 `torch_importable`、`torch_version`、`cuda_version`、`import_error`、`LD_LIBRARY_PATH` 和容器设备可见性。遇到 rank/device 错位，先看 `CUDA_VISIBLE_DEVICES`、`LOCAL_RANK`、`WORLD_SIZE`、`torchrun_hello.log` 和 `parse_local_rank_mapping()` 的输出。

      Debug ticket 的共同规则是单变量复现。先比较失败 run 和最近一次通过 run 的 `command.sh`、`config.resolved.yaml`、主日志和 `metrics.jsonl`；每次只改一个变量，保留修复前后 artifact。不要删除断言、吞掉异常或伪造 metrics。报告里的结论必须连接到具体字段，例如“CVD=2,3 且 LOCAL_RANK=1 映射到 physical_device=3”，而不是只写“环境已修好”。
    mental_model: |
      Debug 像分诊：import 看解释器和路径，CUDA 看 wheel/driver/可见性，rank 错位看启动器和 CVD 重映射。
    why_it_matters: |
      L01 的价值在失败时最明显。证据字段足够细，学生就能把故障分流到正确层面，减少无意义的环境重装和训练代码改动。
    source_refs:
    - title: Report debug section
      repo_path: labs/l01_env_conda_cuda/scripts/run_smoke.py
      lines:
      - 133
      - 145
      note: |
        L133-L145: 报告模板把 rank/device ticket、根因、最小修复和验证方式写出。
    common_confusions:
    - 重装整个环境作为第一反应；更稳妥的顺序是先定位变动字段。
    - 只看最后一个异常；更早的 import、CUDA 或启动器提示常是根因。
    - 把修复动作写成口头描述；报告必须给出能复查的 artifact 路径和字段。
    checkpoint_questions:
    - import 失败时，优先检查哪四类字段？
    - '`torch.cuda.is_available()` 为 false 时，为什么还要记录 `nvidia-smi` 或 `libcuda` 相关证据？'
    - rank/device 错位的最小修复如何用 artifact 验证？
