  - title: 性能和边界
    plain_explanation: |
      环境 smoke 的指标不是训练吞吐。`tokens_per_sec=0.0`、`peak_memory_gb=0.0` 在本关是合理值，因为没有模型 forward/backward。这里真正有用的指标是布尔和计数字段，例如 `torchrun_ok`、`cuda_available`、`cuda_device_count`、`distributed_available`、`nccl_available`。它们回答的是“基础条件是否成立”，不回答“训练能跑多快”。

      边界要写得克制。本地 1×4090 或 CPU validation 可以证明脚本、artifact、gloo 分支和单机小规模启动；8×H200 模板才接近后续训练的硬件形态，但仍只覆盖本节点环境和 torchrun 入口。即使 L01 全部通过，后续仍可能因为显存、网络、文件系统、模型配置或数据 schema 出错。反过来，L01 失败时也不该先改模型代码，应该按环境层证据修复。
    mental_model: |
      L01 是红绿灯，不是测速仪。它告诉你能否进入后续实验路口，不给出模型训练性能结论。
    why_it_matters: |
      如果把 smoke 当成 benchmark，报告会夸大证据范围；如果忽略 smoke，后续每个失败都可能被误判成框架问题。
    source_refs:
