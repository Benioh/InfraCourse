id: l01_env_conda_cuda
title: L01 · 环境探针：把环境变成可复查证据
act: 第 0 章：入门与环境
level: L01
role: Infra 新兵
priority: 核心
frameworks:
- MiniInfra
- PyTorch
- CUDA/NCCL
gpu_modes:
  local: 1×RTX 4090 调试
  cluster: 8×H200 单节点验证
datasets: []
learning_goals:
- 先在 MiniInfra 主线模块完成 L01 增量，再用 notebook、真实源码和 lab artifact 交叉验证。
- 读懂关键源码路径，并画出 环境、Conda、CUDA 与 Git 生存课 的入口到指标/artifact 调用链。
- 用 notebook 或最小脚本建立预测，再用真实运行验证 同一段 PyTorch 代码为什么会在 import、CUDA、NCCL、rank/device 映射四个层面分别失败？
- 完成真实项目：Environment Flight Recorder：一键环境审计器，留下可复现 artifacts。
- 掌握本关 debug ticket 的最小排查路径，不用猜测替代证据。
success_criteria:
- 报告必须包含 MiniInfra 同构文件、对应真实源码、lab artifact/metrics 的三方对照，不能只提交 toy demo 结论。
- 报告包含至少 3 个源码节点、关键不变量和失败边界。
- metrics.jsonl、日志和 artifacts 能支撑实验矩阵中的结论。
- 完成项目交付物：artifacts/check_cuda.json、check_torch.json、check_nccl.json、collect_env.json。; artifacts/torchrun_hello.log，含每个 rank
  的 hostname、rank、local_rank、device。
- 清楚区分本地 smoke、H200 真实运行与 validation-only。
lesson:
  opening: |
    这节课解决一个开工前必须回答的问题：拿到一台陌生 4090 或 H200 机器时，怎样证明后面的 PyTorch、DDP、Megatron、Serving 和 RL 实验具备基本运行条件。这里的证明要落成一组可复查 artifact：Python 从哪里启动，Conda 环境是否符合课程文件，PyTorch wheel 是否带 CUDA，当前进程能看到几张 GPU，NCCL/Gloo 是否可用，torchrun 的每个 rank 绑定到哪个 device。

    本讲的 patch 很小，只实现 `collect_python_env`、`parse_local_rank_mapping` 和 `summarize_drift`。小函数背后对应真实工程里的第一道 gate：把 import 失败、CUDA 不可用、`CUDA_VISIBLE_DEVICES` 重映射和 rank/device 错位拆成结构化证据。学完后，学生应能读懂 `check_cuda.json`、`check_nccl.json`、`collect_env.json`、`torchrun_hello.log`、`command.sh` 和 `config.resolved.yaml`，并知道下一步该查 Python、wheel、driver、容器可见性、通信后端还是启动参数。
  sections:
  - title: 目标和验收边界
    plain_explanation: |
      本讲的目标有四个。第一，能把环境检查拆成 Python/Conda、PyTorch wheel、CUDA 可见性、分布式后端和 torchrun 进程身份。第二，能解释 `torch_importable`、`torch.version.cuda`、`torch.cuda.is_available()`、`cuda_device_count`、`nccl_available` 各自回答的问题。第三，能实现三个环境探针函数，并让 7 个 CPU patch tests 通过。第四，能把一次 smoke run 的命令、配置、JSON、日志和报告串成证据链。

      验收边界也要写清。本关不训练模型，不评估吞吐，不证明 NCCL 在多节点大规模训练中稳定；它只证明当前环境的基础事实是否可复查。`make patch-test M=l01_env_conda_cuda` 检查的是函数行为。`make smoke M=l01_env_conda_cuda` 或 lab 内 `make smoke` 检查的是环境证据产物。若运行在 CPU-only validation 模式，只能说明脚本路径和 gloo 分支可用，不能写成 H200 GPU/NCCL 已通过。
    mental_model: |
      把 L01 看成起飞前检查单。每一项只证明一件事：解释器、依赖、GPU 可见性、通信后端、rank 映射和证据落盘。
    why_it_matters: |
      后续实验的失败常会伪装成模型或框架 bug。先把环境层证据固定下来，排障时才能少猜一步，避免在错误层面修改训练代码。
    source_refs:
    - title: Smoke output
      repo_path: labs/l01_env_conda_cuda/scripts/run_smoke.py
      lines:
      - 67
      - 79
      note: |
        L67-L79: smoke run 写配置、命令快照和四类环境 artifact。
    common_confusions:
    - 把 patch-test 通过等同于 H200 环境通过；patch-test 只验证函数逻辑。
    - 把 gloo smoke 写成 NCCL 通过；gloo 只能覆盖 CPU 或轻量分布式路径。
    - 只保存终端截图；本关要求能被脚本读取和比较的 JSON、日志、配置和命令。
    checkpoint_questions:
    - 本关的 patch-test 和 smoke run 分别验证什么？
    - CPU-only validation 的报告边界应该怎样写？
    - 为什么 `command.sh` 也属于环境证据？
  - title: Python、Conda 和 Wheel
    plain_explanation: |
      Python 解释器是实际执行脚本的二进制程序，`sys.executable` 能告诉你当前脚本从哪个 Python 启动。Conda 环境是一组隔离的 Python 包和部分动态库依赖，课程的 `envs/base.yaml` 固定了 Python 版本、基础工具和若干服务依赖。PyTorch wheel 是已经编译好的 PyTorch 包，它可能是 CPU-only，也可能内置某个 CUDA runtime。三者属于不同层，排障时不能混在一起。

      `collect_python_env()` 故意不 import torch。它只读 `sys` 和 `os.environ`，返回 `python_version`、`python_executable`、`pythonpath`、`cuda_visible_devices`、`local_rank` 和 `world_size`。这样即使 torch 还没安装，探针也能先记录解释器和启动环境。`pythonpath` 必须是 list，空路径要过滤掉；`CUDA_VISIBLE_DEVICES` 未设置返回 `None`，设置为空串返回 `""`。这两个细节能直接暴露 import 污染和 GPU 可见性漂移。
    mental_model: |
      Python 是入口，Conda 是工具箱，PyTorch wheel 是工具箱里的大件工具。入口错了，工具箱再对也没用；wheel 版本错了，GPU 机器也可能只能跑 CPU。
    why_it_matters: |
      import 失败、包版本漂移和 CPU-only torch 是新环境里最早出现的故障。先记录解释器和路径变量，能把“包没装”和“进错环境”区分开。
    source_refs:
    - title: Conda 创建脚本
      repo_path: scripts/env/create_env.sh
      lines:
      - 4
      - 16
      note: |
        L4-L16: 创建环境前先验证环境名、yaml 文件和 conda 是否可用。
    - title: Reference collect
      repo_path: labs/l01_env_conda_cuda/patch/reference/env_probe.py
      lines:
      - 9
      - 21
      note: |
        L9-L21: 参考实现只使用 `os.environ` 和 `sys`。
    common_confusions:
    - 认为 `pip show torch` 能证明当前脚本会 import 同一个 torch；脚本可能由另一个解释器启动。
    - 把 `torch.version.cuda` 当成 driver 版本；它表示 wheel 编译时使用的 CUDA runtime。
    - 把未设置的 `CUDA_VISIBLE_DEVICES` 和空串混成同一种状态；本关要求字段能区分。
    checkpoint_questions:
    - '`sys.executable` 能回答哪个排障问题？'
    - 为什么 `collect_python_env()` 不应该 import torch？
    - 空 PYTHONPATH 应该返回什么类型和值？
  - title: CUDA 可见性和设备映射
    plain_explanation: |
      CUDA 可见性描述当前进程能看到哪些 GPU。它受驱动、容器、调度系统、PyTorch wheel 和 `CUDA_VISIBLE_DEVICES` 影响。`nvidia-smi` 主要证明 driver 能看到硬件；`torch.cuda.is_available()` 证明当前 Python 进程能通过 torch 使用 CUDA；`torch.cuda.device_count()` 证明当前进程能看到多少个逻辑 device。三条证据经常不同步，所以要分别保存。

      `CUDA_VISIBLE_DEVICES=2,3` 是重映射表。对进程来说，物理 GPU 2 会变成逻辑 `cuda:0`，物理 GPU 3 会变成逻辑 `cuda:1`。torchrun 通常用 `LOCAL_RANK` 选择本机逻辑 device，所以 `LOCAL_RANK=1` 会调用 `set_device(1)`，进程内看到的是 `cuda:1`，对应物理 GPU 3。`parse_local_rank_mapping()` 的作用是把这个逻辑编号和物理编号写清楚，越界时用包含 `local_rank=`、`visible_devices=`、`out of range` 的异常提示定位问题。
    mental_model: |
      `CUDA_VISIBLE_DEVICES` 像一张座位重编号表。PyTorch 看逻辑座位号，`nvidia-smi` 看物理座位号，调试时要能把两张表对上。
    why_it_matters: |
      rank/device 映射错会导致某些 GPU 空闲、某些 GPU 被多个进程占用，甚至让 NCCL 初始化卡住。提前输出映射，比在训练 hang 后猜测要便宜得多。
    source_refs:
    - title: CUDA checker
      repo_path: scripts/env/check_cuda.py
      lines:
      - 16
      - 28
      note: |
        L16-L28: 检查 torch import、CUDA 可用性、设备数量、CUDA 版本和设备属性。
    - title: Reference mapping
      repo_path: labs/l01_env_conda_cuda/patch/reference/env_probe.py
      lines:
      - 29
      - 41
      note: |
        L29-L41: 参考实现处理 unset、空串、非整数、越界和正常映射。
    common_confusions:
    - 用 `nvidia-smi` 替代 `torch.cuda.is_available()`；前者在 driver 层，后者在当前 Python 进程层。
    - 认为 `LOCAL_RANK=1` 总是物理 GPU 1；CVD 重映射后它可能对应物理 GPU 3。
    - 越界时只报普通 IndexError；工程上要把 local rank 和 visible device 列表写进错误信息。
    checkpoint_questions:
    - '`CUDA_VISIBLE_DEVICES=2,3` 时，进程内 `cuda:0` 对应哪张物理卡？'
    - '`torch.cuda.is_available()` 和 `cuda_device_count` 分别回答什么？'
    - rank 映射越界时，错误信息至少要包含哪三个片段？
  - title: NCCL、Gloo 和 torchrun
    plain_explanation: |
      PyTorch Distributed 支持多种后端。NVIDIA Collective Communications Library（NCCL）通常用于 GPU 间集合通信，DDP、Megatron 和 Tensor Parallel 都会依赖它。Gloo 是另一种后端，常用于 CPU 或轻量 smoke test。`check_nccl.py` 只检查 torch distributed 是否可用、NCCL 是否可用、Gloo 是否可用；它不启动多个进程，也不证明通信在当前节点实际成功。

      torchrun 才负责多进程身份。它为每个进程注入 `RANK`、`LOCAL_RANK` 和 `WORLD_SIZE`。`RANK` 是全局编号，跨节点唯一；`LOCAL_RANK` 是本机编号，常用于选择本机 GPU；`WORLD_SIZE` 是总进程数。`torchrun_hello.py` 会根据 GPU 数和 world size 选择 NCCL 或 Gloo，输出每个进程的 rank、local_rank、backend 和 device。报告里要同时看 backend 和 device，避免把“多进程启动了”误写成“GPU 通信通过”。
    mental_model: |
      torchrun 是点名器，RANK 是全班编号，LOCAL_RANK 是本机座位号，NCCL/Gloo 是进程之间传消息的通道。
    why_it_matters: |
      后面的多卡训练、推理并行和 RL rollout 都继承这套身份语义。第一讲先用短日志验证身份和设备绑定，能降低后续定位成本。
    source_refs:
    - title: NCCL checker
      repo_path: scripts/env/check_nccl.py
      lines:
      - 16
      - 28
      note: |
        L16-L28: 检查 distributed、NCCL、Gloo 和 import 错误。
    - title: torchrun hello
      repo_path: labs/l01_env_conda_cuda/scripts/torchrun_hello.py
      lines:
      - 17
      - 29
      note: |
        L17-L29: 根据 world size 和 GPU 数选择 backend，并输出 rank/device payload。
    common_confusions:
    - 看到 `distributed_available=true` 就认为 NCCL 真实通信已通过；还需要 torchrun 多进程证据。
    - 用全局 `RANK` 调 `torch.cuda.set_device`；多节点时本机 GPU 编号应该用 `LOCAL_RANK`。
    - 忽略 `WORLD_SIZE` 和 GPU 数关系；world size 大于可见 GPU 数时脚本可能退到 CPU/Gloo。
    checkpoint_questions:
    - '`RANK` 和 `LOCAL_RANK` 的作用分别是什么？'
    - '`check_nccl.json` 为什么不能替代 `torchrun_hello.log`？'
    - H200 模板和 4090 smoke 在进程数、后端假设上有什么差异？
  - title: Patch 实现路径
    plain_explanation: |
      第一个函数 `collect_python_env()` 建议先读原始环境变量，再做类型整理。`PYTHONPATH` 用 `os.pathsep` 切开，并过滤空字符串；`CUDA_VISIBLE_DEVICES` 直接用 `os.environ.get`，保留 unset 与空串的差异；`LOCAL_RANK` 和 `WORLD_SIZE` 只有在存在且非空时才转成整数。这个函数的边界是不能 import torch，因为它要在最干净的 Python 环境里运行。

      第二个函数 `parse_local_rank_mapping()` 先检查 local rank 非负，再解析 CVD。CVD 为 `None` 或 `""` 时，约定 `visible_devices=[]`，表示没有显式重映射，物理编号等于 local rank；CVD 非空时，按逗号切成整数列表，再用 local rank 索引。第三个函数 `summarize_drift()` 对 baseline 和 current 的 key 做并集，按字母序输出变化；list 值用 `repr` 打印，缺失值用 `<missing>`。这三个函数合起来覆盖“记录现状、解释映射、比较漂移”三类动作。
    mental_model: |
      Patch 像三步排障工具：先拍快照，再把本地 rank 映射到物理设备，最后比较两次快照哪里变了。
    why_it_matters: |
      课程后面会不断要求学生保存 run artifact。L01 先用最小函数训练字段语义、异常信息和可 diff 输出，避免后面只写散乱日志。
