    common_confusions:
    - 把 `pythonpath` 返回成字符串；测试要求 list，便于比较路径项。
    - 把 CVD 空串当成 `[0]`；本关约定空串和 unset 都返回空 visible list。
    - drift 只比较交集 key；任务要求新增 key 也算漂移。
