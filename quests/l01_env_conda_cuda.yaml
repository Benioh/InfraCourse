  - title: Smoke 流程和证据落盘
    plain_explanation: |
      完整 smoke 从配置文件进入。`run_smoke.py` 读取 `configs/4090_debug.yaml` 或 `configs/h200_node.yaml`，创建 run directory，写 `command.sh` 和 `config.resolved.yaml`，再依次运行 `check_cuda.py`、`check_torch.py`、`check_nccl.py`、`collect_env.py` 和 `torchrun_hello.py`。最后它从 `check_cuda.json` 提取 CUDA 可见性，写 `train.log`、`metrics.jsonl` 和 `report.md`。

      最小复现可以按两层执行。函数层先跑：

      ```bash
      make patch-test M=l01_env_conda_cuda
      ```

      环境层再跑：

      ```bash
      make smoke M=l01_env_conda_cuda
      ```

      若只想缩小 CUDA 问题，可以直接运行：

      ```bash
      python scripts/env/check_cuda.py --pretty --output /tmp/check_cuda.json
      ```

      读报告时要把 artifact 和结论对应起来：`check_cuda.json` 说明 torch/CUDA/GPU，`check_nccl.json` 说明后端能力，`collect_env.json` 说明 Python、PATH、CONDA、外部命令，`torchrun_hello.log` 说明多进程身份和设备绑定。
    mental_model: |
      smoke 流程是一条证据流水线。配置和命令进入，多个探针产出 JSON 和日志，报告只负责解释这些证据。
    why_it_matters: |
      结构化产物能支持对比。两次 run 的 `config.resolved.yaml`、`command.sh` 和 JSON 字段不同，通常比训练日志里最后一个异常更接近根因。
