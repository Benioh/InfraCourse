source_reading:
  - title: Memory Snapshot starter
    repo_path: labs/l02.5_memory_snapshot/patch/starter/memory_snapshot.py
    focus: 学生要补齐的事件记录、live set 和聚合接口。
    highlights:
      - title: AllocEvent 数据模型
        lines: [21, 27]
        note: |
          L21-L27: `AllocEvent` 定义一次 allocation 的地址、大小、调用栈和时间戳。
      - title: caller stack TODO
        lines: [29, 37]
        note: |
          L29-L37: `get_caller_stack` 要跳过自身 frame，返回 `file:line:function` 字符串 tuple。
      - title: tracker 内部状态
        lines: [40, 47]
        note: |
          L40-L47: `_events`、`_live`、`_enabled` 和 `_next_addr` 是最小 tracker 的全部状态。
      - title: alloc TODO
        lines: [57, 67]
        note: |
          L57-L67: `alloc` 要在 enabled 时生成新 addr，并准备创建 `AllocEvent`。
      - title: free TODO
        lines: [73, 81]
        note: |
          L73-L81: `free` 要处理 disabled、负地址、未知地址和已知地址释放。
      - title: snapshot TODO
        lines: [83, 91]
        note: |
          L83-L91: `dump_snapshot` 要返回 events、live_allocations 和 total_leaked_bytes。
      - title: top-k TODO
        lines: [94, 102]
        note: |
          L94-L102: 聚合函数要按 stack tuple 求和，并返回累计 bytes 最大的前 k 项。

  - title: Memory Snapshot reference
    repo_path: labs/l02.5_memory_snapshot/patch/reference/memory_snapshot.py
    focus: 参考实现中的状态推进顺序和边界处理。
    highlights:
      - title: start / stop
        lines: [31, 35]
        note: |
          L31-L35: start 和 stop 只切换 `_enabled`，不清空已有事件和 live set。
      - title: alloc 状态推进
        lines: [37, 45]
        note: |
          L37-L45: enabled alloc 生成地址、推进 next_addr、创建 event，并写入 events/live。
      - title: free 边界
        lines: [47, 52]
        note: |
          L47-L52: disabled、负地址和未知地址不会抛错；已知地址会记录 free event。
      - title: snapshot 输出
        lines: [54, 59]
        note: |
          L54-L59: snapshot 的泄露总量只统计当前 live allocations。
      - title: stack 聚合
        lines: [62, 69]
        note: |
          L62-L69: 函数按完整 stack tuple 聚合 size，降序排序后截断 top-k。

  - title: Patch tests
    repo_path: labs/l02.5_memory_snapshot/patch/tests/test_patch.py
    focus: 8 个 CPU tests 锁定 patch 行为合同。
    highlights:
      - title: disabled tracker
        lines: [21, 27]
        note: |
          L21-L27: 未 start 时 alloc 返回 -1，snapshot 不应出现泄露。
      - title: alloc/free balance
        lines: [30, 39]
        note: |
          L30-L39: 分配后释放应清空 live allocations，并让 total_leaked_bytes 为 0。
      - title: leak case
        lines: [42, 50]
        note: |
          L42-L50: 只 alloc 不 free 时，snapshot 应保留一个 live allocation。
      - title: double free safe
        lines: [53, 62]
        note: |
          L53-L62: 重复释放和释放未知地址都不能让测试失败。
      - title: snapshot shape
        lines: [65, 76]
        note: |
          L65-L76: snapshot 必须包含三类 key，并正确计算 live bytes。
      - title: top-k ordering
        lines: [100, 111]
        note: |
          L100-L111: top-k 结果需要按 bytes 降序，并尊重 k 的截断。
      - title: caller stack shape
        lines: [114, 120]
        note: |
          L114-L120: caller stack 返回 tuple，元素是字符串，第一帧包含调用者函数名。
