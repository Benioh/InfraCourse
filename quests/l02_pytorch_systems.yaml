      note: |
        L80-L92: 测试覆盖 SGD、SGD momentum 和 Adam state 大小。
    common_confusions:
    - 把 optimizer state 当成模型参数的一部分；它属于 optimizer，需要单独保存和加载。
    - 把 state dict 里的非 tensor 值也按 tensor 统计；本关只累加 Tensor。
    - 认为 optimizer 创建时 state 立刻完整存在；很多状态在第一次 step 后才初始化。
    checkpoint_questions:
    - plain SGD、SGD momentum、Adam 的 state 大小大约分别是多少？
    - 为什么遍历 optimizer.state 时要过滤 Tensor 类型？
    - 恢复训练时为什么不能只加载 model checkpoint？
  - title: 实现和测试闭环
    plain_explanation: |
      实现路径可以直接从三个函数写起。参数账是一行求和；梯度账在参数循环里判断 `p.grad` 是否存在；优化器状态账在双层循环里过滤 Tensor。不要引入 torchsummary、torchinfo 或额外 profiler，这会绕开本关想训练的 PyTorch 对象结构阅读能力。

      一个最小 CPU 实验能观察生命周期：

      ```python
      import torch
      import torch.nn as nn

      def nbytes(t):
          return t.numel() * t.element_size()

      model = nn.Sequential(nn.Linear(8, 16), nn.ReLU(), nn.Linear(16, 4))
      opt = torch.optim.Adam(model.parameters(), lr=1e-3)
      x = torch.randn(2, 8)

      print(sum(nbytes(p) for p in model.parameters()))
      print(sum(nbytes(p.grad) for p in model.parameters() if p.grad is not None))

      model(x).sum().backward()
      print(sum(nbytes(p.grad) for p in model.parameters() if p.grad is not None))

      opt.step()
      print(sum(nbytes(v) for s in opt.state.values() for v in s.values() if isinstance(v, torch.Tensor)))
      ```

      第一行输出参数账；第二行在 backward 前通常为 0；第三行在 backward 后接近参数账；第四行在 Adam step 后接近两份参数。完成 patch 后运行：

      ```bash
      make patch-test M=l02_pytorch_systems
      ```

      这 7 个测试足以验证本关三个函数的边界，但它们不覆盖 activation、CUDA allocator 或真实 GPU 峰值。讲义自查时不要把 patch-test 的范围扩大。
    mental_model: |
      先写三把可测量的尺子，再用单步训练观察账本何时出现。测试验证尺子，训练脚本验证生命周期。
    why_it_matters: |
      这种小闭环能让学生在 CPU 上先建立定量直觉，之后迁移到 GPU profiler、Megatron 显存报告和分布式优化器时更稳。
