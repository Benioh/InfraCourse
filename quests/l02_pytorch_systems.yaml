      note: |
        L9-L10: 参考实现直接对 `model.parameters()` 求和。
    - title: Param tests
      repo_path: labs/l02_pytorch_systems/patch/tests/test_patch.py
      lines:
      - 34
      - 46
      note: |
        L34-L46: 测试覆盖手算公式和 mixed dtype 模型。
    common_confusions:
    - 只看 shape，不看 dtype；相同 shape 在 fp32 和 bf16 下字节数不同。
    - 把 batch size 变化写进参数账；batch 不会改变模型参数数量。
    - 用固定 4 字节估算所有参数；half、bf16、int8 都会改变 `element_size()`。
    checkpoint_questions:
    - '`numel()` 和 `element_size()` 分别表示什么？'
    - 为什么 mixed dtype 模型不能用统一字节数估算？
    - batch size 翻倍会不会改变参数账？
  - title: 梯度生命周期
    plain_explanation: |
      梯度是 loss 对参数的导数，通常保存在 `p.grad`。模型刚创建时，参数已经存在，但梯度多半是 `None`。执行 forward 和 loss 计算后，仍然没有梯度；只有 `loss.backward()` 运行后，参与计算的参数才会得到 grad tensor。优化器更新前会读取这些梯度，`zero_grad(set_to_none=True)` 又会把它们设回 `None`，让下一轮 backward 重新分配。

      `count_grad_bytes(model)` 因此必须跳过 `p.grad is None` 的参数。None 不是 0 字节 tensor，它表示当前没有 grad 对象。fp32 小模型里，backward 后 grad shape 通常与 param shape 相同，因此 grad bytes 接近 param bytes。本关测试直接构造 MLP，backward 后要求 grad bytes 等于 param bytes；再手动把 `p.grad = None`，要求函数返回 0。

      混合精度训练会让梯度账更复杂。quiz 里提醒学生，某些 AMP 流程会维护 fp32 master weights，grad dtype 不一定等于 forward matmul 的 dtype。课堂上不要求记住所有框架实现，但要养成读取实际 tensor dtype 的习惯，而不是从配置名推断显存。
    mental_model: |
      梯度像本轮批改纸。backward 写出批改纸，optimizer 读取它，zero_grad 决定把纸拿走还是留在原处填 0。
    why_it_matters: |
      梯度累积、DDP all-reduce bucket、ZeRO-2 和 mixed precision 都依赖梯度生命周期。统计时跳过 None，是理解这些机制的基础。
    source_refs:
