  - title: 训练脚本和指标
    plain_explanation: |
      `train_tiny_transformer.py` 给出一个比 patch 更接近真实训练的上下文。它构造合成 token 数据集和 tiny decoder-only transformer，支持 fp32/bf16/fp16 autocast、activation checkpointing、DataLoader 延迟、profiler trace、timing metrics 和 CUDA peak memory。训练循环按 `zero_grad`、forward、loss、backward、grad clipping、optimizer.step 的顺序推进，正好对应三本账和 activation 峰值的生命周期。

      两个配置展示不同压力面。`4090_debug.yaml` 使用短序列、2 层、fp32、不开 activation checkpointing，适合快速检查指标链路。`memory_stress.yaml` 把 seq_len 提到 256、层数提到 3、打开 checkpointing，并加入 DataLoader sleep，用来观察 step time、dataloader time、forward/backward/optimizer time 和 `peak_memory_gb` 的变化。这些指标用于训练“只改一个变量”的观测纪律，不用于推出通用性能结论。
    mental_model: |
      patch 量三本静态账，训练脚本观察一次 step 里账本和临时峰值如何变化。两者配合，才能解释 OOM 和吞吐指标。
    why_it_matters: |
      真实训练失败会混合显存、吞吐和数据加载问题。按阶段记录 timing 与 peak memory，能把 DataLoader 慢、activation 峰值和 optimizer step 成本分开。
