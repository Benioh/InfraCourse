        L34-L46: 测试覆盖参数、梯度、优化器状态和 mixed dtype。
    common_confusions:
    - 用第三方 summary 库替代对象遍历；本关要练的是 PyTorch 原生结构。
    - patch-test 通过后宣称真实 GPU 峰值已解释；测试只覆盖三类 tensor 账。
    - 把 Adam state 的少量 per-param step 标量当成主要显存来源；主项是 m 和 v。
    checkpoint_questions:
