id: l02_pytorch_systems
title: L02 · PyTorch 显存账本与训练 step 证据链
level: L02
act: 第 1 章：PyTorch 训练系统基础
role: PyTorch 系统学徒
priority: 核心
estimated_minutes: 90
no_gpu_friendly: true
frameworks:
- PyTorch
patch:
  description: |
    实现 3 个显存计数函数：count_param_bytes / count_grad_bytes /
    count_optimizer_state_bytes。写完之后能精确回答「7B 模型用 Adam
    训练要多少显存」。
  task_md: labs/l02_pytorch_systems/patch/task.md
  starter_file: labs/l02_pytorch_systems/patch/starter/memory_probe.py
  reference_file: labs/l02_pytorch_systems/patch/reference/memory_probe.py
  test_command: make patch-test M=l02_pytorch_systems
  status_file: labs/l02_pytorch_systems/patch/.last_run.json
  test_count: 7
  test_kind: 结果对比
lesson:
  opening: |
    这节课解决一个训练系统里最常见的定量问题：模型还没真正跑起来就 CUDA OOM 时，显存到底被哪几类对象占掉了。只说“模型太大”没有排障价值。学生需要能把训练显存先拆成参数（parameters, params）、梯度（gradients, grads）、优化器状态（optimizer states）、激活值（activations）、临时 workspace、通信 buffer 和 allocator cache。

    本关只实现三把最基础的尺子：`count_param_bytes`、`count_grad_bytes` 和 `count_optimizer_state_bytes`。它们不能替代 profiler，也不会完整估算 activation 峰值；它们的价值在于把长期存在、能从 PyTorch 对象直接访问的三本账量准。后面讲 ZeRO、FSDP、Megatron distributed optimizer、activation checkpointing 和 mixed precision 时，所有讨论都会回到一个问题：哪本账被切分、变小、延后创建或用算力换掉。
  sections:
  - title: 目标和边界
    plain_explanation: |
      本讲的目标有四个。第一，能用 `tensor.numel() * tensor.element_size()` 计算任意 tensor 的数据区字节数。第二，能区分参数、梯度、优化器状态在训练 step 中的创建时机和生命周期。第三，能解释 plain SGD、SGD momentum、Adam/AdamW 在 optimizer state 上的差异。第四，能读懂 7 个 CPU patch tests 为什么覆盖 mixed dtype、None grad、SGD 无状态、momentum 约一份参数和 Adam 约两份参数。

      边界要先讲清。本关三个函数只统计可以从 `model.parameters()`、`p.grad` 和 `optimizer.state` 直接访问的 tensor。它们不统计 activation、CUDA allocator reserved memory、fragmentation、cublas/cudnn workspace、通信 bucket、DataLoader host memory 或 profiler trace。若报告里出现“显存优化”，必须说明优化的是哪本账，比较对象是什么，测试条件是什么，代价是什么。
    mental_model: |
      显存账本先分三册：参数册在模型创建时存在，梯度册在 backward 后出现，优化器状态册通常在第一次 optimizer step 后出现。
    why_it_matters: |
      OOM 的修复方向取决于主导项。参数主导时考虑量化或切分参数；梯度或 optimizer state 主导时考虑 ZeRO/FSDP；activation 主导时考虑 checkpointing、batch 或 sequence length。
    common_confusions:
    - 把本关函数当成完整 GPU profiler；它们只统计三类可访问 tensor。
    - 把所有 OOM 都归因到参数；batch、sequence length 和 activation 也可能主导峰值。
    - 只写“节省显存”；需要说明节省哪一项、对哪个配置有效、付出什么代价。
    checkpoint_questions:
    - 本关三个函数分别统计哪些对象？
    - 本关明确不统计哪些显存来源？
    - 遇到 OOM 时，为什么要先判断主导账本？
  - title: 7B 训练账本
    plain_explanation: |
      7B 模型的参数量是 70 亿个可学习数值。若权重按 bf16 或 fp16 保存，每个元素通常 2 字节，参数本身约为 `7B × 2 bytes = 14GB`。这个数字只回答模型权重占多少，不回答训练能不能放进单卡。训练还要保存梯度、优化器状态、activation 和各种临时 buffer。

      Adam/AdamW 的 optimizer state 是最容易低估的一项。标准 Adam 为每个参数维护一阶矩 `exp_avg` 和二阶矩 `exp_avg_sq`，形状与参数相同。fp32 训练时，7B 参数本身约 28GB，两份 Adam state 约 56GB。混合精度训练中，具体实现还可能维护 fp32 master weights、fp32 grads 或 bf16 optimizer states，不能只按权重 dtype 一刀切。

      这就是为什么“7B bf16 参数 14GB”无法推出“24GB 卡能训练 7B”。若 OOM 在 `model.to(device)` 附近出现，先看参数账；若 backward 后峰值暴涨，先看 grad 和 activation；若第一次 optimizer step 后暴涨，先看 Adam state。将 OOM 放回训练阶段，排障才有方向。
    mental_model: |
      参数像教材，梯度像批改痕迹，Adam state 像两本历史记录。训练时往往要同时带着教材、批改痕迹和历史记录。
    why_it_matters: |
      大模型训练的并行和优化策略都在处理这些账。ZeRO-1 切 optimizer state，ZeRO-2 继续切梯度，ZeRO-3/FSDP 进一步切参数。
    common_confusions:
    - 用参数大小直接判断训练显存；训练还要看梯度、optimizer state 和 activation。
    - 认为 Adam 的 step 计数也会带来一份参数级 tensor；常规 step 计数不是主项。
    - 把混合精度理解成所有账都减半；实现不同，grads 和 optimizer state 可能仍是 fp32。
    checkpoint_questions:
    - 7B bf16 参数本身约多少 GB？
    - Adam 的两份主要 tensor state 是什么？
    - optimizer.step 后峰值第一次明显上涨时，优先检查哪本账？
  - title: Tensor 字节数和参数账
    plain_explanation: |
      Tensor 字节数由两个量决定：元素个数和每个元素的字节数。`numel()` 返回元素个数，`element_size()` 返回当前 dtype 下单个元素的字节数。shape 为 `(3, 4)` 的 fp32 tensor 有 12 个元素，每个元素 4 字节，数据区为 48 字节；同样 shape 的 fp16 或 bf16 tensor 通常为 24 字节。参数账就是把模型中所有 `nn.Parameter` 的字节数加起来。

      `count_param_bytes(model)` 的实现应该遍历 `model.parameters()`，对每个参数累加 `p.numel() * p.element_size()`。它不依赖参数名字，也不应该假设所有参数 dtype 相同。mixed dtype 测试故意把一个 Linear 设为 half，另一个保持 float，就是为了阻止学生写成“参数个数乘统一字节数”。batch size、sequence length 和输入数据不会改变参数数量，只会影响 activation 和临时 tensor。
    mental_model: |
      shape 决定格子数量，dtype 决定每个格子大小。参数账是模型里所有可学习格子的面积总和。
    why_it_matters: |
      参数账是其他估算的基准。梯度通常与参数同形，SGD momentum 常接近一份参数，Adam state 常接近两份参数。
    source_refs:
