      note: |
        L56-L68: 测试覆盖 backward 后和 grad=None 两个状态。
    common_confusions:
    - 把 None grad 当成一个 0 值 tensor；它表示没有 grad 对象。
    - 认为 forward 后就有梯度；梯度由 backward 写入。
    - 从 precision 配置直接推断 grad dtype；实际应检查 `p.grad.dtype`。
    checkpoint_questions:
    - 梯度通常在训练 step 的哪个阶段出现？
    - '`set_to_none=True` 对 grad 对象有什么影响？'
    - 为什么统计 grad bytes 时要检查 `p.grad is not None`？
  - title: 优化器状态
    plain_explanation: |
      优化器状态是 optimizer 为更新参数保存的额外数据，存放在 `optimizer.state`。plain SGD 在没有 momentum 时，通常不需要为每个参数保存 tensor 状态；SGD momentum 会保存 `momentum_buffer`，大小接近一份参数；Adam/AdamW 会保存 `exp_avg` 和 `exp_avg_sq`，大小接近两份参数。很多 optimizer 是 lazy 初始化，第一次 `step()` 之后 state 才出现。

      `count_optimizer_state_bytes(optimizer)` 不能假设 state 里全是 tensor。PyTorch 的 state 可能包含 Python int、float 或小标量，也可能包含参数级 tensor。本关要求遍历 `optimizer.state.values()`，再遍历每个 state dict 的值，只对 `isinstance(v, torch.Tensor)` 的项累加 `v.numel() * v.element_size()`。测试分别检查 plain SGD 为 0、SGD momentum 接近一份参数、Adam 接近两份参数。

      还要区分 model checkpoint 和 optimizer checkpoint。`model.state_dict()` 保存参数和 buffer；`optimizer.state_dict()` 保存每个参数的 state 以及 param_groups 里的学习率、betas、weight decay 等超参。只恢复模型参数，不恢复 optimizer state，Adam 的历史会从头开始，loss 曲线可能短暂抖动。
    mental_model: |
      optimizer state 是训练历史，不是模型本体。SGD 可以只看当前梯度，momentum 记一份方向历史，Adam 记方向和波动两份历史。
    why_it_matters: |
      optimizer state 常是大模型训练的主要显存项。ZeRO-1、distributed optimizer、8bit optimizer 和 optimizer offload 都围绕这本账做文章。
