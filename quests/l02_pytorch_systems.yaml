  - title: Debug 路线
    plain_explanation: |
      OOM 先按阶段分类：`model.to(device)` 附近失败多看参数；forward/backward 附近失败多看 activation、batch、sequence length 和 grad；optimizer.step 附近失败多看 optimizer state。最小检查包括 `torch.cuda.max_memory_allocated()`、`torch.cuda.memory_summary()`、折半 seq_len、折半 batch、切换 checkpointing 和观察 `peak_memory_gb`。每次只改一个变量，报告里写清峰值变化和吞吐代价。

      DataLoader 慢和 NaN loss 也要分开处理。DataLoader 慢时，看 `dataloader_time_ms`、配置 diff、主日志和 metrics；NaN loss 时，先用 `torch.isfinite` 找到是输入、forward、loss 还是 backward 先坏，再检查 lr、warmup、autocast、grad norm 和数据边界。三类 ticket 的共同要求是保留 evidence path，不能只写“已修复”。L02 的正确学习结果是能把“显存不够”“数据慢”“数值爆炸”三类故障分流，而不是混成一个训练失败。
    mental_model: |
      Debug 像分流诊室。OOM 看显存阶段，DataLoader 慢看输入等待，NaN 看数值链路中第一个非有限值。
    why_it_matters: |
      训练系统的症状会互相掩盖。分阶段指标和 ticket 能让学生从第一个可验证事实开始，而不是靠经验猜改参数。
    source_refs:
    - title: Report debug
      repo_path: labs/l02_pytorch_systems/scripts/train_tiny_transformer.py
      lines:
      - 232
      - 244
      note: |
        L232-L244: 报告模板记录配置、结果、诊断、debug ticket 和迁移说明。
    common_confusions:
    - OOM 后只调用 `torch.cuda.empty_cache()`；它不会释放仍被引用的活跃 tensor。
    - NaN 后用 `nan_to_num(loss)` 继续训练；optimizer state 可能已经被污染。
    - DataLoader 慢时只调模型；应先看输入等待时间和配置漂移。
    checkpoint_questions:
    - OOM 发生在 forward/backward/optimizer.step 时，排查方向有什么不同？
    - NaN loss 的第一步检查应该放在哪里？
    - 为什么修复报告要写峰值变化和吞吐代价？
