patch:
  description: |
    实现 CosineWithRestartsLR：在多段 cosine 衰减区间之间做"热重启"——
    每个 restart_step 把 lr 重置回 max_lr。Megatron 没有内置这个，但 SDXL /
    长训 LLM 经常需要。
