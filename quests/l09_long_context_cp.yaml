id: l09_long_context_cp
title: Ring attention forward (online softmax)
level: L04.5
act: 第 1 章：训练框架
role: 长上下文学徒
priority: 核心
estimated_minutes: 120
no_gpu_friendly: true

frameworks:
  - PyTorch
  - FlashAttention (对照)

patch:
  description: |
    把 attention 拆成"分块 + online softmax"的形式：维护 running max + denom，
    遍历 K/V chunk 边累加 softmax 边算输出。num_chunks=1 与 num_chunks=N 数学等价。
  task_md: labs/l09_long_context_cp/patch/task.md
  starter_file: labs/l09_long_context_cp/patch/starter/ring_attention.py
  reference_file: labs/l09_long_context_cp/patch/reference/ring_attention.py
  test_command: make patch-test M=l09_long_context_cp
  status_file: labs/l09_long_context_cp/patch/.last_run.json
  test_count: 5
  test_kind: 结果对比（与 F.scaled_dot_product_attention 等价）

source_reading:
  - title: FlashAttention paper Algorithm 1
    repo_path: docs/术语表.md
    focus: 论文 section 3 的 forward 算法与本关 patch 一一对应
  - title: Megatron context parallel ring 实现
    repo_path: github_repo/Megatron-LM/megatron/core/

mini_infra_targets:
  - mini_infra/distributed/

notebooks:
  - notebooks/n13_rope_yarn_math.ipynb
  - notebooks/n14_context_parallel_ringattn.ipynb

tickets:
  - cp_shape_mismatch_001
  - long_ctx_oom_003

prereq: l08_megatron_text_pretrain
next_lab: l10_megatron_pretrain_lifecycle

gpu_modes:
  local: CPU 完整
  cluster: CP=4 H200 验证（可选）
