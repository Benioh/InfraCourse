id: l10_megatron_pretrain_lifecycle
title: L11 · Megatron 预训练生命周期与 Train Step
level: L11
act: 第 2 章：训练系统、并行与数据
role: Megatron 生命周期学徒
priority: 核心
estimated_minutes: 120
no_gpu_friendly: true
frameworks:
  - Megatron-LM
  - MiniInfra
  - PyTorch

patch:
  description: |
    实现 Megatron-shaped `train_step`：zero_grad、forward/backward、optimizer step、
    scheduler step 和 metrics，覆盖 update success、skip 和异常 loss 输入。
  task_md: labs/l10_megatron_pretrain_lifecycle/patch/task.md
  starter_file: labs/l10_megatron_pretrain_lifecycle/patch/starter/train_step.py
  reference_file: labs/l10_megatron_pretrain_lifecycle/patch/reference/train_step.py
  test_command: make patch-test M=l10_megatron_pretrain_lifecycle
  status_file: labs/l10_megatron_pretrain_lifecycle/patch/.last_run.json
  test_count: 5
  test_kind: 训练循环行为验证

lesson:
  opening: |
    L11 把预训练生命周期拆成可测试的单步合同。任务入口提供 model provider、data iterator 和 forward step；通用训练循环负责 optimizer、scheduler、metrics 和 checkpoint。

    本关 patch 实现 `train_step`，重点是调用顺序、microbatch loss 平均、optimizer skip、scheduler 边界和 metrics schema。Drill 会把 patch 接回 tiny lifecycle，产出 `metrics.jsonl`、`acceptance.json` 和 checkpoint marker。
  sections:
    - title: Task entry 与通用训练循环
      plain_explanation: |
        Megatron 预训练通常把任务入口和通用循环分开。任务入口提供 model provider、batch、loss 和 forward step；通用循环负责初始化、构造 optimizer/scheduler、执行 train_step、写日志和保存 checkpoint。
      mental_model: |
        任务入口说明训练什么，training loop 规定每一步怎么训练和怎么记账。
      why_it_matters: |
        分清边界后，换模型不需要重写训练框架；排查时也能定位问题在数据、模型、optimizer、scheduler 还是 checkpoint。
      source_refs:
        - title: MiniInfra provider and batch
          repo_path: mini_infra/megatron/pretrain_gpt.py
          lines: [6, 12]
          note: |
            L6-L7: `model_provider` 返回 GPT 风格模型配置。
            L10-L12: `get_batch` 从 iterator 取文本并构造 tokens/labels。
        - title: MiniInfra forward step
          repo_path: mini_infra/megatron/pretrain_gpt.py
          lines: [15, 27]
          note: |
            L15-L16: `loss_func` 从 output tensor 中取 loss。
            L19-L27: `forward_step` 取 batch、计算 token_count，并返回 loss 与 model_type。
        - title: Megatron pretrain contract
          repo_path: github_repo/Megatron-LM/megatron/training/training.py
          lines: [829, 841]
          note: |
            L829-L841: 真实 `pretrain` 接收 dataset provider、model provider、model type 和 forward step。
        - title: Megatron pretrain order
          repo_path: github_repo/Megatron-LM/megatron/training/training.py
          lines: [842, 849]
          note: |
            L842-L849: docstring 列出初始化、构造模型/optimizer/lr schedule、获取数据集和训练的顺序。
      common_confusions:
        - 把 task entry 和 training loop 写成一个函数。
        - 只看模型 forward，漏掉 optimizer、scheduler 和 checkpoint。
        - 认为 MiniInfra 的小模型与真实 Megatron 没有结构对应关系。
      checkpoint_questions:
        - 任务入口提供哪些回调？
        - 通用 training loop 负责哪些系统行为？
        - 为什么这两层要分开？

    - title: Train step 的最小合同
      plain_explanation: |
        `train_step` 接收 forward/backward 回调、data iterator、model、optimizer、scheduler 和 iteration。它返回 metrics dict，至少包含 iteration、loss、num_microbatches、skipped_iter 和 lr。

        主顺序是 `zero_grad -> forward_backward -> optimizer.step -> scheduler.step if success -> metrics`。
      mental_model: |
        train_step 是训练循环里的关口清单，每个关口都决定下一个状态和日志字段。
      why_it_matters: |
        调用顺序错会让 loss、梯度、lr 和 checkpoint 全部失真。
      source_refs:
        - title: Starter signature
          repo_path: labs/l10_megatron_pretrain_lifecycle/patch/starter/train_step.py
          lines: [17, 24]
          note: |
            L17-L24: `train_step` 接收 forward_backward、data iterator、model、optimizer、scheduler 和 iteration。
        - title: Starter contract
          repo_path: labs/l10_megatron_pretrain_lifecycle/patch/starter/train_step.py
          lines: [25, 31]
          note: |
            L25-L31: docstring 说明 forward/backward 输出和 optimizer.step 返回值。
        - title: Starter TODOs
          repo_path: labs/l10_megatron_pretrain_lifecycle/patch/starter/train_step.py
          lines: [32, 38]
          note: |
            L32-L37: TODO 列出 zero_grad、forward/backward、loss、optimizer、scheduler 和 metrics。
            L38: 未实现时抛出 L11 提示。
        - title: Reference step path
          repo_path: labs/l10_megatron_pretrain_lifecycle/patch/reference/train_step.py
          lines: [52, 63]
          note: |
            L52-L53: optimizer 有 zero_grad 时先清梯度。
            L55-L59: 调用 forward_backward 并计算平均 loss。
            L61-L63: optimizer 成功后推进 scheduler。
      common_confusions:
        - 在 forward/backward 之后才清梯度。
        - scheduler 在 optimizer skip 时仍前进。
        - metrics 在 scheduler step 前读取 lr。
      checkpoint_questions:
        - "`train_step` 的最小 metrics 字段有哪些？"
        - 为什么 scheduler 要等 optimizer update 成功？
        - optimizer 没有 `zero_grad` 方法时应该怎样处理？

    - title: Loss、optimizer result 和 metrics
      plain_explanation: |
        forward/backward 可以返回单个 loss，也可以返回 microbatch losses。`losses` 非空时取平均，并记录 `num_microbatches`。optimizer 返回 bool、None 或 dict；`False` 和 `success=False` 表示 skip。
      mental_model: |
        Loss 是计算收据，optimizer result 是更新收据，metrics 是交给日志的总账。
      why_it_matters: |
        loss 汇总和 skip 语义一旦写错，训练曲线和 lr 时间轴都会难以解释。
      source_refs:
        - title: Reference loss parsing
          repo_path: labs/l10_megatron_pretrain_lifecycle/patch/reference/train_step.py
          lines: [13, 22]
          note: |
            L13-L18: 支持 `losses` 和 `loss` 两种返回。
            L19-L22: 缺失或空 loss 时抛 `TrainStepError`。
        - title: Reference step result
          repo_path: labs/l10_megatron_pretrain_lifecycle/patch/reference/train_step.py
          lines: [25, 32]
          note: |
            L25-L27: dict 返回 success 和 grad_norm。
            L28-L32: bool、None 和未知类型分别处理。
        - title: Reference metrics
          repo_path: labs/l10_megatron_pretrain_lifecycle/patch/reference/train_step.py
          lines: [65, 76]
          note: |
            L65-L71: metrics 写 iteration、loss、num_microbatches、skipped_iter 和 lr。
            L72-L75: 可选写 grad_norm 和 tokens。
        - title: Patch test assertions
          repo_path: labs/l10_megatron_pretrain_lifecycle/patch/tests/test_patch.py
          lines: [60, 69]
          note: |
            L60-L62: 断言调用顺序和 scheduler 调用次数。
            L63-L69: 断言 iteration、loss、microbatch、tokens、grad_norm、skip 和 lr。
      common_confusions:
        - 多 microbatch loss 求和后直接写日志。
        - optimizer 返回 None 时当成 skip。
        - 忽略 tokens 和 grad_norm 这类辅助证据。
      checkpoint_questions:
        - "`_as_loss_list` 接受哪些输入？"
        - optimizer 返回未知类型时为什么要抛错？
        - metrics 中的 lr 从哪里读取？

    - title: Lifecycle drill 和 checkpoint 证据
      plain_explanation: |
        `run_lifecycle.py` 把 patch 接回 tiny decoder 训练循环。它加载 train_step、加载 L09 scheduler 或 fallback，构造模型、optimizer、scheduler 和 synthetic data，循环写 metrics，并按配置写 checkpoint marker。
      mental_model: |
        Patch 验证单步，lifecycle drill 验证单步能在一个小训练闭环里反复工作。
      why_it_matters: |
        单步测试通过后仍可能在多步循环里暴露 lr、checkpoint、loss drop 或 artifact 问题。
      source_refs:
        - title: Load train_step
          repo_path: labs/l10_megatron_pretrain_lifecycle/scripts/run_lifecycle.py
          lines: [44, 55]
          note: |
            L44-L50: 支持 `IMPL=reference` 时直接加载 reference。
            L51-L55: 默认尝试加载 starter train_step。
        - title: Load L09 scheduler
          repo_path: labs/l10_megatron_pretrain_lifecycle/scripts/run_lifecycle.py
          lines: [62, 70]
          note: |
            L62-L66: 函数读取 L09 patch 目录，并根据环境变量决定查找顺序。
            L67-L70: 按 starter/reference 顺序查找 scheduler 文件。
        - title: Scheduler construction
          repo_path: labs/l10_megatron_pretrain_lifecycle/scripts/run_lifecycle.py
          lines: [231, 239]
          note: |
            L231-L239: 构造模型、optimizer 和 scheduler。
        - title: Lifecycle loop metrics
          repo_path: labs/l10_megatron_pretrain_lifecycle/scripts/run_lifecycle.py
          lines: [264, 271]
          note: |
            L264-L271: 循环调用 train_step 并记录 loss/lr。
        - title: Lifecycle metrics write
          repo_path: labs/l10_megatron_pretrain_lifecycle/scripts/run_lifecycle.py
          lines: [272, 284]
          note: |
            L272-L284: 写入 metrics.jsonl。
        - title: Acceptance
          repo_path: labs/l10_megatron_pretrain_lifecycle/scripts/run_lifecycle.py
          lines: [294, 303]
          note: |
            L294-L303: 根据 loss drop 和 restart lr 判断局部 acceptance。
      common_confusions:
        - patch test 通过后不跑 lifecycle。
        - 把 CPU tiny model 的 loss drop 当成真实集群吞吐证据。
        - 只看 report，不检查 metrics.jsonl 和 acceptance.json。
      checkpoint_questions:
        - lifecycle 脚本如何选择 train_step 实现？
        - acceptance.json 记录哪些判断？
        - checkpoint marker 在哪一步写入？

    - title: 真实 Megatron 对照
      plain_explanation: |
        真实 Megatron 的 `training.py` 包含更多并行、日志和保存分支，但主线相同：pretrain 构造系统，train_step 调用 forward_backward，optimizer 成功后推进 scheduler，主 loop 读取 lr 交给 training_log。
      mental_model: |
        MiniInfra 是真实 Megatron 的窄切片；源码带读要把窄切片映射回生产主路径。
      why_it_matters: |
        读真实源码时，如果没有这条主线，很容易被 activation logging、pipeline、distributed optimizer 和 monitor 分支带偏。
      source_refs:
        - title: Megatron forward_backward
          repo_path: github_repo/Megatron-LM/megatron/training/training.py
          lines: [1888, 1900]
          note: |
            L1888-L1899: 真实 train_step 调用 forward_backward_func 并传入 microbatch、序列长度和模型。
            L1900: 后续处理 activation logging 等分支。
        - title: Megatron optimizer step
          repo_path: github_repo/Megatron-LM/megatron/training/training.py
          lines: [1945, 1949]
          note: |
            L1945-L1948: 执行真实 optimizer step。
            L1949: update_successful 决定后续 scheduler 行为。
        - title: Megatron scheduler update
          repo_path: github_repo/Megatron-LM/megatron/training/training.py
          lines: [1976, 1983]
          note: |
            L1976-L1979: update 成功后按 batch 相关 increment 推进 scheduler。
            L1980-L1983: 记录 skipped_iter。
        - title: Megatron lr to log
          repo_path: github_repo/Megatron-LM/megatron/training/training.py
          lines: [3211, 3221]
          note: |
            L3211-L3216: 主 loop 读取 canonical lr。
            L3217-L3221: 将 lr 传给 `training_log`。
      common_confusions:
        - 认为 MiniInfra 和真实 Megatron 的训练主线无关。
        - 看到真实源码分支多，就忽略 optimizer/scheduler 主路径。
        - 把 sample-based increment 简化成每 iteration 加 1。
      checkpoint_questions:
        - 真实 Megatron 在哪里调用 forward_backward_func？
        - 真实 scheduler increment 和本关 patch 有什么差异？
        - learning rate 怎样进入 training_log？

