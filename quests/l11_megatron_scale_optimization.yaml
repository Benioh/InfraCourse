patch:
  description: |
    实现 `BucketedManualDDP`：按字节数给 trainable params 分桶，把每个 bucket
    的 grad flatten 成连续 tensor，all-reduce 求和后除以 world size，再 unflatten
    copy 回原 grad。结果应与 PyTorch DDP 的平均梯度语义一致。
  task_md: labs/l11_megatron_scale_optimization/patch/task.md
  starter_file: labs/l11_megatron_scale_optimization/patch/starter/bucketed_ddp.py
  reference_file: labs/l11_megatron_scale_optimization/patch/reference/bucketed_ddp.py
  test_command: make patch-test M=l11_megatron_scale_optimization
  status_file: labs/l11_megatron_scale_optimization/patch/.last_run.json
  test_count: 5
  test_kind: 结果对比（与 PyTorch DDP 等价）

