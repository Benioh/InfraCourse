patch:
  description: |
    实现 `top2_router(logits, capacity_factor)`：从 router logits 得到 top-2 expert，
    构造 `dispatch_mask` 和 `combine_weights`，按 capacity factor drop overflow route，
    并计算 Switch 风格 load-balance aux loss。
  task_md: labs/l13_moe_ep/patch/task.md
  starter_file: labs/l13_moe_ep/patch/starter/moe_router.py
  reference_file: labs/l13_moe_ep/patch/reference/moe_router.py
  test_command: make patch-test M=l13_moe_ep
  status_file: labs/l13_moe_ep/patch/.last_run.json
  test_count: 5
  test_kind: MoE routing 张量行为合同

