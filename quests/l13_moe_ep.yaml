lesson:
  opening: |
    # 第 14 讲：MoE Top-2 Router、Capacity 与 Expert Parallelism

    L14 解决 MoE 层的路由控制问题。MoE 让每个 token 只激活少数 expert，但 router 一旦偏向少数 expert，就会产生 overload、drop rate 上升和 all-to-all 等待。本关先把 top-2 router 的张量语义写清楚，再对照 Megatron 的 `TopKRouter`、token dropping 和 dispatcher。

    Patch 只实现 `top2_router(logits, capacity_factor)`。它返回 `dispatch_mask`、`combine_weights` 和 `aux_loss`，不执行 expert MLP，也不做真实 NCCL 通信。
  sections:
    - title: 课程定位：MoE 把 FFN 计算变成路由问题
      plain_explanation: |
        Dense FFN 让每个 token 经过同一组参数。MoE 把 FFN 拆成多个 expert，每个 token 只选 top-k 个 expert。这样可以扩大参数总量，同时控制单个 token 的计算量。

        代价是系统多了 router、capacity 和 dispatcher。router 决定 token 去哪，capacity 控制每个 expert 的队列上限，dispatcher 把 token 发到 expert 所在 rank。任何一层出错，都会表现为 drop rate、负载不均、all-to-all 慢或 loss 异常。
      mental_model: |
        Dense FFN 像所有 token 排同一个窗口；MoE 像多个窗口并行处理，但需要调度员决定每个 token 去哪个窗口。
      why_it_matters: |
        MoE 的瓶颈经常不在 expert MLP 本身，而在路由不均和跨 rank token 通信。先读懂 router，才能定位 EP 性能问题。
      source_refs:
        - title: MiniInfra MoE summary
          repo_path: mini_infra/megatron/core/transformer/moe/experts.py
          lines: [30, 41]
          note: |
            L30-L37: `moe_summary` 接收 token、expert、top-k、capacity 和 EP 配置。
            L38-L41: 生成 logits，并串起 routing、capacity 和 dispatch plan。
        - title: Megatron dispatcher 状态
          repo_path: github_repo/Megatron-LM/megatron/core/transformer/moe/token_dispatcher.py
          lines: [68, 76]
          note: |
            L68-L76: dispatcher 保存 shared expert、EP/TP groups 和组合 group。
        - title: Megatron dispatcher ranks
          repo_path: github_repo/Megatron-LM/megatron/core/transformer/moe/token_dispatcher.py
          lines: [78, 81]
          note: |
            L78-L81: 保存 TP 和 EP size/rank，后续通信依赖这些状态。
      common_confusions:
        - 认为 MoE 只是在模型里多放几个 FFN。
        - 只看 expert MLP FLOPs，不看 token dispatch 和 combine。
        - 把 CPU patch 通过当成 EP 通信性能合格。
      checkpoint_questions:
        - MoE 的稀疏激活省下哪类计算？
        - router 不均为什么会拖慢 EP group？
        - 本关 patch 不覆盖哪些生产路径？

    - title: Top-2 routing：从 logits 到 mask 和 weights
      plain_explanation: |
        router logits 的形状是 `(num_tokens, num_experts)`。softmax 后，每个 token 得到一个 expert 概率分布。top-2 选择给出两个 expert id 和对应概率；再把这两个概率在 top-2 内重新归一化。

        `dispatch_mask` 决定 token 是否发给某个 expert，`combine_weights` 决定 expert 输出回来后按多少权重合并。两者形状相同，且必须共享同一个 token-to-expert 对齐关系。没有 capacity drop 时，mask 每行有两个 1，weights 每行和接近 1。
      mental_model: |
        mask 是物流标签，weights 是结算比例。标签决定去哪，比例决定回来后怎么加权。
      why_it_matters: |
        如果 mask 和 weights 错位，dispatcher 可能把 token 发给一个 expert，却用另一个 expert 的权重合并。数值可能错误但不一定立刻报 shape error。
      source_refs:
        - title: Reference top-2 scatter
          repo_path: labs/l13_moe_ep/patch/reference/moe_router.py
          lines: [16, 22]
          note: |
            L16: softmax 得到全 expert 概率。
            L17-L18: 取 top-2 并在 top-2 内归一化。
            L20-L22: scatter 回完整 expert 维度，得到 weights 和 mask。
        - title: Megatron routing scatter
          repo_path: github_repo/Megatron-LM/megatron/core/transformer/moe/moe_utils.py
          lines: [837, 842]
          note: |
            L837-L840: 普通模式下用 scatter 构造 routing probabilities 和 boolean map。
            L842: 返回 dense probabilities 和 routing map。
      common_confusions:
        - 只返回 expert id，缺少后续 capacity 和 combine 需要的 dense 形状。
        - top-2 后忘记重新归一化，导致 weights 行和小于 1。
        - 把 aux loss 的概率来源误写成 top-2 normalized weights。
      checkpoint_questions:
        - "`dispatch_mask` 和 `combine_weights` 分别服务于 MoE forward 的哪一步？"
        - top-2 weights 为什么要重新归一化？
        - Megatron 的 `routing_map` 对应本关哪个输出？

    - title: Capacity 与 token dropping
      plain_explanation: |
        capacity factor 控制每个 expert 最多接收多少 route。top-2 时总 route 数是 `num_tokens * 2`，均匀分给 expert 后乘以 capacity factor。本关按 `max(1, int(capacity_factor * num_tokens * 2 / num_experts))` 计算 capacity。

        overflow 时，reference 按该 expert 列的 combine weight 保留前 capacity 个 route，其余 route 的 weights 和 mask 同步清零。这样可以保留 router 更有信心的分配，同时避免重新路由的额外通信轮。
      mental_model: |
        capacity 像每个 expert 的队列长度上限。排不进队列的 route 会取消，不能只取消标签而保留结算比例。
      why_it_matters: |
        capacity 直接影响 drop rate、padding、expert buffer 和 all-to-all 大小。它是质量与系统成本之间的旋钮。
      source_refs:
        - title: Reference capacity
          repo_path: labs/l13_moe_ep/patch/reference/moe_router.py
          lines: [24, 33]
          note: |
            L24: 根据 token、top-k、expert 和 capacity factor 计算 capacity。
            L25-L28: 逐 expert 检查 route 数。
            L29-L33: 保留高权重 route，并同步更新 weights 与 mask。
        - title: Megatron capacity
          repo_path: github_repo/Megatron-LM/megatron/core/transformer/moe/moe_utils.py
          lines: [933, 940]
          note: |
            L933-L934: capacity 逻辑要求 routing_probs 和 routing_map 都是二维。
            L935-L940: capacity 使用 `num_tokens * router_topk` 和 expert 数计算。
        - title: Megatron final map/probs
          repo_path: github_repo/Megatron-LM/megatron/core/transformer/moe/moe_utils.py
          lines: [958, 965]
          note: |
            L958-L961: pad_to_capacity 分支直接用 capacity mask。
            L963-L965: 普通分支把 routing_map 与 capacity mask 取交集，并同步更新 probabilities。
      common_confusions:
        - 把 top-2 的 capacity 算成 `num_tokens / num_experts`。
        - drop 时只清 mask，忘记清 weights。
        - capacity 越大越好，忽略 padding、buffer 和通信成本。
      checkpoint_questions:
        - 32 个 token、4 个 expert、top-2、capacity factor 0.5 时 capacity 是多少？
        - overflow 时本关按什么分数保留 route？
        - capacity 太小会怎样影响 drop rate 和 loss？

    - title: Aux loss 与 router collapse
      plain_explanation: |
        Switch 风格 aux loss 使用 `fraction_routed` 和 `fraction_prob` 的乘积。`fraction_routed` 来自实际 routing mask，表示某个 expert 接到多少 route；`fraction_prob` 来自 softmax，保留可微梯度通道。

        top-2 均匀路由时，所有 expert 的 routed fraction 接近 `2 / num_experts`，prob fraction 接近 `1 / num_experts`，aux loss 接近 2。本关不除以 top-k，因此测试会把 2 当作均衡尺度。
      mental_model: |
        aux loss 像路由分布的罚单：谁既被频繁选择又拿到高概率，谁就让 router 付出更高代价。
      why_it_matters: |
        没有负载均衡约束，router 可能长期偏向少数 expert，导致 drop rate 上升、某些 rank 慢、其他 expert 空闲。
      source_refs:
        - title: Reference aux loss
          repo_path: labs/l13_moe_ep/patch/reference/moe_router.py
          lines: [35, 39]
          note: |
            L35: `fraction_routed` 来自 dispatch mask。
            L36: `fraction_prob` 来自全 softmax 概率。
            L37-L39: 计算并返回标量 aux loss。
        - title: Megatron aux loss
          repo_path: github_repo/Megatron-LM/megatron/core/transformer/moe/moe_utils.py
          lines: [142, 146]
          note: |
            L142: 汇总每个 expert 的 router 概率。
            L143-L145: 概率和 token count 相乘，并按 expert、top-k 和 token 数缩放。
            L146: 返回 aux loss。
        - title: MiniInfra entropy
          repo_path: mini_infra/megatron/core/transformer/moe/router.py
          lines: [58, 68]
          note: |
            L58-L60: entropy 先统计 tokens per expert。
            L61-L63: 没有 route 时返回 0。
            L64-L68: 按 expert 分布计算归一化 entropy。
      common_confusions:
        - 认为 top-2 均匀 aux loss 应接近 1。
        - 只看 aux loss，不看 tokens per expert 和 overflow rate。
        - 用 detached routing count 直接当作可微 loss。
      checkpoint_questions:
        - "`fraction_routed` 和 `fraction_prob` 分别来自哪个张量？"
        - top-2 均匀 aux loss 为什么接近 2？
        - router collapse 时 entropy、drop rate 和 all-to-all 通常怎么变化？

    - title: Dispatcher 边界：从路由到 EP 通信
      plain_explanation: |
        router 输出的是 token-to-expert 关系。dispatcher 要把这个关系变成实际通信：先做本地 token 重排，再把 token 发到 expert 所在设备，expert 计算后再把输出合回原 token 顺序。

        Megatron 把 dispatcher 拆成 preprocess、dispatch、postprocess、combine preprocess、combine 和 combine postprocess。AllGather 和 AllToAll 分支会根据 EP/TP group 决定通信域。本关 patch 不覆盖这些通信，但 mask 和 weights 必须满足 dispatcher 的输入语义。
      mental_model: |
        router 写目的地清单，dispatcher 负责装车、跨 rank 运输、卸货和按原顺序归还。
      why_it_matters: |
        MoE 性能问题经常出在 dispatcher：tokens per expert 不均、all-to-all 慢、combine 重排错，都可能让 step time 或 loss 异常。
