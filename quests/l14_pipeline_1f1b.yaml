patch:
  description: |
    实现 `make_1f1b_schedule(num_stages, num_microbatches)` 和 `bubble_count(num_stages)`：
    生成每个 pipeline stage 的 warmup、steady 1F1B、cooldown timeline，
    并验证标准 non-interleaved 1F1B 的 bubble 公式。
  task_md: labs/l14_pipeline_1f1b/patch/task.md
  starter_file: labs/l14_pipeline_1f1b/patch/starter/pp_schedule.py
  reference_file: labs/l14_pipeline_1f1b/patch/reference/pp_schedule.py
  test_command: make patch-test M=l14_pipeline_1f1b
  status_file: labs/l14_pipeline_1f1b/patch/.last_run.json
  test_count: 8
  test_kind: Pipeline timeline 行为合同

