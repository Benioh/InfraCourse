lesson:
  opening: |
    # 第 16 讲：Megatron Parallel Checkpoint

    L16 解决分布式训练恢复的状态合同问题。checkpoint 文件存在，不等于训练可以无缝 resume；TP/PP/DP/EP 拓扑、optimizer shard、scheduler step、RNG 和数据进度都会影响恢复语义。

    Patch 实现一个教学版 Megatron-shaped checkpoint：保存 model、optimizer、scheduler、parallel_state 和 latest marker；加载时校验 format 和 expected parallel_state。它不实现真实 sharded tensor，也不做跨拓扑转换。
  sections:
    - title: 课程定位：checkpoint 是训练恢复合同
      plain_explanation: |
        L16 属于训练可靠性主线。前面课程讲了训练 step、FSDP2、MoE/EP 和 PP，这些并行配置都会影响 checkpoint 中 shard 的坐标系。一次安全 resume 必须同时恢复模型、优化器、调度器和并行拓扑。

        本讲先把 save/load 的最小合同写清楚，再读 Megatron 如何把 rank 坐标写进 path、如何保存 state_dict、如何用 metadata 选择 distributed optimizer sharding。
      mental_model: |
        checkpoint 像训练状态的合同。payload 写明状态内容，latest marker 指向合同版本，parallel_state 写明 shard 坐标系。
      why_it_matters: |
        错误 resume 可能不会立刻崩溃，却会让 LR、optimizer 动量、RNG 或 shard 语义错位。训练损失和时间成本都会受影响。
      source_refs:
        - title: Megatron checkpoint path
          repo_path: github_repo/Megatron-LM/megatron/training/checkpointing.py
          lines: [197, 206]
          note: |
            L197-L201: `get_checkpoint_name` 接收 iteration、TP/PP/EP rank 和 basename。
            L203-L206: release 和普通 iteration 使用不同目录名。
        - title: Megatron rank 默认值
          repo_path: github_repo/Megatron-LM/megatron/training/checkpointing.py
          lines: [211, 221]
          note: |
            L211-L217: 未传 TP/PP rank 时从 parallel state 查询。
            L218-L221: EP 是否启用和 EP rank 也来自 parallel state。
      common_confusions:
        - 能加载权重就认为完整 resume 成功。
        - 只比较 world size，不比较 TP/PP/EP/DP 组合。
        - 忽略 scheduler step 和 optimizer state。
      checkpoint_questions:
        - L16 patch 保存了哪些状态？
        - 为什么 checkpoint path 需要带 rank 坐标？

    - title: Payload 与 latest marker
      plain_explanation: |
        Payload 是落盘的训练状态。本关要求保存 format、iteration、model_state、optimizer_state、scheduler_state 和 parallel_state。format 用来拒绝未知版本；iteration 用来恢复训练步；四类 state 对应权重、优化器、学习率调度和并行拓扑。

        Latest marker 是恢复入口。loader 先读 `latest_checkpointed_iteration.txt`，再找到对应 checkpoint 文件。这样可以避免用目录排序猜最新文件，也能在 marker 缺失时明确失败。
      mental_model: |
        payload 是箱子里的训练状态，marker 是仓库入口的标签。标签缺失时，不应该凭肉眼猜哪只箱子最新。
      why_it_matters: |
        训练目录里可能有多个 iteration 或半成品文件。marker 和 format 让恢复入口和 payload 版本都可验证。
      source_refs:
        - title: Reference payload
          repo_path: labs/l15_megatron_parallel_checkpoint/patch/reference/checkpointing.py
          lines: [28, 35]
          note: |
            L28-L35: payload 保存 format、iteration、model、optimizer、scheduler 和 parallel state。
        - title: Reference marker
          repo_path: labs/l15_megatron_parallel_checkpoint/patch/reference/checkpointing.py
          lines: [36, 45]
          note: |
            L36-L39: checkpoint 文件按 iteration 命名并写入 JSON。
            L40-L45: latest marker 写入 iteration，并返回两个路径。
        - title: Megatron latest tracker
          repo_path: github_repo/Megatron-LM/megatron/training/checkpointing.py
          lines: [312, 317]
          note: |
            L312-L317: tracker 文件固定为 `latest_checkpointed_iteration.txt`。
      common_confusions:
        - 用 glob 找最大文件名代替 latest marker。
        - 忽略 format 字段。
        - marker 指向的 checkpoint 不存在时继续尝试其他文件。
      checkpoint_questions:
        - 本关 payload 必须包含哪些 key？
        - latest marker 缺失时 loader 应该怎么做？

    - title: Parallel state 兼容性
      plain_explanation: |
        parallel_state 描述 checkpoint 的 shard 坐标系。TP 改变会改变权重切分，PP 改变会改变 layer 所属 stage，EP 改变会改变 expert shard，DP 改变会影响 optimizer state 归属。

        L16 的校验方式是逐个比较 expected parallel state。strict 模式下 mismatch 立即抛 `CheckpointError`；non-strict 模式返回 warnings，供转换工具、诊断脚本或 finetune 流程继续读取 payload。
      mental_model: |
        parallel_state 是 checkpoint 的坐标系标签。坐标系不一致时，strict resume 应该停下来。
      why_it_matters: |
        TP/PP/EP mismatch 常见表现是 tensor shape mismatch、rank 目录缺失、optimizer shard 不兼容或训练继续后数值异常。
      source_refs:
        - title: Reference parallel_state 校验
          repo_path: labs/l15_megatron_parallel_checkpoint/patch/reference/checkpointing.py
          lines: [72, 84]
          note: |
            L72-L76: 遍历 expected parallel state，并读取 actual 值。
            L77-L80: mismatch 时 strict 抛错，non-strict 收集 warning。
            L82-L84: 返回 payload 时补上 checkpoint_path 和 warnings。
        - title: Megatron TP/PP 对比
          repo_path: github_repo/Megatron-LM/megatron/training/checkpointing.py
          lines: [1676, 1683]
          note: |
            L1676-L1683: checkpoint 与当前运行的 TP/PP 都进入比较。
        - title: Megatron mismatch message
          repo_path: github_repo/Megatron-LM/megatron/training/checkpointing.py
          lines: [1685, 1690]
          note: |
            L1685-L1690: world size、DP 和 mismatch message 也被准备好。
        - title: Megatron optimizer mismatch
          repo_path: github_repo/Megatron-LM/megatron/training/checkpointing.py
          lines: [1725, 1735]
          note: |
            L1725-L1727: 根据旧参数推断 optimizer sharding type。
            L1728-L1735: TP/PP mismatch 且格式不可 reshard 时直接报错。
      common_confusions:
        - non-strict 时吞掉 mismatch，不返回 warning。
        - 只检查 TP/PP，忘记 EP/CP 等新并行轴。
        - 把 checkpoint 转换和直接 resume 混成同一流程。
      checkpoint_questions:
        - strict 和 non-strict 的适用场景分别是什么？
        - 为什么 world size 相同仍可能不兼容？

    - title: Optimizer 与 scheduler 也属于 checkpoint
      plain_explanation: |
        model_state 决定当前位置，optimizer_state 决定下一步更新方向和尺度，scheduler_state 决定下一步学习率。缺少 optimizer 或 scheduler 时，训练能继续跑，但已经不再延续同一条优化轨迹。

        Megatron 的 `generate_state_dict` 会把 model、optimizer、opt_param_scheduler、RNG 和 rerun state 都纳入保存逻辑。distributed optimizer 还会根据 metadata 选择 sharding type，决定 optimizer state 是否支持某些 reshard 场景。
      mental_model: |
        model 是位置，optimizer 是速度和惯性，scheduler 是油门曲线。resume 需要三者对齐。
      why_it_matters: |
        resume 后 LR 跳变、loss 抖动或 optimizer shape mismatch，常常来自 scheduler_state 或 distributed optimizer metadata 不完整。
      source_refs:
        - title: Megatron generate_state_dict 入口
          repo_path: github_repo/Megatron-LM/megatron/training/checkpointing.py
          lines: [980, 991]
          note: |
            L980-L989: 函数接收 args、model、optimizer、scheduler、RNG 和 rerun state。
            L991: docstring 明确这是从这些对象生成 state dict。
        - title: Megatron scheduler
          repo_path: github_repo/Megatron-LM/megatron/training/checkpointing.py
          lines: [1041, 1045]
          note: |
            L1041-L1045: optimizer state 和 opt_param_scheduler state 都进入 state_dict。
        - title: DistributedOptimizer sharding
          repo_path: github_repo/Megatron-LM/megatron/core/optimizer/distrib_optimizer.py
          lines: [1336, 1342]
          note: |
            L1336-L1342: sharded_state_dict 接收 model sharded state、loading 标记、sharding type 和 metadata。
      common_confusions:
        - scheduler 可以完全从配置重建。
        - "`--no-load-optim` 成功就证明完整 resume 安全。"
        - optimizer state 的 sharding 和 model state 一样简单。
      checkpoint_questions:
        - scheduler_state 丢失会导致什么现象？
        - optimizer sharding metadata 为什么会影响 load 行为？

    - title: Lab 和 drill：把兼容性证据落盘
      plain_explanation: |
        Patch-test 验证最小 save/load 合同。drill 在 run 目录中保存 checkpoint，分别测试同拓扑、TP 改变和 EP 改变。每个 case 都记录 strict 是否抛错、non-strict warning 数和 case 是否通过。

        CPU drill 可以证明 JSON 合同和 topology 校验逻辑正确，不能证明真实 sharded tensor 已经能跨拓扑转换。进入 Megatron 集群验证时，还要记录 checkpoint format、rank 路径、distributed optimizer sharding type、RNG 和数据进度。
      mental_model: |
        patch 是合同测试，drill 是小型事故演练，真实 Megatron resume 才包含 rank 目录、tensor shard 和通信。
      why_it_matters: |
        没有落盘证据，checkpoint 问题很难复盘。L16 要求把 marker、payload、warnings 和 strict 错误都保留下来。
      source_refs:
        - title: Patch strict/non-strict 测试
          repo_path: labs/l15_megatron_parallel_checkpoint/patch/tests/test_patch.py
          lines: [54, 66]
          note: |
            L54-L58: strict 下 TP mismatch 必须抛 `CheckpointError`。
            L61-L66: non-strict 下 TP mismatch 必须返回 warning。
        - title: Drill case 判定
          repo_path: labs/l15_megatron_parallel_checkpoint/scripts/run_checkpoint_drill.py
          lines: [99, 111]
          note: |
            L99-L108: strict 预期和 warning 数共同决定 case 是否通过。
            L109-L111: 更新整体通过状态并保存当前 case。
        - title: Drill summary
          repo_path: labs/l15_megatron_parallel_checkpoint/scripts/run_checkpoint_drill.py
          lines: [125, 128]
          note: |
            L125-L128: 将整体结果和所有 case 写入 `artifacts/drill.json`。
      common_confusions:
        - 只跑 patch-test，不跑 topology mismatch drill。
        - 看见 non-strict 读到 payload，就忽略 warnings。
        - 用 CPU JSON drill 证明真实 Megatron reshard 已经可用。
      checkpoint_questions:
        - drill 的 `all_passed=true` 能证明什么？
        - 真实 Megatron resume 还需要补哪些证据？
