patch:
  description: |
    实现 Megatron-shaped checkpoint save/load：保存 model、optimizer、scheduler、
    parallel_state 与 latest marker，load 时校验 format 和 parallel_state 兼容性。
  task_md: labs/l15_megatron_parallel_checkpoint/patch/task.md
  starter_file: labs/l15_megatron_parallel_checkpoint/patch/starter/checkpointing.py
  reference_file: labs/l15_megatron_parallel_checkpoint/patch/reference/checkpointing.py
  test_command: make patch-test M=l15_megatron_parallel_checkpoint
  status_file: labs/l15_megatron_parallel_checkpoint/patch/.last_run.json
  test_count: 5
  test_kind: checkpoint resume 语义验证

