patch:
  description: |
    实现 crash-safe checkpoint 的最小合同：payload 先写入临时文件并 fsync，
    原子提交为正式 checkpoint，恢复时清理 dangling tmp，并用 latest marker
    找到最近一个已提交 iteration。
  task_md: labs/l16_resume_after_crash/patch/task.md
  starter_file: labs/l16_resume_after_crash/patch/starter/crash_safe.py
  reference_file: labs/l16_resume_after_crash/patch/reference/crash_safe.py
  test_command: make patch-test M=l16_resume_after_crash
  status_file: labs/l16_resume_after_crash/patch/.last_run.json
  test_count: 6
  test_kind: crash-safe checkpoint 行为合同验证
