    - title: 读 load_latest marker
      repo_path: labs/l16_resume_after_crash/patch/reference/crash_safe.py
      lines:
      - 38
      - 50
      note: |
        L38-L45: 没有目录或正式 checkpoint 时返回 None。
        L46-L50: latest marker 指向 step，并转换成 checkpoint 文件名。
    - title: 读 dangling tmp 测试
      repo_path: labs/l16_resume_after_crash/patch/tests/test_patch.py
      lines:
      - 31
      - 40
      note: |
        L31-L40: 模拟 step 3 半写失败，load_latest 必须回到 step 2。
    - title: 读 tracker 准备
      repo_path: github_repo/Megatron-LM/megatron/training/checkpointing.py
      lines:
      - 770
      - 774
      note: |
        L770-L774: checkpoint 保存后才准备更新 latest tracker。
    - title: 读 tracker 写入
      repo_path: github_repo/Megatron-LM/megatron/training/checkpointing.py
      lines:
      - 783
      - 792
      note: |
        L783-L792: finalize 函数把 release 或 iteration 写入 tracker 文件。
    checkpoint_questions:
    - dangling tmp 为什么必须被丢弃？
    - marker 损坏、marker 指向缺失文件、目录为空时分别应该怎么处理？
  - title: Resume state：loss 对齐靠状态完整性
    plain_explanation: |-
      crash-safe 写入只解决文件边界，不能替代状态完整性。要继续同一条训练轨迹，checkpoint 需要保存模型参数、optimizer 动量或二阶矩、step/iteration、RNG state，以及生产系统里的数据消费进度。

      patch 的 loss continuation 测试把问题缩成一个标量权重和一个动量字段。baseline 连续跑完；crash run 中途保存，再加载继续。两条 loss 序列对齐，说明写入和恢复保住了后续计算需要的状态。
    mental_model: 恢复的目标是拿到下一步训练所需的完整上下文，能 forward 的模型只覆盖其中一部分。
    why_it_matters: 只加载 model weights 的 smoke 可以验证权重可读，但不能证明训练从中断点延续。
