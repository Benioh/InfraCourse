lesson:
  opening: |-
    # L17：Crash Resume

    本讲处理训练系统里最朴素也最容易被低估的可靠性问题：作业在 checkpoint 写到一半时崩溃，下一次启动应该从哪个状态继续。

    学完后，你要能把一次 checkpoint 拆成写入阶段、提交阶段和恢复阶段，解释为什么临时文件、fsync、latest marker、optimizer state 和 RNG state 都会影响 resume 结论。
  sections:
  - title: 课程定位：checkpoint 合同后的可靠写入
    plain_explanation: |-
      L16 已经定义了完整 resume 需要保存哪些状态。L17 把视角收窄到写入可靠性：同一份状态如果写到一半就被进程、机器或网络文件系统打断，恢复入口不能误读半成品。

      这讲的 patch 只实现单进程、JSON payload 的最小版本。它不模拟多 rank barrier，也不覆盖远端对象存储，但它把生产系统里最核心的提交边界暴露出来：checkpoint 文件先完整落盘，latest marker 再指向它。
    mental_model: 把 checkpoint 看成一次小事务：prepare 写 tmp，commit rename，recover 清理 tmp 并读取最近 committed 文件。
    why_it_matters: 训练任务中断不可怕，恢复到错误状态才会污染后续实验和算力预算。
    source_refs:
    - title: 读 save_checkpoint 调用
      repo_path: mini_infra/megatron/training/training.py
      lines:
      - 169
      - 176
      note: |
        L169-L176: 训练结束时把 iteration、model、optimizer、scheduler 和 parallel state 交给 save_checkpoint。
    - title: 读 save 输入
      repo_path: mini_infra/megatron/training/checkpointing.py
      lines:
      - 17
      - 24
      note: |
        L17-L24: MiniInfra checkpoint 保存 model、optimizer、scheduler 和 parallel state。
    checkpoint_questions:
    - L16 的完整状态合同和 L17 的 crash-safe 写入合同分别解决什么问题？
    - latest marker 为什么不能早于 checkpoint 文件提交？
  - title: Atomic save：从 tmp 到 committed checkpoint
    plain_explanation: |-
      `atomic_save` 的目标是限制 reader 的视角：它只能看到旧 checkpoint，或看到完整的新 checkpoint。写 tmp 是 prepare；flush/fsync 尽量把文件内容推到存储层；`os.replace` 是 commit。

      同目录 tmp 很关键，因为跨文件系统 rename 可能退化成复制。课程 patch 用 JSON 方便测试，真实框架可能用 `torch.save`、分布式 checkpoint 或对象存储 API，但提交边界仍然要清楚。
    mental_model: reader 不应该参与写入过程；它只读取已经提交的文件和 marker。
    why_it_matters: 半写文件一旦被当成最新 checkpoint，训练恢复会在更隐蔽的位置失败。
    source_refs:
    - title: 读 atomic_save TODO
      repo_path: labs/l16_resume_after_crash/patch/starter/crash_safe.py
      lines:
      - 13
      - 18
      note: |
        L13-L18: starter 把写 tmp、flush/fsync 和 replace 拆成三个 TODO。
    - title: 读 atomic_save
      repo_path: labs/l16_resume_after_crash/patch/reference/crash_safe.py
      lines:
      - 13
      - 24
      note: |
        L13-L16: target 和 tmp 都限制在同一目录。
        L17-L24: 写入、flush、fsync 后用 os.replace 提交。
    - title: 读 atomic save 测试
      repo_path: labs/l16_resume_after_crash/patch/tests/test_patch.py
      lines:
      - 21
      - 28
      note: |
        L21-L28: 测试要求正式文件存在、tmp 消失、payload 可读。
    checkpoint_questions:
    - 为什么 tmp 文件必须和目标文件在同一目录？
    - atomic save 只能保证哪些现象，不能保证哪些存储故障？
  - title: Recover：清理 dangling tmp 并定位 latest
    plain_explanation: |-
      恢复路径先处理上一次失败留下的痕迹。`.tmp` 文件没有经过 commit，不能被加载，也不能被随手改名成正式 checkpoint。清理后，loader 优先相信 latest marker；如果 marker 损坏，教学 patch 回退到编号最大的正式文件。

      生产系统通常会加入 rank 间一致性、远端存储语义、保留策略和异步保存 finalize。你读 Megatron 时要抓住同一个问题：什么时候算保存完成，什么时候可以更新 tracker。
    mental_model: recover 的第一步是丢弃 prepare 阶段残留，只保留 committed 集合。
    why_it_matters: 恢复入口选错 iteration，会让后续 loss、LR schedule 和数据消费数全部偏离。
    source_refs:
    - title: 读 _cleanup_partial
      repo_path: labs/l16_resume_after_crash/patch/reference/crash_safe.py
      lines:
      - 27
      - 35
      note: |
