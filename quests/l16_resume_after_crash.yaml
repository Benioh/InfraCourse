  - title: Lab：从 patch-test 到 crash drill 复盘
    plain_explanation: |-
      本讲先跑 `IMPL=reference make patch-test M=l16_resume_after_crash` 确认最小行为合同，再跑 crash drill 生成端到端 artifact。复盘时不要只写通过或失败，要记录实现版本、seed、crash_at、total_steps、最大相对 loss diff、checkpoint 目录和 latest marker 内容。

      真实项目排查时，把这份记录映射到生产系统：保存完成的日志、tracker 更新时间、目录里是否有半成品、各 rank 的 iteration 是否一致，以及 resume 后的 loss 是否出现跳变。
    mental_model: patch-test 检查函数级合同，drill 检查训练轨迹是否真的接上。
    why_it_matters: 可靠性问题往往不能只靠单个异常定位，artifact 是复盘和复现的共同语言。
    source_refs:
    - title: 读 baseline 与 crash 前半程
      repo_path: labs/l16_resume_after_crash/scripts/run_crash_drill.py
      lines:
      - 73
      - 81
      note: |
        L73-L78: 同 seed 生成完整梯度序列并跑 baseline。
        L80-L81: crash 分支只跑到 crash_at。
    - title: 读 resume 判定
      repo_path: labs/l16_resume_after_crash/scripts/run_crash_drill.py
      lines:
      - 91
      - 102
      note: |
        L91-L96: 恢复状态后继续跑剩余梯度。
        L98-L102: 用相对 loss diff 判定是否通过。
    - title: 读 summary artifact
      repo_path: labs/l16_resume_after_crash/scripts/run_crash_drill.py
      lines:
      - 117
      - 125
      note: |
        L117-L125: artifact 记录实现、最大相对误差和 crash 配置。
    - title: 读 async finalize
      repo_path: github_repo/Megatron-LM/megatron/training/checkpointing.py
      lines:
      - 830
      - 835
      note: |
        L830-L835: async save 把 tracker 更新挂到 finalize，sync save 直接执行。
    checkpoint_questions:
    - patch-test 和 crash drill 分别能证明什么？
    - 如果 loss diff 变大，你会先检查 checkpoint payload、optimizer state、RNG state 还是 marker？
