lesson:
  opening: |-
    # L18：Multimodal Data Collator

    本讲解决多模态训练数据进入模型前的 batch 合同问题：一个 batch 内可能混合文本、图像和音频样本，collator 必须把它们整理成 shape 对齐、字段清楚、能被 forward 检查的张量。
  sections:
  - title: 系统位置：manifest 到 forward 的边界
    plain_explanation: |-
      L18 位于多模态数据主线中间。manifest 负责样本集合和文件路径，dataset/processor 负责单样本读取与预处理，collator 负责 batch 对齐，forward 负责 image/audio encoder 和 embedding replacement。

      这条边界帮助排查问题：缺文件看 manifest，单样本 shape 异常看 dataset，mask 或 batch index 错看 collator，placeholder 数与 encoder 输出数不一致看 forward。
    mental_model: manifest 证明有哪些样本，collator 证明这一批样本怎样摆成矩阵。
    why_it_matters: 多模态训练的错误常跨越数据、模型和恢复状态，先划清层次才能定位。
    source_refs:
    - title: 读图文样本
      repo_path: labs/l17_megatron_multimodal_data/scripts/build_manifest.py
      lines:
      - 4
      - 13
      note: |
        L4-L13: 图文 caption 样本写入 id、task、files 和 split。
    - title: 读任务和文件检查
      repo_path: labs/l17_megatron_multimodal_data/scripts/validate_manifest.py
      lines:
      - 11
      - 19
      note: |
        L11-L19: validator 检查 task 是否允许，并逐个确认文件路径存在。
    checkpoint_questions:
    - manifest、dataset、collator、forward 分别负责哪一层？
    - 缺失 wav 文件时，应该先看哪一个 artifact？
  - title: 主序列：placeholder、padding 和 modal id
    plain_explanation: |-
      每个样本按 `[image tokens][audio tokens][text ids]` 生成主序列。`attention_mask` 只回答位置是否有效；`modal_type_ids` 回答有效位置来自哪类模态。padding 和真实文本的 modal 值都可以是 0，所以判断 padding 必须同时看 attention mask。

      实现时先按样本构造 ids/modal，再 pad 到 batch 内最大长度。这样可以避免边扩矩阵边写字段导致的 off-by-one。
    mental_model: 主序列排座位，modal type 贴来源标签，attention mask 标记座位是否有人。
    why_it_matters: 主序列错位会让后续 embedding replacement 写到错误位置，训练可能不报 shape 错但监督信号已经污染。
    source_refs:
    - title: 读 per-sample 初始化
      repo_path: labs/l17_megatron_multimodal_data/patch/reference/multimodal_collate.py
      lines:
      - 27
      - 34
      note: |
        L27-L34: 每个样本先独立构造 ids 和 modal 两条等长 list。
    - title: 读 batch 表
      repo_path: labs/l17_megatron_multimodal_data/patch/reference/multimodal_collate.py
      lines:
      - 44
      - 52
      note: |
        L44-L52: 创建 `(B,S)` 表，并按每行有效长度填入张量。
    - title: 读 mixed batch shape
      repo_path: labs/l17_megatron_multimodal_data/patch/tests/test_patch.py
      lines:
      - 98
      - 104
      note: |
        L98-L104: 最长样本决定 `S=19`。
    - title: 读 padding 测试
      repo_path: labs/l17_megatron_multimodal_data/patch/tests/test_patch.py
      lines:
      - 115
      - 126
      note: |
        L115-L126: padding 位置要同时满足 attention False、PAD id、modal 0。
    checkpoint_questions:
    - mixed batch 中 `S` 由哪一行决定？
    - 为什么 `modal_type_ids=0` 不能单独证明某个位置是真实文本？
  - title: Side channel：图像、音频和 batch indices
    plain_explanation: |-
      图像和音频的真实内容走 side channel。`pixel_values` 只 stack 有图样本，`image_batch_indices` 记录这些图来自原 batch 的哪一行。音频先截断到 `max_audio_frames`，再 pad 到固定 shape，并用 `audio_mask` 标记真实帧。

      主序列里的 image/audio token 是占位，真实内容要等 encoder 输出后替换进 embedding。
    mental_model: 主序列是索引表，side tensors 是真实货物，batch indices 是回填地址。
    why_it_matters: side tensor 顺序错一位，模型可能把 A 样本的图片写进 B 样本上下文。
    source_refs:
    - title: 读 image collation
      repo_path: labs/l17_megatron_multimodal_data/patch/reference/multimodal_collate.py
      lines:
      - 54
      - 64
      note: |
        L54-L64: image side tensor 只包含真实图像，顺序由 `image_batch_indices` 解释。
    - title: 读 audio pad 和 mask
      repo_path: labs/l17_megatron_multimodal_data/patch/reference/multimodal_collate.py
      lines:
      - 79
      - 89
      note: |
        L79-L89: `audio_features` pad 到上限，`audio_mask` 只标记真实帧。
    - title: 读 audio truncation
      repo_path: labs/l17_megatron_multimodal_data/patch/tests/test_patch.py
      lines:
      - 129
      - 141
      note: |
        L129-L141: 超长音频截断后主序列 audio token 数等于上限。
    - title: 读 image indices assert
      repo_path: labs/l17_megatron_multimodal_data/patch/tests/test_patch.py
      lines:
      - 154
      - 158
      note: |
        L154-L158: `pixel_values` 的顺序必须与 `image_batch_indices` 一致。
    checkpoint_questions:
    - '`pixel_values` 为什么不需要补到 batch 大小 `B`？'
    - 音频 padding 帧为什么不生成 `AUDIO_TOKEN_ID`？
  - title: 真实框架：TaskEncoder、packing 和 dataloader state
    plain_explanation: |-
      Megatron multimodal 示例把 L18 的简化合同扩展成真实训练字段。TaskEncoder 处理 image tag、tokenize、image tile、labels 和 total length。batch 阶段 stack images、pad tokens/labels，并保留 packed length metadata。

      真实 dataloader 还要处理 rank gating 和恢复状态。训练从 checkpoint 恢复时，dataloader state 决定是否重复读或漏读样本。
    mental_model: L18 patch 是 batch 合同缩小图，Megatron TaskEncoder 是生产版同构问题。
    why_it_matters: 真训练的 bug 不一定出现在 collator；packing、rank、worker 和 resume state 都可能改变样本顺序。
    source_refs:
    - title: 读总长度
      repo_path: github_repo/Megatron-LM/examples/multimodal/dataset_helpers.py
      lines:
      - 195
      - 200
      note: |
        L195-L200: 总长度由文本 token 和 image tiles 共同决定。
    - title: 读一致性检查
