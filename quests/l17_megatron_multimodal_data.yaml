    checkpoint_questions:
    - Megatron 在哪里检查 image token 数和 image tile 数一致？
    - resume 后重复读样本时，为什么要先查 dataloader state？
  - title: Lab 验收：patch-test 和 smoke 分层看
    plain_explanation: |-
      patch-test 验证 collator 的函数级合同：主序列、mask、side tensors、batch indices 和音频截断。smoke 验证 toy 数据集合：manifest 是否可读、shard 成员是否完整、loader 是否能拿到样本 key。

      两类验证不能互相替代。patch-test 不证明 shard 和 worker 没问题；smoke 也不证明每个 `modal_type_ids` 都写对。
    mental_model: patch-test 看 batch 内字段，smoke 看数据集合和 artifact。
    why_it_matters: 多模态数据问题容易被一个通过的局部测试掩盖，分层验收能保留明确证据。
    source_refs:
    - title: 读前置脚本
      repo_path: labs/l17_megatron_multimodal_data/scripts/run_multimodal_data_lab.py
      lines:
      - 50
      - 58
      note: |
        L50-L58: 依次生成 toy raw files、manifest、shard 和 batch preview。
    - title: 读 metrics
      repo_path: labs/l17_megatron_multimodal_data/scripts/run_multimodal_data_lab.py
      lines:
      - 83
      - 94
      note: |
        L83-L94: rows、missing、shard_count 和 sample_count 进入 metrics。
    - title: 读成员写入
      repo_path: labs/l17_megatron_multimodal_data/scripts/build_webdataset_shards.py
      lines:
      - 11
      - 20
      note: |
        L11-L20: 每个样本写 metadata，并把所有 files 加入同一个 shard。
    checkpoint_questions:
    - patch-test 和 smoke 各自证明什么？
    - 如果 patch-test 通过但 smoke 显示 missing files，下一步查哪里？
