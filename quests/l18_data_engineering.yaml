lesson:
  opening: |-
    # L19：Data Engineering - MinHash, WebDataset, Shard Resume

    本讲把训练前的数据工程拆成三层：内容质量、供给性能和容灾恢复。MinHash 负责找近重复文本，WebDataset-style pipeline 负责把 shard 顺序送到 worker，shard resume 负责坏数据和重启后的顺序。
  sections:
  - title: 系统位置：数据质量、供给和容灾
    plain_explanation: L19 接在 L18 的 collator 后面。collator 处理单个 batch 的字段合同；L19 处理数据集级问题：哪些文本重复，哪些 shard 影响吞吐，坏 shard 出现时是否能记录跳过和恢复位置。
    mental_model: 质量决定训练什么，供给决定训练能否喂满 GPU，容灾决定重启后是否还在同一条数据轨迹上。
    why_it_matters: 数据问题经常不抛异常，只会在训练效率、eval 泄漏或样本重复读中出现。
    source_refs:
    - title: 读 pipeline 输出
      repo_path: mini_infra/data/wds_pipeline.py
      lines:
      - 57
      - 67
      note: |
        L57-L67: 输出吞吐、p99 latency、dedup_ratio、recovery 和 duplicate pairs。
    checkpoint_questions:
    - L19 为什么不能只讲 MinHash 算法？
    - '`dedup_ratio` 和 `wds_throughput_mbs` 分别回答什么问题？'
  - title: MinHash：从文本到固定长度签名
    plain_explanation: MinHash 先把文本切成 shingle 集合，再用多组稳定哈希函数生成固定长度 signature。两个集合 Jaccard 越高，它们在同一维签名上相同的概率越高。`num_perm` 越大，估计越稳，计算和存储成本也越高。
    mental_model: 每个签名维度是一次稳定抽样，签名相同位置比例近似 Jaccard。
    why_it_matters: 大规模数据不能保存和比较完整 shingle 集合，固定长度签名让近重复检测可落地。
    source_refs:
    - title: 读 base hashes
      repo_path: labs/l18_data_engineering/patch/reference/dedup_minhash.py
      lines:
      - 24
      - 31
      note: |
        L24-L31: 文本先变成 shingles，再变成稳定整数哈希。
    - title: 读 signature loop
      repo_path: labs/l18_data_engineering/patch/reference/dedup_minhash.py
      lines:
      - 32
      - 37
      note: |
        L32-L37: 每个维度使用一组 `(a,b)`，取 transformed hash 最小值。
    checkpoint_questions:
    - 为什么不能用 Python 内置 `hash()` 做基础哈希？
    - '`num_perm` 增大时成本怎样变化？'
  - title: Dedup：first-occurrence 和阈值审计
    plain_explanation: |-
      本 patch 的 dedup 从前往后扫描，当前样本和任一已保留样本的估计 Jaccard 达到阈值时就丢弃。它返回保留索引，方便上游 manifest、caption 文件和训练日志保持对应关系。

      阈值不能只凭感觉定。真实数据要抽样查看 detected pairs，按语言、长度和来源分桶统计误删和漏删。
    mental_model: keep list 是已入库样本；新样本只要和已入库样本足够像，就不再进入 keep list。
    why_it_matters: 去重会改变训练数据分布，误删正常样本会伤害多样性。
    source_refs:
    - title: 读 dedup 初始化
      repo_path: labs/l18_data_engineering/patch/reference/dedup_minhash.py
      lines:
      - 48
      - 56
      note: |
        L48-L56: 先计算所有签名，再准备 keep indices 和 keep signatures。
    - title: 读 dedup 逻辑
      repo_path: labs/l18_data_engineering/patch/reference/dedup_minhash.py
      lines:
      - 57
      - 62
      note: |
        L57-L62: first-occurrence 策略保留第一个未撞上阈值的样本。
    - title: 读 exact dedup
      repo_path: labs/l18_data_engineering/patch/tests/test_patch.py
      lines:
      - 52
      - 60
      note: |
        L52-L60: 完全重复样本按 first occurrence 保留索引 `[0, 2]`。
    checkpoint_questions:
    - 为什么 dedup 返回索引比返回文本更适合数据管线？
    - dedup ratio 异常偏高时先检查哪些配置？
  - title: Shard pipeline：吞吐、detshuffle 和恢复
    plain_explanation: 文本去重结果最终要回到 manifest 或 shard。WDS pipeline 关心 worker、prefetch、shard 顺序和坏 shard 处理。detshuffle 让固定 seed
      下的 shard 顺序可复现；recovery_plan 记录 corrupt shard、lost samples 和 resume cursor。
    mental_model: MinHash 管内容相似，WDS 管数据供给，shard resume 管顺序和故障边界。
    why_it_matters: 数据慢会让 GPU 等待，坏 shard 静默跳过会改变训练样本集合。
    source_refs:
    - title: 读 pipeline 状态
      repo_path: mini_infra/data/wds_pipeline.py
      lines:
      - 51
      - 56
      note: |
        L51-L56: detshuffle、corrupt shard、recovery 和 dedup 都在同一条路径里计算。
    - title: 读 recovery 扫描
      repo_path: mini_infra/data/shard_resume.py
      lines:
      - 41
      - 51
      note: |
        L41-L51: cursor 前 shard 和 corrupt shard 分别进入 skipped 列表。
    - title: 读 detshuffle
      repo_path: mini_infra/data/shard_resume.py
      lines:
      - 62
      - 67
      note: |
        L62-L67: detshuffle 用 seed 和 shard 名生成稳定排序 key。
    checkpoint_questions:
    - 重启后重复读样本时，应该先查 cursor 还是 MinHash threshold？
    - worker 和 prefetch 变化主要影响哪个指标？
  - title: 验收：patch-test、notebook 和 smoke artifact
    plain_explanation: patch-test 只验证函数级合同。notebook 用于观察 `num_perm`、threshold 和 shingle 宽度的影响。smoke 生成 WDS throughput、dedup
      report 和 shard recovery artifact，用来判断数据链路是否能进入训练。
    mental_model: patch-test 查算法函数，notebook 查参数直觉，smoke 查系统证据。
    why_it_matters: 去重错误和数据供给错误都可能静默改变训练结果，必须留下可复查 artifact。
    source_refs:
    - title: 读 run_smoke
      repo_path: labs/l18_data_engineering/scripts/run_smoke.py
      lines:
      - 13
      - 20
      note: |
        L13-L20: CLI 将 run id 和 mode 传给 `run_half_mission`。
    - title: 读 bench CLI
      repo_path: labs/l18_data_engineering/scripts/bench_wds.py
      lines:
      - 12
      - 22
      note: |
        L12-L22: workers 和 prefetch 参数进入 `simulate_pipeline`，结果以 JSON 打印。
    checkpoint_questions:
    - patch-test 和 smoke 各自证明什么？
    - smoke artifact 中哪些字段能说明坏 shard 被记录下来？
