patch:
  description: |
    实现 `minhash_signature`、`jaccard_estimate` 和 `dedup`：
    用 char-level shingle 和多组稳定哈希生成签名，用签名相同位置比例估计 Jaccard，
    再按 first-occurrence 策略返回保留索引。
  task_md: labs/l18_data_engineering/patch/task.md
  starter_file: labs/l18_data_engineering/patch/starter/dedup_minhash.py
  reference_file: labs/l18_data_engineering/patch/reference/dedup_minhash.py
  test_command: make patch-test M=l18_data_engineering
  status_file: labs/l18_data_engineering/patch/.last_run.json
  test_count: 5
  test_kind: MinHash 去重行为合同验证
