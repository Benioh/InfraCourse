patch:
  description: |
    实现 Locally Typical Sampling 的 logits filter：从 logits 计算概率、surprisal、
    entropy 和 typicality distance，按 distance 排序后用累计概率截断候选集合。
  task_md: labs/l19_vllm_serving_baseline/patch/task.md
  starter_file: labs/l19_vllm_serving_baseline/patch/starter/typical_p.py
  reference_file: labs/l19_vllm_serving_baseline/patch/reference/typical_p.py
  test_command: make patch-test M=l19_vllm_serving_baseline
  status_file: labs/l19_vllm_serving_baseline/patch/.last_run.json
  test_count: 5
  test_kind: Typical-p logits filter 行为合同验证

