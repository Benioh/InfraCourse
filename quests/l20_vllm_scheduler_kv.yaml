        - finished 请求需要同时更新哪几处状态？

    - title: 真实 vLLM：token budget、prefix cache、chunked prefill 和 preemption
      plain_explanation: |
        真实 vLLM 的 scheduler 使用更通用的 token 进度模型。源码注释里说，scheduler 关注 `num_computed_tokens` 追赶 `num_tokens_with_spec`。这样可以统一表示普通 prefill、chunked prefill、decode、spec decode 和 prefix cache 命中。

        真实系统还要同时管理 token budget 和 KV block budget。Token budget 限制本 step 的计算量，KV block budget 限制历史上下文显存。prefix cache 可以复用已有前缀的 KV；chunked prefill 可以把长 prompt 切成多步，避免长请求独占 step；preemption 可以在 KV 压力下把 running 请求临时移回 waiting，释放资源并等待后续重算。
      mental_model: |
        教学版看状态，真实 vLLM 看 token 进度和资源预算。状态机让你入门，token 进度模型让生产系统能覆盖更多优化。
      why_it_matters: |
        读真实源码时，很多分支都围绕同一个目标展开：在有限 token budget 和 KV budget 下推进请求，同时控制尾延迟和重算成本。
      source_refs:
        - repo_path: github_repo/vllm/vllm/v1/core/sched/scheduler.py
          lines: [352, 362]
          title: 真实 Scheduler 的 token catch-up 模型
          note: |
            L352: `schedule()` 是真实调度器单步入口。
            L353-L354: 真实 scheduler 不固定使用 prefill/decode phase 标签。
            L355-L357: 每个请求维护 computed tokens 和 tokens with spec。
            L358-L360: 本 step 分配 token，让 computed 追赶 tokens with spec。
            L361-L362: 这个模型覆盖 chunked prefill、prefix cache 和 spec decode。
        - repo_path: github_repo/vllm/vllm/v1/core/sched/scheduler.py
          lines: [744, 756]
          title: 真实 vLLM：完整序列容量检查
          note: |
            L744-L746: 如果要求保留完整输入长度，先检查完整序列容量。
            L747-L752: 检查 request、prefix 命中、外部 KV 和 encoder token。
            L753-L756: 放不下时释放 encoder cache，并停止 admit。
        - repo_path: github_repo/vllm/vllm/v1/core/sched/scheduler.py
          lines: [758, 769]
          title: 真实 vLLM：allocate_slots
          note: |
            L758-L767: 容量检查通过后，才调用 `allocate_slots` 分配 KV blocks。
            L758-L760: request 和本 step 新 token 数进入 KV 分配函数。
            L761-L764: prefix 命中、lookahead、外部 KV 都影响分配。
            L765-L767: 异步 KV load 和 encoder token 也会进入分配参数。
            L769: `new_blocks is None` 表示当前请求不能被调度。
        - repo_path: github_repo/vllm/vllm/v1/core/sched/scheduler.py
          lines: [971, 980]
          title: preempt_request
          note: |
            L971-L973: 只有 RUNNING 请求可以被抢占。
            L974-L975: 抢占先释放 KV cache 和 encoder cache。
            L976-L977: 状态改为 `PREEMPTED`，已计算 token 清零。
            L978-L980: 清理 spec token，并记录抢占次数。
        - repo_path: github_repo/vllm/vllm/v1/core/sched/scheduler.py
          lines: [984, 985]
          title: preempt_request 回队列
          note: |
            L984-L985: 请求放回 waiting 队列，等待后续重算。
        - repo_path: github_repo/vllm/vllm/v1/core/sched/output.py
          lines: [178, 187]
          title: SchedulerOutput
          note: |
            L178-L183: `scheduled_new_reqs` 表示首次调度的新请求，worker 需要缓存其请求数据。
            L184-L187: `scheduled_cached_reqs` 表示 worker 已知道的请求，只发送增量。
        - repo_path: github_repo/vllm/vllm/v1/core/sched/output.py
          lines: [189, 191]
          title: SchedulerOutput token 数
          note: |
            L189-L191: `num_scheduled_tokens` 给出每个请求本 step 处理多少 token。
      common_confusions:
        - 到真实源码里寻找固定的 prefill/decode 二分，忽略 token 进度模型。
        - 把 token budget 和 KV block budget 混为一谈。
      checkpoint_questions:
        - "`num_computed_tokens` 追赶 `num_tokens_with_spec` 能覆盖哪些优化？"
        - preemption 为什么会影响 TTFT 尾部和吞吐？

    - title: Drill 与课后产物：把指标和源码连起来
      plain_explanation: |
        patch test 只证明函数合同，drill 用合成 workload 暴露服务形状。`run_serving_drill.py` 会记录 waiting 长度、KV usage、scheduled_prefill、scheduled_decode_count、finished、TTFT 和 ITL。读这些指标时，要把它们放回 scheduler 状态机里解释：waiting 增长通常说明 admission 受限，KV usage 接近 1.0 说明显存块紧张，finished 增长但 usage 不降说明释放路径要检查。

        完成本讲后，建议填写 `outputs/serving_metrics_template.md`，再用 `outputs/debug_checklist.md` 做一次自查。`outputs/source_reading_card.md` 用来复习 MiniInfra 和真实 vLLM 的源码主路径。
      mental_model: |
        指标是调度器的体征。TTFT 看首轮放行，ITL 看 decode 节奏，KV usage 看显存压力，waiting 看资源是否卡住队列。
      why_it_matters: |
        学完一节课要能留下可复用的排查方法。下一次真实服务变慢时，这些产物可以直接拿来定位问题。
      source_refs:
        - repo_path: labs/l20_vllm_scheduler_kv/scripts/run_serving_drill.py
          lines: [121, 129]
          title: drill decode tick
          note: |
            L121: 每个 step 调用 scheduler，拿到调度结果。
            L124-L127: 对 `scheduled_decode` 中的 running 请求追加一个 token。
            L128-L129: 首次 decode step 用来计算 TTFT，decode 次数用来计算 ITL。
        - repo_path: labs/l20_vllm_scheduler_kv/scripts/run_serving_drill.py
          lines: [131, 137]
          title: drill waiting / KV pressure
          note: |
            L131-L132: 记录 finished 请求的完成 step。
            L134-L135: 每步记录 waiting 长度和 KV usage。
            L136-L137: 高 KV usage 下 waiting 增长，说明 admission 真的受压。
      common_confusions:
        - patch-test 通过后就结束，没有把指标和生产排查联系起来。
        - 只看 requests/sec，不看 TTFT、ITL、waiting 和 KV usage 的组合。
      checkpoint_questions:
        - 如果 KV usage 很高且 waiting 持续增长，你会先检查哪些字段？
        - drill 结果如何转化成一次真实服务排查 checklist？
