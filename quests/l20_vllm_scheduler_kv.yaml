lesson:
  opening: |
    # 第 21 讲：vLLM Scheduler 与 KV Block Manager

    这一讲讲推理服务的控制面。一个请求到达 OpenAI-compatible API 后，还要经过 engine、scheduler、KV manager 和 worker，才能真正生成 token。scheduler 每一步都要决定哪些请求进入 prefill，哪些请求继续 decode，哪些请求完成并释放 KV cache。KV Cache Manager 负责记录显存块归属，两者共同决定 TTFT、ITL、吞吐、waiting queue 和 KV pressure。

    新版课程按“系统地图 → 主讲义 → 源码带读 → notebook → quiz → patch → drill → 课后产物”的顺序组织。lab 只检查最小合同：请求如何从 waiting 进入 running，KV block 如何分配，running 请求如何进入 decode，finished 请求如何释放 KV。
  sections:
    - title: 课程定位：先看系统，再写 patch
      plain_explanation: |
        L21 属于 Serving control plane。它连接 L20 的服务入口和后续 SGLang、Spec Decode、PD 分离与观测课程。学习这节课时，先读 `system_map.md`，把 OpenAI facade、LLMEngine、Scheduler、KVCacheManager、Worker 的位置放进同一张图；再读 `lecture.md`，按问题、机制、源码和生产排查的顺序理解；最后用 `source_walkthrough.md` 带着问题读源码。

        这节课的 patch 很小。它不是课程主体，只是检查你是否掌握了请求生命周期和 KV 资源合同。写代码前，应该能完整讲出这条链：`prompt length -> blocks_needed -> allocate_slots -> running admission -> scheduled_decode -> output token -> finished -> free KV blocks`。
      mental_model: |
        把 vLLM serving 想成一个调度台：入口收工单，engine 驱动循环，scheduler 决定本轮谁能动，KV manager 管显存车位，worker 执行模型计算。
      why_it_matters: |
        真实 vLLM 源码分支很多。先建立系统地图，再看主路径，学生更容易分清主线、扩展功能和暂时可以跳过的细节。
      common_confusions:
        - 直接打开 patch 猜测试，跳过系统位置和请求生命周期。
        - 把 HTTP 入口、engine loop、scheduler 和 worker 混成一层。
      checkpoint_questions:
        - L21 在 Serving 章里解决的是协议入口、控制面、执行层，还是采样算法？
        - 写 patch 前，你能否画出请求从 API 到 KV manager 的路径？

    - title: 问题入口：为什么 HTTP 200 了，首 token 还很慢
      plain_explanation: |
        线上 serving 问题经常表现为：HTTP 请求都返回 200，GPU 利用率也不低，但用户等待首 token 的时间变长，waiting queue 增长，KV cache usage 接近上限。这个时候只看 HTTP 层或 GPU 利用率无法解释问题。请求到达入口，只说明服务接住了请求；它是否被 scheduler admit、是否拿到 KV block、是否已经完成 prefill，还要继续往下看。

        这节课从这个现象进入。TTFT 变慢时，要把请求生命周期拆成 queue、tokenization、prefill、KV admission、decode 和 output processing。L21 主要讲 queue、scheduler admission 和 KV pressure 三个环节。
      mental_model: |
        HTTP 200 像前台收到了订单；首 token 慢通常发生在后厨排队、拿不到工位、或者前一道工序占满资源。
      why_it_matters: |
        只看吞吐或 HTTP 状态，很容易把调度问题误判成模型计算慢。拆开请求生命周期，排查才有方向。
      common_confusions:
        - HTTP 请求成功就等于请求已经开始生成。
        - GPU 忙就等于每个请求都公平拿到了 first token。
      checkpoint_questions:
        - TTFT 升高时，你会先看 waiting queue、KV usage，还是只看 requests/sec？
        - HTTP 层和 scheduler 层分别能证明什么？

    - title: 请求路径：OpenAI API 到 Engine，再到 Scheduler
      plain_explanation: |
        MiniInfra 的 OpenAI facade 把 chat messages 拼成 prompt，然后调用 `LLMEngine.add_request`。Engine 内部持有 `KVCacheManager` 和 `Scheduler`。每次 `step()` 时，engine 调用 `scheduler.schedule()`，再给 `scheduled_decode` 里的 running 请求追加一个 token。完成请求会被包装成 `RequestOutput`。

        真实 vLLM 的外层 `LLMEngine.add_request` 会把 raw prompt 或 EngineInput 处理成内部 request，交给 EngineCore；`step()` 从 EngineCore 拿输出，再交给 output processor 生成用户可见的输出。主线依然清楚：入口整理请求，engine 驱动循环，scheduler 决定本 step 的执行计划。
      mental_model: |
        请求像一张工单：入口登记工单，engine 推动工单流转，scheduler 决定本轮哪些工单进入加工区。
      why_it_matters: |
        读源码时先分清层次，才知道 TTFT、ITL、waiting、KV usage 分别应该在哪个边界观察。
      source_refs:
        - repo_path: mini_infra/vllm/entrypoints/openai/api_server.py
          lines: [18, 22]
          title: MiniInfra OpenAI-compatible facade
          note: |
            L18: 把 chat messages 拼成内部 prompt。
            L19: 把 request id、prompt、`max_tokens` 交给 engine。
            L20: 准备保存 engine 每步输出。
            L21-L22: 只要 engine 还有未完成请求，就持续调用 `step()`。
        - repo_path: mini_infra/vllm/v1/engine/llm_engine.py
          lines: [30, 36]
          title: MiniInfra LLMEngine
          note: |
            L30: `step()` 是 engine 单步驱动入口。
            L31: 先调用 scheduler，拿到本 step 的调度结果。
            L32: engine 只处理 `scheduled_decode` 中的请求。
            L33-L35: running 里找不到请求时跳过，避免 finished 请求继续生成。
            L36: 给当前请求追加一个 token，模拟 decode tick。
        - repo_path: github_repo/vllm/vllm/v1/engine/llm_engine.py
          lines: [241, 252]
          title: 真实 vLLM：raw input 转内部 request
          note: |
            L241: 调用 input processor，进入内部请求构造层。
            L242-L244: request id、prompt 和 params 是最小输入。
            L245-L250: task、arrival time、LoRA、tokenization、trace、priority 都进入 request。
            L252: 提取 prompt text，output processor 后面要用。
        - repo_path: github_repo/vllm/vllm/v1/engine/llm_engine.py
          lines: [263, 268]
          title: 真实 vLLM：单请求进入 EngineCore
          note: |
            L263: `n == 1` 走单请求主路径。
            L265: output processor 建立这个请求的输出状态。
            L267: request 交给 EngineCore，后续调度在 core 内发生。
            L268: 返回 request id 给上层调用方。
      common_confusions:
        - 把 OpenAI API 层当成调度器。
        - 把 `RequestOutput` 当成 scheduler 的输入，它实际是输出处理后的结果形状。
      checkpoint_questions:
        - MiniInfra 中哪一层调用 `scheduler.schedule()`？
        - 真实 vLLM 外层 `LLMEngine.step()` 为什么只看到 EngineCore output？

    - title: 核心机制：Prefill、Decode、TTFT、ITL 和 KV Cache
      plain_explanation: |
        Prefill 阶段处理完整 prompt，计算 hidden states，并为 attention 生成 key/value。长 prompt 会增加 prefill 计算和 KV 写入，所以经常推高 TTFT。Decode 阶段每次生成一个新 token，只计算新 token，同时读取历史上下文对应的 KV cache。decode 的单步计算较小，但访存、batch 组织和调度节奏会影响 ITL。

        KV cache 保存 attention 的 key/value 张量，减少 decode 阶段的重复计算。它也带来显存成本，显存随并发请求数、上下文长度、层数、KV head 数、head_dim 和 dtype bytes 增长。模型参数装得下，只说明静态权重能放进显存；KV cache 会随请求动态增长，常常成为 serving 并发上限。
      mental_model: |
        Prefill 像把整份资料读完并做索引；decode 像每次写一个新字时翻索引。索引越大，后续写作越省计算，但桌面空间占得越多。
      why_it_matters: |
        TTFT、ITL 和 KV usage 是一组联动指标。长 prompt、高并发、大上下文会把问题从模型计算推向调度和显存管理。
      source_refs:
        - repo_path: mini_infra/vllm/v1/core/kv_cache_manager.py
          lines: [24, 27]
          title: MiniInfra KV usage
          note: |
            L24-L27: `usage` 统计 owner 非空的 block 占比，是 KV pressure 的最小指标。
            L24-L25: `usage` 作为属性暴露给 scheduler/drill。
            L26: owner 非空说明该 block 已被请求占用。
            L27: 使用率归一化到 0 到 1。
        - repo_path: mini_infra/vllm/v1/core/kv_cache_manager.py
          lines: [29, 38]
          title: MiniInfra allocate_slots
          note: |
            L29: `allocate_slots` 按 request id 和 block 数申请资源。
            L30-L31: 负数 block 是调用错误，直接拒绝。
            L32: 找出当前所有空闲 block。
            L33-L34: 空闲 block 不足时显式失败。
            L35-L38: 成功时写入 owner，并返回分配到的 block id。
      common_confusions:
        - KV cache 是文本缓存。它实际保存 attention key/value 张量。
        - 参数显存装得下，服务并发就一定够。KV cache 会随请求长度和并发动态增长。
      checkpoint_questions:
        - 长 prompt 更直接影响 TTFT 还是 ITL？原因是什么？
        - KV cache 为什么既能加速 decode，又会限制并发？

    - title: 调度主线：waiting、running、finished 和 admission
      plain_explanation: |
        教学版 scheduler 用三张表讲清主线。`waiting` 保存已经进入系统但还没有拿到运行资源的请求；`running` 保存已经拿到 KV block、可以参与本 step 的请求；`finished` 保存生成完成、需要返回输出并释放资源的请求。

        admission 有两道门。第一道门是 running 数量，`len(running) < max_num_running_reqs`；第二道门是 KV block，教学版用 prompt token 数估算 `blocks_needed`。KV block 分配成功后，请求才从 waiting 移到 running。分配失败时，请求留在 waiting，等待后续 step 有请求完成并释放 block。
      mental_model: |
        waiting 是排队区，running 是已经拿到车位的活跃区，finished 是完成归档区。admission 就是入口闸机。
      why_it_matters: |
        这三张表能解释大量 serving 故障：waiting 增长说明 admission 卡住，running 不减少说明完成或释放逻辑可能有问题，KV usage 只涨不降说明 free 路径需要检查。
      source_refs:
        - repo_path: mini_infra/vllm/v1/core/sched/scheduler.py
          lines: [46, 57]
          title: MiniInfra Scheduler admission
          note: |
