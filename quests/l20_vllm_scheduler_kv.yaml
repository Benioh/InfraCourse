  test_count: 5
  test_kind: 调度资源语义验证

source_reading:
  - title: MiniInfra LLMEngine
    repo_path: mini_infra/vllm/v1/engine/llm_engine.py
    focus: add_request、step、RequestOutput 生命周期
    highlights:
      - title: Engine 持有 KV manager 和 scheduler
        lines: [20, 23]
        note: |
          L20: engine 初始化时接收 running 上限和 KV block 总量。
          L21: 创建 `KVCacheManager`，把显存资源账本放到 engine 里。
          L22: 创建 `Scheduler`，并把 KV manager 传进去，调度器才能做 admission。
          L23: `outputs` 保存 request id 到可返回结果的映射。
      - title: step 使用 SchedulerOutput 推进 decode
        lines: [30, 36]
        note: |
          L30: `step()` 是 engine 的单步驱动入口。
          L31: 先调用 `scheduler.schedule()`，让 scheduler 决定本 step 处理谁。
          L32: 只遍历 `scheduled_decode`，说明 engine 不自行挑请求。
          L33-L35: running 里找不到请求就跳过，finished 或已删除请求不会继续生成。
          L36: 给被调度的请求追加一个 token，模拟一次 decode tick。
  - title: MiniInfra Scheduler
    repo_path: mini_infra/vllm/v1/core/sched/scheduler.py
    focus: waiting/running/finished、admission、decode、finished 释放
    highlights:
      - title: add_request 只入队
        lines: [38, 40]
        note: |
          L38: `add_request` 接收内部 `Request`。
          L39: 教学版用 `prompt.split()` 得到 prompt token 数，用来估算 KV block。
          L40: 新请求只进入 `waiting`，此时不占 KV block。
      - title: admission 双门
        lines: [46, 57]
        note: |
          L46: 只有 waiting 非空且 running 未满时才尝试 admit。
          L47: 先查看队首请求，不立刻弹出，避免资源不足时丢请求。
          L48: 用 prompt token 数估算需要多少 KV block。
          L49-L52: 调用 KV manager 分配 block，成功后才有运行资源。
          L53-L54: KV 不足时停止 admit，请求继续留在 waiting。
          L55-L57: 分配成功后，从 waiting 移到 running，并记录本 step 的 prefill。
      - title: finished 释放闭环
        lines: [58, 66]
        note: |
          L58: 复制 running items，后面可以安全删除 running 请求。
          L59: 输出 token 达到 `max_tokens`，请求进入完成路径。
          L60: 写入 `finished`，保留完成请求的结果状态。
          L61: 释放该请求占用的 KV blocks。
          L62-L63: 从 running 删除，并把 request id 写入本 step 输出。
          L64-L65: 未完成请求进入 `scheduled_decode`。
          L66: 返回本 step 的调度结果。
  - title: MiniInfra KVCacheManager
    repo_path: mini_infra/vllm/v1/core/kv_cache_manager.py
    focus: KV block owner、allocate_slots、free、snapshot
    highlights:
      - title: usage 是已占 block 比例
        lines: [24, 27]
        note: |
          L24-L25: `usage` 暴露 KV cache 使用率。
          L26: 统计 owner 非空的 block 数。
          L27: 除以总 block 数，得到 0 到 1 之间的压力指标。
      - title: allocate_slots 的资源合同
        lines: [29, 38]
        note: |
          L29: 按 request id 和 block 数申请 KV slot。
          L30-L31: 负数 block 是调用错误，直接拒绝。
          L32: 找出所有 owner 为空的 block。
          L33-L34: 空闲块不足时显式失败。
          L35: 取前 `num_blocks` 个空闲块。
          L36-L37: 写入 owner，建立 block 到 request 的归属。
          L38: 返回 block id，供 request 记录自己占用的 KV。
  - title: vLLM LLMEngine
    repo_path: github_repo/vllm/vllm/v1/engine/llm_engine.py
    focus: add_request、step、RequestOutput 生命周期
    highlights:
      - title: raw input 转内部 request
        lines: [241, 252]
        note: |
          L241: raw prompt 进入 input processor。
          L242-L244: request id、prompt、sampling/pooling 参数一起参与内部 request 构造。
          L245: supported task 约束这次请求能走哪类模型任务。
          L246-L250: arrival time、LoRA、tokenization、trace、priority 等生产字段进入请求。
          L252: 提取 prompt text，后续 output processor 需要它维护输出状态。
      - title: 单请求进入 EngineCore
        lines: [263, 268]
        note: |
          L263: `n == 1` 走单请求主路径。
          L265: output processor 先建立请求输出状态。
          L267: request 交给 EngineCore，后续调度在 core 内发生。
          L268: 返回 request id 给上层。
  - title: vLLM Scheduler
    repo_path: github_repo/vllm/vllm/v1/core/sched/scheduler.py
    focus: token budget、waiting/running、preemption 和调度输出
    highlights:
      - title: token catch-up 调度模型
        lines: [352, 362]
        note: |
          L352: `schedule()` 是真实调度器单步入口。
          L353-L354: 源码说明真实 scheduler 不固定区分 prefill/decode phase。
          L355-L357: 每个请求维护 computed tokens 和 tokens with spec。
          L358-L360: 本 step 分配 token，让 computed 追赶 tokens with spec。
          L361-L362: 这个模型覆盖 chunked prefill、prefix cache、spec decode 和未来优化。
      - title: waiting admission 的 KV 容量检查
        lines: [744, 756]
        note: |
          L744-L746: 开启完整输入长度保留时，admission 要先问 KV manager。
          L747-L752: 检查当前请求、已计算 token、prefix 命中、外部 KV、encoder token。
          L753-L756: 完整序列放不下时释放 encoder cache，并停止 admit。
      - title: waiting admission 的 KV 分配
        lines: [758, 769]
        note: |
          L758-L767: 容量检查通过后才调用 `allocate_slots` 分配真实 KV blocks。
          L758-L760: request 和本 step 新 token 数进入 KV 分配函数。
          L761-L764: prefix 命中、lookahead、外部 KV 都影响分配。
          L765-L767: 异步 KV load 和 encoder token 也会进入分配参数。
          L769: `new_blocks is None` 表示本请求本 step 不能被调度。
      - title: preemption 释放并回到 waiting
        lines: [971, 980]
        note: |
          L971-L973: 只有 RUNNING 请求可以被抢占。
          L974: 释放该请求占用的 KV cache。
          L975: 同步释放 encoder cache。
          L976: 状态改为 `PREEMPTED`。
          L977: 已计算 token 清零，后续需要重算。
          L978-L980: 清 draft token，并累计 preemption 次数。
      - title: preemption 回到 waiting
        lines: [984, 985]
        note: |
          L984-L985: 请求放回 waiting 队列。
  - title: vLLM KV Cache Manager
    repo_path: github_repo/vllm/vllm/v1/core/kv_cache_manager.py
    focus: usage、can_fit_full_sequence、allocate_slots
    highlights:
      - title: usage 来自 block pool
        lines: [162, 169]
        note: |
          L162-L163: `usage` 是 KV manager 对外暴露的压力指标。
          L164-L168: 返回值语义是 0 到 1 之间的 KV cache 使用率。
          L169: 真实数值来自 block pool，已经不是教学版的本地列表统计。
      - title: full sequence gate 参数
        lines: [225, 232]
        note: |
          L225-L232: `can_fit_full_sequence` 接收请求、prefix 命中、外部 KV 和 encoder token。
      - title: full sequence gate 目的
        lines: [233, 238]
        note: |
          L233-L238: 这个 gate 防止 chunked prefill 只看当前小段而过度 admit。
      - title: full sequence gate 的 token 账
        lines: [239, 251]
        note: |
          L239-L242: 取 prefix cache 命中的 block，没有命中则用空 block 集合。
          L244-L250: 合并本地已计算 token 和外部 KV token，并受 `max_model_len` 限制。
          L251: `full_num_tokens` 表示完整序列需要容纳的 token 数。
      - title: full sequence gate 的 block 账
        lines: [253, 263]
        note: |
          L253-L261: coordinator 计算还要分配多少 KV blocks。
          L263: 需要的 block 数小于等于 free blocks 时，admission 才能继续。

