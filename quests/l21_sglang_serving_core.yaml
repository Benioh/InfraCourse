lesson:
  opening: |-
    # L22：SGLang RadixCache Prefix Reuse

    L22 继续推理服务主线。L21 讲 scheduler 和 KV block admission；本讲关注 repeated-prefix workload：相同 system prompt、few-shot examples、工具 schema、RAG 模板或多轮对话历史反复出现时，RadixCache 怎样复用已经算过的前缀 KV，减少重复 prefill。
  sections:
    - title: 系统位置：从 KV 容量到 prefix 复用
      plain_explanation: |-
        vLLM scheduler 课程把请求生命周期和 KV block 容量讲清楚。SGLang RadixCache 接着处理另一个常见瓶颈：请求已经能被接纳，但首 token 前还在重复计算同一段长 prompt。Prefix cache 的目标是让共享前缀只 prefill 一次，后续请求从 cache 中拿到对应 KV indices，只计算 suffix。

        本讲 patch 不接 GPU，也不模拟真实 KV page。它只验证 trie 合同：token 前缀怎样匹配、插入如何避免重复计数、LRU 如何删除冷叶子并保护共享前缀。真实 SGLang 在同一合同上增加 page alignment、reference lock、namespace 和调度策略。
      mental_model: Scheduler 决定谁能运行，RadixCache 决定这次运行还需要重新算多少 prompt 前缀。
      why_it_matters: repeated-prefix workload 很常见。没有 prefix cache 时，TTFT 可能被重复 prefill 支配；cache miss 又常被误判成模型慢或 GPU 慢。
      source_refs:
        - title: Benchmark workload 构造
          repo_path: labs/l21_sglang_serving_core/scripts/bench_sglang.py
          lines: [62, 69]
          note: |
            L62-L69: workload 参数决定 prompt 模式。
        - title: Benchmark 请求调用
          repo_path: labs/l21_sglang_serving_core/scripts/bench_sglang.py
          lines: [70, 75]
          note: |
            L70-L75: repeated_prefix 会拼接固定前缀和 suffix 后发请求。
        - title: MiniInfra scheduler cache 入口
          repo_path: mini_infra/sglang/srt/managers/scheduler.py
          lines: [30, 39]
          note: |
            L30-L35: scheduler 从 waiting 取请求。
            L36-L39: prefill 前先执行 prefix_cache.match_prefix。
      common_confusions:
        - 把 prefix cache 当成请求调度器，忽略它只减少 prefill 前缀计算。
        - patch-test 通过后直接宣称真实 TTFT 改善。
      checkpoint_questions:
        - L22 解决的是 queue admission、prefix prefill 复用，还是 decode 采样？
        - repeated-prefix workload 至少要固定哪些输入？
    - title: 命中边界：cache key 是 token ids 和 namespace
      plain_explanation: |-
        Prefix cache 按 token id 前缀命中。两个 prompt 字符串相同，只要 chat template、BOS/EOS、空格、换行、工具 schema 顺序、tokenizer 版本或 RAG 文档排序不同，就可能得到不同 token ids。工程排查时先比较 token id 的最长公共前缀，再谈 RadixCache 实现。

        真实 SGLang 还会把 `extra_key` 放进 RadixKey。它可以隔离不同 adapter、cache version、retrieval context 或租户。token ids 一样但 namespace 不同，也不应该共享同一段 KV。
      mental_model: Prefix cache 认 token 齿形和 namespace，不认人类读起来是否相同。
      why_it_matters: 很多 cache miss 来自模板漂移或 namespace 隔离。只看字符串和 TTFT，很容易定位错。
      source_refs:
        - title: MiniInfra RadixKey
          repo_path: mini_infra/sglang/srt/mem_cache/radix_cache.py
          lines: [7, 13]
          note: |
            L7-L10: RadixKey 同时包含 token_ids 和 extra_key。
            L12-L13: key 长度由 token_ids 决定。
        - title: 真实 match_prefix 文档
          repo_path: github_repo/sglang/python/sglang/srt/mem_cache/radix_cache.py
          lines: [398, 410]
          note: |
            L398-L405: 真实 match_prefix 使用 token ids 和 extra_key 共同决定 namespace。
            L407-L410: extra_key 可隔离 adapter、cache version 或 retrieval context。
      common_confusions:
        - 认为文本相同就一定 hit。
        - 忽略 extra_key，导致不同上下文错误共享或应该共享的请求被隔离。
      checkpoint_questions:
        - cache miss 时第一步应该比较字符串还是 token id LCP？
        - "`extra_key` 可以用来隔离哪些请求？"
    - title: Patch trie：最长前缀、新增节点和 LRU 时间
      plain_explanation: |-
        教学版 `_Node` 保存 children、last_access、parent 和 token_from_parent。`match_prefix` 从 root 沿 token ids 前进，返回能走到的最长长度，并刷新命中节点的 last_access。`insert` 沿已有路径复用节点，只在 child 缺失时创建节点并增加 `_total`。重复插入同一序列时，新增数量为 0。

        `last_access` 必须在 match 和 insert 两条路径都更新。一个前缀可能很久没有新插入，但被持续命中；LRU 应该把它视为热数据。
      mental_model: 每个 token 是 trie 上一步台阶；走得越远，说明可复用前缀越长。
      why_it_matters: 节点计数、访问时间和父子关系任何一个错，都会表现为错误 hit、重复计数或误删热前缀。
      source_refs:
        - title: starter Node 和 cache 状态
          repo_path: labs/l21_sglang_serving_core/patch/starter/radix_cache.py
          lines: [18, 25]
          note: |
            L18-L25: _Node 保存 trie 结构和 LRU 需要的元数据。
        - title: starter cache 状态
          repo_path: labs/l21_sglang_serving_core/patch/starter/radix_cache.py
          lines: [28, 36]
          note: |
            L28-L36: RadixCache 持有 root、容量、访问计数和总节点数。
        - title: reference match_prefix
          repo_path: labs/l21_sglang_serving_core/patch/reference/radix_cache.py
          lines: [28, 39]
          note: |
            L28-L31: match 从 root 和 matched=0 开始。
            L32-L39: 命中节点时刷新 LRU 时间，miss 时停止。
        - title: reference insert
          repo_path: labs/l21_sglang_serving_core/patch/reference/radix_cache.py
          lines: [41, 51]
          note: |
            L41-L48: 缺失 child 才新建节点并增加 `_total`。
            L49-L51: 访问节点刷新时间。
        - title: reference insert 容量边界
          repo_path: labs/l21_sglang_serving_core/patch/reference/radix_cache.py
          lines: [52, 54]
          note: |
            L52-L54: 超容量后 evict，并返回新增数量。
      common_confusions:
        - 把 `_total` 当成插入序列条数。
        - 只在 insert 时刷新 last_access，导致热门命中前缀被删。
      checkpoint_questions:
        - 重复插入 `[1,2,3]` 时第二次应返回多少？
        - "`match_prefix([1,2,9])` 在 cache 只有 `[1,2,3]` 时返回多少？"
    - title: Evict：只删可安全移除的叶子
      plain_explanation: |-
        如果 cache 中有 `[1,2,3]` 和 `[1,2,4]`，节点 `[1,2]` 被两条路径共享。删除共享前缀会破坏仍可命中的请求。教学版 evict 先收集所有非 root 叶子，选择 last_access 最小的叶子，从父节点删除它；如果父节点因此变成叶子，下一轮才可能删除。

        真实 SGLang 还要考虑 lock_ref、KV value、eviction policy、priority 和指标。课堂版只用节点数模拟容量，是为了看清“叶子删除保护共享前缀”这个不变量。
      mental_model: Evict 是修剪末端枝条，不是砍共享主干。
      why_it_matters: 错删共享前缀会让 hit rate 波动，真实系统里还可能让 trie 和 KV page 引用不同步。
      source_refs:
        - title: reference evict
          repo_path: labs/l21_sglang_serving_core/patch/reference/radix_cache.py
          lines: [56, 68]
          note: |
            L56-L62: evict 每轮收集叶子，并选择最冷叶子。
            L63-L68: 从父节点删除叶子并减少总数。
        - title: shared prefix test
          repo_path: labs/l21_sglang_serving_core/patch/tests/test_patch.py
          lines: [76, 85]
          note: |
            L76-L85: 两条路径共享 `[1,2]`，测试只删除一个叶子。
        - title: shared prefix assertions
          repo_path: labs/l21_sglang_serving_core/patch/tests/test_patch.py
          lines: [86, 90]
          note: |
            L86-L90: 共享前缀和另一条完整路径必须保留。
        - title: real SGLang evict
          repo_path: github_repo/sglang/python/sglang/srt/mem_cache/radix_cache.py
          lines: [621, 630]
          note: |
            L621-L627: 真实 evict 弹出叶子、释放 KV value 并删除 leaf。
            L628-L630: 父节点变成可驱逐叶子后继续加入 heap。
        - title: real SGLang evict metrics
          repo_path: github_repo/sglang/python/sglang/srt/mem_cache/radix_cache.py
          lines: [632, 635]
          note: |
            L632-L635: 删除事件和 eviction metrics 会被记录。
      common_confusions:
        - 一次 evict 删除整条旧路径。
        - 忽略 running 请求的 lock_ref，把正在使用的节点当作可驱逐。
      checkpoint_questions:
        - 为什么 evict 要重新收集叶子？
        - 真实 SGLang 删除叶子时还要释放什么资源？
    - title: MiniInfra 集成：prefill 前 match，完成后 insert
      plain_explanation: |-
        MiniInfra scheduler 展示 prefix cache 怎样进入 serving 路径。waiting 请求被取出后，scheduler 先调用 `prefix_cache.match_prefix`，把 `matched_prefix_tokens` 写入 prefill 记录；随后模拟生成一个 token，并调用 `cache_finished_req` 把 prompt KV 写回 cache。

        这说明 trie 只是核心数据结构。服务效果取决于 scheduler 是否在 prefill 前查询、在完成后写回，并把命中长度转化为“少算多少 prompt token”。
      mental_model: Scheduler 先问 cache 已经有什么，再决定本次 prefill 还需要做多少。
      why_it_matters: 单测通过但 scheduler 没接入 cache，真实 TTFT 不会变化。
      source_refs:
        - title: MiniInfra cache_finished_req
          repo_path: mini_infra/sglang/srt/mem_cache/radix_cache.py
          lines: [83, 95]
          note: |
            L83-L90: 不插入或空 prompt 不写 cache。
            L91-L95: prompt_tokens 转成 RadixKey 并写入教学版 KV value。
        - title: MiniInfra run_batch 输出
          repo_path: mini_infra/sglang/srt/managers/scheduler.py
          lines: [40, 50]
          note: |
            L40-L45: prefill 记录 matched_prefix_tokens。
            L46-L50: decode 后写回 cache，并把请求加入 running。
        - title: MiniInfra repeated-prefix smoke
          repo_path: mini_infra/sglang/run_scheduler.py
          lines: [19, 25]
          note: |
            L19-L24: smoke 构造共享前缀和重复请求。
            L25: payload 保存两轮结果，用于观察第二轮命中。
      common_confusions:
        - 只看 RadixCache 单测，忽略 scheduler 是否真的调用 cache。
        - 把 MiniInfra 的 `["kv"]` value 当成真实 GPU KV tensor。
      checkpoint_questions:
        - MiniInfra 在 prefill 前和请求完成后分别调用哪个 cache 方法？
        - "`matched_prefix_tokens` 应该怎样影响 prefill 工作量？"
    - title: 真实 SGLang：KV indices、page alignment 和调度策略
      plain_explanation: |-
        真实 SGLang 的 MatchResult 返回 `device_indices`，这是已经命中的 KV cache indices。TreeNode 还保存 lock_ref、host_value、hash_value、priority 和访问时间。`match_prefix` 会按 page size 对齐 key，必要时 split node；`cache_finished_req` 会插入 KV indices，释放重复 KV 和未对齐 tail。

        Prefix cache 也进入调度策略。schedule policy 会为 waiting 请求预计算 prefix matches，写回 `prefix_indices` 和 last node，并可以按最长 prefix 或 in-batch prefix caching 调整 waiting queue 顺序。
      mental_model: 课堂版回答“命中多长”，真实 SGLang 还要回答“命中的 KV pages 在哪里、是否被锁、调度时优先谁”。
      why_it_matters: 线上问题经常出在 page alignment、namespace、lock_ref、eviction strategy 或调度策略，而不是 trie 查找本身。
      source_refs:
        - title: Base MatchResult
          repo_path: github_repo/sglang/python/sglang/srt/mem_cache/base_prefix_cache.py
          lines: [142, 147]
          note: |
            L142-L147: MatchResult 包含 device_indices、命中节点和 cache_protected_len。
        - title: TreeNode production fields
          repo_path: github_repo/sglang/python/sglang/srt/mem_cache/radix_cache.py
          lines: [211, 223]
          note: |
            L211-L223: TreeNode 保存 key、value、lock_ref 和访问时间。
        - title: TreeNode extended fields
          repo_path: github_repo/sglang/python/sglang/srt/mem_cache/radix_cache.py
          lines: [224, 233]
          note: |
            L224-L233: host cache、hash 和 priority 支撑生产特性。
        - title: cache_finished_req release
          repo_path: github_repo/sglang/python/sglang/srt/mem_cache/radix_cache.py
          lines: [520, 530]
          note: |
            L520-L523: 重复 KV indices 被释放。
            L524-L530: 未插入路径和未对齐 tail 也被释放。
        - title: schedule policy prefix matches
          repo_path: github_repo/sglang/python/sglang/srt/managers/schedule_policy.py
          lines: [195, 203]
          note: |
            L195-L203: waiting 请求用 input/output ids 和 extra_key 查 tree cache。
        - title: schedule policy match result
          repo_path: github_repo/sglang/python/sglang/srt/managers/schedule_policy.py
          lines: [204, 214]
          note: |
            L204-L214: prefix_indices 和命中节点写回 request。
      common_confusions:
        - 以为真实 RadixCache 只返回命中长度。
        - 认为 cache 命中只影响计算量，不会进入调度排序。
      checkpoint_questions:
        - "`device_indices` 和课堂版 matched length 的差别是什么？"
        - page alignment 为什么会让可缓存长度和 prompt 长度不同？
    - title: 验证边界：patch-test、server validation 和 benchmark
      plain_explanation: |-
        L22 有三个层次的验证。patch-test 验证 trie 行为；`run_server.py` 验证本地 SGLang/CUDA 状态和启动命令记录；`bench_repeated_prefix.py` 连接 OpenAI-compatible server 并写 TTFT/cache metrics。没有真实 server 时，benchmark 会写 `validation_only`。

        报告必须写清本次属于哪一层。validation-only 可以证明命令、配置和 artifact 路径，但不能证明 TTFT 下降或 cache hit rate 改善。
      mental_model: 单测证明树正确，server validation 证明路径可复查，真实 benchmark 才能讨论性能。
      why_it_matters: Prefix cache 的收益依赖 workload 和真实 server 状态。把 validation-only 当成性能结果会误导后续调参。
      source_refs:
        - title: run_server validation
          repo_path: labs/l21_sglang_serving_core/scripts/run_server.py
          lines: [40, 42]
          note: |
            L40-L42: 脚本记录 SGLang import、CUDA 和启动命令。
        - title: run_server validation artifact
          repo_path: labs/l21_sglang_serving_core/scripts/run_server.py
          lines: [43, 55]
          note: |
            L43-L55: serve.log 和 artifact 写出 validation 边界。
        - title: run_server validation metrics
          repo_path: labs/l21_sglang_serving_core/scripts/run_server.py
          lines: [56, 64]
          note: |
            L56-L64: metrics 行标记 config_validated 和 cache_hit_rate。
        - title: benchmark served metrics
          repo_path: labs/l21_sglang_serving_core/scripts/bench_sglang.py
          lines: [76, 88]
          note: |
            L76-L88: server 成功时写 TTFT、requests_per_sec、cache_hit_rate 和 workload。
        - title: benchmark validation-only metrics
          repo_path: labs/l21_sglang_serving_core/scripts/bench_sglang.py
          lines: [89, 101]
          note: |
            L89-L101: server 不可达时写 validation_only 和空 TTFT。
        - title: benchmark metrics append
          repo_path: labs/l21_sglang_serving_core/scripts/bench_sglang.py
          lines: [103, 104]
          note: |
            L103-L104: metrics 追加到 JSONL。
      common_confusions:
        - patch-test 通过后就认为真实 SGLang serving 已经变快。
        - server 不可达时仍把 validation-only 产物写成真实 benchmark。
      checkpoint_questions:
        - L22 的三层验证分别证明什么？
        - repeated-prefix benchmark 的报告必须写清哪些固定变量？

