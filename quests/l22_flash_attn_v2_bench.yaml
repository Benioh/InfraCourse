  - title: 真实 wrapper：layout、cache、mask 和 GQA 都会影响 SDPA
    plain_explanation: |
      真实 serving 或训练代码很少只有一行 SDPA。Torchtitan 先做 layout transpose，并用 `sdpa_kernel()` 排序 backend。SGLang 从 KV cache 和 request token 映射中取出 key/value，还要对齐 dtype。vLLM CPU backend 会按序列 slice 调用 SDPA，并传入 mask、dropout、scale、causal 和 GQA。

      这说明 patch 的价值在最小合同，生产排查要继续看输入布局、cache 索引、mask 形态和 backend 条件。
    mental_model: |
      patch 是 attention kernel 的缩小图，真实 wrapper 是同一合同加上服务系统里的状态恢复和参数组合。
    why_it_matters: |
      数值不一致或 fallback 往往出现在 patch 之外：layout 转换错、KV cache slice 错、mask 和 causal 组合不符合 backend 条件。
    source_refs:
    - title: KV cache 输入
      repo_path: github_repo/sglang/python/sglang/srt/layers/attention/torch_native_backend.py
      lines:
      - 89
