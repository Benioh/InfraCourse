  - title: Benchmark 证据：正确性、耗时和显存要分开
    plain_explanation: |
      L23 的 benchmark 先用 fp32 小 shape 做正确性，再用配置里的 dtype 和完整 shape 做性能。这个设计避免把半精度误差、CPU smoke、长序列内存压力和 GPU kernel 差异混在一起。CUDA 计时还要同步，否则得到的可能只是 launch 提交时间。

      输出 artifact 是复盘依据。`metrics.jsonl` 保留逐 shape 结构化指标，`bench.csv` 便于快速阅读，`bench_summary.json` 给出验收结果和全部 rows。
    mental_model: |
      正确性回答“算得对不对”，耗时回答“在这个条件下快不快”，峰值显存回答“中间矩阵是否带来压力”。三者不能互相替代。
    why_it_matters: |
      很多性能误判来自条件缺失：没有同步、没有 dtype、没有 shape、没有 backend 证据，speedup 数字就无法复查。
    source_refs:
    - title: CUDA 同步计时
