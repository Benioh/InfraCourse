lesson:
  opening: |
    # 第 23 讲：PyTorch SDPA 与 FlashAttention benchmark

    这一讲处理 attention kernel 的系统边界。eager attention 会显式生成 `[B,H,T,T]` 的 score 和 weight，长序列下会放大 HBM 流量和峰值显存。PyTorch SDPA 提供统一 API，在合适的 GPU、dtype、head_dim 和 mask 条件下可以走 FlashAttention 类 backend。我们先写 eager baseline，再调用 SDPA，最后用 benchmark artifact 判断数值、耗时、speedup 和显存峰值。

    课程按“系统地图 -> 主讲义 -> 源码带读 -> quiz -> patch -> drill -> 课后产物”的顺序组织。lab 只检查最小合同：attention 数学公式、causal mask、SDPA API 和 benchmark 指标是否闭合。
  sections:
  - title: 课程定位：attention kernel 是 serving 性能路径的一层
    plain_explanation: |
      L20 到 L22 已经把请求入口、调度、KV cache 和 SGLang 前缀缓存放到系统图里。L23 下沉到模型层中的 attention kernel。同一个请求被 scheduler 选中后，prefill 和 decode 的实际成本仍然取决于 attention 如何访问 Q/K/V、是否显式保存 `[T,T]` 中间矩阵、以及 SDPA 是否走到合适 backend。

      这节课的 patch 很小，但讲授重点在系统边界。写代码前，学生应该能说清 `B/H/T/D`、dtype、device、causal、mask 和 backend 条件怎样共同决定一次 attention benchmark 的结论。
    mental_model: |
      把 attention 看成一个数据通路：输入 shape 进入 eager baseline 或 SDPA，backend 决定中间矩阵是否落到 HBM，artifact 再记录数值、耗时和显存。
    why_it_matters: |
      线上看到 SDPA 调用，并不能直接说明服务已经拿到 flash backend 收益。只有把输入条件、dispatch、计时和 artifact 对齐，性能判断才可靠。
    source_refs:
    - title: IMPL 选择
      repo_path: labs/l22_flash_attn_v2_bench/scripts/run_bench.py
      lines:
      - 33
      - 45
      note: |
        L33-L36: `_impl` 支持用环境变量显式选择 starter 或 reference。
        L38-L45: 默认导入路径把教学实现和参考实现放在同一个 drill 入口下。
    - title: benchmark 合同
      repo_path: labs/l22_flash_attn_v2_bench/patch/starter/flash_bench.py
      lines:
      - 26
      - 35
      note: |
        L26-L34: `bench_attention` 固定输入 shape、device、dtype 和迭代次数。
        L35: 返回值要同时承载正确性、性能和显存指标。
    common_confusions:
    - 看到 SDPA API 就断言使用了 flash backend。
    - CPU smoke 通过后直接报告 CUDA speedup。
    checkpoint_questions:
    - L23 解决的是请求调度、KV cache 复用，还是 attention kernel 的中间矩阵和 backend 问题？
    - 一次 benchmark 缺少 dtype 和 shape 时，结论还能迁移吗？
  - title: eager baseline：显式暴露 O(T^2) 中间矩阵
    plain_explanation: |
      eager attention 的好处是直观：`q @ k^T`、scale、mask、softmax、乘以 `v`。它的成本也直观：`scores` 和 `weights` 都是 `[B,H,T,T]`。序列长度翻倍，中间矩阵元素数量约变成四倍。长 prompt prefill、长上下文 decode 和大 head 数都会把这个成本放大。

      causal mask 是本讲的第一个边界。第 `i` 个 token 只能看 `j <= i` 的位置。baseline 用上三角 mask 把未来位置填成 `-inf`，测试用 one-hot value 检查第 0 行是否只来自位置 0。
    mental_model: |
      eager baseline 像把完整注意力表先写出来，再做归一化和加权求和。它适合做数学对照，也会暴露长序列下的内存问题。
    why_it_matters: |
      没有 baseline，就无法判断 SDPA 的输出是否保持语义，也无法解释 FlashAttention 类 kernel 省掉了哪一类中间存储。
    source_refs:
    - title: scores 和 mask
      repo_path: labs/l22_flash_attn_v2_bench/patch/reference/flash_bench.py
      lines:
      - 12
      - 20
      note: |
        L12-L14: `scores` 是显式 `[B,H,T,T]` 中间矩阵。
        L15-L18: causal mask 把未来位置填成 `-inf`。
        L19-L20: softmax 权重乘以 value，输出恢复到 `[B,H,T,D]`。
    - title: one-hot 检查
      repo_path: labs/l22_flash_attn_v2_bench/patch/tests/test_patch.py
      lines:
      - 30
      - 40
      note: |
        L30-L37: 测试构造短序列和 one-hot value，专门观察未来位置是否泄漏。
        L38-L40: 第 0 行只能等于位置 0 的 one-hot 前缀。
    common_confusions:
    - 把 `weights @ v` 的输出 shape 和 `scores` 的中间 shape 混淆。
    - 忘记除以 `sqrt(D)`，导致 softmax 分布过尖或过平。
    checkpoint_questions:
    - eager baseline 中哪个张量随 `T^2` 增长？
    - causal mask 为什么要在 softmax 前作用到 scores 上？
  - title: SDPA 和 online softmax：同一语义，不同中间路径
    plain_explanation: |
      PyTorch SDPA 把 attention 暴露成统一 API。相同的 `F.scaled_dot_product_attention()` 在不同条件下可能走 math、memory efficient、flash 或 cudnn backend。FlashAttention 类 backend 的核心收益来自分块融合：每个 tile 更新 running max、running sum 和输出累积，减少完整 attention matrix 写入 HBM。

      MiniInfra 的 online softmax 用 CPU-safe 代码展示这个数学骨架。它不证明 GPU 性能，只解释为什么 softmax 可以分块做数值稳定归一化。
    mental_model: |
      SDPA 是入口，backend 是执行路径。online softmax 是分块执行保持数值等价的关键状态机。
    why_it_matters: |
      排查性能时需要区分 API、backend 和数学语义。数值等价和速度收益来自不同证据。
    source_refs:
    - title: SDPA 调用
      repo_path: labs/l22_flash_attn_v2_bench/patch/reference/flash_bench.py
      lines:
      - 23
      - 24
      note: |
        L23: wrapper 维持和 eager baseline 相同的函数签名。
        L24: 调用 PyTorch SDPA，backend 由运行时条件决定。
    - title: running 状态
      repo_path: mini_infra/gpu/triton_softmax.py
      lines:
      - 43
      - 55
      note: |
        L43-L50: running sum 需要随 running max 变化重缩放。
