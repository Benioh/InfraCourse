  - title: Serving smoke：指标矩阵要覆盖速度、显存和质量
    plain_explanation: |
      MiniInfra 的 `run_engine.py` 会生成 fp16 baseline、AWQ、FP8、KV-int8 四类指标。每一行都包含延迟、吞吐、显存和 accuracy drift 相关字段。它是教学 smoke，目标是让学生练习报告结构，不是声明某个硬件上的真实性能。

      `bench_acc.py` 也用 `quant_payload` 生成对比矩阵。写报告时，必须把 fp16 baseline 作为比较对象，并说明本地 CPU validation-only 与真实 GPU benchmark 的差别。
    mental_model: |
      量化报告像一张多列对照表：省了多少显存、快了多少、质量掉了多少、在哪个硬件和数据集上测到。
    why_it_matters: |
      只报告 tokens/s 会漏掉 accuracy drift 和硬件边界。量化上线风险通常来自这些被省略的条件。
