  - title: W8 quant/dequant：两个 scale 的广播方向
    plain_explanation: |
      `quantize_w8_per_channel` 先计算 `w_scaled = weight * awq_scale.unsqueeze(0)`，再按输出通道求 `per_out_scale`。int8 权重保存在 `[-127,127]` 范围内。`dequantize_w8_per_channel` 先乘 `per_out_scale.unsqueeze(1)`，恢复到 `weight * awq_scale` 空间；如果要回到原始 weight，还要除以 `awq_scale.unsqueeze(0)`。

      本节的核心是广播方向。`unsqueeze(0)` 表示输入通道 scale 作用到每一行；`unsqueeze(1)` 表示输出通道 dequant scale 作用到每一列。
    mental_model: |
      AWQ scale 是先放大某些列，per-output scale 是每一行的整数刻度尺，dequant 后还要把列方向的放大除回去。
    why_it_matters: |
      很多量化 bug 不会立刻崩溃，而是产生看似合理的 int8 范围，却在 dequant 后输出错误分布。
    source_refs:
    - title: quantize 广播
      repo_path: labs/l23_quant_serving/patch/reference/awq_calibrate.py
      lines:
      - 20
      - 30
      note: |
