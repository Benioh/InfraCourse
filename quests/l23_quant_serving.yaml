  - title: 真实加载器：AWQ、FP8 和 KV scale 的生产边界
    plain_explanation: |
      vLLM AWQ 加载器处理的是 W4A16 packed checkpoint，不会重新执行课堂 patch 的 W8 量化。它检查 weight_bits、group_size、zero_point、qweight、qzeros、scales、input partition 和 pack_factor。FP8 路径关注 checkpoint 是否已经 serialized、activation_scheme、weight_scale、input_scale 和 block scale。KV cache quantization 则给 Attention layer 增加 q/k/v/prob scale，并在加载后决定是否使用 checkpoint scale 或动态 scale。

      所以，真实排查要从“数学合同”扩展到“checkpoint 合同”和“kernel 合同”。
    mental_model: |
      patch 是一个 linear 的量化显微镜；真实加载器是 checkpoint、tensor parallel、kernel backend 和 runtime scale 的组合系统。
    why_it_matters: |
      线上量化失败常表现为 load error、shape mismatch、kernel fallback 或 accuracy drift。每一种都对应不同源码入口。
