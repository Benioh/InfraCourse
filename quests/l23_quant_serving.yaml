lesson:
  opening: |
    # 第 24 讲：AWQ-lite W8 Per-Channel 量化 Serving

    这一讲处理推理服务里的低精度权重和 KV cache。权重越大，留给 KV cache、并发和长上下文的显存越少；scale 选错时，服务可能能启动，但 logits 和 accuracy drift 会出问题。L24 先用 CPU-safe patch 写清 AWQ-lite 的 input-channel scale、W8 per-output-channel quant 和 dequant，再对照 MiniInfra 指标矩阵和真实 vLLM AWQ/FP8/KV cache 加载器。

    课程按“系统地图 -> 主讲义 -> 源码带读 -> notebook -> quiz -> patch -> smoke -> 课后产物”的顺序组织。lab 只检查最小数学合同，生产结论还要结合 kernel、checkpoint、硬件和评估集。
  sections:
  - title: 课程定位：量化服务要同时看资源和误差
    plain_explanation: |
      L24 属于 Serving systems 的显存和低精度路径。它连接 L23 的 kernel 性能讨论和 L25 的 speculative decoding：前者关注 attention 的中间矩阵和 backend，L24 关注权重、KV cache、scale metadata 和 accuracy drift。量化可以降低权重显存或 KV cache 显存，也可能因为 kernel 不匹配而没有端到端速度收益。

      写 patch 前要先分清四类对象：AWQ scale、per-output dequant scale、FP8 weight/input scale、KV cache k/v scale。它们都叫 scale，但来源、shape 和用途不同。
    mental_model: |
      把量化 serving 看成两张账本：资源账本记录权重、KV 和吞吐；误差账本记录 roundtrip、calibration 和 accuracy drift。
    why_it_matters: |
      真实服务上线时，能启动只说明加载路径走通。还要同时证明显存、速度和质量都在可接受范围内。
    source_refs:
    - title: AWQ scale 输入输出
      repo_path: labs/l23_quant_serving/patch/starter/awq_calibrate.py
      lines:
      - 18
      - 27
      note: |
        L18-L22: `compute_awq_scale` 接收 weight、activation amax 和 alpha。
        L23-L27: 返回 scale 是输入通道维度，不能写成输出通道。
    - title: fp16 baseline
      repo_path: mini_infra/vllm/run_engine.py
      lines:
      - 54
      - 64
      note: |
        L54-L64: fp16 baseline 提供比较对象，量化行必须和它对照。
    common_confusions:
    - 只看 weight bit 数，不看 activation dtype、kernel 和 accuracy drift。
    - 把所有 scale 当成同一类元数据。
    checkpoint_questions:
    - L24 里 AWQ scale、per-output dequant scale 和 KV scale 的 shape 分别是什么？
    - CPU smoke 能证明什么，不能证明什么？
  - title: AWQ-lite scale：activation amax 保护输入通道
    plain_explanation: |
      `compute_awq_scale` 的输入是 `(out_features, in_features)` weight 和 `(in_features,)` activation amax。activation 沿输入通道进入 linear，所以要沿 `dim=0` 求每个输入通道的 weight amax，再用 `act_amax^alpha / w_amax_in^alpha` 得到输入通道 scale。课堂 patch 把下限裁到 1.0，目标是让 activation outlier 对应通道得到额外保护。

      `alpha=0` 是重要边界。此时所有 scale 都应为 1，流程退回普通 weight-only INT8。测试用它确认 AWQ 分支没有破坏普通路径。
    mental_model: |
      Activation amax 是风险信号：某个输入通道经常出现大值，就在量化前给对应 weight 列更多表示空间。
    why_it_matters: |
      scale 方向写错会直接影响 logits。这个错误在小模型里可能只表现为轻微漂移，在大模型和长上下文里会放大。
