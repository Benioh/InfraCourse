    common_confusions:
    - 只写 tokens/s，不写 baseline 和质量指标。
    - 把 notebook 公式当成真实硬件结论。
    checkpoint_questions:
    - vLLM 中哪些 counter 可以计算 acceptance rate？
    - spec decode p99 抖动时应该按哪些维度分桶？
  - title: Lab 验收：最小合同和下一步实验
    plain_explanation: |
      patch 只验收 `greedy_verify` 的行为合同。测试覆盖全接受、中间 mismatch、k=0、首错和返回类型。通过 patch 后，还要跑 smoke 和 bench，把一轮返回值映射到 acceptance、speedup、ITL p50/p99、draft latency 和 draft memory。

      写实验报告时先列 baseline，再列 spec method、K、draft cost、acceptance、per-position acceptance、显存、p99 和质量指标。没有这些字段时，不能把局部现象写成生产结论。
    mental_model: |
      先证明单轮 verify 语义正确，再证明一批请求的指标账本划算。
    why_it_matters: |
      这能防止学生把 patch-test 当成课程终点，也能把下一讲的评测闭环接上。
    source_refs:
    - title: 返回类型
