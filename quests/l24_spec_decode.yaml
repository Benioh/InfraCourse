lesson:
  opening: |
    # 第 25 讲：Speculative Decoding Greedy Verify

    本讲处理 decode 阶段 target step 成本。draft proposer 先给出 k 个候选 token，target 一次 verify forward 产生 k+1 行 logits；greedy verify 只接受连续前缀，在第一处 mismatch 用 target argmax 接管，全接受时追加 bonus token。L25 先用 CPU-safe patch 写清这个合同，再对照 MiniInfra 指标、vLLM speculative 配置和 SGLang KV 提交边界。

    课程按“系统地图 -> 主讲义 -> 源码带读 -> notebook -> quiz -> patch -> smoke/bench -> 课后产物”的顺序组织。lab 只检查 greedy verify 的最小合同，生产结论还要结合 draft 成本、K、并发、显存、p99 和输出质量。
  sections:
  - title: 课程定位：spec decode 要先写清 verify 合同
    plain_explanation: |
      L25 属于 Serving systems 的 decode 加速路径。它连接 L21 的 KV 调度、L24 的显存预算和 L26 的评测闭环。推理服务打开 spec decode 后，一轮 target verify 可能提交多个 token，也可能只提交一个 target token；这个差别会影响吞吐、KV committed length、acceptance 指标和长尾延迟。

      本讲先把 greedy verify 合同写成 patch。proposer 的类型可以换成 n-gram、draft model、Medusa 或 EAGLE，但 target verify 必须回答同一个问题：从第 0 个候选开始，target 连续接受了多少 draft，并由哪个 target token 接管下一步。
    mental_model: |
      把 spec decode 看成三段：便宜 proposer 提案、target 一次验收、scheduler 提交有效前缀并回收无效候选。
    why_it_matters: |
      verify 合同不清楚时，acceptance、mean acceptance length、KV 提交长度和 p99 分析都会偏移。
    source_refs:
    - title: 函数签名和返回语义
      repo_path: labs/l24_spec_decode/patch/starter/spec_decode.py
      lines:
      - 20
      - 29
      note: |
        L20-L23: 函数接收 draft token 和 target logits。
        L24-L29: 返回列表长度和 accepted draft 数在 docstring 里明确区分。
    - title: verify candidates
      repo_path: mini_infra/vllm/spec_decode/draft_runner.py
      lines:
      - 29
      - 40
      note: |
        L29-L34: MiniInfra 用连续前缀接受模拟 target verify。
        L35-L40: 第一处不一致后停止计数。
    common_confusions:
    - 把 proposer 写对当成 spec decode 全链路正确。
    - 把返回 token 数和 accepted draft 数混成同一个指标。
    checkpoint_questions:
    - 为什么 target verify 是 spec decode 的语义边界？
    - L25 与 L24 的显存预算有什么关系？
  - title: Greedy verify：连续接受、mismatch 接管、全接受 bonus
    plain_explanation: |
      `draft_tokens` 的长度是 k，`target_logits` 的 shape 是 `(k+1, vocab)`。实现时先计算 `target_argmax = target_logits.argmax(dim=-1).tolist()`，再从左到右比较 `target_argmax[i]` 和 `draft_tokens[i]`。相等就把 draft token 追加到 accepted；第一处不相等就返回 accepted 前缀加 `target_argmax[i]`，accepted draft 数是前缀长度。

      如果 k 个 draft 都匹配，说明 target 接受完整候选链。这时第 k 行 logits 给出 bonus token，要追加到返回列表；accepted draft 数仍然是 k。k=0 时没有 draft 可验，但 target logits 仍有第 0 行，所以返回一个 target token 和 accepted draft 数 0。
    mental_model: |
      `target_argmax` 是标准答案序列。draft 必须从第一题开始连续答对；第一题错了就由标准答案接管，全对时还能拿到下一题答案。
    why_it_matters: |
      少 append bonus 会少算每轮输出；把 bonus 计入 accepted draft 会抬高 acceptance；mismatch 后继续看后面的 draft 会改变 greedy decode 路径。
    source_refs:
    - title: loop and bonus
      repo_path: labs/l24_spec_decode/patch/reference/spec_decode.py
      lines:
      - 17
      - 23
      note: |
        L17-L21: mismatch 分支返回 target argmax 和已接受数量。
        L22-L23: 全接受时追加 `target_argmax[k]`。
    - title: 中间 mismatch
      repo_path: labs/l24_spec_decode/patch/tests/test_patch.py
      lines:
      - 40
      - 47
      note: |
        L40-L47: target 在位置 2 给出 99，返回前两个 draft 加 99。
    common_confusions:
    - mismatch 分支返回 draft token。
    - 全接受分支只返回 draft 列表。
    - k=0 时返回空列表。
    checkpoint_questions:
    - '`target_argmax=[3,7,99,0,0]`、`draft=[3,7,11,23]` 时返回什么？'
    - 为什么 `num_accepted_drafts` 不包含 bonus？
  - title: Acceptance 和 speedup：收益要覆盖 draft 成本
    plain_explanation: |
      Acceptance rate 是 accepted draft tokens / proposed draft tokens。投机一轮平均产出 `1 + α*k` 个 token，其中 1 是 target bonus。若 draft 成本很高，或者 α 很低，额外 draft forward 会吃掉 target step 减少带来的收益。

      L25 的 MiniInfra 用 `AcceptanceTracker` 维护滑动窗口，并给出教学版 speedup 估计。真实报告里不能只写 speedup，必须同时写 baseline、tokens/s、ITL p50/p99、draft latency、draft memory、K、method、采样参数和质量指标。
    mental_model: |
      spec decode 是一张成本账：target verify 是固定成本，draft 是额外成本，只有被接受的候选足够多，平均成本才会下降。
    why_it_matters: |
      高平均吞吐不能掩盖 p99、显存或质量问题；低 acceptance 还可能让服务比 baseline 更慢。
    source_refs:
    - title: rate and speedup
      repo_path: mini_infra/vllm/spec_decode/acceptance_tracker.py
      lines:
      - 32
      - 42
      note: |
        L32-L38: `rate()` 汇总 accepted/proposed。
        L40-L42: `expected_speedup()` 使用 draft cost ratio 估计收益。
    - title: rows
      repo_path: labs/l24_spec_decode/scripts/bench_concurrency.py
      lines:
      - 12
      - 20
      note: |
        L12-L15: CLI 接收 servers 和 batches。
        L16-L20: 每个 batch 输出 n-gram 与 draft 两组指标。
    common_confusions:
    - 只看 acceptance，不看 draft latency 和显存。
    - 只看 p50，不看 reject burst 对 p99 的影响。
    checkpoint_questions:
    - acceptance rate 高但 draft model 很大时，速度为什么仍可能变差？
    - 报告 spec decode 至少要列哪些 baseline 字段？
  - title: Proposer 家族：ngram、draft model、Medusa/EAGLE
    plain_explanation: |
      n-gram proposer 从 prompt 中查找当前 suffix 的历史出现位置，并把后续 token 当候选。它几乎没有额外 GPU 显存，但只适合 prompt 内重复明显的场景。独立 draft model 更通用，但需要额外权重、KV、forward 成本和配置对齐。

      Medusa/EAGLE 把候选生成接到 target 的 hidden state 或专门 head 上，目标是降低 draft 成本并提高候选质量。vLLM `SpeculativeConfig` 把 method、model、K、draft TP、prompt lookup、tree 和 parallel drafting 分成不同字段，读配置时要把这些成本项分开。
    mental_model: |
      proposer 负责提出候选，target 负责验收。不同 proposer 改变成本和候选质量，不改变 verify 合同。
    why_it_matters: |
      线上排查时，低 acceptance、draft OOM 和 p99 抖动经常来自 proposer 选型或配置，而非 verify 函数本身。
    source_refs:
    - title: prompt lookup
      repo_path: mini_infra/vllm/spec_decode/ngram.py
      lines:
      - 28
      - 32
      note: |
        L28-L32: n-gram 找到 suffix 后返回其后的 token 作为候选。
    - title: core fields
      repo_path: github_repo/vllm/vllm/config/speculative.py
      lines:
      - 73
      - 85
      note: |
        L73-L85: 配置保存 K、draft model 名称和 method。
    - title: prompt lookup
      repo_path: github_repo/vllm/vllm/config/speculative.py
      lines:
      - 138
      - 144
      note: |
        L138-L144: prompt lookup 控制 n-gram window。
    - title: alternative drafting
      repo_path: github_repo/vllm/vllm/config/speculative.py
      lines:
