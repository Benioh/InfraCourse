  - title: KV 和 scheduler：bonus 推进输出，accepted draft 进入统计
    plain_explanation: |
      Verify forward 可能临时计算多个候选位置的 KV，但最终有效序列只包含被接受的 draft 前缀和一个 target bonus。接受 m 个 draft 时，输出长度增加 `m+1`。mismatch 之后的候选 KV 需要通过 length、page table、slot mapping 或 overallocated KV 回收处理。

      SGLang 的 `accept_lens` 包含 bonus token，所以 accepted draft 数等于 `accept_lens - 1`。这个关系连接 patch 返回值和真实 scheduler：bonus 推进输出和 KV committed length，accepted draft count 进入 acceptance histogram。
    mental_model: |
      KV 像临时铺好的候选轨道。验证通过的前缀和 bonus 变成正式轨道，拒绝后的轨道要收回或忽略。
    why_it_matters: |
      计数边界一旦错，KV committed length、accepted draft histogram 和 mean acceptance length 都会错。
    source_refs:
    - title: committed length
      repo_path: github_repo/sglang/python/sglang/srt/managers/scheduler_output_processor_mixin.py
      lines:
      - 363
      - 372
      note: |
        L363-L368: KV committed length 按 `accept_lens[i]-1` 推进。
        L369-L372: predict tokens 按 accept length 从 buffer 中切出。
    - title: overallocated KV
      repo_path: github_repo/sglang/python/sglang/srt/managers/schedule_batch.py
      lines:
      - 937
      - 947
      note: |
        L937-L943: spec decode 可能分配超过 committed length 的 KV。
        L944-L947: 释放时返回 committed 与 allocated 范围。
    common_confusions:
    - 把 bonus 计入 accepted draft tokens。
    - reject 后认为需要重新 prefill 全部上下文。
    checkpoint_questions:
    - 接受 2 个 draft 时，输出长度增加多少？
    - 为什么 SGLang 统计 accepted draft 时要减 1？
  - title: Metrics 和 debug：从 patch 返回值到生产判断
    plain_explanation: |
      vLLM 的 spec decode metrics 聚合 draft 数、draft token 数、accepted token 数和 per-position acceptance。mean acceptance length 通常包含 bonus，acceptance rate 使用 accepted draft tokens / draft tokens。报告里要同时记录 drafted throughput、accepted throughput、ITL 分位数和 draft memory。

      Debug 时按三张账本走：概率账本看 acceptance 和 per-position 分布，资源账本看 draft 权重、draft KV、target KV 和临时 buffer，延迟账本看 p50/p99、accept=0 占比和 mixed workload。
    mental_model: |
      patch 是单轮语义检查，metrics 是批量服务账本。两者通过 accepted draft count 和 returned token count 相连。
    why_it_matters: |
      只有 patch-test 通过，不能说明真实 spec decode 值得上线；上线判断要能复查成本、收益和尾部风险。
    source_refs:
    - title: acceptance formulas
      repo_path: github_repo/vllm/vllm/v1/spec_decode/metrics.py
      lines:
      - 88
      - 99
      note: |
        L88-L92: draft acceptance rate 等于 accepted tokens / draft tokens。
        L94-L99: mean acceptance length 包含 bonus，并计算 per-position acceptance。
    - title: Prometheus observe counters
      repo_path: github_repo/vllm/vllm/v1/spec_decode/metrics.py
      lines:
      - 200
