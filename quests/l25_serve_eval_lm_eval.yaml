      lines:
      - 1479
      - 1487
      note: |
        L1479-L1484: SGLang 注册 `/v1/completions`。
        L1485-L1487: 请求交给 completion handler。
    common_confusions:
    - 用 completion prompt 评测 chat-only 模型，却不说明 chat template。
    - 不记录 base_url、model id 和服务启动命令。
    checkpoint_questions:
    - L26 OpenAIClient 默认读取响应的哪个字段？
    - endpoint 形状错误会怎样影响评测？
  - title: Lab 验收和 debug 路线
    plain_explanation: |
      patch-test 覆盖数字抽取、exact scorer、numeric scorer、prompt 顺序、stub 完整评测和部分正确聚合。通过后跑本地 stub eval，检查 `metrics.jsonl`、`eval_summary.json` 和 `report.md` 是否完整。

      Debug 时先看完成率，再看 exact/numeric 的组合，再抽查样本。exact 低、numeric 高通常是格式问题；两个指标都低时查 prompt、stop、temperature、endpoint、模型和 timeout。
    mental_model: |
      先验收 harness，再验证 artifact，最后才把真实服务质量结论写进报告。
    why_it_matters: |
      这样能把 patch 错误、harness 错误和真实服务错误分开定位。
