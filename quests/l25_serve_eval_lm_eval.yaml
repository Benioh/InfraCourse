  - title: Endpoint 对照：vLLM 和 SGLang 都支持 OpenAI 形状
    plain_explanation: |
      本讲的 client 使用 `/v1/completions`，因为 patch prompt 是 raw text completion 形状。vLLM 的 completion serving 会校验 request，计算 max_tokens，把 request 转成 sampling params，并把结果转换回 OpenAI completion response。SGLang 的 HTTP server 也暴露 `/v1/completions` 和 `/v1/chat/completions`。

      真实评测时，如果模型需要 chat template，就应使用 chat endpoint 或在 harness 中显式包装 chat prompt。endpoint 形状错时，质量问题可能来自 prompt wrapper，而非模型本身。
    mental_model: |
      OpenAI-compatible API 是 harness 和 serving backend 之间的插座；插头形状不匹配，评测结果就失真。
    why_it_matters: |
      同一个模型在 completion 和 chat prompt 下可能表现不同，报告必须写清 endpoint 和 prompt 形状。
    source_refs:
    - title: sampling params
      repo_path: github_repo/vllm/vllm/entrypoints/openai/completion/serving.py
      lines:
      - 156
      - 165
      note: |
        L156-L165: request 转成 beam search 或 sampling params。
    - title: non-streaming collect
