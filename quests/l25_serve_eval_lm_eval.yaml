lesson:
  opening: |
    # 第 26 讲：Serving Eval · OpenAI-Compatible GSM8K Harness

    本讲处理推理服务的质量评测闭环。Serving 优化只看吞吐和延迟时，容易漏掉格式漂移、数值错误、stop 缺失、timeout 和 prompt 泄漏。L26 先用 CPU-safe patch 写清最小 evaluation harness：切分 few-shot examples 和 eval items，构造 prompt，调用 completion client，计算 exact 与 first-number 指标，并保存每样本记录。

    课程按“系统地图 -> 主讲义 -> 源码带读 -> quiz -> patch -> stub eval -> 课后产物”的顺序组织。lab 只检查最小 harness，真实评测还要结合模型、endpoint、生成参数、完成率、服务日志和硬件条件。
  sections:
  - title: 课程定位：服务优化之后要证明质量没有回退
    plain_explanation: |
      L26 属于 Serving systems 的质量闭环。前面的量化、spec decode、调度和 cache 优化都会改变服务行为；评测 harness 的作用是把“服务是否仍答对”写成可执行证据。这个证据要包含配置、样本、prompt、prediction、打分函数、聚合指标和命令。

      本讲 patch 使用 stub client，保证 CPU 上也能验证 harness 行为。真实服务评测需要切换到 vLLM 或 SGLang 的 OpenAI-compatible endpoint，并保留服务端配置。
    mental_model: |
      把 serving eval 看成一条账本：输入样本进入 prompt builder，completion endpoint 产出 prediction，scorer 写入每样本记录，runner 汇总指标和 artifact。
    why_it_matters: |
      没有质量闭环时，性能优化无法上线；任何速度数字都要和质量、完成率和复现条件一起看。
    source_refs:
    - title: run evaluation
      repo_path: labs/l25_serve_eval_lm_eval/patch/starter/eval_harness.py
      lines:
      - 36
      - 46
      note: |
        L36-L41: `run_evaluation` 的输入足以连接本地 stub 或真实 endpoint。
        L42-L46: TODO 明确要求输出聚合指标和 samples。
    - title: run setup
      repo_path: labs/l25_serve_eval_lm_eval/scripts/run_eval.py
      lines:
      - 103
      - 113
      note: |
        L103-L110: CLI 和 config 决定本次评测条件。
        L111-L113: command 和 prediction 写入运行目录。
    - title: resolved config
      repo_path: labs/l25_serve_eval_lm_eval/scripts/run_eval.py
      lines:
      - 114
      - 117
      note: |
        L114-L117: resolved config 写入运行目录。
    common_confusions:
    - 只写一个最终分数，不保留样本级证据。
    - 把 stub eval 的通过结果当成真实模型质量结论。
    checkpoint_questions:
    - serving eval 报告为什么必须包含 command 和 config？
    - stub eval 能证明什么，不能证明什么？
  - title: Patch 合同：shots、prompt、client 和 samples
    plain_explanation: |
      `items[:n_shots]` 是 few-shot examples，`items[n_shots:]` 才是 eval items。`format_few_shot_prompt` 要保持 shots 顺序，最后以待评测 question 的 `Answer:` 结束。`run_evaluation` 对每个 eval item 构造 prompt，调用 `client.complete(prompt, max_tokens=max_tokens, stop=["Question:"])`，再把 prediction 和两个指标写入 samples。

      `n_total` 必须等于 eval items 数量，不包含 shots。这个字段既影响完成率，也能防止少跑样本时只看分数。
    mental_model: |
      few-shot examples 是上下文，不是评测对象；eval items 才进入分母。
    why_it_matters: |
      shot 泄漏、样本数错误和 prompt 顺序错误都会让评测分数失真。
    source_refs:
    - title: few-shot prompt
      repo_path: labs/l25_serve_eval_lm_eval/patch/reference/eval_harness.py
      lines:
      - 37
      - 49
      note: |
        L37-L42: prompt 从 system 和空行开始。
        L43-L49: shots 按顺序写入，最后以 `Answer:` 结尾。
    - title: sample scoring
      repo_path: labs/l25_serve_eval_lm_eval/patch/reference/eval_harness.py
      lines:
      - 65
      - 69
      note: |
        L65-L69: 每条 eval item 构造 prompt、调用 client 并评分。
    - title: sample record
      repo_path: labs/l25_serve_eval_lm_eval/patch/reference/eval_harness.py
      lines:
      - 70
      - 78
      note: |
        L70-L78: samples 保留 question、reference、prediction 和命中标记。
    - title: prompt order
      repo_path: labs/l25_serve_eval_lm_eval/patch/tests/test_patch.py
      lines:
      - 48
      - 57
      note: |
        L48-L54: 测试构造 Q1、Q2、Q3 的 prompt。
        L55-L57: 断言顺序、结尾和 system。
    common_confusions:
    - 把 few-shot examples 也算进 `n_total`。
    - 不保存 per-sample prediction，导致无法排查错误类型。
    checkpoint_questions:
    - '`items` 有 6 条、`n_shots=2` 时，`n_total` 应该是多少？'
    - samples 至少要包含哪些字段？
  - title: Scoring：exact 和 numeric 指标解释不同问题
    plain_explanation: |
      exact match 对格式敏感，适合检查模型是否严格按要求输出。first-number match 抽取 prediction 和 reference 的第一个数字，适合隔离“数值对但格式不同”的场景。两者都低时，要查 prompt、模型能力、endpoint、timeout 和生成参数。

      本讲 patch 使用 first number，是为了让最小测试可手算。真实 GSM8K 常见做法是用 final answer delimiter 或 last number extraction，因为推理文本中间可能有多个数字。
    mental_model: |
      exact 是格式尺，numeric 是数值尺；两把尺一起看，才能判断错误来自格式还是答案本身。
    why_it_matters: |
      只看 exact 可能误判格式问题，单看 numeric 又可能放过任务格式错误。
    source_refs:
    - title: number cleaning
      repo_path: labs/l25_serve_eval_lm_eval/patch/reference/eval_harness.py
      lines:
