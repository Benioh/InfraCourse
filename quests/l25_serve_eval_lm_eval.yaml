  - title: Artifact：评测结论必须能追溯到样本
    plain_explanation: |
      `run_eval.py` 会写 `command.sh`、`config.resolved.yaml`、`metrics.jsonl`、`artifacts/eval_summary.json` 和 `report.md`。这些文件让评测结论可以被复查：命令和配置说明条件，metrics 保存每样本结果，summary 给出聚合分数和完成情况，report 给人读。

      如果评测失败，脚本会写 fallback artifact。真实服务评测还应该保留服务端日志、服务启动命令和模型版本。
    mental_model: |
      Artifact 是评测的审计日志。没有 artifact 的分数无法定位错误，也难以比较两次实验。
    why_it_matters: |
      质量回退排查需要看具体样本，而不是只看聚合分数。
