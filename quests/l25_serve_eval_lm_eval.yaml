    common_confusions:
    - exact 为 0 就断定模型完全不会。
    - numeric 高就忽略输出格式要求。
    checkpoint_questions:
    - exact 低、numeric 高时，优先抽查什么？
    - 为什么真实 GSM8K 可能不用 first number？
  - title: Prompt、stop 和 deterministic eval
    plain_explanation: |
      Deterministic serving eval 要固定 temperature、top_p、max_tokens、stop sequence、模型版本和题目顺序。对于 completion API，stop sequence 常用 `Question:`，用于阻止模型继续生成下一题。缺少 stop 会污染 parser，尤其是 first-number 或 exact 这种依赖输出文本形状的指标。

      本讲 `OpenAIClient` 固定 temperature 为 0，并把 stop 写入 payload。真实服务中，completion 和 chat endpoint 的 prompt 形状不同，必须保证 harness 和 endpoint 匹配。
    mental_model: |
      Prompt 规定输入形状，stop 规定输出边界，temperature 规定随机性；三者共同决定评测是否可复现。
    why_it_matters: |
      很多评测波动来自生成设置，而非模型能力变化。
    source_refs:
    - title: OpenAI payload
      repo_path: labs/l25_serve_eval_lm_eval/scripts/run_eval.py
      lines:
