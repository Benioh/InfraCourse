  - title: 真实 eval 对照：SGLang 任务和 sampler
    plain_explanation: |
      SGLang 的 GSM8K eval 展示了生产评测常见结构：任务类负责数据、prompt、答案抽取和聚合；sampler 负责 OpenAI-compatible API 调用；统一 run_eval 负责选择任务、记录 latency、throughput 和统一 metric。

      L26 patch 是这个结构的缩小版。它保留了数据切分、prompt、client、parser 和 metric，省略了并发、retry、任务 registry、HTML report 和多任务 parser。
    mental_model: |
      真实 eval 把任务逻辑和模型调用拆开；patch 把两者压缩成一个可测试的最小环。
    why_it_matters: |
      读懂这种拆分后，学生可以把 L26 harness 扩展到 MMLU、HumanEval 或业务数据集。
    source_refs:
    - title: leakage boundary
      repo_path: github_repo/sglang/python/sglang/test/simple_eval_gsm8k.py
