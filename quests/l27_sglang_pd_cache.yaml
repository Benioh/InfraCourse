lesson:
  opening: |
    # 第 28 讲：SGLang PD Disaggregation

    这一讲讲 prefill/decode 分离里的最小控制面。请求进入 PD 服务后，要先根据 prefix cache 命中估算 prefill 工作量，再分别选择 prefill 和 decode worker，随后记录 KV handoff，并在 complete 时释放 worker load。L28 的 patch 不启动真实 SGLang server，它训练的是 PD 系统中最容易漏掉的状态不变量。

    新版课程按“系统地图 -> 主讲义 -> 源码带读 -> notebook -> quiz -> patch -> drill -> 课后产物”的顺序组织。lab 只检查最小合同：route、transfer、metrics、transfer history 和 complete。
  sections:
    - title: 课程定位：从观测字段到状态来源
      plain_explanation: |
        L27 已经讲过 queue、KV transfer、cache hit-rate 和 worker load 应如何观测。L28 继续回答这些字段从哪里来：一个请求如何进入 prefill worker，cached prefix 如何改变 prefill token 数，KV transfer 如何记录 prefill 到 decode 的交接，complete 如何释放 active load。

        这节课仍在 Serving 章内。它是 SGLang PD 分离的最小控制面，不处理真实网络传输、GPU KV page 或 router service discovery。学生要先掌握不变量，再去读真实 SGLang 的 RadixCache、Req prefix match、disagg queue 和 bootstrap service。
      mental_model: |
        把 PD 服务看成调度台：route 挑两侧 worker，transfer 写交接单，metrics 出账本，complete 结清活跃占用。
      why_it_matters: |
        PD 分离会把一个请求拆成跨 worker 流水线。状态不闭合时，TTFT、ITL、queue 和 cache 指标都会变得难解释。
      common_confusions:
        - 把 PD 当成启动参数，忽略 route 和 KV handoff 的中间状态。
        - 只看 prefill saving，不看 decode worker load 和 transfer/request。
        - complete 后把 transfer history 一起清掉。
      checkpoint_questions:
        - L28 连接 L27 的哪些观测字段？
        - patch 不模拟真实 SGLang 的哪些生产细节？
        - 为什么 route 和 complete 必须成对考虑？

    - title: 数据模型：active route 与 transfer history 分开
      plain_explanation: |
        Patch 的三个 dataclass 分别对应三类事实。`Worker` 保存当前资源占用；`KVTransfer` 保存历史 handoff；`DisaggRoute` 保存 active request 在两侧 worker 和 token 数上的状态。`self.routes` 是当前活跃请求表，`self.transfers` 是历史交接列表。

        这个区分决定 complete 的行为。complete 应释放 active route 和 worker load，但不应删除历史 transfers。否则事故复盘时无法证明请求是否产生过 handoff。
      mental_model: |
        route 是当前占用，transfer 是审计流水。结算时清占用，不清流水。
      why_it_matters: |
        很多 PD 故障来自状态混淆：把历史当当前会误判 worker 忙，把当前当历史会丢审计证据。
      source_refs:
        - title: Worker state
          repo_path: labs/l27_sglang_pd_cache/patch/reference/disagg_service.py
          lines: [8, 13]
          note: |
            L8: `Worker` 建模 prefill/decode 资源角色。
            L9-L11: id 和 role 标识 worker。
            L12-L13: load 和 active request 是 route/complete 的核心状态。
        - title: KVTransfer state
          repo_path: labs/l27_sglang_pd_cache/patch/reference/disagg_service.py
          lines: [16, 21]
          note: |
            L16-L21: `KVTransfer` 保存一次 handoff。
      common_confusions:
        - complete 后清空 `self.transfers`。
        - 用 transfer history 代表当前 worker load。
        - 只保存 request id，不保存 token 字段。
      checkpoint_questions:
        - active route 和 transfer history 分别服务什么问题？
        - '`DisaggRoute` 中哪些字段用于 complete？'
        - '`KVTransfer` 中哪些字段用于排查 transfer lost？'

    - title: Prefix Cache：减少 prefill 工作量
      plain_explanation: |
        Prefix cache 命中表示一段 prompt 的 KV 已经可复用。L28 的整数模型把真实 prefix match 结果压缩成 `cached_prefix_tokens`。因此 prefill 侧要新算的 token 是 `prompt_token_count - cached_prefix_tokens`。

        Decode 侧仍要拥有完整历史上下文对应的 KV。本讲把 `kv_transfer_tokens` 记成 prompt token 数，防止把 prefill saving 错当成 decode handoff 成本也消失。
      mental_model: |
        Prefix cache 减少“还要算多少”，KV transfer 记录“decode 侧要接手多少历史上下文”。
      why_it_matters: |
        cache on/off 的收益必须拆阶段解释。只看总延迟或只看 prefill saving，容易漏掉 decode transfer queue 或 worker load 问题。
      source_refs:
        - title: MiniInfra match_prefix
          repo_path: mini_infra/sglang/srt/mem_cache/radix_cache.py
          lines: [60, 72]
          note: |
            L60: prefix cache 查询入口。
            L61-L68: 沿 token 序列查找 radix tree。
            L69-L71: 命中 value 时更新最长命中长度。
            L72: 返回 matched prefix length。
        - title: MiniInfra scheduler prefill record
          repo_path: mini_infra/sglang/srt/managers/scheduler.py
          lines: [40, 50]
          note: |
            L40-L45: prefill 记录写入 matched prefix tokens。
            L46-L48: 生成 token 后把完成请求写回 cache。
            L49-L50: 返回 prefill、decode 和 cache hit 记录。
        - title: SGLang Req prefix match
          repo_path: github_repo/sglang/python/sglang/srt/managers/schedule_batch.py
          lines: [1013, 1021]
          note: |
            L1013: tree cache 存在时才做 prefix match。
            L1014-L1015: 根据 cache 能力设置 cow_mamba。
            L1016-L1021: 调用 `tree_cache.match_prefix`。
      common_confusions:
        - 认为 cached prefix 会让 transfer token 数归零。
        - 把 cache hit 次数当成 cached prefix token 数。
        - 忽略真实 SGLang 中的 namespace 和 page alignment。
      checkpoint_questions:
        - 128 token prompt 命中 32 token prefix 时，prefill tokens 和 transfer tokens 分别是多少？
        - cache on 没有降低 prefill tokens，优先查哪些字段？
        - 真实 SGLang 中 `extra_key` 会影响哪类命中？

    - title: Route：校验、算量、选 worker、记录 handoff
      plain_explanation: |
        `route_request` 是 L28 patch 的主路径。它先校验 request id、重复 route、prompt token 和 cached prefix 边界；再计算 prefill 工作量；再分别选择 least-loaded prefill/decode worker；随后更新两侧 load 和 active request，调用 `transfer_kv`，保存并返回 route。

        Least-loaded 的排序 key 是 `(load_tokens, active_requests, worker_id)`。这让负载相同时选择稳定，便于测试和复盘。
      mental_model: |
        route 的顺序是“先校验，再记账，再交接，再登记”。任何一步省略都会留下不可复查状态。
      why_it_matters: |
        router misroute、decode starvation 和 metrics skew 都会在 route 阶段埋下种子。最小实现也必须保证两侧状态一致。
      source_refs:
        - title: Route validation
          repo_path: labs/l27_sglang_pd_cache/patch/reference/disagg_service.py
          lines: [76, 83]
          note: |
            L76-L83: 校验空 id、重复 request、非正 prompt 和 cached prefix 越界。
        - title: Route state update
          repo_path: labs/l27_sglang_pd_cache/patch/reference/disagg_service.py
          lines: [85, 95]
          note: |
            L85: 计算 prefill tokens。
            L86-L87: 选择两侧 least-loaded worker。
            L89-L92: 更新 worker load 和 active request。
            L93-L95: 记录 KV transfer。
        - title: Least-loaded test
          repo_path: labs/l27_sglang_pd_cache/patch/tests/test_patch.py
          lines: [36, 46]
          note: |
            L36: 测试 least-loaded 选择。
            L38-L43: 两次 route 产生不同 worker load。
            L44-L46: 第二个请求应选择负载更低的 worker。
      common_confusions:
        - 只选择 prefill worker，不看 decode worker。
        - 更新 load 后才做输入校验。
        - route 后忘记调用 transfer。
      checkpoint_questions:
        - 为什么 route 要拒绝重复 request id？
        - prefill worker 和 decode worker 分别增加哪个 token 数？
        - '`active_requests` 在 tie-break 中解决什么问题？'

    - title: Transfer、Metrics 和 Complete
      plain_explanation: |
        `transfer_kv` 追加历史 handoff；`metrics` 把 active route 和 transfer history 折叠成排障字典；`complete_request` 释放 active load。三者配合后，drill 才能回答：每个 request 是否有一条 transfer，cache on 是否减少 prefill tokens，worker load 是否在 complete 后归零。

        Metrics 中要同时保留 `prefill_tokens`、`cached_prefix_tokens`、`tokens_transferred`、`tokens_by_prefill_worker`、`tokens_by_decode_worker` 和 `worker_loads`。只保留总 transfer 数无法判断哪侧 worker 热，也无法核对 cache saving。
      mental_model: |
        transfer 是流水，metrics 是报表，complete 是结算。
      why_it_matters: |
        PD 故障经常跨越 route、transfer 和 complete。拆开指标后，才能定位丢交接、重复交接和 load 泄漏。
      source_refs:
        - title: Transfer implementation
          repo_path: labs/l27_sglang_pd_cache/patch/reference/disagg_service.py
          lines: [109, 121]
          note: |
            L109-L115: `transfer_kv` 接收 handoff 参数。
            L116-L121: 校验 request、worker 和 token count。
        - title: Metrics implementation
          repo_path: labs/l27_sglang_pd_cache/patch/reference/disagg_service.py
          lines: [128, 139]
          note: |
            L128: metrics 入口。
            L129-L130: 准备 worker 聚合表。
            L131-L139: 遍历历史 transfers 聚合两侧 token。
        - title: Complete implementation
          repo_path: labs/l27_sglang_pd_cache/patch/reference/disagg_service.py
          lines: [163, 172]
          note: |
            L163-L166: complete 弹出 active route，unknown request no-op。
            L167-L168: 找回两侧 worker。
            L169-L172: 回收 load 和 active request。
      common_confusions:
        - complete 后删除 transfer history。
        - metrics 只返回 worker loads。
        - unknown request complete 抛错。
      checkpoint_questions:
        - complete 后 `kv_transfers` 为什么仍可能大于 0？
        - '`tokens_by_prefill_worker` 和 `worker_loads` 有什么区别？'
        - transfer token count 为 0 会破坏哪条证据链？

    - title: Drill：cache off/on 的证据链
      plain_explanation: |
        Drill 先生成 cache off workload，再生成 cache on workload。每个 pass 都创建新的服务，逐请求 route，写一行 route metrics，随后 complete 所有请求。最后计算 prefill saving、transfer/request 范围和 worker drain 结果。

        这个 drill 不代表真实性能。它验证的是证据链形状：cache on 应该减少 prefill tokens，每个 request 应该恰好一条 transfer，complete 后 worker loads 应该归零。
      mental_model: |
        Patch tests 查函数局部语义，drill 查函数组合后的 run 证据。
      why_it_matters: |
        真实 benchmark 也需要同样的结构：固定配置、保存 metrics、计算 acceptance、保留 artifact。
      source_refs:
        - title: Workload generation
          repo_path: labs/l27_sglang_pd_cache/scripts/run_pd_drill.py
          lines: [48, 58]
          note: |
            L48: workload 生成入口。
            L49-L53: 读取 seed、prompt 范围、cache hit rate 和 hit ratio。
            L54-L57: 生成每个请求的 prompt 与 cached token 数。
            L58: 返回请求列表。
        - title: Run pass route
          repo_path: labs/l27_sglang_pd_cache/scripts/run_pd_drill.py
          lines: [97, 105]
          note: |
            L97-L101: 创建服务。
            L102-L105: 每个请求调用 route。
        - title: Run pass metrics
          repo_path: labs/l27_sglang_pd_cache/scripts/run_pd_drill.py
          lines: [106, 113]
          note: |
            L106-L113: 写入 route metrics 的时间、pass、request 和 prompt 字段。
        - title: Run pass worker metrics
          repo_path: labs/l27_sglang_pd_cache/scripts/run_pd_drill.py
          lines: [114, 119]
          note: |
            L114-L119: 写入 cached prefix、prefill 和 worker 字段。
        - title: Acceptance
          repo_path: labs/l27_sglang_pd_cache/scripts/run_pd_drill.py
          lines: [138, 145]
          note: |
            L138-L141: 计算 prefill saving。
            L143-L145: 检查 saving 阈值。
        - title: Acceptance transfer and drain
          repo_path: labs/l27_sglang_pd_cache/scripts/run_pd_drill.py
          lines: [146, 153]
          note: |
            L146-L150: 检查 transfer/request 和 drained loads。
            L152-L153: 汇总 overall。
      common_confusions:
        - patch-test 通过后不跑 drill。
        - saving 达标就忽略 transfer/request。
        - complete 后只看 active_requests，不看 worker_loads。
      checkpoint_questions:
        - Drill 的三个 acceptance 分别验证什么？
        - 为什么 cache off 和 cache on 要使用同一类 workload？
        - '`pd_drill.json` 中哪些字段最能定位 complete 漏释放？'

    - title: 真实 SGLang 对照
      plain_explanation: |
        真实 SGLang 的 prefix cache、request 初始化和 PD queue 都比 patch 复杂。RadixCache 要处理 namespace、page alignment 和 KV indices；Req 会把 prefix match 结果写回自身；scheduler 根据 disaggregation mode 把请求送入 waiting、prefill bootstrap、decode prealloc 或 decode transfer 相关队列；bootstrap service 负责 prefill 侧 KV 交接入口。

        L28 的价值是给这些复杂代码一条最小阅读线：先找 prefix match，再找请求进入哪条 queue，再找 KV handoff，再找 queue/worker 指标。
      mental_model: |
        真实 SGLang 是 L28 patch 的生产扩展版：同样的状态边界，多了 page、rank、backend、queue 和 failure recovery。
      why_it_matters: |
        只会启动 PD 服务，不等于能排查 PD 服务。读懂这些源码落点后，看到 p99 或 ITL 退化时才能判断慢在 cache、route、transfer 还是 decode queue。
      source_refs:
        - title: SGLang match_prefix
          repo_path: github_repo/sglang/python/sglang/srt/mem_cache/radix_cache.py
          lines: [449, 457]
          note: |
            L449-L455: 禁用或空 key 返回空命中。
            L457: 调用 radix tree helper。
        - title: Scheduler add request queue
          repo_path: github_repo/sglang/python/sglang/srt/managers/scheduler.py
          lines: [2144, 2152]
          note: |
            L2144-L2152: NULL mode 进入普通 waiting queue。
        - title: Scheduler PD request queues
          repo_path: github_repo/sglang/python/sglang/srt/managers/scheduler.py
          lines: [2153, 2158]
          note: |
            L2153-L2158: PREFILL mode 进入 prefill bootstrap queue。
        - title: Scheduler decode queue
          repo_path: github_repo/sglang/python/sglang/srt/managers/scheduler.py
          lines: [2159, 2166]
          note: |
            L2159-L2164: DECODE mode 进入 decode prealloc queue。
            L2165-L2166: 非法 mode 直接报错。
        - title: SGLang bootstrap service
          repo_path: github_repo/sglang/python/sglang/srt/managers/disagg_service.py
          lines: [14, 26]
          note: |
            L14-L16: bootstrap service 入口接收 server args。
            L17-L20: 读取 mode 和 transfer backend。
            L21-L26: PREFILL mode 选择 bootstrap server class。
      common_confusions:
        - 把 L28 的整数 token count 当成真实 KV 字节量。
        - 只看 waiting queue，忽略 disagg queues。
        - 认为 bootstrap service 等同于 router。
      checkpoint_questions:
        - 真实 SGLang 的 prefix match 结果写回 request 的哪些字段？
        - PREFILL 和 DECODE mode 分别把请求送入哪条队列？
        - 为什么 idle 判断要看 disagg queues？
