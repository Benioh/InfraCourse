id: l27_sglang_pd_cache
title: L28 · SGLang PD Disaggregation：Prefix Cache、KV Transfer 与 Worker Load
level: L28
act: 第 3 章：推理服务
role: SGLang 调度学徒
priority: 核心
estimated_minutes: 120
no_gpu_friendly: true

frameworks:
  - SGLang
  - MiniInfra
  - Python stdlib

patch:
  description: |
    实现 SGLang-shaped DisaggregationService：route request、计算 cached prefix 后的
    prefill 工作量、记录 prefill 到 decode 的 KV transfer，并暴露 worker load 指标。
  task_md: labs/l27_sglang_pd_cache/patch/task.md
  starter_file: labs/l27_sglang_pd_cache/patch/starter/disagg_service.py
  reference_file: labs/l27_sglang_pd_cache/patch/reference/disagg_service.py
  test_command: IMPL=reference make patch-test M=l27_sglang_pd_cache
  status_file: labs/l27_sglang_pd_cache/patch/.last_run.json
  test_count: 7
  test_kind: PD route / KV transfer / worker load 语义验证

lesson_docs:
  - title: 系统地图
    path: labs/l27_sglang_pd_cache/system_map.md
    description: L28 在 Serving PD、prefix cache、KV transfer 和 worker load 链路中的位置。
  - title: 主讲义
    path: labs/l27_sglang_pd_cache/lecture.md
    description: 从 PD 执行模型、prefix cache 影响范围、route/transfer/complete 不变量讲到 SGLang 对照。
  - title: 源码带读讲义
    path: labs/l27_sglang_pd_cache/source_walkthrough.md
    description: 按 patch、MiniInfra、真实 SGLang RadixCache、Req prefix match 和 disagg queues 组织源码阅读。

