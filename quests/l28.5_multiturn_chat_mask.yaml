mini_infra_targets: []
notebooks:
  - notebooks/n23_chat_template_multiturn.ipynb
tickets:
  - multiturn_default_system_leak
  - multiturn_think_dropped
  - multiturn_tool_loss_leak
  - multiturn_user_loss_leak
  - multiturn_delta_empty
