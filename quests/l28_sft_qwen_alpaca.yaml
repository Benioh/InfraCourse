patch:
  description: |
    实现 SFT 的最小数据合同：chat messages 编码为 input_ids，prompt labels 写 -100，
    assistant labels 保留 token id，pad 和 EOS 边界可测，loss 对齐 PyTorch cross entropy。
  task_md: labs/l28_sft_qwen_alpaca/patch/task.md
  starter_file: labs/l28_sft_qwen_alpaca/patch/starter/sft_pipeline.py
  reference_file: labs/l28_sft_qwen_alpaca/patch/reference/sft_pipeline.py
  test_command: IMPL=reference make patch-test M=l28_sft_qwen_alpaca
  status_file: labs/l28_sft_qwen_alpaca/patch/.last_run.json
  test_count: 8
  test_kind: tokenization + loss mask + CE 数值合同

