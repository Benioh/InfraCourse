lesson:
  opening: |
    L29 讲 SFT 的数据入口。训练代码最终只看到 `input_ids`、`labels` 和 `attention_mask`，但这些字段来自 chat messages、tokenizer、EOS、pad 和截断策略。只要 loss mask 错位，后面的 DPO、PPO 或 GRPO 都会继承错误的监督信号。

    本讲把问题压到两个函数：`tokenize_chat_with_loss_mask` 和 `sft_loss`。学生要能解释每个 token 为什么进入或不进入 loss，并能用 CPU smoke 产出可复查 artifacts。
  sections:
    - title: 系统位置
      plain_explanation: |
        SFT 位于 RLHF/RL 之前。它把 pretrained LM 调到能按 chat prompt 回答的状态，后续偏好优化和 RL 才有可用起点。L29 不训练真实大模型，而是先锁住 SFT 数据合同：messages 经过 tokenizer 后，哪些位置作为条件，哪些位置作为目标。
      mental_model: |
        SFT 数据处理像给一段 token 序列盖 mask：prompt 盖住，assistant 露出，pad 移出计算。
      why_it_matters: |
        prompt 泄漏进 loss 会让模型学复述问题；assistant 被 mask 掉会让样本没有监督；pad 进 loss 会污染训练目标。
      source_refs:
        - title: starter validation
          repo_path: labs/l28_sft_qwen_alpaca/patch/starter/sft_pipeline.py
          lines: [13, 25]
          note: |
            L13-L16: 空输入直接报错。
            L17-L25: role 和结尾 assistant 决定样本是否合法。
      common_confusions:
        - 把 SFT 数据问题当成模型能力问题。
        - 只看 loss 下降，不检查 labels。
        - 忽略训练模板和推理模板的一致性。
      checkpoint_questions:
        - SFT 在偏好优化和 RL 之前解决什么问题？
        - L29 patch 只验收哪两个函数？
        - prompt token 为什么仍要输入模型？

    - title: 三个序列
      plain_explanation: |
        `input_ids`、`labels` 和 `attention_mask` 必须等长。`input_ids` 是模型输入，`labels` 是训练目标，`attention_mask` 标出 pad。prompt 位置的 labels 是 `-100`，assistant 位置的 labels 等于 token id，pad 位置 labels 也是 `-100`，但 attention mask 为 `0`。
      mental_model: |
        同一个 token 位置有三张表：输入表、目标表、可见性表。
      why_it_matters: |
        这三个序列只要错位，训练还能运行，但优化目标已经变了。
      source_refs:
        - title: reference assistant labels
          repo_path: labs/l28_sft_qwen_alpaca/patch/reference/sft_pipeline.py
          lines: [52, 63]
          note: |
            L52-L57: 初始化输出并编码当前 message。
            L58-L63: assistant token 和 EOS 都进入 labels。
        - title: reference prompt labels
          repo_path: labs/l28_sft_qwen_alpaca/patch/reference/sft_pipeline.py
          lines: [64, 70]
          note: |
            L64-L65: prompt token labels 写 -100。
            L67-L70: 截断时 input_ids 和 labels 同步处理。
        - title: reference padding
          repo_path: labs/l28_sft_qwen_alpaca/patch/reference/sft_pipeline.py
          lines: [71, 78]
          note: |
            L71-L72: attention mask 覆盖真实 token。
            L73-L78: pad 位置同步补齐三个列表。
      common_confusions:
        - 把 attention mask 当成 loss mask。
        - pad id 与 EOS id 相同就放弃区分语义。
        - 截断 input_ids 后忘记同步截断 labels。
      checkpoint_questions:
        - "`labels[i]` 有哪些合法含义？"
        - pad 位置的 attention mask 和 label 分别是什么？
        - assistant EOS 为什么进入 loss？

    - title: Chat Template 简化
      plain_explanation: |
        L29 patch 用 `<|role|>{content}` 模拟 chat template。这个设计足够验证 role、assistant-only labels、EOS 和 pad。真实模板会插入模型专属 prefix、suffix、stop string 和默认 system，甚至根据历史消息改变前后缀。
      mental_model: |
        L29 先把模板当成稳定字符串拼接器；真实系统里模板是带条件分支的渲染器。
      why_it_matters: |
        训练和推理模板不一致时，模型学习到的格式和线上看到的格式不同，输出会漂移。
      source_refs:
        - title: prompt assembly
          repo_path: github_repo/sglang/python/sglang/lang/chat_template.py
          lines: [43, 54]
          note: |
            L43-L46: get_prompt 按消息顺序遍历。
            L47-L54: 每条消息按 prefix、content 和 suffix 拼接。
        - title: default template
          repo_path: github_repo/sglang/python/sglang/lang/chat_template.py
          lines: [81, 90]
          note: |
            L81-L85: default 模板声明基本配置。
            L86-L90: role prefix 和 suffix 直接写在表里。
      common_confusions:
        - 认为所有模型的 chat template 格式相同。
        - 只保存 tokenized 数据，不保存 tokenizer 版本和模板。
        - 用推理 prompt 手写格式替代训练模板。
      checkpoint_questions:
        - L29 patch 为什么使用简化 role tag？
        - 真实模板的 prefix/suffix 会影响什么？
        - tokenizer 版本为什么要进入复盘记录？

    - title: Loss 函数
      plain_explanation: |
        `sft_loss` 的职责很窄：把 logits 和 labels 展平，调用 PyTorch cross entropy，并把 `-100` 作为 ignore index。本讲假设 labels 已经对齐，不在 loss 函数里做 causal shift。真实框架可能在 model forward、collator 或 trainer 内部处理 shift，读代码时要先确认接口边界。
      mental_model: |
        tokenization 决定哪些位置有 target；loss 函数只按 target 表计分。
      why_it_matters: |
        把 shift、mask 和 CE 混在一起会让错误很难定位。L29 把 mask 和 CE 先分开验证。
      source_refs:
        - title: reference CE
          repo_path: labs/l28_sft_qwen_alpaca/patch/reference/sft_pipeline.py
          lines: [81, 90]
          note: |
            L81-L84: vocab 是 logits 最后一维。
            L85-L90: cross_entropy 使用 ignore_index 和 mean reduction。
        - title: finite loss test
          repo_path: labs/l28_sft_qwen_alpaca/patch/tests/test_patch.py
          lines: [86, 94]
          note: |
            L86-L91: 测试构造含 -100 的 labels。
            L92-L94: loss 必须是有限值。
      common_confusions:
        - 在 loss 函数里重复 shift。
        - 把 `-100` 当成真实类别 id。
        - 只比较 loss 值，不确认有效 token 数。
      checkpoint_questions:
        - "`ignore_index=-100` 如何影响平均分母？"
        - L29 的 `sft_loss` 是否做 causal shift？
        - 何时需要检查有效 label 数？

    - title: Smoke 与 Artifacts
      plain_explanation: |
        CPU smoke 用 synthetic messages 和 `_CharTokenizer` 快速验证数据合同。它会写 resolved config、metrics、tokenize summary 和 report。Trainer 路径会加载真实 tokenizer、模型和数据，再把 patch 输出交给 `Dataset` 与 `Trainer`。
      mental_model: |
        CPU smoke 验证数据形状和 mask；Trainer smoke 验证真实框架连接；长训才讨论模型质量。
      why_it_matters: |
        不同验证层证明的事情不同。把 CPU smoke 写成真实训练结论，会误导后续排障。
      source_refs:
        - title: impl selector
          repo_path: labs/l28_sft_qwen_alpaca/scripts/run_sft.py
          lines: [36, 45]
          note: |
            L36-L38: 读取 IMPL。
            L39-L45: 显式选择 reference 或 starter。
        - title: tokenize metrics
          repo_path: labs/l28_sft_qwen_alpaca/scripts/run_sft.py
          lines: [137, 149]
          note: |
            L137-L146: 写 assistant token count。
            L147-L149: report 记录样本数和 accept。
        - title: trainer dataset
          repo_path: labs/l28_sft_qwen_alpaca/scripts/run_sft.py
          lines: [204, 209]
          note: |
            L204-L208: patch 函数处理每条 example。
            L209: Dataset.from_list 组装训练数据。
      common_confusions:
        - CPU smoke 通过后就认定真实 tokenizer 没问题。
        - 只看 report，不看 metrics 和 config。
        - 没记录模型与 tokenizer 版本。
      checkpoint_questions:
        - CPU smoke 产出哪些文件？
        - Trainer 路径比 CPU smoke 多验证什么？
        - 为什么 smoke 结论要写清边界？
