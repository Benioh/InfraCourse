lesson:
  opening: |
    本讲处理 rollout engine 与 training engine 的 logprob 不一致问题。完整 RL 训练中，rollout engine 负责采样，training engine 负责算损失；两边即使用同一份权重，也可能因为 decode/prefill 路径、batch shape、kernel 和归约顺序不同，对同一 token 序列给出不同 logprob。

    本关不要求启动完整 RL 训练。你要实现的是六个可独立测试的 PyTorch 算子：K3 KL 用来量化 mismatch，TIS 和 MIS 用 token-level ratio 修正 advantage，Geometric Sequence IS 把 token ratio 汇成序列权重，Veto 丢弃极端低概率样本，Batch Normalize 把一批权重的均值拉回 1。
  sections:
  - title: 目标和边界
    plain_explanation: |
      本讲的输入可以缩小成一张 token 表：rollout logprob、training logprob、advantage、loss mask 和 sequence length。K3 KL 读两组 logprob 并输出一个监控标量；TIS/MIS 读 old/new logprob 与 advantage 并输出修正后的 token contribution；Geometric IS 读 `(B,T)` logprob 与 `(B,)` 长度并输出序列权重；Veto 输出 0/1 mask；Batch Normalize 输出均值为 1 的权重。

      边界要先说清。本讲不实现 PPO loss，不做 rollout 调度，不做 Megatron/SGLang 权重同步，也不处理 context parallel 切片。patch 只验证局部算子的数值、shape、padding 和极值边界。
    mental_model: |
      先把完整 RL 系统压成 token 表，再看每个算子怎样从这张表里读字段、产生监控值、权重或 mask。
    why_it_matters: |
      真实训练崩溃时，reward 曲线通常不能直接告诉你问题来自 reward、optimizer、backend 还是 mismatch。掌握这些算子后，可以先用小张量复现 ratio 怎样进入 loss，再把结论迁移到大规模训练日志。
    source_refs:
    - title: Starter K3 TODO
      repo_path: labs/l29.5_train_infer_mismatch/patch/starter/mismatch.py
      lines:
      - 20
      - 32
      note: |
        L20-L32: starter 把 K3 的输入、公式和输出标量写成 TODO。
    - title: Starter Geometric TODO
      repo_path: labs/l29.5_train_infer_mismatch/patch/starter/mismatch.py
      lines:
      - 69
      - 80
      note: |
        L69-L80: shape 注释说明 Geometric IS 的输入是 `(B,T)`，输出是 `(B,)`。
    common_confusions:
    - 把本讲当成完整 PPO 实现；本讲只写 mismatch 修正算子。
    - 认为必须有完整 logits 才能估计 mismatch；本讲只依赖已采样 token 的 logprob。
    - 把所有 ratio 修正都理解成同一个 clip；不同算子处理的风险不同。
    checkpoint_questions:
    - 六个函数各自的输入和输出 shape 是什么？
    - 本讲没有覆盖完整 RL 系统里的哪些组件？
    - 为什么 patch 通过不能直接证明真实训练稳定？
  - title: mismatch 的来源
    plain_explanation: |
      rollout engine 通常按 decode 路径生成 token，每步处理一个新 token 并读取 KV cache。training engine 通常按 forward/prefill 路径处理完整序列。两边权重相同，但 batch shape、kernel 选择、Tensor Core 路径和归约顺序可能不同。浮点加法不满足结合律，归约顺序改变后，logits 和 logprob 可能出现差异。

      对 dense 模型，这个差异可能很小。进入 RL loss 后，它会经过 `ratio = exp(logp_new - logp_old)` 放大。MoE 模型还有离散 router，微小 logits 差异可能让 token 走到不同 expert，后续计算分支随之改变。
    mental_model: |
      同一份权重像同一组参数，decode 和 prefill 是两条执行路径。路径不同，数值累加顺序不同，输出 logprob 就可能分叉。
    why_it_matters: |
      如果不知道 mismatch 的来源，就容易把 K3 KL 上升直接归因到 reward 或学习率。理解执行路径差异后，排查时会同时看 backend 对齐、ratio 分布和修正配置。
    source_refs:
    - title: SLiME 输入校验
      repo_path: github_repo/slime/examples/train_infer_mismatch_helper/mis.py
      lines:
      - 178
      - 188
      note: |
        L178-L188: 生产代码先校验 train、rollout 和 loss mask 的序列数与 shape。
    - title: SLiME raw log ratio
      repo_path: github_repo/slime/examples/train_infer_mismatch_helper/mis.py
      lines:
      - 211
      - 216
      note: |
        L211-L216: 每条序列进入主循环后计算 `train_log_prob - rollout_log_prob`。
    common_confusions:
    - 把 mismatch 简化成 dtype 不一致；相同 dtype 也可能因执行路径不同产生差异。
    - 认为 KV cache 改变数学语义；常见问题来自 shape、kernel 和累加路径。
    - 只看平均 KL；少量极端 token 也可能让 loss 权重失控。
    checkpoint_questions:
    - decode 和 prefill 为什么容易触发不同 kernel 或归约顺序？
    - MoE router 为什么会放大微小 logits 差异？
    - logprob 与 token 序列错位时，IS 公式还可靠吗？
  - title: K3 KL 监控
    plain_explanation: |
      `compute_k3_kl(logp_p, logp_q)` 先算 `log_ratio = logp_p - logp_q`，再算 `ratio = exp(log_ratio)`，最后返回 `mean(ratio - 1 - log_ratio)`。aligned 输入会得到 0；对任意正 ratio，K3 非负。

      K3 在这里是监控仪表，不直接改 loss。它的价值是用一个标量提前暴露两套 engine 的概率分歧。看到 K3 KL 上升后，应继续拆 ratio 的最大值、分位数、mask 命中率、veto 命中率和 grad norm。
    mental_model: |
      K3 KL 像 mismatch 的温度计。它告诉你概率是否分叉，但降温要靠后面的修正或 backend 对齐。
    why_it_matters: |
      大规模 RL 训练的 reward 和 loss 常常滞后于数值问题。K3 KL 能提前提供一条更直接的 logprob 分歧证据。
    source_refs:
    - title: K3 reference
      repo_path: labs/l29.5_train_infer_mismatch/patch/reference/mismatch.py
      lines:
      - 12
      - 14
      note: |
        L12-L14: reference 把 ratio、K3 和 mean 标量输出连起来。
    - title: K3 formula test
      repo_path: labs/l29.5_train_infer_mismatch/patch/tests/test_patch.py
      lines:
      - 33
      - 42
      note: |
        L33-L42: 测试用 `log_ratio=1` 手算期望值 `e - 2`。
    common_confusions:
    - 把 `mean(logp_p - logp_q)` 当 K3；K3 还需要 `exp(log_ratio) - 1`。
    - 把 K3 当作 loss 权重；本讲把它作为监控值。
    - K3 均值小就忽略长尾；极端 ratio 可能被均值掩盖。
    checkpoint_questions:
    - '`logp_p == logp_q` 时 K3 为什么为 0？'
    - 为什么本讲禁止 `torch.distributions.kl_divergence`？
    - K3 KL 上升后，下一步要看哪些指标？
  - title: Token-level TIS 与 MIS
    plain_explanation: |
      TIS 和 MIS 都先算 `ratio = exp(logp_new - logp_old)`。TIS 使用 `clamp(ratio, lo, hi) * advantages`，ratio 越界后被压到边界但仍参与训练。MIS 构造区间 mask，越界 token 输出为 0。

      TIS 的优势是更新连续，代价是越界 token 仍有贡献。MIS 更适合切断不可信 token，代价是有效样本数下降。阈值越窄并不总是更稳，因为过窄会引入更强偏差或丢掉太多学习信号。
    mental_model: |
      TIS 是限幅器，MIS 是门禁。一个压低异常权重，一个直接阻断越界样本。
    why_it_matters: |
      ratio 长尾通常早于 reward 崩溃出现。能区分 TIS 和 MIS，才知道当前配置是在缓冲风险还是在丢弃风险样本。
    source_refs:
    - title: TIS reference
      repo_path: labs/l29.5_train_infer_mismatch/patch/reference/mismatch.py
      lines:
      - 24
      - 26
      note: |
        L24-L26: TIS 把 ratio clamp 到边界后乘 advantage。
    - title: MIS reference
      repo_path: labs/l29.5_train_infer_mismatch/patch/reference/mismatch.py
      lines:
      - 36
      - 38
      note: |
        L36-L38: MIS 用区间 mask 把越界 token 置零。
    - title: SLiME clip mode
      repo_path: github_repo/slime/examples/train_infer_mismatch_helper/mis.py
      lines:
      - 116
      - 128
      note: |
        L116-L128: 生产 clip mode 记录上下界命中率后 clamp 权重。
    - title: SLiME mask mode
      repo_path: github_repo/slime/examples/train_infer_mismatch_helper/mis.py
      lines:
      - 141
      - 147
      note: |
        L141-L147: 生产 mask mode 更新 modified mask 并清掉 padding 权重。
    common_confusions:
    - TIS 和 MIS 都只是 clamp；MIS 的越界输出是 0。
    - 忽略 advantage 的符号；ratio 缩放贡献大小，不改变 advantage 本身的正负语义。
    - 上下界越窄越好；过窄会牺牲有效样本。
    checkpoint_questions:
    - TIS 中 ratio 超过 `hi` 时输出如何变化？
    - MIS 中 ratio 落在区间外时贡献是多少？
    - 什么时候需要同时记录 clip fraction 和 mask fraction？
  - title: Geometric Sequence IS
    plain_explanation: |
      token-level ratio 没有表达整条 response 的分布偏移。sequence-level IS 会把 ratio 连乘，长序列的方差会很高。Geometric IS 折中处理：先对有效 token 的 log ratio 求均值，再取 exp。

      实现时 `logp_old` 和 `logp_new` 是 `(B,T)`，`seq_lens` 是 `(B,)`。必须用 `arange(T) < seq_lens[:, None]` 生成 mask，屏蔽 padding。输出是每条序列一个权重，shape 为 `(B,)`。
    mental_model: |
      普通 sequence IS 把倍率连乘，长序列容易放大。Geometric IS 用平均 log ratio 给整条序列一个代表权重。
    why_it_matters: |
      多轮对话和长 response 很常见。没有长度归一化时，更新可能被少数长样本主导。
    source_refs:
    - title: Geometric reference
      repo_path: labs/l29.5_train_infer_mismatch/patch/reference/mismatch.py
      lines:
      - 46
      - 52
      note: |
        L46-L52: reference 展示 mask、sum_log、denom 和 exp。
    - title: Geometric padding test
      repo_path: labs/l29.5_train_infer_mismatch/patch/tests/test_patch.py
      lines:
      - 87
      - 99
      note: |
        L87-L99: 测试用 padding 位置 99.0 验证只统计有效 token。
    - title: SLiME ratio levels
      repo_path: github_repo/slime/examples/train_infer_mismatch_helper/mis.py
      lines:
      - 192
      - 200
      note: |
        L192-L200: token、sequence、geometric 三种 level 对应不同 log ratio 聚合。
    common_confusions:
    - 对 ratio 直接求平均；本讲要求 `exp(mean(log_ratio))`。
    - 忘记 mask padding；padding 上的值可能任意。
    - 输出 `(B,T)`；本讲输出每条序列一个权重。
    checkpoint_questions:
    - 为什么 sequence-level ratio 连乘容易高方差？
    - '`seq_lens` 怎样变成 `(B,T)` mask？'
    - Geometric IS 的稳定性代价是什么？
  - title: Veto 与 Batch Normalize
    plain_explanation: |
      Veto 处理极端低概率 token。本讲用 `logp_rollout >= log(threshold)` 做保留判断，输出 0/1 mask。用 log 空间比较可以避免极小概率下先 exp 造成下溢。

      Batch Normalize 处理 batch 平均权重漂移。它把每个权重除以 batch mean，让均值回到 1，并保持相对顺序。它不会过滤异常样本，所以通常接在 TIS/MIS/Veto 之后。
    mental_model: |
      Veto 是急停，Batch Normalize 是整体音量调节。一个丢掉不可信样本，一个缩放整批权重。
    why_it_matters: |
      有些失败来自个别灾难 token，有些来自整批权重均值漂移。把二者分开，才能判断该丢样本还是该缩放 batch。
    source_refs:
    - title: Veto reference
      repo_path: labs/l29.5_train_infer_mismatch/patch/reference/mismatch.py
      lines:
      - 55
      - 62
      note: |
        L55-L62: reference 同时展示 log 阈值 veto 和 mean clamp 归一化。
    - title: Veto test
      repo_path: labs/l29.5_train_infer_mismatch/patch/tests/test_patch.py
      lines:
      - 102
