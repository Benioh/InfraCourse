  - title: 生产排查顺序
    plain_explanation: |
      生产排查先确认 token、logprob 和 loss mask 对齐，再看 K3 KL 与 ratio 分布，然后检查 TIS/MIS、veto、batch normalize 的命中率和 factor。最后再判断问题来自 backend 对齐、采样后处理、权重同步还是阈值配置。

      SLiME `mis.py` 的生产代码也沿这条线组织：先校验输入 shape，按 level 聚合 log ratio，按 mode 修改 weights 或 mask，接入 veto，再做 batch normalize 和 final stats。
    mental_model: |
      先保语义对齐，再看数值分布，最后调修正策略。顺序倒过来会把错位数据包装成看似合理的指标。
    why_it_matters: |
      RL 训练成本高，完整复现实验慢。清晰的排查顺序能让工程师先用小证据排除一批错误方向。
    source_refs:
    - title: SLiME TIS 主分支
      repo_path: github_repo/slime/examples/train_infer_mismatch_helper/mis.py
      lines:
      - 219
      - 231
      note: |
        L219-L231: TIS 主分支先算聚合 log ratio，再安全 clamp 和 exp。
    - title: SLiME RS veto
      repo_path: github_repo/slime/examples/train_infer_mismatch_helper/mis.py
      lines:
      - 258
      - 264
      note: |
        L258-L264: veto mask 被乘到 modified mask 上，影响后续样本贡献。
    - title: SLiME final stats
      repo_path: github_repo/slime/examples/train_infer_mismatch_helper/mis.py
      lines:
      - 299
      - 307
      note: |
        L299-L307: 最终 mean/min/max 写入 metrics，支持训练日志排查。
    - title: Batch norm order test
      repo_path: labs/l29.5_train_infer_mismatch/patch/tests/test_patch.py
      lines:
      - 119
      - 124
      note: |
        L119-L124: 测试确认 batch normalize 不改变权重相对顺序。
    common_confusions:
    - 只看 reward 曲线判断修正是否生效。
    - token 序列和 logprob 未对齐时继续调 IS 阈值。
    - 把算法修正等同于 backend 位级一致。
    checkpoint_questions:
    - 生产报告至少应包含哪些 ratio、veto 和 batch norm 指标？
    - 什么情况下应优先查采样后处理？
    - 什么情况下应优先做 backend 对齐，少继续调阈值？
