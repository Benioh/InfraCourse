      common_confusions:
        - CPU smoke 通过后就认为长训稳定。
        - reward parser 没自测就开始调 KL。
        - 只记录 reward，不记录 KL、entropy、长度和时间。
      checkpoint_questions:
        - reward self-test 能排除哪类错误？
