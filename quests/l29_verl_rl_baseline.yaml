        - 本地 smoke 和真实 GPU PPO 验证的边界是什么？

    - title: SLiME 对照和生产排查
      plain_explanation: |
        SLiME 的 PPO utils 展示 KL estimator、ratio clip 和 `kl_coef` 进入 returns/advantages 的位置。async train loop 展示 rollout manager、actor/critic 训练、weight sync 和 eval。小 controller 只是这条链路里的一个调节器。

        生产排查按三类问题拆开：KL 爆炸看 reference、tokenizer、mask、KL estimator、controller 和 PPO 参数；reward parse 错误看 parser self-test 和样本；rollout 慢看生成引擎、并发、长度、stop token、prefix cache、tokenizer CPU 和 weight sync。
      mental_model: |
        controller 是一个旋钮，完整 RL infra 还包含 rollout、reward、logprob、loss、权重同步和指标系统。
      why_it_matters: |
        真实故障通常跨多层。用 SLiME 对照后，学生能把 `kl_coef`、`kl_loss_coef`、`eps_clip`、reference update 和 rollout time 放回同一张系统图。
      source_refs:
        - title: returns 接收 kl_coef
          repo_path: github_repo/slime/slime/utils/ppo_utils.py
          lines: [217, 229]
          note: |
            L217-L229: returns 函数接收 `kl_coef`。
        - title: returns KL penalty
          repo_path: github_repo/slime/slime/utils/ppo_utils.py
          lines: [253, 258]
          note: |
            L253-L258: per-token KL 乘以负系数后进入 token-level reward。
        - title: PPO ratio 参数
          repo_path: github_repo/slime/slime/utils/arguments.py
          lines: [765, 773]
          note: |
            L765-L773: PPO ratio clip 参数控制 update 局部约束。
        - title: PPO KL 参数
          repo_path: github_repo/slime/slime/utils/arguments.py
          lines: [775, 779]
          note: |
            L775-L779: `kl_coef` 作用于 reward shaping。
        - title: async rollout loop
          repo_path: github_repo/slime/train_async.py
          lines: [34, 43]
          note: |
            L34-L43: 下一轮 rollout 提前启动。
        - title: actor / critic loop
          repo_path: github_repo/slime/train_async.py
          lines: [45, 53]
          note: |
            L45-L53: actor 和 critic 根据配置执行训练。
        - title: weight sync
          repo_path: github_repo/slime/train_async.py
          lines: [69, 79]
          note: |
            L69-L79: 按 interval 同步权重、eval，并清理资源。
      common_confusions:
        - 看到 `kl_coef` 就忽略 estimator、mask 和 reference 版本。
        - 把 `kl_coef` 和 `kl_loss_coef` 混成一个配置。
        - rollout 慢时只加 GPU，不检查 stop token 和长度。
      checkpoint_questions:
        - KL estimator 位于 controller 前还是后？
        - "`kl_coef`、`kl_loss_coef` 和 `eps_clip` 分别约束什么？"
        - KL 爆炸时为什么要先检查 step 0 KL？
