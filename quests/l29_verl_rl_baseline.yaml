patch:
  description: |
    实现 InstructGPT App C 风格的 adaptive KL coefficient controller：
    根据 current_kl / target_kl 的偏差调节 KL penalty 系数，并把 proportional
    error 限制在 [-0.2, 0.2]。
  task_md: labs/l29_verl_rl_baseline/patch/task.md
  starter_file: labs/l29_verl_rl_baseline/patch/starter/kl_controller.py
  reference_file: labs/l29_verl_rl_baseline/patch/reference/kl_controller.py
  test_command: IMPL=reference make patch-test M=l29_verl_rl_baseline
  status_file: labs/l29_verl_rl_baseline/patch/.last_run.json
  test_count: 5
  test_kind: 行为契约 + 数值边界

