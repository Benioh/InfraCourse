lesson:
  opening: |
    L31 讲 Adaptive KL Controller。RLHF/PPO 训练不能只看 reward：policy 偏离 reference 太远时，reward 可能上升，但输出会重复、格式投机或利用 reward parser 漏洞。本讲把 KL coefficient controller 单独拆出来，先写清公式和状态机，再用 toy GSM8K reward smoke 检查数据、奖励和指标闭环，最后对照 SLiME 源码理解真实 RL infra 的完整路径。
  sections:
    - title: 系统位置
      plain_explanation: |
        KL controller 位于 KL estimate 和 actor loss 之间。它不生成 token，不计算 reward，也不做 optimizer step。它接收 `current_kl`，把它和 `target_kl` 比较，然后输出新的 KL penalty 系数。

        这个位置决定了排障顺序。KL 异常时，先确认 reference logprob、KL estimator 和 mask 没错，再看 controller。reward 异常时，先确认 reward parser 自测通过。rollout 慢时，先拆 `rollout_time_sec` 和 `update_time_sec`。
      mental_model: |
        把 RLHF 更新看成一条信号链：rollout 产生样本，reference 给锚点，reward 给方向，KL controller 调惩罚强度，actor loss 消费这些信号。
      why_it_matters: |
        训练曲线混在一起看时，很容易把 reward、KL、rollout 和 optimizer 的问题混成一个故障。先定位 controller 的链路位置，才能缩小排查范围。
      source_refs:
        - title: run lab 指标元数据
          repo_path: labs/l29_verl_rl_baseline/scripts/run_verl_lab.py
          lines: [56, 64]
          note: |
            L56-L64: metrics 每步写入 RL 指标类型和 step。
        - title: run lab 指标数值
          repo_path: labs/l29_verl_rl_baseline/scripts/run_verl_lab.py
          lines: [65, 74]
          note: |
            L65-L74: reward、KL、entropy、长度、rollout/update 时间一起落盘。
      common_confusions:
        - 只看 reward_mean，忽略 KL、entropy 和长度。
        - 把 rollout 慢归因到 KL controller。
        - patch-test 通过后就认为真实 PPO 稳定。
      checkpoint_questions:
        - KL controller 在 RLHF 信号链中接收什么、输出什么？
        - reward 异常时为什么先跑 parser self-test？
        - rollout 慢时至少要拆哪两个时间指标？

    - title: PPO/RLHF 的约束分工
      plain_explanation: |
        policy 是训练对象，reference 是锚点，reward 给方向。PPO ratio clip 限制新旧 policy 的单次更新幅度，KL penalty 限制当前 policy 相对 reference 的漂移。

        这两类约束工作在不同层级。ratio clip 主要处理一次 update 中的 importance ratio；KL penalty 让多轮更新后 policy 仍留在 reference 附近。reward、ratio clip 和 KL penalty 需要一起看，才能判断训练是否健康。
      mental_model: |
        reward 是目标方向，ratio clip 是单步限速器，KL penalty 是相对 reference 的拉力。
      why_it_matters: |
        如果把 ratio clip 和 KL penalty 混为一个机制，调参时会误判：单步更新过猛、reference 漂移过大、reward parser 错误分别需要不同证据。
      source_refs:
        - title: KL estimator
          repo_path: github_repo/slime/slime/utils/ppo_utils.py
          lines: [12, 17]
          note: |
            L12-L17: KL estimator 接收当前 logprob、base logprob 和 estimator 类型。
        - title: ratio clip
          repo_path: github_repo/slime/slime/utils/ppo_utils.py
          lines: [124, 136]
          note: |
            L124-L136: PPO policy loss 用 ratio 和 clip 限制单次 update。
      common_confusions:
        - 认为 ratio clip 已经覆盖 KL penalty。
        - 把 reference model 当成训练对象。
        - reward 上升时不检查 KL 和 entropy。
      checkpoint_questions:
        - ratio clip 限制哪一类变化？
        - KL penalty 依赖 reference model 的哪种输出？
        - reward 上升但 KL 和 entropy 异常时，应该先怀疑哪些入口？

    - title: 控制器公式
      plain_explanation: |
        每次 update 先计算 `current_kl / target_kl - 1`。这个相对误差表示当前 KL 比目标高多少或低多少。随后把误差限制在 `[-0.2, 0.2]`，再乘以 `n_steps / horizon`，最后用乘法更新 `kl_coef`。

        `horizon` 是响应速度。horizon 越大，每次变化越小；`n_steps` 表示这次统计覆盖多少训练步。clip 限制的是 proportional error，不能把它理解成 `kl_coef` 的上下界。
      mental_model: |
        公式按四步运行：量偏差、限幅、按时间尺度缩放、乘到当前系数上。
      why_it_matters: |
        KL 爆炸可能来自 controller 反应太慢、初始系数太低、target 设置不合理，也可能来自 reward outlier 或 reference 错配。理解公式后，学生能用曲线解释配置。
      source_refs:
        - title: Starter 公式
          repo_path: labs/l29_verl_rl_baseline/patch/starter/kl_controller.py
          lines: [16, 22]
          note: |
            L16-L22: starter docstring 写出 proportional error、clip 和乘法更新。
        - title: Reference update
          repo_path: labs/l29_verl_rl_baseline/patch/reference/kl_controller.py
          lines: [12, 18]
          note: |
            L12-L18: 参考实现把公式直接落到 `update` 和 `get_coef`。
      common_confusions:
        - 用 `current_kl - target_kl` 做绝对误差。
        - 把 horizon 当成训练总步数。
        - 把 clip 当作 `kl_coef` 的取值范围。
      checkpoint_questions:
        - "`current_kl == target_kl` 时比例误差是多少？"
        - 极端 KL 为什么不会让系数瞬间翻倍？
        - horizon 变小会让 controller 反应更快还是更慢？

    - title: Patch 实现路径
      plain_explanation: |
        `__init__` 保存 `self.value`、`self.target_kl` 和 `self.horizon`。`update` 读取 `current_kl`，计算相对误差、clip 和乘法更新。`get_coef` 只返回当前状态。

        这段代码短，但状态语义很重要。不要在 update 里重置初值，不要把 `horizon / n_steps` 写反，也不要用加法替代乘法。
      mental_model: |
        controller 是一个有记忆的状态机：初始化一次，多次观测 KL，多次微调同一个系数。
      why_it_matters: |
        真实框架里 controller 往往藏在配置和训练循环里。写一次最小实现后，学生能把公式错误、KL estimator 错误和 reward 错误分开。
      source_refs:
        - title: 初始化状态
          repo_path: labs/l29_verl_rl_baseline/patch/starter/kl_controller.py
          lines: [24, 29]
          note: |
            L24-L29: `__init__` 的 TODO 对应三个内部状态。
        - title: update TODO
          repo_path: labs/l29_verl_rl_baseline/patch/starter/kl_controller.py
          lines: [31, 41]
          note: |
            L31-L41: `update` 负责状态变化，`get_coef` 负责读取。
        - title: reference 状态机
          repo_path: labs/l29_verl_rl_baseline/patch/reference/kl_controller.py
          lines: [6, 18]
          note: |
            L6-L9: 参考实现保存当前系数和目标 KL。
            L12-L18: update 后 `get_coef` 返回最新状态。
      common_confusions:
        - 每次 update 后把系数重置成初始值。
        - 把 error 直接赋给 `kl_coef`。
        - 忽略 `n_steps` 对调节幅度的影响。
      checkpoint_questions:
        - "`__init__`、`update`、`get_coef` 分别承担什么职责？"
        - 为什么用乘法更新系数？
        - 如果公式写成 `self.horizon / n_steps`，方向会错在哪里？

    - title: 测试闭环
      plain_explanation: |
        patch tests 覆盖初始、增大、减小、不变和 clip 五个合同。最关键的是 clip 测试：`current_kl` 是 target 的 100 倍时，误差先被限制到 0.2；`horizon=10` 时单步只增长 2%。

        这些测试只证明 controller 的局部数学。它们不覆盖真实 rollout、reference forward、KL estimator、advantage normalization 或 optimizer。
      mental_model: |
        五个测试把 controller 放进五个固定场景，分别观察它的方向、稳定点和极端输入反应。
      why_it_matters: |
        controller bug 往往不会立刻报错，而是在训练曲线上表现为 KL 异常。小测试先锁住公式，后续 debug 才能聚焦其他层。
      source_refs:
        - title: 初始系数测试
          repo_path: labs/l29_verl_rl_baseline/patch/tests/test_patch.py
          lines: [21, 24]
          note: |
            L21-L24: 初始系数测试检查 `get_coef`。
        - title: 方向测试
          repo_path: labs/l29_verl_rl_baseline/patch/tests/test_patch.py
          lines: [27, 38]
          note: |
            L27-L38: KL 高低分别触发增罚和减罚。
        - title: 稳定点测试
          repo_path: labs/l29_verl_rl_baseline/patch/tests/test_patch.py
          lines: [41, 45]
          note: |
            L41-L45: 目标处不更新。
        - title: clip 测试
          repo_path: labs/l29_verl_rl_baseline/patch/tests/test_patch.py
          lines: [48, 59]
          note: |
            L48-L59: 极端 KL 更新后必须精确接近 1.02。
      common_confusions:
        - 认为方向对就够了，忽略 exact clip 数值。
        - 把 patch-test 当成真实 PPO 验证。
        - 忽略 target 处不变的稳定性合同。
      checkpoint_questions:
        - 五个测试分别覆盖什么行为？
        - 为什么 extreme KL case 的结果是 1.02？
        - patch-test 通过后，还需要哪些 smoke 证据？

    - title: Reward 和本地 Smoke
      plain_explanation: |
        L31 的本地 smoke 先生成 toy GSM8K 数据，再构造 prompt/target JSONL，随后运行 reward parser self-test，并把结果写到 run 目录。`metrics.jsonl` 会记录 reward、KL、entropy、response length、rollout/update time 和吞吐。

        这条链路的目标是固定 debug 证据格式。它能证明数据、reward parser 和指标落盘闭合；真实 PPO 是否稳定，还需要 GPU 环境里的 rollout、reference logprob 和 actor update 证据。
      mental_model: |
        CPU smoke 是训练前的体检：先确认评分入口和指标出口，再把问题交给真实训练栈。
      why_it_matters: |
        reward parser 错误会污染所有 RL 指标。先做 self-test，可以避免把评分入口错误当成 KL 或 PPO 问题。
      source_refs:
        - title: toy 数据
