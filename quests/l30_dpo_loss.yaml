lesson:
  opening: |
    本讲处理 SFT 之后的偏好优化问题。输入是同一个 prompt 下的 chosen/rejected response；目标是让 policy 相对 reference 更偏向 chosen，同时保留 reference 作为分布锚点。

    本关不启动真实偏好数据训练。你要实现的是两个局部函数：completion-only logprob 抽取，以及 DPO pairwise loss。通过它们可以看清 prompt mask、reference log-ratio、reward margin、beta 和数值稳定性怎样连接。
  sections:
  - title: 目标和边界
    plain_explanation: |
      DPO 样本由 prompt、chosen response 和 rejected response 组成。prompt 是条件，chosen/rejected 是要比较的 completion。patch 的第一个函数只统计 completion token 的 logprob；第二个函数比较 policy 和 reference 对 chosen/rejected 的相对偏好。

      本讲不处理 tokenizer、真实数据加载、分布式 reference forward、checkpoint 或多轮 DPO 迭代。它只验证两个最小合同：`labels == -100` 的位置不进入 logprob，DPO loss 使用 reference log-ratio 构造稳定 pairwise loss。
    mental_model: |
      把 DPO 看成一张四列表：policy chosen、policy rejected、ref chosen、ref rejected。loss 只关心 chosen 相对 rejected 的 reference-adjusted margin。
    why_it_matters: |
      DPO 代码行数少，但常见 bug 很隐蔽。prompt 混入、方向写反或 reference 漂移都可能让 loss 看起来下降，实际优化目标已经偏离。
    source_refs:
    - title: Starter logprob
      repo_path: labs/l30_dpo_loss/patch/starter/dpo.py
      lines:
      - 8
      - 20
      note: |
        L8-L20: starter 说明 logits、labels、mask 和 log_softmax 的输入合同。
    - title: Starter DPO
      repo_path: labs/l30_dpo_loss/patch/starter/dpo.py
      lines:
      - 26
      - 38
      note: |
        L26-L38: DPO 函数签名展示四组 logprob 和 beta。
    common_confusions:
    - 把 DPO 写成只对 chosen 做交叉熵。
    - 把 prompt token 加进 completion logprob。
    - 忽略 reference 是否冻结。
    checkpoint_questions:
    - DPO patch 的两个函数分别输出什么？
    - prompt token 为什么不能进入 completion logprob？
    - patch 没覆盖哪些真实训练组件？
  - title: Completion-only logprob
    plain_explanation: |
      `compute_logps_for_completions` 接收 `[B,T,V]` logits 和 `[B,T]` labels。labels 中 `-100` 表示忽略位置。实现时先构造 mask，再把 `-100` 替换成合法 token id，随后用 `F.log_softmax` 和 `gather` 抽取目标 token logprob，最后按 mask 清零并沿时间维求和。

      safe labels 不改变 masked 位置的结果，因为这些位置在乘 mask 后贡献为 0。它只避免 `gather` 遇到非法负索引。
    mental_model: |
      先把无效格子盖住，再从 vocab 维度取出目标 token 的 logprob。盖住的位置即使临时填了 0，也不会进入最终求和。
    why_it_matters: |
      prompt 混入会让 `log π(y|x)` 被共同前缀污染。多轮数据中，tool token、padding 或 system prompt 混入也会造成类似问题。
    source_refs:
    - title: Reference logprob
      repo_path: labs/l30_dpo_loss/patch/reference/dpo.py
      lines:
      - 9
      - 15
      note: |
        L9-L15: reference 展示 mask、safe labels、log_softmax、gather 和 sum。
    - title: Prompt mask test
      repo_path: labs/l30_dpo_loss/patch/tests/test_patch.py
      lines:
      - 31
      - 42
      note: |
        L31-L42: 测试验证 mask 掉两个 prompt token 后，logprob 总和更接近 0。
    - title: SLiME token logprob
      repo_path: github_repo/slime/slime/utils/ppo_utils.py
      lines:
      - 151
      - 158
      note: |
        L151-L158: 真实 RL 工具用 fused cross entropy 抽取 token logprob。
    common_confusions:
    - 用 labels 直接 gather，忘记替换 `-100`。
    - 先 sum 再 mask，导致 prompt 贡献已经进入结果。
    - 输出 `[B,T]`；本讲要求每条样本一个 sequence logprob。
    checkpoint_questions:
    - safe labels 为什么不会影响最终结果？
    - '`labels == -100` 的 mask 应在哪一步生效？'
    - 为什么输出 shape 是 `(B,)`？
  - title: DPO reward margin
    plain_explanation: |
      DPO loss 接收四组 sequence-level logprob。先计算 policy 相对 reference 的 chosen reward 和 rejected reward，再取二者差值作为 reward margin。margin 为正时，policy 相对 reference 更偏向 chosen，loss 应下降。

      最终 loss 是 `-F.logsigmoid(reward_margin).mean()`。使用 `F.logsigmoid` 是数值边界：大负 margin 下，先 sigmoid 再 log 容易下溢。
    mental_model: |
      reference 是尺子。先量 policy 对 chosen/rejected 相对尺子的变化，再比较 chosen 是否超过 rejected。
    why_it_matters: |
      方向写反时，训练可能仍有下降曲线，但模型会被推向 rejected。大 beta 下数值下溢会把问题表现成 inf/NaN。
    source_refs:
    - title: Reference DPO
      repo_path: labs/l30_dpo_loss/patch/reference/dpo.py
      lines:
      - 25
      - 34
      note: |
        L25-L34: reference 写出 chosen/rejected reward、reward margin、loss 和返回字段。
    - title: Reward margin test
      repo_path: labs/l30_dpo_loss/patch/tests/test_patch.py
      lines:
      - 104
      - 113
      note: |
        L104-L113: 测试用手写公式验证 reward margin。
    - title: Large beta test
      repo_path: labs/l30_dpo_loss/patch/tests/test_patch.py
      lines:
      - 116
      - 125
      note: |
        L116-L125: 大 beta 下 loss 必须保持 finite。
    common_confusions:
    - 只用 `policy_chosen - policy_rejected`，丢掉 reference。
    - 把 beta 当成 optimizer learning rate。
    - 使用 `log(sigmoid)` 导致极端 margin 下数值下溢。
    checkpoint_questions:
    - policy 等于 reference 时，reward margin 为什么为 0？
    - chosen 变好时 loss 为什么下降？
    - 大 beta 测试能发现哪类 bug？
  - title: Reference 与 smoke
    plain_explanation: |
      真实 DPO 训练中，reference 通常是 SFT checkpoint 的冻结副本。smoke 脚本用 TinyLM 构造 policy 和 reference，把 reference 加载为 policy 的初始权重，并关闭梯度。合成数据把前半段 labels 设为 `-100`，模拟 prompt mask。

      这个 smoke 只能说明最小训练循环闭合：能计算四组 logprob，能调用 DPO loss，能写 metrics 和 artifact。它不说明真实偏好数据质量、chat template、reference forward 性能或输出质量。
    mental_model: |
      smoke 是一个小闭环：造数据、算四组 logprob、跑 loss、写指标。它用于检查接线，不用于证明模型已对齐。
    why_it_matters: |
      很多训练问题先出现在数据接线和 artifact 缺失。smoke 把这部分成本降到 CPU 本地可跑。
    source_refs:
    - title: Reference freeze
      repo_path: labs/l30_dpo_loss/scripts/run_dpo_smoke.py
      lines:
      - 96
      - 102
      note: |
        L96-L102: smoke 从 policy 复制 reference，并关闭 reference 梯度。
    - title: Preference labels
      repo_path: labs/l30_dpo_loss/scripts/run_dpo_smoke.py
      lines:
      - 103
      - 109
      note: |
        L103-L109: synthetic 数据把前半段 label 设为 `-100`。
    - title: Loss call
      repo_path: labs/l30_dpo_loss/scripts/run_dpo_smoke.py
      lines:
      - 111
      - 123
      note: |
        L111-L123: 训练循环计算四组 logprob 并调用 `dpo_loss`。
    common_confusions:
    - smoke 通过就代表真实数据训练稳定。
    - reference 只要初始化一样就可以继续训练。
    - 合成 chosen/rejected 能代表真实偏好质量。
    checkpoint_questions:
    - smoke 中 reference 怎样冻结？
    - smoke 写出哪些 artifact？
    - smoke 不能证明哪些生产结论？
  - title: 测试合同和排查
    plain_explanation: |
      patch-test 覆盖 logprob shape、prompt mask、手写 gather、两个 `log(2)` 基准、chosen/rejected 单调性、reward margin 公式和大 beta 数值稳定。排查时先看输入语义，再看 mask 和 reference，最后看 loss 与 artifact。

      如果 loss 下降但输出变差，先检查 chosen/rejected 是否被 swap、prompt 是否混入、reference 是否漂移。如果 loss 为 inf/NaN，先查 `F.logsigmoid`、beta 和 logprob 极值。
    mental_model: |
      DPO debug 是三层：数据方向、公式状态、数值边界。三层都过了，才讨论真实训练规模和模型质量。
    why_it_matters: |
      DPO 的错误常能伪装成正常下降曲线。测试合同和 artifact 是防止误判的最低证据。
    source_refs:
    - title: Chosen better test
      repo_path: labs/l30_dpo_loss/patch/tests/test_patch.py
      lines:
      - 79
      - 89
      note: |
        L79-L89: 测试验证 chosen 相对变好时 loss 下降。
    - title: Rejected better test
      repo_path: labs/l30_dpo_loss/patch/tests/test_patch.py
      lines:
      - 92
      - 101
      note: |
        L92-L101: 测试验证 rejected 相对变好时 loss 上升。
    - title: Metrics write
      repo_path: labs/l30_dpo_loss/scripts/run_dpo_smoke.py
      lines:
      - 128
      - 136
      note: |
        L128-L136: smoke 每步写 loss 和 reward margin mean。
    - title: Artifact write
      repo_path: labs/l30_dpo_loss/scripts/run_dpo_smoke.py
      lines:
      - 139
      - 147
      note: |
        L139-L147: smoke 写 head/tail loss、drop 和 accept。
    common_confusions:
    - 只看平均 loss，不看 reward margin。
    - 只跑 patch-test，不看 smoke artifact。
    - 只检查代码公式，不抽样看数据方向。
    checkpoint_questions:
    - 哪个测试能发现方向写反？
    - 哪个测试能发现 prompt mask 错误？
    - 一份 DPO debug 报告至少要记录哪些证据？
  - title: DPO 与 PPO 的 logprob 对照
    plain_explanation: |
      DPO 和 PPO 都依赖目标 token 的 logprob，但消费方式不同。DPO 用 chosen/rejected 相对 reference 的 log-ratio 做 pairwise preference loss。PPO 用当前策略、旧策略、advantage 和 clip 约束 rollout 更新。

      读 SLiME PPO utils 时，不要把 PPO policy loss 当 DPO 实现。它的价值是展示真实 RL 框架如何抽取 token logprob，以及 ratio/clip 这条路径和 DPO 有哪些差异。
    mental_model: |
      logprob 是共同原料。DPO 把它送进偏好对比较，PPO 把它送进 rollout ratio 和 advantage。
    why_it_matters: |
      课程前后会同时出现 DPO、PPO、GRPO。能区分 logprob 的消费方式，才能避免把不同优化目标混在一起。
    source_refs:
    - title: PPO ratio loss
      repo_path: github_repo/slime/slime/utils/ppo_utils.py
      lines:
      - 124
      - 136
      note: |
        L124-L136: PPO policy loss 使用 ratio、advantage 和 clip。
    - title: PPO dual clip
      repo_path: github_repo/slime/slime/utils/ppo_utils.py
      lines:
      - 138
      - 148
      note: |
        L138-L148: dual clip 处理 negative advantage 分支。
    - title: MiniInfra reward
      repo_path: mini_infra/rl/reward.py
      lines:
      - 21
      - 33
      note: |
        L21-L33: scalar reward 路线把 prediction 和 target 比较成 reward。
    common_confusions:
    - 把 DPO 当成 PPO 的无 rollout 版本。
    - 把 scalar reward parser 当成 DPO loss 的必需输入。
    - 看到 logprob 抽取就认为优化目标相同。
    checkpoint_questions:
    - DPO 和 PPO 分别怎样使用 logprob？
    - DPO 为什么不需要显式 reward parser？
    - scalar reward 路线和 preference pair 路线的证据有何差异？
