gpu_modes:
  local: CPU OK
  cluster: 真 vLLM/SGLang async endpoint 验证（可选）

lesson:
  opening: |
    L35 讲 RL rollout 的请求侧控制。训练侧需要 prompt、response、latency、reward-ready 字段和样本顺序；客户端需要并发提交请求，又不能把 vLLM/SGLang server 压垮。本讲用一个 CPU-safe 的 `RolloutPool` patch 讲清 `asyncio.Semaphore`、`asyncio.gather`、保序返回和异常透传，再用 rollout-only smoke 建立 artifacts 与 metrics 证据链。
  sections:
    - title: Rollout 的系统位置
      plain_explanation: |
        rollout 是 RL 训练的数据生产阶段。它从 prompt 开始，调用当前 policy 生成 response，再把样本交给 reward、logprob、KL 和 advantage 计算。L35 不做完整 PPO/GRPO，只处理 rollout 请求如何安全并发提交，以及输出如何保持样本对齐。

        本地 smoke 会写 `rollouts.jsonl`、`metrics.jsonl`、`rl.log` 和 `report.md`。这些 artifact 能证明 schema 和指标字段闭合，不能证明真实训练已经稳定。
      mental_model: |
        把 rollout 看成样本生产线：prompt 进入，response 出来，latency 和 reward-ready 字段让这批样本日后能被检查。
      why_it_matters: |
        如果 prompt/response 顺序错位，reward、KL 和 advantage 会绑定到错误样本。这个问题比请求失败更隐蔽，必须从客户端保序开始防住。
      source_refs:
        - title: mock response schema
          repo_path: labs/l31_rollout_only_smoke/scripts/run_rollout_only.py
          lines: [59, 68]
          note: |
            L59-L68: rollout 样本保存 id、prompt、response、latency 和 reward-ready 字段。
        - title: smoke metrics
          repo_path: labs/l31_rollout_only_smoke/scripts/run_rollout_only.py
          lines: [110, 122]
          note: |
            L110-L122: metrics 明确 mock_server、actor_update 和 weight_sync 边界。
      common_confusions:
        - 只看吞吐数字，不保存 rollout 样本。
        - 把 rollout-only smoke 当成完整 RL 训练。
        - 忽略 prompt/response 对齐。
      checkpoint_questions:
        - 一条 rollout 样本至少需要哪些字段？
        - 本地 smoke 能证明什么，不能证明什么？
        - 样本错位会污染哪些后续计算？

    - title: Async、限流和保序
      plain_explanation: |
        客户端并发提交 prompt，让服务端推理引擎有足够请求可调度。`max_concurrency` 限制的是客户端在途请求数，不等于服务端 GPU batch size。服务端 vLLM/SGLang 会根据 queue、KV cache、decode slot 和 finished 状态组织真实 batch。

        `asyncio.Semaphore` 控制同时进入 `generate_fn` 的协程数；`asyncio.gather` 按传入任务顺序返回结果。因此即使较短请求先完成，输出列表仍和输入 prompt 对齐。
      mental_model: |
        Semaphore 是入口闸门，gather 是结果归位器。一个管压力，一个管顺序。
      why_it_matters: |
        串行请求会让服务端缺少 batch；无上限并发会让 queue、连接池或 KV cache 先出问题。限流和保序是 rollout 客户端最基础的两个合同。
      source_refs:
        - title: reference 限流
          repo_path: labs/l31_rollout_only_smoke/patch/reference/rollout_pool.py
          lines: [18, 28]
          note: |
            L18-L28: 参考实现用 semaphore 包住 `generate_fn`，再用 gather 返回结果。
        - title: vLLM generate 返回
          repo_path: github_repo/vllm/vllm/v1/engine/async_llm.py
          lines: [568, 580]
          note: |
            L568-L580: vLLM 从 per-request queue 读取输出并 yield 给调用者。
      common_confusions:
        - 把 `max_concurrency` 当作训练 batch size。
        - 用完成顺序直接构造训练数据。
        - 在 semaphore 外调用 `generate_fn`。
      checkpoint_questions:
        - "`Semaphore` 和 `gather` 分别保证什么？"
        - 为什么客户端不手动固定 GPU batch？
        - 如果 `generate_fn` 在 semaphore 外调用，会发生什么？

    - title: Patch 实现路径
      plain_explanation: |
        `__init__` 保存生成函数和并发上限。`rollout` 先处理空输入，然后创建 semaphore 和内部 `_bounded` coroutine。`_bounded` 在 `async with sem` 内调用 `await self.generate_fn(prompt)`。最后用 `asyncio.gather(*tasks)` 收集结果。

        异常应向上传递。L35 不在 pool 内重试、吞异常或写占位 response。上层 driver 可以根据 endpoint、错误类型和 run 策略决定重试或中止。
      mental_model: |
        这是一个很小的状态机：保存配置，给每次 rollout 创建闸门，提交任务，按输入顺序收结果。
      why_it_matters: |
        真实 SLiME/vLLM/SGLang 路径会复杂很多，但客户端合同仍是限流、保序和错误可见。小 patch 把这个合同固定下来。
      source_refs:
        - title: starter 初始化
          repo_path: labs/l31_rollout_only_smoke/patch/starter/rollout_pool.py
          lines: [19, 28]
          note: |
            L19-L28: 学生需要保存 `generate_fn` 和 `max_concurrency`。
        - title: starter rollout
          repo_path: labs/l31_rollout_only_smoke/patch/starter/rollout_pool.py
          lines: [30, 42]
          note: |
            L30-L42: TODO 已列出空输入、semaphore、bounded coroutine 和 gather。
        - title: reference 状态
          repo_path: labs/l31_rollout_only_smoke/patch/reference/rollout_pool.py
          lines: [9, 16]
          note: |
            L9-L16: reference 只保存生成函数和并发上限。
      common_confusions:
        - 认为 `asyncio.create_task` 是必须项；本关 coroutine 列表交给 gather 也能运行。
        - 返回 `as_completed` 的完成顺序结果。
        - 捕获异常后返回空字符串。
      checkpoint_questions:
        - 空输入为什么要直接返回？
        - "`generate_fn` 抛错时为什么不应该吞掉？"
        - 参考实现里哪个位置真正限制了并发？

    - title: 测试闭环
      plain_explanation: |
        五个测试覆盖基本输出、保序、并发上限、空输入和异常透传。保序测试用不同 sleep 时间制造完成顺序差异；限流测试用 lock 和 counter 记录最大同时运行数量；异常测试要求 `"bad"` prompt 抛出的 `ValueError` 继续被调用者看到。

        这些测试只证明客户端合同。它们不验证真实 HTTP endpoint、server queue、KV cache、reward model 或 weight sync。
      mental_model: |
        单元测试给 async pool 放上五把尺子：内容、顺序、压力、边界输入和错误信号。
      why_it_matters: |
        async bug 很容易在少量样本里隐藏。先用测试锁住并发和顺序，后续接真实 endpoint 时才能把问题定位到 server、网络或 reward。
      source_refs:
        - title: 保序测试
          repo_path: labs/l31_rollout_only_smoke/patch/tests/test_patch.py
          lines: [34, 46]
          note: |
            L34-L46: 不同延迟下结果仍要按输入顺序返回。
        - title: 限流计数
          repo_path: labs/l31_rollout_only_smoke/patch/tests/test_patch.py
          lines: [49, 59]
          note: |
            L49-L59: counter 记录同时运行数量。
        - title: 限流断言
          repo_path: labs/l31_rollout_only_smoke/patch/tests/test_patch.py
          lines: [60, 66]
          note: |
            L60-L66: 断言最大并发不超过上限。
        - title: 异常测试
          repo_path: labs/l31_rollout_only_smoke/patch/tests/test_patch.py
          lines: [80, 90]
          note: |
            L80-L90: `"bad"` prompt 触发异常，调用者必须看到。
      common_confusions:
        - 认为能返回结果就说明并发正确。
        - 认为保序测试不影响训练。
        - 认为异常应在 pool 内消化。
      checkpoint_questions:
        - 为什么保序测试要设置不同 sleep 时间？
        - 限流测试为什么需要 lock？
        - patch-test 没覆盖哪些真实服务分支？

    - title: vLLM / SGLang 服务端对照
      plain_explanation: |
        vLLM 的 `generate` 会调用 `add_request`，为请求创建 output collector，再从 request queue 中 yield 输出。output processor 会把 engine core 的结果放回对应 request queue。

        SGLang scheduler 维护 waiting queue、running batch、cur batch 和 last batch。normal loop 接收请求、处理输入、取下一批 batch、运行 batch 并处理结果。overlap loop 进一步拆分 CPU 处理和 GPU 计算。
      mental_model: |
        客户端负责把请求送到门口并限流；服务端 scheduler 负责把这些请求组织成真正的推理批次。
      why_it_matters: |
        调 `max_concurrency` 时不能只看客户端。TTFT、queue、KV cache、running batch 和 stop token 都在服务端决定最终吞吐与延迟。
      source_refs:
        - title: vLLM add_request
          repo_path: github_repo/vllm/vllm/v1/engine/async_llm.py
          lines: [280, 292]
          note: |
            L280-L292: `add_request` 接收请求 id、prompt 和 sampling params。
        - title: vLLM output queue
          repo_path: github_repo/vllm/vllm/v1/engine/output_processor.py
          lines: [655, 660]
          note: |
            L655-L660: AsyncLLM 路径把输出放进 request queue。
        - title: SGLang running 状态
          repo_path: github_repo/sglang/python/sglang/srt/managers/scheduler.py
          lines: [993, 999]
          note: |
            L993-L999: scheduler 保存 waiting queue、running batch 和当前 batch。
        - title: SGLang normal loop 接收
          repo_path: github_repo/sglang/python/sglang/srt/managers/scheduler.py
          lines: [1468, 1475]
          note: |
            L1468-L1475: loop 接收请求并处理输入。
        - title: SGLang normal loop 运行
          repo_path: github_repo/sglang/python/sglang/srt/managers/scheduler.py
          lines: [1479, 1486]
          note: |
            L1479-L1486: 取 batch、运行 batch 并处理结果。
      common_confusions:
        - 认为 async pool 已经完成 continuous batching。
        - 只调客户端并发，不看 server queue。
        - 把 TTFT 变大误判成 reward 计算慢。
      checkpoint_questions:
        - vLLM 的 request output 如何回到对应请求？
        - SGLang waiting queue 和 running batch 各代表什么？
        - "`max_concurrency` 升高时应该同时看哪些服务端指标？"

    - title: SLiME 对照
      plain_explanation: |
        SLiME 的 async train loop 会提前启动下一轮 rollout，在当前 rollout 数据上训练 actor/critic，并按 interval 更新 rollout 侧权重。更新前先等待正在生成的任务结束，避免 generation 中途切换 policy。

        SGLang rollout 代码里，`GenerateState` 创建 semaphore；`generate_and_rm` 在 semaphore 内生成并调用 reward；`generate_and_rm_group` 用 task 和 gather 处理同组样本；`generate_rollout_async` 持续提交任务、等待先完成的 task、过滤样本，最后按样本 index 排序。
      mental_model: |
        L35 是单进程 toy driver；SLiME 是生产版 rollout driver。它多了 Ray、HTTP、reward、过滤、abort 和 weight sync，但限流、保序和样本身份仍是主线。
      why_it_matters: |
        读 SLiME 时先找 familiar pieces，可以避免被框架层淹没：semaphore 控并发，gather 收组内样本，index 排序保训练数据身份。
      source_refs:
        - title: SLiME async train
          repo_path: github_repo/slime/train_async.py
          lines: [34, 43]
          note: |
            L34-L43: 当前 rollout 取回后，下一轮 generation 提前启动。
        - title: SLiME semaphore
          repo_path: github_repo/slime/slime/rollout/sglang_rollout.py
          lines: [94, 96]
          note: |
            L94-L96: semaphore 上限来自 server concurrency 和 rollout GPU 数。
        - title: SLiME group gather
          repo_path: github_repo/slime/slime/rollout/sglang_rollout.py
          lines: [323, 333]
          note: |
            L323-L333: 同组样本创建 task，并用 gather 收集结果。
        - title: SLiME sort
          repo_path: github_repo/slime/slime/rollout/sglang_rollout.py
          lines: [460, 470]
          note: |
            L460-L470: abort 未完成请求，按样本 index 排序，并重置状态。
      common_confusions:
        - 把 Ray remote 和 Python coroutine 混成同一层。
        - 看到 FIRST_COMPLETED 就认为最终顺序无关。
        - 认为 weight sync 可以在 generation 中途随时发生。
      checkpoint_questions:
        - SLiME 为什么提前启动下一轮 rollout？
        - SLiME 在哪里限制 SGLang 请求并发？
        - 为什么最终还要按样本 index 排序？

    - title: 排障路线
      plain_explanation: |
        rollout 慢先拆阶段：客户端连接和并发、服务端 queue、生成长度、reward 后处理、weight sync、artifact 写入。reward collapse 先抽样本，看 response 是否有最终答案、reward-ready 字段是否为 true、parser 是否能解析，再看 KL、entropy 和 policy version。

        接真实 endpoint 后，一次实验只改一个变量。比如固定 prompt 集，只改 `max_concurrency`；或者固定并发，只改 `max_new_tokens`。失败 run 要保留可复现证据，不要伪造 metrics，也不要把异常改成空 response。
      mental_model: |
        先看链路，再看数字。链路断了，吞吐和 reward 曲线都没有解释价值。
      why_it_matters: |
        rollout 慢和 reward 崩溃会拖累整个 RL 训练。把客户端、服务端、reward、sync 和 artifact 分层后，修复动作才会可验证。
      source_refs:
        - title: HTTP client limit
          repo_path: github_repo/slime/slime/utils/http_utils.py
          lines: [201, 213]
          note: |
            L201-L213: HTTP client 连接上限来自 rollout concurrency。
        - title: distributed post
          repo_path: github_repo/slime/slime/utils/http_utils.py
          lines: [255, 266]
          note: |
            L255-L266: distributed POST 把连接并发分配给多个 actor。
        - title: direct ObjectRef await
          repo_path: github_repo/slime/slime/utils/http_utils.py
          lines: [275, 286]
          note: |
            L275-L286: 分布式 POST 直接 await ObjectRef，避免轮询尾延迟。
      common_confusions:
        - rollout 慢时只加 GPU。
        - reward 全 0 时先调 learning rate。
        - 为了让训练继续而吞掉 rollout 异常。
      checkpoint_questions:
        - 定位 rollout 慢时，应该先拆哪几个阶段？
        - reward collapse 时为什么先抽样本？
        - 接真实 endpoint 后，为什么一次实验只改一个变量？
