id: l31_rollout_only_smoke
title: L35 · Async Rollout Pool：并发上限、保序返回与 Rollout-only Smoke
level: L35
act: 第 4 章：RL 与对齐
role: RL 系统学徒
priority: 核心
estimated_minutes: 80
no_gpu_friendly: true
frameworks:
  - asyncio
  - vLLM / SGLang 对照
  - SLiME 对照

patch:
  description: |
    实现 RolloutPool：用 asyncio.Semaphore 限制 generate_fn 并发数；
    用 asyncio.gather 保证输出顺序与输入一致；空列表直接返回；异常向上传递。
  task_md: labs/l31_rollout_only_smoke/patch/task.md
  starter_file: labs/l31_rollout_only_smoke/patch/starter/rollout_pool.py
  reference_file: labs/l31_rollout_only_smoke/patch/reference/rollout_pool.py
  test_command: IMPL=reference make patch-test M=l31_rollout_only_smoke
  status_file: labs/l31_rollout_only_smoke/patch/.last_run.json
  test_count: 5
  test_kind: 行为契约 + 并发约束

