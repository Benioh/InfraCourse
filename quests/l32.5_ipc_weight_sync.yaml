id: l32.5_ipc_weight_sync
title: L37 · CUDA IPC Weight Sync：handle tuple 与共享 storage
level: L37
act: 第 4 章：RL 与对齐
role: RL co-locate 系统学徒
priority: 核心
estimated_minutes: 90
no_gpu_friendly: true
frameworks:
  - PyTorch
  - SGLang
  - SLiME

patch:
  description: |
    实现 CUDA IPC-shaped weight sync 的 CPU 模拟：序列化 handle 和元数据，
    不把 tensor data 塞进 bytes；反序列化后共享 storage；按 rank gather handle；
    用 LocalSerializedTensor 按 TP rank 取回 tensor，并只在最后一个参数上 flush。
  task_md: labs/l32.5_ipc_weight_sync/patch/task.md
  starter_file: labs/l32.5_ipc_weight_sync/patch/starter/ipc_weight_sync.py
  reference_file: labs/l32.5_ipc_weight_sync/patch/reference/ipc_weight_sync.py
  test_command: IMPL=reference make patch-test M=l32.5_ipc_weight_sync
  status_file: labs/l32.5_ipc_weight_sync/patch/.last_run.json
  test_count: 7
  test_kind: 行为契约 + 共享 storage 语义

