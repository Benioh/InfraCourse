  cluster: 真 CUDA IPC 需要 multiprocessing spawn 和同机 GPU 环境

lesson:
  opening: |
    L37 讲 co-locate RL 系统里权重同步的真实传输对象。L36 已经把 state_dict 的 key/shape/dtype 合同讲清；本讲继续看训练侧如何把 CUDA tensor 变成 handle tuple，让 SGLang rollout 进程按 TP rank 重建指向同一块 GPU storage 的 tensor。CPU patch 用 `IPCStoragePool` 模拟这条路径，验证 handle bytes 小、data_ptr 共享、rank 0 gather、LocalSerializedTensor 和 flush 时序。
  sections:
    - title: 系统位置
      plain_explanation: |
        L37 位于 L36 的本地 weight sync 合同之后。训练侧 actor 更新权重后，co-locate 路径不希望把完整 tensor data 复制给 rollout engine；它更希望传一个可以重建共享 storage 的 handle。真实 CUDA IPC 需要同机进程、GPU allocation 生命周期和 PyTorch reduction 支持，本关用 CPU pool 只模拟结构语义。
      mental_model: |
        tensor data 是货物，handle tuple 是提货单。同步时传提货单，接收端按提货单找到同一块 storage。
      why_it_matters: |
        大模型 RL 每轮可能同步几十 GB 权重。若 co-locate 路径退化成数据复制，rollout 会被同步时间拖住，旧 KV cache 与新权重的边界也会变得不清楚。
      source_refs:
        - title: serialize contract
          repo_path: labs/l32.5_ipc_weight_sync/patch/starter/ipc_weight_sync.py
          lines: [60, 68]
          note: |
            L60-L68: starter 明确返回 bytes 只包含 handle 和 meta，不包含 tensor data。
        - title: storage pool
          repo_path: labs/l32.5_ipc_weight_sync/patch/starter/ipc_weight_sync.py
          lines: [26, 38]
          note: |
            L26-L38: CPU pool 保存原 tensor 引用，用 data_ptr 相等模拟共享 storage。
      common_confusions:
        - 把 handle bytes 当成 tensor 压缩包。
        - 认为 CPU pool 证明了真实 CUDA IPC 跨进程可用。
        - 忽略 tensor 生命周期和 cache flush。
      checkpoint_questions:
        - L37 和 L36 的同步合同差异是什么？
        - 为什么 handle bytes 应远小于 tensor data？
        - CPU 模拟不能证明哪些 GPU 结论？

    - title: Handle 和共享 storage
      plain_explanation: |
        `serialize_handle` 先把 tensor 注册进 pool 得到 handle，再 pickle shape、dtype、stride、device 和 handle。`deserialize_handle` 解出 handle 后从 pool 取回 tensor。测试要求 4 MB fp32 tensor 的 blob 小于 1024 bytes，并要求反序列化 tensor 的 `data_ptr()` 与源 tensor 相同。
      mental_model: |
        同步传访问凭证，不传完整参数。凭证小，storage 仍在原处。
      why_it_matters: |
        handle 大小和 data_ptr 是判断实现是否仍保持 IPC 语义的最小证据。
      source_refs:
        - title: reference handle meta
          repo_path: labs/l32.5_ipc_weight_sync/patch/reference/ipc_weight_sync.py
          lines: [39, 48]
          note: |
            L39-L48: reference 只序列化 handle、shape、dtype、stride 和 device。
        - title: reference deserialize
          repo_path: labs/l32.5_ipc_weight_sync/patch/reference/ipc_weight_sync.py
          lines: [51, 53]
          note: |
            L51-L53: 反序列化后从 pool 按 handle 取回 tensor。
        - title: handle size test
          repo_path: labs/l32.5_ipc_weight_sync/patch/tests/test_patch.py
          lines: [22, 29]
          note: |
            L22-L29: 测试用 blob 小于 1024 bytes 防止学生把数据塞进序列化结果。
        - title: data_ptr test
          repo_path: labs/l32.5_ipc_weight_sync/patch/tests/test_patch.py
          lines: [32, 39]
          note: |
            L32-L39: 反序列化结果必须和源 tensor 共享 data_ptr。
      common_confusions:
        - 数值相等就等于共享 storage。
        - pickle tensor 本体也算 handle 序列化。
        - shape/dtype 足够重建 tensor，handle 可以省略。
      checkpoint_questions:
        - handle meta 至少要包含哪些字段？
        - 为什么测试同时看 blob 大小和 data_ptr？
        - clone 会破坏哪个合同？

    - title: Rank Gather 和 LST
      plain_explanation: |
        真实路径里每个 training rank 都要参与 gather_object，但只有目标 rank 拿到完整列表。本关的 `gather_handles_to_rank0` 用 dict 模拟这件事：所有 rank 写入自己的 blob，非 0 rank 返回 None，rank 0 未收齐也返回 None，收齐后按 rank 顺序返回列表。`LocalSerializedTensor.values` 保存每个 rank 的 blob，SGLang TP rank 用 `values[rank]` 取自己的 handle。
      mental_model: |
        每个 rank 投递一张提货单，rank 0 收齐后装进一封信。接收端按自己的 TP rank 抽对应那张。
      why_it_matters: |
        co-locate sync 的常见错误是 rank 维度错配：collective 只有部分 rank 参与，rank 0 提前返回部分列表，或 SGLang rank 取错 blob。
      source_refs:
        - title: gather reference
          repo_path: labs/l32.5_ipc_weight_sync/patch/reference/ipc_weight_sync.py
          lines: [64, 76]
          note: |
            L64-L76: reference 保留 gather_object 的单目标返回语义。
        - title: LST real class
          repo_path: github_repo/sglang/python/sglang/srt/model_executor/model_runner.py
          lines: [3453, 3461]
          note: |
            L3453-L3461: 真实 LocalSerializedTensor 也用 `values[rank]` 反序列化。
        - title: gather test
          repo_path: labs/l32.5_ipc_weight_sync/patch/tests/test_patch.py
          lines: [52, 61]
          note: |
            L52-L61: 测试逐 rank 写入 blob，并调用 gather。
      common_confusions:
        - rank 0 第一次调用就能返回完整列表。
        - 所有 rank 都应拿到完整列表。
        - "`values` 可以是单个 bytes。"
      checkpoint_questions:
        - 为什么非 0 rank 返回 None？
        - rank 0 未收齐时为什么不能返回部分列表？
        - LocalSerializedTensor 的 rank 顺序错误会造成什么问题？

    - title: SGLang 接收路径
      plain_explanation: |
        SGLang `ModelRunner.update_weights_from_tensor` 先 patch torch reduction，再把每个 named tensor unwrap。若输入是 LocalSerializedTensor，就按当前 TP rank 取出 tensor，再走 direct/custom/default loader 写模型。flattened bucket 路径会先根据 metadata reconstruct tensors，再调用模型加载。
      mental_model: |
        SGLang 收到的不是普通 dict；它先把每个提货单换成当前 rank 的 tensor，再交给模型 loader。
      why_it_matters: |
        如果 unwrap、device 映射或 loader 选择出错，问题会表现为权重更新失败、部分参数更新或服务端请求异常。
      source_refs:
        - title: update entry
          repo_path: github_repo/sglang/python/sglang/srt/model_executor/model_runner.py
          lines: [1932, 1940]
          note: |
            L1932-L1940: update 入口先 patch reduction，并分流 flattened bucket。
        - title: unwrap and device
          repo_path: github_repo/sglang/python/sglang/srt/model_executor/model_runner.py
          lines: [1944, 1951]
          note: |
            L1944-L1951: SGLang 根据 TP rank unwrap tensor，并移动到当前 device。
        - title: loader choice
          repo_path: github_repo/sglang/python/sglang/srt/model_executor/model_runner.py
          lines: [1952, 1961]
          note: |
            L1952-L1961: load_format 决定 direct、custom 或默认 load_weights。
        - title: torch patch
          repo_path: github_repo/sglang/python/sglang/srt/utils/patch_torch.py
          lines: [40, 51]
          note: |
            L40-L51: monkey patch torch reductions，保证 CUDA tensor reduction/rebuild 可被定制。
      common_confusions:
        - SGLang 直接使用 serialized bytes 更新模型。
        - load_format 只是日志字段。
        - device 映射对 co-locate IPC 无关。
      checkpoint_questions:
        - SGLang 在哪里按 TP rank unwrap？
        - "`monkey_patch_torch_reductions` 解决什么边界？"
        - flattened bucket 和普通 named tensor 路径有什么区别？

    - title: SLiME 分桶发送
      plain_explanation: |
        SLiME 的 tensor updater 先 pause generation 和 flush cache，再按 HF weight chunk 发送。co-locate 发送时把参数按 dtype 分组，构造 FlattenedTensorBucket，序列化 flattened tensor 和 metadata，然后用 gather_object 收集到 ipc_gather_src。源 rank 按 dtype bucket 调 rollout engine 的 `update_weights_from_tensor`，最后等待 refs 并调用 `torch.cuda.ipc_collect()`。
      mental_model: |
        训练侧按桶打包参数：一个 flattened tensor 加一份 metadata 清单。
      why_it_matters: |
        大模型 sync 的瓶颈可能来自 bucket 构造、HF 转换、gather、engine lock、IPC 资源释放和 cache flush，不只是 handle 本身。
      source_refs:
        - title: SLiME update loop
          repo_path: github_repo/slime/slime/backends/megatron_utils/update_weight/update_weight_from_tensor.py
          lines: [137, 143]
          note: |
            L137-L143: update 开始时递增 version。
        - title: send chunks
          repo_path: github_repo/slime/slime/backends/megatron_utils/update_weight/update_weight_from_tensor.py
          lines: [156, 166]
          note: |
            L156-L166: 每个 HF weight chunk 发送后等待 refs，并释放 IPC 资源。
        - title: serialize bucket
          repo_path: github_repo/slime/slime/backends/megatron_utils/update_weight/update_weight_from_tensor.py
          lines: [234, 244]
          note: |
            L234-L244: flattened tensor 和 metadata 一起进入 MultiprocessingSerializer。
        - title: gather object
          repo_path: github_repo/slime/slime/backends/megatron_utils/update_weight/update_weight_from_tensor.py
          lines: [245, 253]
          note: |
            L245-L253: gather_object 收集每个 rank 的 serialized bucket。
        - title: engine update
          repo_path: github_repo/slime/slime/backends/megatron_utils/update_weight/update_weight_from_tensor.py
          lines: [255, 267]
          note: |
            L255-L267: src rank 组装 kwargs，并远程调用 rollout engine 的 tensor update。
      common_confusions:
        - from_tensor 完全没有显存峰值。
        - bucket 只是性能装饰，不影响正确性。
        - "`ipc_collect` 可以省略。"
      checkpoint_questions:
        - SLiME 为什么先 pause generation？
        - FlattenedTensorBucket metadata 保存什么？
        - "`torch.cuda.ipc_collect()` 放在什么边界之后？"

    - title: Lab 验收边界
      plain_explanation: |
        本讲 patch 只验证 CPU 模拟合同：handle 小、共享 storage、rank 0 gather、LST get、state 替换和最后 flush。它不证明 CUDA IPC 跨进程、SGLang 真实 endpoint、Ray actor、NCCL/Gloo group 或 GPU 生命周期管理。本讲目录没有 dedicated smoke target，验证闭环是 patch-test 加 notebook 复盘。
      mental_model: |
        CPU patch 证明提货单格式和流程；GPU 集群验证才证明仓库真的能跨进程开门。
      why_it_matters: |
        只跑 CPU 测试就声称 co-locate weight sync 可用，会漏掉最关键的跨进程和生命周期风险。
      source_refs:
        - title: update state test
          repo_path: labs/l32.5_ipc_weight_sync/patch/tests/test_patch.py
          lines: [95, 107]
          note: |
            L95-L107: update 后 inference state 被源 tensor 替换。
        - title: flush timing test
          repo_path: labs/l32.5_ipc_weight_sync/patch/tests/test_patch.py
          lines: [128, 139]
          note: |
            L128-L139: flush_cache=True 时最后一个参数后 pool 才清空。
      common_confusions:
