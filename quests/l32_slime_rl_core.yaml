id: l32_slime_rl_core
title: L36 · SLiME RL Core：Weight Sync Coordinator
level: L36
act: 第 4 章：RL 与对齐
role: SLiME 系统学徒
priority: 核心
estimated_minutes: 90
no_gpu_friendly: true
frameworks:
  - PyTorch
