lesson:
  opening: |
    L36 讲 actor 训练侧和 rollout 推理侧之间的权重交接。L35 已经把 rollout 请求并发和样本保序讲清；这一讲继续看 actor train 之后，新权重如何到达 rollout engine，以及 shape、dtype、bytes、mismatch 和 weight_version 如何成为排障证据。
  sections:
    - title: 系统位置
      plain_explanation: |
        weight sync 位于 actor train 之后、下一轮 rollout 之前。训练侧 actor 完成参数更新后，rollout engine 必须拿到新权重，否则后续样本仍来自旧 policy。短期 stale 可以被 PPO 的 ratio 和 clip 吸收一部分；stale 太大时，KL、reward 和 advantage 都会变得难解释。
      mental_model: |
        rollout 产样本，actor 用样本训练，sync 把新 actor 交给下一轮 rollout。少了 sync，两条流水线就会逐渐分叉。
      why_it_matters: |
        很多 RL 训练异常表面上是 reward 不涨或 KL 异常，根因可能是 rollout policy 没更新。先定位 sync 在 loop 中的位置，才能判断曲线是否可信。
      source_refs:
        - title: MiniInfra loop
          repo_path: mini_infra/slime/train.py
          lines: [12, 19]
          note: |
            L12-L19: MiniInfra 按 generate、train、update_weights 推进。
        - title: SLiME train loop
          repo_path: github_repo/slime/train.py
          lines: [66, 72]
          note: |
            L66-L72: 真实 SLiME 先生成 rollout data。
      common_confusions:
        - 认为 rollout policy 和 actor 参数天然一致。
        - 把 sync 只看成吞吐开销。
        - 没有 version 证据就判断 rollout 新鲜。
      checkpoint_questions:
        - generate、train、update_weights 的顺序是什么？
        - rollout policy 过旧会影响哪些训练量？
        - 为什么 weight_version 是最小证据？

    - title: 本地同步合同
      plain_explanation: |
        本地 `WeightSyncCoordinator` 从 train state 读取 tensor，只把 key 存在、shape 一致、dtype 一致的 tensor clone 后写入 inference。missing key、shape mismatch 和 dtype mismatch 都进入 `mismatched_keys`。`bytes_synced` 和 `num_tensors` 只统计 accepted tensors。
      mental_model: |
        这是一张收货检查表：名字、尺寸、类型三项都对上才入库。
      why_it_matters: |
        shape/dtype gate 能抓住 checkpoint 转换、TP/PP/EP 切片、fp32 master 和 bf16/fp16 inference 的常见错误。clone 能避免 inference 继续引用 train tensor。
      source_refs:
        - title: starter 合同
          repo_path: labs/l32_slime_rl_core/patch/starter/weight_sync.py
          lines: [35, 45]
          note: |
            L35-L45: sync docstring 写出返回字段和筛选规则。
        - title: reference gate
          repo_path: labs/l32_slime_rl_core/patch/reference/weight_sync.py
          lines: [35, 38]
          note: |
            L35-L38: 初始化 accepted、mismatch 和 bytes。
        - title: reference clone
          repo_path: labs/l32_slime_rl_core/patch/reference/weight_sync.py
          lines: [40, 49]
          note: |
            L40-L49: key、shape、dtype 都匹配后 clone 并计入 bytes。
        - title: reference stats
          repo_path: labs/l32_slime_rl_core/patch/reference/weight_sync.py
          lines: [51, 56]
          note: |
            L51-L56: setter 写入 accepted tensors，并返回同步统计。
      common_confusions:
        - key 名相同就直接同步。
        - dtype 不同也在 coordinator 里自动转换。
        - 用浅拷贝字典替代 tensor clone。
      checkpoint_questions:
        - accepted tensor 需要满足哪三个条件？
        - 为什么 dtype mismatch 不自动 cast？
        - "`bytes_synced` 应该统计哪些 tensor？"

    - title: 测试闭环
      plain_explanation: |
        patch tests 把同步合同拆成五个断言：正常同步、shape mismatch、dtype mismatch、train extra key 和 stats 数值。测试不覆盖 Ray、NCCL、SGLang endpoint 或 Megatron/HF 转换。
      mental_model: |
        测试先把本地收货合同固定下来，生产路径再把这份合同放进分布式传输链路。
      why_it_matters: |
        weight sync 错误可能在下一次 forward 才暴露。小测试先把错误压缩到可复现断言里。
      source_refs:
        - title: shape mismatch test
          repo_path: labs/l32_slime_rl_core/patch/tests/test_patch.py
          lines: [51, 60]
          note: |
            L51-L60: 构造 shape mismatch。
        - title: shape mismatch assert
          repo_path: labs/l32_slime_rl_core/patch/tests/test_patch.py
          lines: [61, 66]
          note: |
            L61-L66: mismatch 不覆盖 inference 旧值。
        - title: dtype mismatch test
          repo_path: labs/l32_slime_rl_core/patch/tests/test_patch.py
          lines: [69, 80]
          note: |
            L69-L80: dtype mismatch 被跳过，num_tensors 为 0。
        - title: stats test
          repo_path: labs/l32_slime_rl_core/patch/tests/test_patch.py
          lines: [98, 99]
          note: |
            L98-L99: stats 用例先准备两个 fp32 tensors。
      common_confusions:
        - patch-test 通过就等于多机同步正确。
        - shape mismatch 可以覆盖后再修。
        - stats 错误不影响训练。
      checkpoint_questions:
        - 哪个测试证明 mismatch 不覆盖 inference？
        - 为什么 stats 也属于行为合同？
        - patch-test 没覆盖哪些生产分支？

    - title: MiniInfra 版本链路
      plain_explanation: |
        MiniInfra 的 `TrainRayActor.train` 会递增 `weight_version`，`update_weights` 把版本写回 rollout manager。`RolloutServer.generate` 在 meta_info 里记录 server weight version、actor version 和 staleness。
      mental_model: |
        version 是权重交接的收据。没有收据，就无法证明 rollout 用的是哪一版 policy。
      why_it_matters: |
        后续 freshness 课程会继续扩展这个概念。L36 先让学生看到版本从 actor 到 rollout 的最小路径。
      source_refs:
        - title: TrainRayActor train
          repo_path: mini_infra/slime/ray/train_actor.py
          lines: [44, 53]
          note: |
            L44-L53: actor train 后递增 weight_version。
        - title: Rollout meta_info
          repo_path: mini_infra/slime/ray/rollout.py
          lines: [40, 49]
          note: |
            L40-L49: rollout meta_info 记录 weight_version、actor_version 和 staleness。
        - title: Rollout update
          repo_path: mini_infra/slime/ray/rollout.py
          lines: [84, 93]
          note: |
            L84-L93: rollout manager 把新 version 写到指定 server 或所有 server。
      common_confusions:
        - 版本号只是日志字段。
        - rollout manager 不需要知道 actor version。
        - stale 只影响吞吐。
      checkpoint_questions:
        - MiniInfra 哪里递增 weight_version？
        - rollout meta_info 里为什么同时有 actor_version 和 weight_version？
        - freshness 错误应该在什么地方暴露？

    - title: SLiME 生产链路
      plain_explanation: |
        真实 SLiME 通过 Ray 协调 train actors。`RayTrainGroup.update_weights()` 调每个 actor 的 remote 方法；Megatron actor 根据 colocate 选择 tensor updater 或 distributed updater；update 时从 rollout manager 取可更新 engines 和 lock，再调用 weight updater。
      mental_model: |
        本地 patch 是收货检查；SLiME 生产路径是多级交接：Ray 触发、Megatron 整理、updater 传输、SGLang 接收。
      why_it_matters: |
        源码里的 Ray、NCCL、bucket 和 engine lock 都是在维护同一个目标：把 actor 新权重可靠交给 rollout engine，并留下可检查的 version。
      source_refs:
        - title: Ray update call
          repo_path: github_repo/slime/slime/ray/actor_group.py
          lines: [135, 138]
          note: |
            L135-L138: RayTrainGroup 对每个 actor 调用 update_weights remote。
        - title: updater choice
          repo_path: github_repo/slime/slime/backends/megatron_utils/actor.py
          lines: [127, 134]
          note: |
            L127-L134: colocate 选择 tensor updater，否则选择 distributed updater。
        - title: updater call
          repo_path: github_repo/slime/slime/backends/megatron_utils/actor.py
          lines: [555, 562]
          note: |
            L555-L562: 连接新 rollout engines。
        - title: updater execute
          repo_path: github_repo/slime/slime/backends/megatron_utils/actor.py
          lines: [563, 569]
          note: |
            L563-L569: 调用 weight_updater.update_weights。
        - title: engine tensor update
          repo_path: github_repo/slime/slime/backends/sglang_utils/sglang_engine.py
          lines: [266, 278]
          note: |
            L266-L278: SGLang engine 暴露 tensor update 入口。
      common_confusions:
        - Ray remote 直接传所有 tensor。
        - co-locate 和 disaggregate 只影响部署，不影响同步路径。
        - disk update 可以替代高频在线 sync。
      checkpoint_questions:
        - SLiME 在哪里选择 updater？
        - Ray 在 sync 路径里主要负责什么？
        - SGLang payload 为什么需要 weight_version？

    - title: Distributed Sync
      plain_explanation: |
        distributed updater 会建立 update group，暂停 generation，flush cache，处理 non-expert 和 expert 参数，按 bucket 更新。Ray 先把 names、dtypes、shapes、group_name 和 version 发给 rollout engines，再由 NCCL broadcast 传 tensor。
      mental_model: |
        生产同步像分桶发货：先贴 metadata 标签，再把 tensor 通过高速链路广播到收货方。
      why_it_matters: |
        同步慢可能来自 gather、HF 转换、bucket、engine lock、NCCL broadcast 或 engine 应用。只看总耗时无法定位瓶颈。
      source_refs:
        - title: distributed class
          repo_path: github_repo/slime/slime/backends/megatron_utils/update_weight/update_weight_from_distributed.py
          lines: [20, 24]
          note: |
            L20-L24: distributed updater 用 NCCL 更新 rollout engines。
        - title: pause and flush
          repo_path: github_repo/slime/slime/backends/megatron_utils/update_weight/update_weight_from_distributed.py
          lines: [81, 87]
          note: |
            L81-L87: 每次 update 递增 weight_version。
        - title: bucket lock
          repo_path: github_repo/slime/slime/backends/megatron_utils/update_weight/update_weight_from_distributed.py
          lines: [228, 239]
          note: |
            L228-L239: bucket update 前拿 rollout engine lock。
        - title: metadata and broadcast
          repo_path: github_repo/slime/slime/backends/megatron_utils/update_weight/update_weight_from_distributed.py
          lines: [310, 319]
          note: |
            L310-L319: Ray 发 metadata，NCCL 传 tensor。
      common_confusions:
        - 同步慢只可能是网络慢。
        - 每个 train shard 都能直接写入 inference 模型。
        - metadata 不重要。
      checkpoint_questions:
        - distributed updater 为什么要先发 metadata？
        - engine lock 防止什么问题？
        - 有效带宽怎么估算？

    - title: Smoke 和排障
      plain_explanation: |
        L36 smoke 只验证配置、toy 数据和指标格式。它写出 `slime_config_validation.json`、`metrics.jsonl`、`rl.log` 和 report。metrics 里的 `weight_sync_time_sec` 用来练习复盘格式，不代表真实 NCCL 性能。
      mental_model: |
        smoke 是证据格式演练；H200/NCCL 才是真实同步能力验证。
      why_it_matters: |
        进入真实集群前，先确认 run 目录、配置、数据、metrics 和报告都能支撑排查。真实跑失败时，证据才不会散落在不同位置。
      source_refs:
        - title: smoke validation
          repo_path: labs/l32_slime_rl_core/scripts/run_slime_lab.py
          lines: [42, 45]
          note: |
            L42-L45: 准备 toy GSM8K prompts。
        - title: smoke metrics
          repo_path: labs/l32_slime_rl_core/scripts/run_slime_lab.py
          lines: [59, 64]
          note: |
            L59-L64: 写 reward、KL 和 metric type。
        - title: smoke report
          repo_path: labs/l32_slime_rl_core/scripts/run_slime_lab.py
          lines: [96, 99]
          note: |
            L96-L99: 报告记录时间结果，并声明本地模式边界。
      common_confusions:
        - 本地 smoke 通过就说明 SGLang 在线权重已更新。
        - "`weight_sync_time_sec` 可以直接代表 NCCL 带宽。"
        - 缺少 validation artifact 也能复盘配置。
      checkpoint_questions:
        - L36 smoke 能证明什么？
        - 本地 smoke 不能替代哪些验证？
        - sync 慢时第一步要保存哪些证据？
