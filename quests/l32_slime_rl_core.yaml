patch:
  description: |
    实现 WeightSyncCoordinator：从 train state_dict 读取 weights，按 key、shape、dtype
    匹配后写入 inference state_dict。不匹配的 key 进入 mismatched_keys，不抛错。
    返回同步字节数、tensor 数和 mismatch 列表。
  task_md: labs/l32_slime_rl_core/patch/task.md
  starter_file: labs/l32_slime_rl_core/patch/starter/weight_sync.py
  reference_file: labs/l32_slime_rl_core/patch/reference/weight_sync.py
  test_command: IMPL=reference make patch-test M=l32_slime_rl_core
  status_file: labs/l32_slime_rl_core/patch/.last_run.json
  test_count: 5
  test_kind: 行为契约 + 数值校验

