patch:
  description: |
    实现带 weight_version 的 RolloutManager：generate 只选择足够新的 server，
    update_weights 支持全量/局部更新，freshness 返回 actor 与 server 的版本差。
  task_md: labs/l33_rl_rollout_freshness/patch/task.md
  starter_file: labs/l33_rl_rollout_freshness/patch/starter/rollout_manager.py
  reference_file: labs/l33_rl_rollout_freshness/patch/reference/rollout_manager.py
  test_command: IMPL=reference make patch-test M=l33_rl_rollout_freshness
  status_file: labs/l33_rl_rollout_freshness/patch/.last_run.json
  test_count: 5
  test_kind: versioned rollout manager 行为验证

