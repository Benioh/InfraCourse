id: l33_rl_rollout_freshness
title: L38 · SLiME Rollout Freshness：Versioned RolloutManager
level: L38
act: 第 4 章：RL 与对齐
role: RL 系统主线学徒
priority: 核心
estimated_minutes: 100
no_gpu_friendly: true
frameworks:
