next_lab: ""
gpu_modes:
  local: CPU OK for Bronze patch and evidence aggregation
  cluster: H100 optional for Stage A/B/C extension runs

lesson:
  opening: |
    L41 是课程收口讲。它把训练、服务、RL 和证据整理放进一个教学版 MM-Tiny-Omni：CLIP/Whisper 产出连续特征，projector 把特征送入 LLM hidden dim，LLM 生成文本，reward 和聚合器再把结果变成可审计证据。

    本讲先用 Bronze patch 锁定三个基础合同：projector shape、WER denominator、CLIP cosine。随后再讲 Stage A 训练、Stage B 服务化、Stage C RL 对齐和 final artifacts。学生完成后应能把一个多模态项目拆成接口、指标、失败边界和交付证据。
  sections:
    - title: 系统边界
      plain_explanation: |
        MM-Tiny-Omni 的输入分三类：文本 token、图像 patch feature 和语音 encoder feature。图像来自冻结的 CLIP-ViT，语音来自冻结的 Whisper，课程项目只训练 projector 和少量 LLM 层。输出覆盖 image/audio-to-text，不做语音生成、codec 或实时双工对话。

        这个边界让 Capstone 能在教学预算内完成：Bronze 做 CPU patch；Silver/Gold 扩展到 Stage A 训练、Stage B 服务化和 Stage C RL。若边界没有写清，项目会混入生产 omni 的复杂模块，最终很难判断失败来自 projector、数据、serving、reward 还是证据缺失。
      mental_model: |
        把 L41 看成一个小型集成台：先验零件合同，再验训练路径、服务路径、RL 路径和交付证据。
      why_it_matters: |
        Capstone 的价值在于可复查的系统闭环。范围压住以后，学生才能把每个指标连回命令、配置、日志和源码。
      source_refs:
        - title: architecture artifact
          repo_path: labs/l35_multimodal_capstone/scripts/run_capstone_aggregator.py
          lines: [363, 375]
          note: |
            L363-L365: architecture.mmd 是 final artifacts 的一部分。
            L366-L375: 图里把环境、训练、serving、RL 和指标证据连到 L41 聚合结果。
      common_confusions:
        - 把教学版 Capstone 扩成完整语音输出系统。
        - 以为 Bronze patch 通过就覆盖了 Stage A/B/C。
        - 忽略证据目录，只保留最终截图。
      checkpoint_questions:
        - L41 保留了哪些多模态路径，裁掉了哪些生产模块？
        - Bronze 和 Stage A/B/C 的验收对象分别是什么？
        - 为什么 final artifacts 必须能回到 run 证据？

    - title: Bronze 组件合同
      plain_explanation: |
        Bronze patch 的三个函数很小，但它们站在多模态链路的关键接口上。MultimodalProjector 把 image feature 和 audio feature 投到 LLM hidden dim，并为图像 patch 加可学习位置 embedding。wer_score 用词级编辑距离衡量语音转写错误，denominator 固定为 reference 词数。clip_score 对图像和文本 embedding 做归一化余弦相似度，避免向量范数污染 reward。

        这些合同都能用 CPU 测试验证。shape 错会让 embedding injection 直接失败；WER denominator 错会扭曲 audio reward；CLIP score 没归一化会让 reward 被 embedding norm 控制。
      mental_model: |
        Projector 是维度适配器，WER 是转写差错计数器，CLIP score 是语义方向相似度。
      why_it_matters: |
        多模态项目的早期错误常落在 shape、mask、denominator 和归一化上。先把这些低层合同固定，后续训练和 RL 才有稳定输入。
      source_refs:
        - title: starter projector constructor
          repo_path: labs/l35_multimodal_capstone/patch/starter/mm_omni.py
          lines: [22, 34]
          note: |
            L22-L26: projector 要支持 image-only、audio-only 和双模态。
            L28-L34: constructor 参数固定三种 hidden dim 和 image token 数。
        - title: starter projector TODO
          repo_path: labs/l35_multimodal_capstone/patch/starter/mm_omni.py
          lines: [36, 41]
          note: |
            L36-L40: TODO 要创建两个线性投影和 image_pos_emb。
            L41: 未实现时保留 L41 提示。
        - title: starter reward contract
          repo_path: labs/l35_multimodal_capstone/patch/starter/mm_omni.py
          lines: [64, 72]
          note: |
            L64-L70: WER 合同写明词级编辑距离和 denominator。
            L71-L72: 完全匹配返回 0。
        - title: reference reward implementation
          repo_path: labs/l35_multimodal_capstone/patch/reference/mm_omni.py
          lines: [51, 63]
          note: |
            L51-L57: WER DP 主循环和归一化返回。
            L60-L63: CLIP score 先归一化再求内积。
        - title: patch test coverage
          repo_path: labs/l35_multimodal_capstone/patch/tests/test_patch.py
          lines: [57, 69]
          note: |
            L57-L59: WER perfect match 锁住 0 分边界。
            L62-L69: known value 测试锁住 denominator 和空 hypothesis。
      common_confusions:
        - 省掉 image positional embedding。
        - 用 hypothesis 长度作为 WER denominator。
        - 对 CLIP embedding 直接点积。
      checkpoint_questions:
        - Projector 的图像输入和输出 shape 是什么？
        - WER 为什么除以 reference 词数？
        - CLIP score 为什么要先归一化？

    - title: Stage A 训练路径
      plain_explanation: |
        Stage A 的目标是让 LLM 接收图像和语音 soft tokens。数据侧先离线提取 CLIP patch feature 和 Whisper feature；训练侧冻结 encoder，训练 image/audio projector，并可解冻 LLM 后部少量层。forward 时先得到文本 embedding，再用 modal_type_ids 找到 image/audio 占位段，把 projector 输出写入 inputs_embeds，最后把混合 embedding 序列交给 LLM。

        数据平衡同样需要写入计划。图像样本和音频样本数量不同，直接 shuffle 会让 image projector 获得更多梯度。课程建议用 weighted sampler、round-robin 或 audio oversample，并在指标里分别看 image CLIP score 和 audio WER。
      mental_model: |
        Stage A 给 LLM 加两个翻译器：视觉特征和语音特征先翻成 LLM hidden dim 里的软 token。
      why_it_matters: |
        训练路径的成功取决于冻结策略、embedding injection 和模态采样。任一处错位，后续服务和 RL 都会继承这个错误。
      source_refs:
        - title: reference projector init
          repo_path: labs/l35_multimodal_capstone/patch/reference/mm_omni.py
          lines: [20, 23]
          note: |
            L20-L21: image/audio projector 负责跨 hidden dim 映射。
            L22-L23: image_pos_emb 给图像 patch 提供位置偏置。
        - title: reference projector forward
          repo_path: labs/l35_multimodal_capstone/patch/reference/mm_omni.py
          lines: [25, 37]
          note: |
            L25-L30: forward 先准备带 None 的输出 dict。
            L31-L37: image/audio 输入存在时才写对应 embedding。
      common_confusions:
        - 把 image token id 当成真实可学习视觉语义。
        - 只看总 loss，忽略 image 和 audio 指标分开评估。
        - 把 offline feature 当成 token id。
      checkpoint_questions:
        - Stage A 默认冻结哪些模块，训练哪些模块？
        - embedding injection 发生在哪一步之后？
        - 模态采样不平衡会怎样影响 audio projector？

    - title: Stage B 服务化
      plain_explanation: |
        Stage B 把 Stage A checkpoint 包成 OpenAI Chat Completions 兼容 endpoint。服务端解析 message 中的 image/audio URL，批量跑对应 encoder，再用训练一致的 collate 和 embedding injection 进入 LLM prefill、decode。一个 batch 里可以同时有图像、音频和纯文本请求，正确路径是把各模态集中编码，然后合成同一次 LLM forward。

        服务指标要拆开看。TTFT 至少包含排队、tokenize、encoder、prefill 和 decode 首步；prefix cache hit 要单独记录；失败时要能从 metrics 回到具体请求和配置。若只报 tokens/s，交互体验和瓶颈位置都无法复查。
      mental_model: |
        服务端像分拣台：媒体先按模态进入 encoder，特征再回到统一 LLM 队列。
      why_it_matters: |
        多模态 serving 的成本常在 prefill 和调度。异质 batch 拆散会增加 LLM forward 次数，TTFT 也会变差。
      source_refs:
        - title: aggregator evidence table
          repo_path: labs/l35_multimodal_capstone/scripts/run_capstone_aggregator.py
          lines: [188, 200]
          note: |
            L188-L190: table 固定 evidence 表头。
            L192-L200: 每个 run 的字段会进入最终报告表。
        - title: aggregator table return
          repo_path: labs/l35_multimodal_capstone/scripts/run_capstone_aggregator.py
          lines: [201, 202]
          note: |
            L201-L202: 聚合后的 Markdown 表格成为 final artifacts 的可读入口。
      common_confusions:
        - 把有图、有音频、纯文本请求拆成多个 LLM batch。
        - 只看 tokens/s，不记录 TTFT 拆分。
        - 忽略 prefix cache 对重复系统提示和多模态 prefix 的影响。
      checkpoint_questions:
        - Stage B endpoint 要支持哪三类输入？
        - 为什么异质请求应尽量合并进一次 LLM forward？
        - TTFT 至少要拆成哪些阶段？

    - title: Stage C RL 对齐
      plain_explanation: |
        Stage C 用 PPO/GRPO 风格的轻量对齐改善 Stage A 模型。rollout 从 image/audio prompt 生成回答；reward 按任务路由，图像任务用 CLIP image-text 相似度，语音转写任务用 1 - WER，再加长度和 KL 约束。weight sync 负责把 actor 新权重送到 rollout engine，避免训练端和生成端长期错位。

        reward 需要按模态记录。图像任务没有语音 reference 时，WER 没有含义；语音任务没有图像 embedding 时，CLIP score 没有含义。报告要同时保留 reward、KL、before/after 样本和同步版本，避免把 reward hacking 写成真实改进。
      mental_model: |
        Stage C 是带刹车的反馈环：生成、打分、约束更新、同步权重，然后再生成。
      why_it_matters: |
        RL 的数字容易被格式、长度和 stale rollout 影响。按模态路由 reward 并记录 KL 与同步证据，才能定位问题。
      source_refs:
        - title: WER recurrence
          repo_path: labs/l35_multimodal_capstone/patch/reference/mm_omni.py
          lines: [51, 57]
          note: |
            L51-L56: WER 通过 DP 累积词级编辑距离。
            L57: audio reward 使用的 error rate 来自 reference 词数归一化。
        - title: CLIP cosine
          repo_path: labs/l35_multimodal_capstone/patch/reference/mm_omni.py
          lines: [60, 63]
          note: |
            L60-L62: cosine 前先做向量归一化。
            L63: 返回值是 image/text embedding 的方向相似度。
      common_confusions:
        - 给所有样本都计算 CLIP 和 WER。
        - 只追 reward 上升，不看 KL 和样本质量。
        - 忽略 rollout 权重新鲜度。
      checkpoint_questions:
        - 图像任务和音频任务分别用什么主 reward？
        - KL 在 Stage C 中约束什么？
        - weight sync 证据为什么要进入报告？

    - title: Evidence Package
      plain_explanation: |
        L41 的 final artifacts 需要把前序 run 证据整理成可审计包。聚合器扫描 quests 和 runs，读取 command、config、metrics、grade、report 和 artifacts，写出 evidence_index、stage reports、final_readme、reproducibility_commands、debug_report、risk_register 和 architecture.mmd。

        聚合器只整理证据，不替代真实运行。某个任务缺 run，或者 report 标记为 validation-only，这一行就不能支撑真实 H100、Serving 或 RL 成功。风险登记必须保留这些边界，并给出补跑命令或后续动作。
      mental_model: |
        evidence_index 是目录，stage reports 是分组摘要，risk_register 是不能隐藏的边界清单。
      why_it_matters: |
        系统课交付靠证据链。每个结论都要能回到 run_id、命令、配置、指标和报告。
      source_refs:
        - title: mission summary metrics
          repo_path: labs/l35_multimodal_capstone/scripts/run_capstone_aggregator.py
          lines: [131, 143]
          note: |
            L131-L137: summarize_mission 读取 metrics、grade 和 resolved config。
            L138-L143: report 和 artifacts 是后续证据字段来源。
        - title: mission summary artifacts
          repo_path: labs/l35_multimodal_capstone/scripts/run_capstone_aggregator.py
          lines: [144, 152]
          note: |
            L144-L150: artifacts 只收集 run/artifacts 下的文件。
            L152: return dict 开始写 mission 证据行。
        - title: final artifact writes
          repo_path: labs/l35_multimodal_capstone/scripts/run_capstone_aggregator.py
          lines: [400, 407]
          note: |
            L400-L405: final artifacts 覆盖 stage、README、复现、debug、risk 和架构。
            L406-L407: evidence_index.json 保存完整 evidence rows。
        - title: capstone metrics
          repo_path: labs/l35_multimodal_capstone/scripts/run_capstone_aggregator.py
          lines: [408, 420]
          note: |
            L408-L414: 统计 source_run_count、artifact_count 和 stage coverage。
            L415-L420: metrics 行标记为 capstone。
      common_confusions:
        - 把聚合器输出当成真实训练或服务结果。
        - 缺少 command/config 时仍把 run 当作证据。
        - 删除 validation-only 边界。
      checkpoint_questions:
        - evidence_index.json 应该回答什么问题？
        - final artifacts 至少包含哪些文件？
        - validation-only 行为什么要留在 risk_register？

    - title: Debug 路线
      plain_explanation: |
        Capstone debug 要按阶段切开。Stage A OOM 先分清 build、forward、backward 和 optimizer state；Stage B 高 TTFT 先拆排队、tokenize、encoder、prefill 和 decode；Stage C reward 异常先查任务路由、样本格式、KL 和 weight sync。每次只改一个变量，保留最小复现命令、配置、日志、metrics 和修复前后对比。

        聚合器会从前序 report 抽取 ticket ID 写入 debug_report。若没有 ticket，报告会明确标出 debug 证据缺失。这个设计迫使学生把故障处理写成可复查链路，而非只写一句已经修复。
      mental_model: |
        Debug 先定位阶段，再定位主导变量，最后用最小实验验证修复。
      why_it_matters: |
        Capstone 同时涉及训练、数据、服务和 RL。没有分层 ticket，很容易把多个变化混在一起，导致结论无法归因。
      source_refs:
        - title: debug report rows
          repo_path: labs/l35_multimodal_capstone/scripts/run_capstone_aggregator.py
          lines: [264, 276]
          note: |
            L264-L269: 收集前序报告中出现的 ticket。
            L270-L276: 每条 ticket 保留 mission、run 和 report path。
        - title: debug fallback
          repo_path: labs/l35_multimodal_capstone/scripts/run_capstone_aggregator.py
          lines: [278, 290]
          note: |
            L278-L286: 没有 ticket 时写明缺 debug 证据。
            L287-L290: debug_report 描述聚合边界。
        - title: risk register
          repo_path: labs/l35_multimodal_capstone/scripts/run_capstone_aggregator.py
          lines: [343, 355]
          note: |
            L343-L350: 风险登记覆盖 validation-only 和源码改造缺证据。
            L352-L355: 风险表进入 final artifacts。
      common_confusions:
        - OOM 后只降 batch size，不判断主导内存项。
        - TTFT 慢就直接加 GPU，不拆阶段。
        - 一次修改多个变量，导致报告无法解释结果变化。
      checkpoint_questions:
        - Stage A OOM 第一轮要分清哪几类位置？
        - Stage B TTFT 慢时先拆哪些时间段？
        - debug_report 为什么需要 ticket ID？
