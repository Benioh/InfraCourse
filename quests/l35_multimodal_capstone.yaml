patch:
  description: |
    Bronze patch 实现 MM-Tiny-Omni 的三个最小组件：MultimodalProjector、wer_score 和 clip_score。
    这三个函数分别固定 Stage A 的 embedding 接口、Stage C 的 audio reward 和 image reward。
  task_md: labs/l35_multimodal_capstone/patch/task.md
  starter_file: labs/l35_multimodal_capstone/patch/starter/mm_omni.py
  reference_file: labs/l35_multimodal_capstone/patch/reference/mm_omni.py
  test_command: IMPL=reference make patch-test M=l35_multimodal_capstone
  status_file: labs/l35_multimodal_capstone/patch/.last_run.json
  test_count: 7
  test_kind: projector shape + WER + cosine 数值合同

